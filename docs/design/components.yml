# The site's components: each one's parts, the text style or mark of each part, where its text may
# break, its wide form, at most one narrow form, the units that never split and the terms it shows in
# their short form, every other term in full. The format is #243's.
# scripts/check_component_registry.py validates this file, generates the element table of
# docs/wireframes/block_standard.md from it and counts its gaps. The sets hold the fixed values of
# docs/design/design_standard.md that system.css uses: the seven text styles (page title, group
# heading, block heading, item title, primary, secondary, small label) and their state colours.
# A part's `gap` names a known gap; the check's GAPS says what each means.
sets:
  text:
    11-400-muted: {size: 11px, weight: 400, colour: muted}
    11-700-muted: {size: 11px, weight: 700, colour: muted}
    11-700-muted-caps: {size: 11px, weight: 700, colour: muted, case: upper}
    11-700-pill-ink-caps: {size: 11px, weight: 700, colour: pill-ink, case: upper}
    13-400-ink: {size: 13px, weight: 400, colour: ink}
    13-400-muted: {size: 13px, weight: 400, colour: muted}
    13-700-ink: {size: 13px, weight: 700, colour: ink}
    13-700-ink-caps: {size: 13px, weight: 700, colour: ink, case: upper}
    13-700-muted: {size: 13px, weight: 700, colour: muted}
    13-700-muted-caps: {size: 13px, weight: 700, colour: muted, case: upper}
    15-400-ink: {size: 15px, weight: 400, colour: ink}
    15-700-accent: {size: 15px, weight: 700, colour: accent}
    15-700-ink: {size: 15px, weight: 700, colour: ink}
    18-700-ink: {size: 18px, weight: 700, colour: ink}
    18-700-muted: {size: 18px, weight: 700, colour: muted}
    20-700-ink: {size: 20px, weight: 700, colour: ink}
    30-400-ink: {size: 30px, weight: 400, colour: ink}
    30-400-muted: {size: 30px, weight: 400, colour: muted}
    30-700-ink: {size: 30px, weight: 700, colour: ink}
  marks:
    team-dot: {size: 10px, colour: chart-team}
    other-dot: {size: 6px, colour: chart-other}
    bar: {size: 5px, colour: chart-team}
    better-bar: {size: 5px, colour: chart-better}
  spacing: ["-8px", "-4px", 2px, 4px, 8px, 12px, 16px, 24px, 36px, 48px, "var(--gap)"]
  colours: [accent, chart-axis, chart-better, chart-line, chart-other, chart-team, draw, ink, ink-2, line, loss, muted, page, pill-ink, sunk, surface, track, win, "#f26d6d", "#fff"]
  switch:
    w280: 280px
    w340: 340px
    w420: 420px
    w430: 430px
    w470: 470px
    w480: 480px
    w520: 520px
    w560: 560px
    w600: 600px
    w700: 700px
    w800: 800px
    w900: 900px
    w1010: 1010px

components:
  page-shell:
    name: Page shell
    file: site_v2/src/layouts/Layout.astro
    used-on: [every page]
    parts:
      root: {class: fx, gap: mock-css}
      column: {class: inner, gap: mock-css}
      page: {class: page, gap: mock-css}
      legacy-width: {class: legacy-width}
      match-page: {class: mp}
    wide: "header, the page's content column, footer"
  header:
    name: Site header
    file: site_v2/src/components/chrome/SiteHeader.astro
    used-on: [every page]
    parts:
      search-field: {class: searchbox, selector: ".header-actions .searchbox", breaks: never, element: Search field, rule: "the header's search field with its placeholder, one on every page from 1010px, where it replaces the search button; on one line in every language, nothing spilling out of it", measured: "visible=1 [>=1010px]; visible=0 [<1010px]; one-line; fits", ruled-on: "`09_chrome.md` (≥ 1010px: the full field)"}
      search-button: {class: search-m, selector: ".iconbtn.search-m", element: Search button, rule: "the header's icon-only search button below 1010px, a 34px target; gone from 1010px", measured: "visible=1 [<1010px]; visible=0 [>=1010px]; min-box=34px", ruled-on: "`09_chrome.md` (phone: the search icon)"}
      row: {class: header-in, element: Header row, rule: "the header's brand, menu and controls fit its row; the menu stands in the row when it fits there, otherwise the menu button", measured: fits, ruled-on: the narrow-screen fix}
      box: {class: site-header}
      brand: {class: brand, selector: ".site-header .brand", text: 18-700-ink, breaks: never}
      brand-iq: {class: iq, selector: ".site-header .iq", text: 18-700-muted, breaks: never}
      menu: {class: mainnav, gap: mock-css}
      drawer: {class: drawer}
      menu-button: {class: hamburger}
      icon: {class: ico}
      current: {class: "on", selector: ".site-header .on"}
    wide: "brand | menu | search field, theme, language"
    narrow: {below: w1010, form: "brand | search button, theme, menu button; the menu in a drawer"}
    never-split: [Matchday Pilot]
  footer:
    name: Site footer
    file: site_v2/src/components/chrome/SiteFooter.astro
    used-on: [every page]
    parts:
      box: {class: site-footer}
      links: {class: flinks}
      meta: {class: fmeta, text: 13-400-muted, breaks: between words}
      imprint: {class: imp, text: 13-400-muted, breaks: between words}
      brand: {class: brand, selector: ".site-footer .brand", text: 15-700-ink, breaks: never}
    wide: "brand, links, meta line"
  breadcrumb:
    name: Breadcrumb
    file: site_v2/src/components/fixture/Breadcrumb.astro
    used-on: [every page but Home]
    parts:
      link: {class: lnk, selector: nav.trail a.lnk, element: Navigation link, rule: "a link known by its place: the logo, the menu, search, the breadcrumb, the tabs, the picker and the filters. A breadcrumb level has a 44px touch area", measured: "min-box=44px", ruled-on: the match page review}
      current: {class: here, selector: ".crumb .here", text: 13-400-ink, element: Breadcrumb current page, rule: "the page you are on differs from the links at rest by colour: the current page ink, the links muted, both regular", measured: "color=ink; font-weight=400", status: proposed, ruled-on: "put to the CPO on the #153 MR; measured, never fails, until ruled"}
      separator: {class: sep, text: 13-400-muted, breaks: never}
      level: {class: lvl}
      far-level: {class: far}
    wide: "levels separated by ›, the current page last"
    narrow: {below: w700, form: "one line that scrolls sideways, the far levels hidden; a trail of two levels keeps Home"}
  facts-line:
    name: Facts line
    file: [site_v2/src/styles/system.css, site_v2/src/components/team/TeamHeader.astro, site_v2/src/components/player/PlayerHeader.astro, site_v2/src/components/competition/CompetitionHeader.astro, site_v2/src/components/fixture/Masthead.astro]
    used-on: [Team, Player, Competition, Match, every page footer, result rows, player rows]
    parts:
      line: {class: facts-line, selector: ".facts-line", element: Facts line, rule: "the facts of one line. Each fact is one unbreakable unit. The units sit in one wrapping line with a 12px gap and no glyph. On a narrow screen a whole unit moves to the next line. A unit wider than the line takes a line of its own and breaks between words", measured: fits, ruled-on: "the separator rule"}
    wide: "all facts on one line"
  page-heading:
    name: Page heading
    file: ["site_v2/src/pages/[lang]/[competitions]/index.astro", "site_v2/src/pages/[lang]/[teams]/index.astro", site_v2/src/components/matches/MatchesDay.astro, "site_v2/src/pages/[lang]/[players]/index.astro", "site_v2/src/pages/[lang]/[players]/[nation].astro"]
    used-on: [Competitions, Matches, Teams, Players, nation page]
    parts:
      heading: {class: crumb, selector: ".crumb + h1", text: 30-700-ink, element: Page heading, rule: "a menu page's heading under its breadcrumb, the menu item's word, in the page title style: 30px bold ink, 20px below 700px", measured: "font-size=30px [>=700px]; font-size=20px [<700px]; font-weight=700; color=ink", ruled-on: "#130; the design standard"}
    wide: "the menu item's word, 30px"
    narrow: {below: w700, form: "the heading at 20px"}
  entity-header:
    name: Entity header
    file: [site_v2/src/components/competition/CompetitionHeader.astro, site_v2/src/components/team/TeamHeader.astro]
    used-on: [Competition pages, Team page]
    parts:
      head: {class: thead}
      identity: {class: tid}
      meta: {class: meta, gap: mock-css}
    wide: "crest | name over meta line, the name 30px"
    narrow: {below: w700, form: "the name at 20px"}
  tabs:
    name: Tab bar
    file: site_v2/src/components/ui/TabBand.astro
    used-on: [Competition pages, Team page, Player page]
    parts:
      bar: {class: tabs, selector: nav.tabs, element: Tab bar, rule: "the tabs share the row and fit in one row at 375px in EN, DE and FI, no sideways scrolling", measured: fits, ruled-on: "#129 header"}
      tab: {class: tab, selector: nav.tabs .tab, text: 13-700-muted, breaks: never, element: Tab, rule: "one line each, never wrapped, 13px bold; the tab you are on ink with the 2px line, every other tab muted", measured: one-line, ruled-on: "#129 header; the design standard"}
      tabs: {class: comp-tabs}
      switch: {class: tab-in}
    wide: the tabs in one row under the header
  block:
    name: Block
    file: site_v2/src/components/ui/SectionHead.astro
    used-on: [every page]
    parts:
      block: {class: section, selector: section, element: Block, rule: "36px above each block; every content block has a name; a block with nothing to show is absent", measured: "margin-top=36px", ruled-on: "#129 binding rules"}
      heading: {class: eyebrow, selector: ".sechead .eyebrow", text: 13-700-muted-caps, element: Block heading, rule: "the block's name: 13px capitals, bold, muted, over a 1px rule", measured: "font-size=13px; font-weight=700; text-transform=uppercase; color=muted", ruled-on: "#129 binding rules (13px, from 11)"}
      heading-gap: {class: sechead, element: Block heading gap, rule: "the block owns the space between its parts: 12px between every two of them, the name's rule and the explainer included; no part brings margin of its own, and a list opening the block carries no top padding; the name starts at the block's left edge", measured: "gap(next)=12px; left-edge=section", ruled-on: "#129 binding rules; #127 correction 3; the design standard"}
      explainer: {class: bsub, text: 13-400-muted, element: Block explainer, rule: "the one sentence under a block name, 13px muted", measured: "font-size=13px; color=muted", ruled-on: "#129 Deserved points"}
      tab-explainer: {class: tab-intro, selector: ".bsub.tab-intro", element: Tab explainer, rule: "a tab's opening sentence under the tab bar, in the block explainer's style: 13px muted", measured: "font-size=13px; color=muted", ruled-on: the Team page review}
    wide: "name over its rule, explainer, content"
  group:
    name: Group
    file: site_v2/src/components/ui/Group.astro
    used-on: [Home, Matches, Competition pages, Team page, Teams page, match page, Players, Player page]
    parts:
      spacing: {class: fxgroup, selector: ".fxgroup + .fxgroup", element: Group spacing, rule: "36px from one group's last row to the next group's heading", measured: "gap(prev)=36px", ruled-on: "#50; the design standard"}
    wide: "group head over its rows"
  group-head:
    name: Group head
    file: site_v2/src/components/ui/GroupHead.astro
    links-to: [competition page, nation page]
    used-on: [Home, Matches, Competition pages, Team page, Teams page, match page, Players, Player page]
    parts:
      head: {class: gh, selector: ".fxgroup:not(.rkgroup) > .gh", element: Competition group head, rule: "the level-1 heading over a competition's match rows: crest, name and chevron when it links, name and count on an index page; 18px bold, a 2px line under it, 36px above the group; on Home, inside the Next matches block, it keeps its line", measured: "border-bottom-width=2px; left-edge=section", ruled-on: "#50; #129; 2026-09-17 (\"Home with line\"); the design standard"}
      name: {class: nm, selector: ".fxgroup:not(.rkgroup) > .gh .nm", text: 18-700-ink, element: Competition group name, rule: 18px bold ink, measured: "font-size=18px; font-weight=700; color=ink", ruled-on: "#50; the design standard"}
      count: {class: cnt, selector: ".fxgroup > .gh .cnt", text: 13-400-muted, element: Group count, rule: "the team count at the right of a group head: 13px muted", measured: "font-size=13px; font-weight=400; color=muted", ruled-on: the Teams page review}
      metric-head: {class: gh, selector: ".rkgroup > .gh", element: Metric group heading, rule: "the level-1 heading over a metric group's boards or rows: the competition group head's size, without its line; 12px to what follows", measured: "border-bottom-width=0px; gap(next)=12px; left-edge=section", ruled-on: "#129 Rankings; 2026-09-17 (\"Rankings without\"); the design standard"}
      metric-name: {class: nm, selector: ".rkgroup > .gh .nm", text: 18-700-ink, element: Metric group name, rule: "18px bold ink, a clear step over the 15px board names", measured: "font-size=18px; font-weight=700; color=ink", ruled-on: "#129 Rankings; the design standard"}
      logo: {class: clogo, gap: mock-css}
    wide: "crest / name / chevron / count; a competition's head links to the competition page, a nation's to the nation page; a metric group's head will link to its Statistics board"
  date-heading:
    name: Date heading
    file: site_v2/src/components/ui/DateHeading.astro
    used-on: [Home, Competition matchdays, Team page, match page, Player page]
    parts:
      date: {class: dh, selector: ".fxgroup .dh", text: 13-700-muted-caps, element: Date heading, rule: "the date once per day, over its rows, in the block heading's style: 13px bold capitals, muted", measured: "font-size=13px; font-weight=700; text-transform=uppercase; color=muted", ruled-on: "#127 (2026-09-14); #50; the design standard"}
    wide: the day's date over its rows
  match-row:
    name: Match row
    file: site_v2/src/components/ui/MatchRow.astro
    links-to: [match page]
    used-on: [Home, Matches, Competition matchdays, Team page]
    parts:
      name: {class: nm, selector: ".fxrow .side .nm", text: 15-400-ink, element: Match row name, rule: "a club's name, 15px ink, wraps and never truncates", measured: "font-size=15px; color=ink; white-space=normal", ruled-on: "#50"}
      kick-off: {class: t, selector: ".fxrow .when .t", text: 15-700-ink, breaks: never, element: Match row kick-off, rule: "the kick-off in the venue's clock, 15px bold ink, on one line inside its column; \"TBC\" when no time", measured: "font-size=15px; font-weight=700; color=ink; one-line; fits", ruled-on: "#50; #129 Matchdays; #146; the component registry"}
      zone: {class: rowtz, selector: ".fxrow .when .rowtz", text: 11-700-muted-caps, element: Match row zone, rule: "the zone label under the kick-off, on every unplayed row, in the small label style: 11px bold muted", measured: "font-size=11px; color=muted", ruled-on: "#50; #146"}
      score: {class: winner, selector: ".fxrow .side .g.winner", text: 15-700-ink, element: Match row score, rule: "a played row is the row plus the score; the winner by weight, never hue", measured: "font-weight=700; color=ink", ruled-on: "#50; #129 Matchdays"}
      sides: {class: sides}
      played: {class: played}
    wide: "home side | kick-off or score | away side"
    narrow: {below: fits, form: "a row's tag on its own line above the home team"}
    never-split: ["15:30", TBC]
    short-forms: [timeOpen]
  table:
    name: Table
    file: [site_v2/src/components/competition/StandingsTable.astro, site_v2/src/components/competition/DeservedTable.astro, site_v2/src/components/competition/RankingBoard.astro, site_v2/src/components/team/TeamDeserved.astro, site_v2/src/components/team/TeamLastSeason.astro, site_v2/src/components/player/PlayerLastSeason.astro]
    used-on: [Competition pages, Team page, Player page, Home]
    parts:
      head: {class: ctab-head, element: Table head, rule: "the head row with the column labels (or, on a board, the board's name); its 1px rule is the table's only line; it starts at the block's left edge", measured: "border-bottom-width=1px; left-edge=section", ruled-on: "#129 Table; 2026-09-17 (\"head only\")"}
      head-label: {class: h, selector: ".ctab-head .h:not(.rk)", text: 11-700-muted, element: Table head label, rule: "the small label's size, weight and colour: 11px bold muted. It keeps the label's own case, since capitals overflow the number columns at 280px", measured: "font-size=11px; font-weight=700; color=muted", ruled-on: "#129 Table; the design standard"}
      box: {class: ctab}
    wide: "rank | crest and name | numbers under their heads"
    narrow: {below: w600, form: "rank, crest and name, then each number under its head"}
  table-row:
    name: Table row
    file: site_v2/src/components/ui/TableRow.astro
    links-to: [team page, player page]
    used-on: [Competition pages, Team page, Player page, Home, match page]
    parts:
      row: {class: ctab-row, element: Table row, rule: "a 1px line between rows, no stripe; the row's tracks are the head's (one fixed track list per table kind)", measured: "stripe=transparent from 1; tracks=head", ruled-on: "#129 Table; the design standard"}
      name: {class: nm, selector: ".ctab .tm .nm", text: 15-400-ink, element: Table name cell, rule: "15px ink, wraps and never truncates", measured: "font-size=15px; font-weight=400; color=ink; white-space=normal", ruled-on: "#129 Table; the design standard"}
      narrow-row: {class: ctab-row, selector: ".ctab.fit-two .ctab-row", element: Table narrow row, rule: "a row that does not fit on one line takes two: rank, crest and name, then each number under its head", measured: "tracks=head", ruled-on: the narrow-screen fix}
      ordered-by: {class: pts, selector: ".ctab .n.pts", text: 15-700-accent, element: Ordered-by number, rule: "the number a table is ordered by: bold 15px accent, everywhere, no per-block colour", measured: "font-size=15px; font-weight=700; color=accent", ruled-on: "#129 binding rules"}
    wide: "rank | crest and name | numbers under their heads; the row links to the team or player page"
    narrow: {below: w600, form: "rank, crest and name, then each number under its head"}
  board:
    name: Board
    file: site_v2/src/components/competition/RankingBoard.astro
    used-on: [Competition rankings, Home]
    parts:
      name: {class: nm, selector: ".ctab.rkt .ctab-head .nmh .bt .nm", text: 15-700-ink, element: Board name, rule: "a board is a single-value table; its name sits in the head row with the chevron, in the item title style: 15px bold ink, not capitals, at the block's left edge", measured: "font-size=15px; font-weight=700; color=ink; text-transform=none", ruled-on: "#129 board rules; #127 correction 1; the design standard"}
      name-cell: {class: nmh, selector: ".ctab.rkt .ctab-head .nmh", element: Board name cell, rule: "at the block's left edge", measured: "left-edge=section", ruled-on: "#127 correction 3"}
      sub-line: {class: sub, selector: ".ctab.rkt .tm .ent .sub", text: 13-400-muted, element: Board sub-line, rule: "a player's club under the name, 13px muted", measured: "font-size=13px; color=muted", ruled-on: "#129 Rankings; the design standard"}
      spacing: {class: board, selector: ".board + .board", element: Board spacing, rule: 24px between boards, measured: "gap(prev)=24px", ruled-on: "#40, #41 (the shipped board); the design standard"}
    wide: "a single-value table, its name in the head row"
    narrow: {below: w480, form: a name and its sub-line each on its own line}
  standings:
    name: Standings table
    file: site_v2/src/components/competition/StandingsTable.astro
    used-on: [Competition overview]
    parts:
      group-head: {class: gh, selector: ".ctab-section > .gh", element: Table group heading, rule: "the heading over one table of a group stage (\"Group A\"): the metric group heading's form, 18px bold. It has no line of its own; the table head's rule is under it", measured: "border-bottom-width=0px; left-edge=section", ruled-on: "#129 Table; the design standard"}
      group-name: {class: nm, selector: ".ctab-section > .gh .nm", text: 18-700-ink, element: Table group name, rule: 18px bold ink, measured: "font-size=18px; font-weight=700; color=ink", ruled-on: "#129 Table; the design standard"}
      goal-difference: {class: gd, selector: ".ctab .n.gd", text: 13-400-muted, breaks: never}
      wdl-head: {class: wdl, selector: ".ctab-head .h.wdl", text: 11-700-muted, breaks: never}
      wdl: {class: wdl, selector: ".ctab .n.wdl", text: 13-400-muted, breaks: never}
    wide: "the table with W, D, L, goal difference and points"
    narrow: {below: w470, form: "without the W, D and L columns"}
    short-forms: [played, wins, draws, losses, goalDifference, position]
  deserved-table:
    name: Deserved points table
    file: site_v2/src/components/competition/DeservedTable.astro
    used-on: [Competition overview]
    parts:
      table: {class: dpt}
      shots-head: {class: hs, selector: ".ctab-head .hs", text: 11-700-muted, breaks: between words}
    wide: the table of deserved points
    short-forms: [position]
  last-season:
    name: Last-season table
    file: site_v2/src/components/team/TeamLastSeason.astro
    used-on: [Team page]
    parts:
      trend: {class: tr, selector: ".ctab.yoyt .n.tr", element: Trend, rule: "▲ in the accent when this season is better, ▼ in the loss red when worse, \"–\" when the shown values are equal", measured: "font-size=13px", ruled-on: the Team page review}
      list: {class: yoy-list}
      up: {class: up, gap: mock-css}
      down: {class: down, gap: mock-css}
      flat: {class: flat, gap: mock-css}
      now: {class: now, gap: mock-css}
      prev: {class: prev, selector: ".ctab.yoyt .n.prev", gap: mock-css}
    wide: "metric | this season | last season | trend"
    narrow: {below: w420, form: the narrow columns}
  fact-row:
    name: Fact row
    file: site_v2/src/components/ui/FactRows.astro
    used-on: [Competition overview, Team page]
    parts:
      label: {class: fl, selector: ".frow .fl", text: 15-400-ink, element: Fact row label, rule: "label, 15px ink regular", measured: "font-size=15px; color=ink; font-weight=400", ruled-on: "#129 the fact row; the design standard"}
      value: {class: fvv, selector: ".frow .fvv b", text: 15-700-accent, element: Fact row value, rule: "the value, bold 15px accent — the number the row is about; right-aligned at every width", measured: "font-size=15px; font-weight=700; color=accent", ruled-on: "#129 binding rules, Block 3; the design standard"}
      context: {class: sub, selector: ".frow .sub", text: 13-400-muted, element: Fact row context, rule: "the context under the value, 13px muted, 2px under it", measured: "font-size=13px; color=muted", ruled-on: "#129 the fact row; the design standard"}
      block: {class: frow, element: Fact row block, rule: "label and value side by side while the block's longest row fits on one line; otherwise every row stacks its value under its label, 2px apart, the value still right-aligned", measured: fits, ruled-on: "the narrow-screen fix; the design standard"}
      rows: {class: facts}
      value-cell: {class: fv}
    wide: "label | value over context"
    narrow: {below: fits, form: "every row's value under its label, right-aligned"}
  heading-link:
    name: Chevron heading link
    file: site_v2/src/components/ui/HeadingLink.astro
    used-on: [every page with a group head]
    parts:
      link: {class: cnm, selector: a.cnm, element: Chevron heading link, rule: a heading that leads somewhere carries a chevron at rest and is never underlined, measured: "text-decoration-line=none", ruled-on: "#52; #129 binding rules"}
    wide: "the heading text, then the chevron"
  chevron:
    name: Chevron
    file: site_v2/src/components/ui/Chevron.astro
    used-on: [every page with a group head, a fold or a filter dropdown]
    parts:
      chevron: {class: chev, selector: a.cnm .chev, element: Chevron, rule: "15px, muted at rest", measured: "color=muted", ruled-on: "#52"}
    wide: the chevron mark
  masthead:
    name: Match header
    file: site_v2/src/components/fixture/Masthead.astro
    used-on: [match page]
    parts:
      team-link: {class: team, selector: ".mast a.team", element: Header team link, rule: "a team in the match header leads to its team page: one link with the chevron at rest, never underlined", measured: "text-decoration-line=none", ruled-on: the match page review}
