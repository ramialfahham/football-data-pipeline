      index: {class: teamindex}
      block: {class: tblock}
      regions: {class: tgroups-region}
      all: {class: tview-all}
      region: {class: tview-region}
    wide: "team rows grouped by competition, in columns"
  fitted-block:
    name: Fitted block
    file: site_v2/src/lib/fitBlocks.mjs
    used-on: [every page with a narrow form]
    parts:
      one: {class: fit-one}
    wide: the block as it fits
  crest:
    name: Crest
    file: site_v2/src/components/ui/Crest.astro
    used-on: [every page]
    parts:
      crest: {class: crest, gap: mock-css}
      small: {class: xs, gap: mock-css}
    wide: "a team's or competition's crest, 24px; 52px in the match header"
  unit:
    name: Unbreakable unit
    file: [site_v2/src/components/fixture/Masthead.astro, site_v2/src/components/competition/SeasonFacts.astro, site_v2/src/components/fixture/HeadToHead.astro, site_v2/src/components/fixture/MatchGoals.astro, site_v2/src/middleware.ts, site_v2/src/lib/wholeWords.mjs]
    used-on: [every page]
    parts:
      unit: {class: nb, gap: style-varies, breaks: never}
    wide: text that never breaks inside itself; the build wraps every hyphen-joined word of a page's body text in it
    never-split: [Matchday 9, 28 July 1993, Saint-Germain]

rules:
  Name in whole words: {selector: ".ctab .tm .nm, .fxrow .side .nm, .club .cn, p.bsub.cmp-p, .cmp-p .chart-legend", rule: "a team name wraps only between words; no word splits or runs past the name's space; in the Finnish Player intro and legend the team name stays with the hyphen that joins it to its Finnish compound", measured: whole-words, ruled-on: the narrow-screen fix}
  Legacy board value: {selector: ".brow .v b", rule: "the legacy Home mocks' boards: the value follows the ordered-by number", measured: "font-size=15px; font-weight=700; color=accent", ruled-on: "#129 binding rules"}
  Fitted block: {selector: ".header-in, .ctab, :has(> .frow), .fbar, .selbar, .fxrow:has(.topmatch), .fxrow:has(> .stag), .rlist.pm, .rlist:has(.resrow:not(.meet, .goal, .scorer)), .rsplit > .rcol:has(.resrow:not(.meet, .goal, .scorer))", rule: "a block with a narrow form carries its measured form, fit-one or fit-two, once the page has loaded", measured: fit-marked, ruled-on: the narrow-screen fix}
  Row link: {selector: "a.ctab-row, a.fxrow, a.frow, a.brow, a.comp-row", rule: "a row that leads somewhere is one link, the whole row; one hover tint for every row link, ink at 11%; the press tint `sunk`; no underline inside a row", measured: "hover(background-color)=ink@11%; press(background-color)=sunk; text-decoration-line=none", ruled-on: "#129 binding rules; #52; #127 (2026-09-14)"}
  Prose link: {selector: "p a, .lede a, .sub a, .bnote a", rule: "the one place an underline stays: a link inside running text", measured: "text-decoration-line=underline", ruled-on: "#52"}
  Tag: {selector: ".nexttag, .fxrow .topmatch, .stag", rule: "Next (on the picker's title), Top match (on the flagged row, before the kick-off) and a match's status. Each is the small label, 11px bold capitals, on an accent mark with 4px corners. Narrow, a row's tag takes its own line above the home team, left-aligned", measured: "font-size=11px; font-weight=700; text-transform=uppercase; background-color=accent; color=pill-ink", ruled-on: "the competition Matchdays design; the Home design; the narrow-screen fix; the design standard"}
  Page width: {selector: "body:not(.legacy-width) :is(.header-in, .footer-in)", rule: "the header row and the footer share the content column's one width, 960px; a page awaiting its new design keeps the earlier widths", measured: "max-width=960px", ruled-on: the page width review}
