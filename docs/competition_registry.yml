# Competition Registry
# Single source of truth for all competitions in the platform.
#
# KEY PRINCIPLE:
# - league_code         : our internal identifier — used in dbt models, naming conventions,
#                         and everywhere above staging. Provider-agnostic.
# - provider_league_code: the code as it appears in the provider's API payload (if any).
# - provider_league_id  : the provider's numeric ID — used only in ingestion scripts and staging.
#
# Above staging, only league_code exists. Provider IDs never appear in core or marts.
# Switching providers = new ingestion + new staging models only. Core and marts untouched.
#
# Status values:
#   active       — ingestion running, models built, app-facing
#   in_progress  — currently being onboarded
#   planned      — approved, not yet implemented
#   backlog      — considered, no timeline
#   completed    — finished, scope doc moved to docs/archive/
#
# Site display metadata (consumed by the site export ONLY — not by dbt; issue #364):
#   confederation : UEFA | CONMEBOL | CONCACAF | CAF | AFC | OFC | FIFA (global)
#   tier          : league pyramid level (domestic_league only; 1 = top flight)
#   slug          : stable, locale-independent URL slug — NEVER change once published
#                   (a rename gets a redirect alias, not a new canonical)
#   sort_order    : display order within the competition's group (groups derive from
#                   competition_type — the type→group map lives in the site export)
#
# Update vars.active_competition_league_codes in dbt_project/dbt_project.yml for active competitions; CI checks sync.

