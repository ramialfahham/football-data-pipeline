# -------------------------------------------------------------------------
# ONBOARDING RULES
# -------------------------------------------------------------------------
# 1. league_code: unique, uppercase, max 6 chars, provider-agnostic.
# 2. provider_league_id: verify with a live API call before writing any code.
#    Document the date in api_coverage_verified.
# 3. Set status to "planned" before writing any code.
#    Only CPO can approve moving from "backlog" to "planned".
# 4. raw_table_prefix: RAW_APIF_{LEAGUE_CODE} (provider first, then league_code).
#    Qualifier leagues set raw_table_prefix: null — data derives from parent raw table.
#    Above staging, only league_code is used — never provider codes or IDs.
# 5. When a competition ends: set status "completed", move scope doc to docs/archive/.
