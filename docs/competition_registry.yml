# -------------------------------------------------------------------------
# ONBOARDING RULES
# -------------------------------------------------------------------------
# 0. COST GATE (answer before writing any code):
#    a. ingest_active: true to start ingesting immediately; false to pause.
#       CI fails if this field is absent on any active/in_progress entry.
#    b. history_seasons: CPO decision — state the rationale. Default is 1.
#       Never increase without explicit approval in the same conversation.
# 1. league_code: unique, uppercase, max 6 chars, provider-agnostic.
# 2. provider_league_id: verify with a live API call before writing any code.
#    Document the date in api_coverage_verified.
# 2b. current_season is optional — ingestion resolves the active year from the API
#     catalog (season.current) first, then season_type inference. Use only as a
#     manual override when the API flag is missing. Set history_seasons for how
#     many season years to load (2 = current + prior for form fallback).
# 3. Set status to "planned" before writing any code.
#    Only CPO can approve moving from "backlog" to "planned".
# 4. raw_table_prefix: RAW_APIF_{LEAGUE_CODE} (provider first, then league_code).
#    Qualifier leagues set raw_table_prefix: null — data derives from parent raw table.
#    Above staging, only league_code is used — never provider codes or IDs.
# 5. When a competition ends: set status "completed", move scope doc to docs/archive/.
