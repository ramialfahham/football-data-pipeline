<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Intelligence - D1 Matchday</title>
  <style>
    :root {
      --bg: #070c1a;
      --panel: #101a34;
      --panel-soft: #162349;
      --line: #2a3c74;
      --text: #ecf1ff;
      --muted: #a8b5df;
      --accent: #6f7dff;
      --good: #16914e;
      --warn: #ba8b00;
      --neutral: #4f5f8d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
    .app { max-width: 1160px; margin: 0 auto; padding: 18px 16px 26px; }
    .start {
      background: linear-gradient(140deg, #243b8f, #6a2fbe);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    .sub { margin: 6px 0 0; color: #e3e9ff; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button, .btn {
      border: 1px solid #8898d8;
      background: #1d2f67;
      color: white;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    .lang-btn.active { background: #e8efff; color: #1a2955; border-color: #e8efff; }
    .meta { margin-top: 9px; color: #dbe3ff; font-size: 13px; }
    .legend { margin-top: 10px; color: #e7eeff; font-size: 13px; }
    .carousel-wrap { margin-top: 14px; }
    .day-header { margin: 16px 0 8px; font-size: 18px; color: #d6defb; }
    .carousel-controls { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 8px;
    }
    .card {
      min-width: min(96vw, 780px);
      scroll-snap-align: start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .fixture { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .kickoff { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .pill { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
    .pill.home { background: #1b854f; }
    .pill.away { background: #8d2e39; }
    .pill.balanced { background: #4e5f8e; }
    .coverage { margin-left: 8px; background: #2d3f72; }
    .narrative { margin: 10px 0 12px; font-size: 15px; color: #f0f3ff; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      background: var(--panel-soft);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid #22325f; font-size: 13px; }
    th { color: #cad5ff; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    td.edge-pos { color: #97f1b6; font-weight: 700; }
    td.edge-neg { color: #ffadb8; font-weight: 700; }
    td.edge-zero { color: #c4d0f8; font-weight: 700; }
    .section-title { margin: 9px 0 6px; color: #dbe4ff; font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 12px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 7, 20, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      width: min(560px, 96vw);
      background: #0f1a37;
      border: 1px solid #334b88;
      border-radius: 12px;
      padding: 14px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 20px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: #d8e2ff; }
    .field textarea, .field select {
      width: 100%;
      border: 1px solid #4d65a7;
      border-radius: 8px;
      background: #111f44;
      color: #f1f5ff;
      padding: 8px;
      font-size: 13px;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #174e30;
      color: #dbffe9;
      border: 1px solid #2a8152;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      display: none;
      z-index: 1100;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="start">
      <div class="topbar">
        <div>
          <h1 id="app-title"></h1>
          <p class="sub" id="app-sub"></p>
        </div>
        <div class="controls">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="de">DE</button>
          <button class="btn" id="feedback-open-btn" type="button">Feedback</button>
        </div>
      </div>
      <div class="meta" id="stamp"></div>
      <div class="legend" id="legend"></div>
    </section>
    <div class="carousel-wrap">
      <div class="carousel-controls">
        <button id="prev-btn">&larr;</button>
        <button id="next-btn">&rarr;</button>
      </div>
      <div id="cards-root"></div>
    </div>
    <div class="foot" id="foot-note"></div>
  </div>
  <div class="modal-backdrop" id="feedback-modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
      <h2 id="feedback-modal-title">Feedback</h2>
      <div class="field">
        <label id="feedback-q1-label" for="feedback-ease"></label>
        <select id="feedback-ease">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q2-label" for="feedback-clarity"></label>
        <select id="feedback-clarity">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q3-label" for="feedback-comment"></label>
        <textarea id="feedback-comment" rows="4" maxlength="500"></textarea>
      </div>
      <div class="modal-actions">
        <button id="feedback-cancel-btn" type="button"></button>
        <button id="feedback-submit-btn" type="button"></button>
      </div>
    </div>
  </div>
  <div class="toast" id="feedback-toast"></div>
  <script>
    const FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/REPLACE_WITH_DEPLOYMENT_ID/exec";
    const FEEDBACK_TOKEN = "replace_with_feedback_token";
    const TZ = "Europe/Berlin";

    const i18n = {
      en: {
        title: "Match Intelligence",
        sub: "D1 pre-match cards: coach-grade metrics, fan-readable story.",
        legend: "How to read: xG = expected goals, xGA = expected goals against, xG Delta = chance quality edge.",
        feedback: "Give feedback",
        feedbackTitle: "Quick feedback",
        feedbackQ1: "How easy was this app to use? (1-5)",
        feedbackQ2: "How clear were the insights and metrics? (1-5)",
        feedbackQ3: "What is the one thing we should improve first?",
        feedbackCancel: "Cancel",
        feedbackSubmit: "Send feedback",
        feedbackThanks: "Thanks! Feedback received.",
        feedbackError: "Could not send feedback right now.",
        dataAsOf: "Data as of",
        sectionCore: "Core Intelligence (5)",
        sectionFan: "Fan Metrics (3)",
        mMetric: "Metric",
        mHome: "Home",
        mAway: "Away",
        mEdge: "Edge",
        mXg: "xG (recent)",
        mXgDelta: "xG Delta (recent)",
        mShotQuality: "Shot Quality Conversion",
        mDefSupp: "Defensive Suppression (xGA)",
        mTransition: "Transition Threat",
        mGoals: "Goals / Match",
        mWinRate: "Win Rate",
        mSoT: "Shots on Target / Match",
        verdictHome: "Home chance edge",
        verdictAway: "Away chance edge",
        verdictBalanced: "Balanced matchup",
        coverageHigh: "High coverage",
        coverageMedium: "Medium coverage",
        coverageLow: "Low coverage",
        foot: "Metrics use recent form with coverage-aware fallback (last 5 -> last 10) when xG data is sparse.",
      },
      de: {
        title: "Match Intelligence",
        sub: "D1 Pre-Match-Karten: Trainer-relevante Metriken, fan-freundliche Story.",
        legend: "So lesen: xG = erwartete Tore, xGA = erwartete Gegentore, xG-Differenz = Chancenqualitätsvorteil.",
        feedback: "Feedback geben",
        feedbackTitle: "Kurzes Feedback",
        feedbackQ1: "Wie einfach war die Nutzung der App? (1-5)",
        feedbackQ2: "Wie verständlich waren Insights und Metriken? (1-5)",
        feedbackQ3: "Was sollten wir als Erstes verbessern?",
        feedbackCancel: "Abbrechen",
        feedbackSubmit: "Feedback senden",
        feedbackThanks: "Danke! Feedback wurde gesendet.",
        feedbackError: "Feedback konnte gerade nicht gesendet werden.",
        dataAsOf: "Datenstand",
        sectionCore: "Kernmetriken (5)",
        sectionFan: "Fan-Metriken (3)",
        mMetric: "Metrik",
        mHome: "Heim",
        mAway: "Auswärts",
        mEdge: "Vorteil",
        mXg: "xG (aktuell)",
        mXgDelta: "xG-Differenz (aktuell)",
        mShotQuality: "Abschluss-Effizienz",
        mDefSupp: "Defensiv-Unterdrückung (xGA)",
        mTransition: "Umschaltgefahr",
        mGoals: "Tore / Spiel",
        mWinRate: "Siegrate",
        mSoT: "Schüsse aufs Tor / Spiel",
        verdictHome: "Heimteam mit Chancenvorteil",
        verdictAway: "Auswärtsteam mit Chancenvorteil",
        verdictBalanced: "Ausgeglichenes Duell",
        coverageHigh: "Hohe Datenabdeckung",
        coverageMedium: "Mittlere Datenabdeckung",
        coverageLow: "Niedrige Datenabdeckung",
        foot: "Metriken nutzen aktuelle Form mit Fallback (letzte 5 -> letzte 10), wenn xG-Daten fehlen.",
      },
    };

    let lang = navigator.language && navigator.language.toLowerCase().startsWith("de") ? "de" : "en";
    let activeFixtureId = null;

    function fmtNum(x, d = 2) {
      return x === null || x === undefined ? "n/a" : Number(x).toFixed(d);
    }
    function fmtPct(x) {
      return x === null || x === undefined ? "n/a" : `${Math.round(Number(x) * 100)}%`;
    }
    function edgeClass(v) {
      if (v > 0.05) return "edge-pos";
      if (v < -0.05) return "edge-neg";
      return "edge-zero";
    }
    function signed(v, d = 2) {
      if (v === null || v === undefined) return "n/a";
      const n = Number(v);
      return `${n > 0 ? "+" : ""}${n.toFixed(d)}`;
    }
    function berlinDate(iso, opts = {}) {
      const base = { timeZone: TZ, weekday: "long", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" };
      return new Intl.DateTimeFormat(lang === "de" ? "de-DE" : "en-GB", { ...base, ...opts }).format(new Date(iso));
    }
    function dayKey(iso) {
      return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, weekday: "long" }).format(new Date(iso));
    }
    function dayLabel(day) {
      const map = {
        Friday: lang === "de" ? "Freitag" : "Friday",
        Saturday: lang === "de" ? "Samstag" : "Saturday",
        Sunday: lang === "de" ? "Sonntag" : "Sunday",
      };
      return map[day] || day;
    }
    function verdictText(row, t) {
      if (row.clash_verdict === "HOME_CHANCE_EDGE") return t.verdictHome;
      if (row.clash_verdict === "AWAY_CHANCE_EDGE") return t.verdictAway;
      return t.verdictBalanced;
    }
    function verdictClass(row) {
      if (row.clash_verdict === "HOME_CHANCE_EDGE") return "pill home";
      if (row.clash_verdict === "AWAY_CHANCE_EDGE") return "pill away";
      return "pill balanced";
    }
    function coverageText(row, t) {
      const low = row.home_coverage_bucket === "LOW" || row.away_coverage_bucket === "LOW";
      const med = row.home_coverage_bucket === "LAST10" || row.away_coverage_bucket === "LAST10";
      if (low) return t.coverageLow;
      if (med) return t.coverageMedium;
      return t.coverageHigh;
    }
    function narrative(row) {
      const home = row.home_team_name;
      const away = row.away_team_name;
      const xgEdge = Number(row.xg_delta_edge_home || 0);
      const defEdge = Number(row.defensive_suppression_edge_home || 0);
      const tranEdge = Number(row.transition_threat_edge_home || 0);

      if (xgEdge >= 0.25 && defEdge >= 0) {
        return lang === "de"
          ? `${home} kommt mit Vorteilen bei Chancenqualität und Defensivkontrolle ins Spiel.`
          : `${home} enter with an edge in chance quality and defensive control.`;
      }
      if (xgEdge <= -0.25 && tranEdge < 0) {
        return lang === "de"
          ? `${away} wirkt im Umschaltspiel gefährlicher und hat die besseren Chancenprofile.`
          : `${away} look more dangerous in transition and carry the better chance profile.`;
      }
      if (Math.abs(xgEdge) < 0.15 && Math.abs(defEdge) < 0.15) {
        return lang === "de"
          ? `Die Profile liegen eng beieinander - Effizienz im Abschluss dürfte entscheiden.`
          : `Profiles are tight - finishing efficiency is likely to decide this one.`;
      }
      return lang === "de"
        ? `${home} vs ${away}: Das Duell kippt je nach Umschaltmomenten und Chancenverwertung.`
        : `${home} vs ${away}: transition moments and shot execution are likely swing factors.`;
    }

    function metricTable(rows, t) {
      return `
        <table>
          <thead><tr><th>${t.mMetric}</th><th>${t.mHome}</th><th>${t.mAway}</th><th>${t.mEdge}</th></tr></thead>
          <tbody>
            ${rows.map((r) => `
              <tr>
                <td>${r.label}</td>
                <td>${r.home}</td>
                <td>${r.away}</td>
                <td class="${edgeClass(r.edge)}">${r.edgeText}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function setFeedbackCopy(t) {
      document.getElementById("feedback-open-btn").textContent = t.feedback;
      document.getElementById("feedback-modal-title").textContent = t.feedbackTitle;
      document.getElementById("feedback-q1-label").textContent = t.feedbackQ1;
      document.getElementById("feedback-q2-label").textContent = t.feedbackQ2;
      document.getElementById("feedback-q3-label").textContent = t.feedbackQ3;
      document.getElementById("feedback-cancel-btn").textContent = t.feedbackCancel;
      document.getElementById("feedback-submit-btn").textContent = t.feedbackSubmit;
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("feedback-toast");
      toast.textContent = message;
      toast.style.display = "block";
      toast.style.background = isError ? "#5b1f2a" : "#174e30";
      toast.style.borderColor = isError ? "#8e3244" : "#2a8152";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }

    function openFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "flex";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "false");
    }

    function closeFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "none";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "true");
    }

    async function submitFeedback() {
      const t = i18n[lang];
      const ease = Number(document.getElementById("feedback-ease").value);
      const clarity = Number(document.getElementById("feedback-clarity").value);
      const comment = String(document.getElementById("feedback-comment").value || "").trim().slice(0, 500);

      const payload = {
        ease_score: ease,
        clarity_score: clarity,
        improvement_text: comment,
        language: lang,
        fixture_id: activeFixtureId,
        app_version: "v1.2-feedback",
        submitted_at: new Date().toISOString(),
        feedback_token: FEEDBACK_TOKEN,
      };

      try {
        const resp = await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) {
          throw new Error(`Feedback endpoint failed: ${resp.status}`);
        }
        closeFeedbackModal();
        document.getElementById("feedback-comment").value = "";
        showToast(t.feedbackThanks);
      } catch (err) {
        showToast(t.feedbackError, true);
      }
    }

    function render(rows) {
      const t = i18n[lang];
      document.getElementById("app-title").textContent = t.title;
      document.getElementById("app-sub").textContent = t.sub;
      document.getElementById("legend").textContent = t.legend;
      setFeedbackCopy(t);
      document.getElementById("foot-note").textContent = t.foot;
      document.getElementById("stamp").textContent = `${t.dataAsOf}: ${new Date().toLocaleString(lang === "de" ? "de-DE" : "en-GB")}`;
      document.querySelectorAll(".lang-btn").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));

      const sorted = [...rows].sort((a, b) => new Date(a.kickoff_datetime) - new Date(b.kickoff_datetime));
      const order = ["Friday", "Saturday", "Sunday"];
      const grouped = {};
      sorted.forEach((r) => {
        const key = dayKey(r.kickoff_datetime);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
      });

      const root = document.getElementById("cards-root");
      root.innerHTML = "";

      order.filter((d) => grouped[d]).forEach((day) => {
        const header = document.createElement("div");
        header.className = "day-header";
        header.textContent = dayLabel(day);
        root.appendChild(header);

        const carousel = document.createElement("div");
        carousel.className = "carousel";
        carousel.dataset.day = day;

        grouped[day].forEach((row) => {
          if (activeFixtureId === null) {
            activeFixtureId = row.fixture_api_id;
          }
          const coreRows = [
            { label: t.mXg, home: fmtNum(row.home_xg_for_recent), away: fmtNum(row.away_xg_for_recent), edge: Number(row.home_xg_for_recent || 0) - Number(row.away_xg_for_recent || 0), edgeText: signed(Number(row.home_xg_for_recent || 0) - Number(row.away_xg_for_recent || 0)) },
            { label: t.mXgDelta, home: fmtNum(row.home_xg_delta_recent), away: fmtNum(row.away_xg_delta_recent), edge: row.xg_delta_edge_home, edgeText: signed(row.xg_delta_edge_home) },
            { label: t.mShotQuality, home: fmtNum(row.home_shot_quality_conversion_recent), away: fmtNum(row.away_shot_quality_conversion_recent), edge: row.shot_quality_conversion_edge_home, edgeText: signed(row.shot_quality_conversion_edge_home) },
            { label: t.mDefSupp, home: fmtNum(row.home_xga_per_match_recent), away: fmtNum(row.away_xga_per_match_recent), edge: row.defensive_suppression_edge_home, edgeText: signed(row.defensive_suppression_edge_home) },
            { label: t.mTransition, home: fmtNum(row.home_transition_threat_recent), away: fmtNum(row.away_transition_threat_recent), edge: row.transition_threat_edge_home, edgeText: signed(row.transition_threat_edge_home) },
          ];
          const fanRows = [
            { label: t.mGoals, home: fmtNum(row.home_goals_per_match_recent, 1), away: fmtNum(row.away_goals_per_match_recent, 1), edge: Number(row.home_goals_per_match_recent || 0) - Number(row.away_goals_per_match_recent || 0), edgeText: signed(Number(row.home_goals_per_match_recent || 0) - Number(row.away_goals_per_match_recent || 0), 1) },
            { label: t.mWinRate, home: fmtPct(row.home_win_rate_recent), away: fmtPct(row.away_win_rate_recent), edge: Number(row.home_win_rate_recent || 0) - Number(row.away_win_rate_recent || 0), edgeText: signed((Number(row.home_win_rate_recent || 0) - Number(row.away_win_rate_recent || 0)) * 100, 0) + "%" },
            { label: t.mSoT, home: fmtNum(row.home_shots_on_target_per_match_recent, 1), away: fmtNum(row.away_shots_on_target_per_match_recent, 1), edge: Number(row.home_shots_on_target_per_match_recent || 0) - Number(row.away_shots_on_target_per_match_recent || 0), edgeText: signed(Number(row.home_shots_on_target_per_match_recent || 0) - Number(row.away_shots_on_target_per_match_recent || 0), 1) },
          ];

          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="fixture">${row.home_team_name} vs ${row.away_team_name}</div>
            <div class="kickoff">${row.league_name} · ${row.round_name} · ${berlinDate(row.kickoff_datetime)} (${TZ})</div>
            <span class="${verdictClass(row)}">${verdictText(row, t)}</span>
            <span class="pill coverage">${coverageText(row, t)}</span>
            <div class="narrative">${narrative(row)}</div>
            <div class="section-title">${t.sectionCore}</div>
            ${metricTable(coreRows, t)}
            <div class="section-title">${t.sectionFan}</div>
            ${metricTable(fanRows, t)}
          `;
          carousel.appendChild(card);
        });
        root.appendChild(carousel);
      });
    }

    function scrollActive(direction) {
      const firstCarousel = document.querySelector(".carousel");
      if (!firstCarousel) return;
      firstCarousel.scrollBy({ left: direction * 420, behavior: "smooth" });
    }

    document.getElementById("prev-btn").addEventListener("click", () => scrollActive(-1));
    document.getElementById("next-btn").addEventListener("click", () => scrollActive(1));
    document.getElementById("feedback-open-btn").addEventListener("click", openFeedbackModal);
    document.getElementById("feedback-cancel-btn").addEventListener("click", closeFeedbackModal);
    document.getElementById("feedback-submit-btn").addEventListener("click", submitFeedback);
    document.getElementById("feedback-modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "feedback-modal-backdrop") {
        closeFeedbackModal();
      }
    });
    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        fetch("./matchday_insights.json")
          .then((r) => r.json())
          .then((payload) => render(payload.show || []));
      });
    });

    fetch("./matchday_insights.json")
      .then((r) => r.json())
      .then((payload) => render(payload.show || []))
      .catch((err) => {
        document.getElementById("cards-root").innerHTML =
          `<article class="card">Could not load matchday data: ${err}</article>`;
      });
  </script>
</body>
</html>
