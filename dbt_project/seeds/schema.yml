version: 2

seeds:
  - name: competition_types
    description: >
      The competition-type taxonomy. Hand-authored, one row per competition_type: whether the type
      is played by clubs or by national teams, which navigation group it belongs to, and its
      display heading.

      The single source of truth for the club/national split — entity_type is resolved through
      this table, never hardcoded, and no type is both. Every competition_type in
      docs/competition_registry.yml must have a row here or
      scripts/check_competition_type_seed.py fails the build.

      `qualifying` is national-team qualifying only; a club qualifying round would take its own
      clearly-club type.
    columns:
      - name: competition_type
        description: "Competition-type enum value, matching docs/competition_registry.yml competition_type."
        tests:
          - not_null
          - unique
      - name: entity_type
        description: "Whether the competition is played by clubs or national teams."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: display_group
        description: >
          Which navigation group a competition of this type belongs to: leagues, cups,
          continental-club or national-teams.

          Blank means the type is not browsable. Competitions of a blank type are excluded
          from mart_competition_index, and so from the competitions page. Only the friendly
          types are blank today, and no active competition uses one, so the exclusion
          currently removes no rows.
        tests:
          - accepted_values:
              values: ["leagues", "cups", "continental-club", "national-teams"]
      - name: label_i18n_key
        description: >
          The i18n key for this category's TRANSLATED heading. English does not resolve through
          it — the English words are in label_en.

          The key is formed mechanically, so it cannot drift from the type: `compType` followed by
          the competition_type in PascalCase. That is why `world_championship` carries
          compTypeWorldChampionship even though the heading reads "World Cup" — the key follows
          the type name, not the label, so renaming the type renames the key with it.
        tests:
          - not_null
          - unique
      - name: label_en
        description: >
          The category's English display name — the heading shown above a group of competitions.
          This seed owns it; other languages resolve from label_i18n_key in the i18n layer.

          Naming rule: a type that holds ONE specific competition is named for that competition
          ("World Cup", "Club World Cup", "Intercontinental Cup"); a type that holds a CLASS of
          competitions takes a plural noun phrase ("Domestic leagues", "Continental club cups").
          Three of the types are singular by nature and all three are FIFA's.
        tests:
          - not_null
          - unique

  - name: confederations
    description: >
      Readable region names for the confederation codes — what "UEFA" is called when it is shown
      to someone. Hand-authored, seven rows, one per confederation.

      Keyed by confederation rather than held as extra columns on competition_types, because the
      region varies WITHIN a type: COAM and EURO are both `continental_championship`, and they are
      South America and Europe.

      `FIFA -> World` is the one label that is a judgement rather than geography, FIFA being a
      global governing body and not a region.
    columns:
      - name: confederation
        description: >
          Confederation code, matching docs/competition_registry.yml's `confederation` field and
          the enum documented in its header (UEFA | CONMEBOL | CONCACAF | CAF | AFC | OFC | FIFA).
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ["UEFA", "CONMEBOL", "CONCACAF", "CAF", "AFC", "OFC", "FIFA"]
      - name: label_i18n_key
        description: "i18n key for the translated region label. Convention: `confed` + PascalCase of the code."
        tests:
          - not_null
          - unique
      - name: label_en
        description: >
          The region's English display name. CONCACAF's "North & Central America" is the
          normalised form — the registry's own `country` field writes it "North/Central America"
          for CCCU, which is one of the inconsistencies this seed removes.
        tests:
          - not_null
          - unique
      - name: region_rank
        description: >
          Hand-set rank across the seven confederations, UEFA=1 through OFC=7. It orders regions
          against each other where competitions are listed together and nothing more specific
          separates them.

          A judgement rather than geography, and unique per row, so it always breaks a tie.
        tests:
          - not_null
          - unique

  - name: competition_registry
    description: >
      Every competition the platform tracks, with the fields the registry authors by hand:
      competition type, parent competition, confederation, URL slug, ordering, division tier and
      season shape. One row per league_code.

      GENERATED, do not hand-edit — scripts/sync_dbt_vars.py writes it from
      docs/competition_registry.yml, the authoring surface.
      scripts/check_registry_var_sync.py fails the build if the two drift on any column.

      `country` is deliberately absent: dim_league carries it from the provider, and the
      registry's hand-typed copy holds a region word ("Europe") for about half the rows.
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests:
          - not_null
          - unique
      - name: competition_type
        description: "Competition type; must exist in the competition_types taxonomy."
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type
      - name: parent_competition
        description: >
          The league_code of this competition's parent, or empty when it has none. A qualifier
          points at its tournament (WCQEU -> WC); a domestic cup points at its country's league
          (DFBP -> BL1).

          It exists so a tournament's qualifying competitions can be found by following the link
          instead of from a hardcoded list of codes. Every non-empty value is a known league_code;
          check_registry_var_sync.py fails the build otherwise.
      - name: confederation
        description: >
          The competition's governing confederation, and the region key for the whole platform:
          AFC, CAF, CONCACAF, CONMEBOL, OFC, UEFA, or FIFA for worldwide competitions. Join
          confederations for the display label. This is OUR classification — the provider does
          not supply it — which is why it is registry-owned rather than taken from a dim. It is
          strictly more precise than the registry's country field ever was: country says
          "International" for both the Copa América and the Gold Cup, while confederation
          separates CONMEBOL from CONCACAF.
        tests:
          - not_null
          - relationships:
              to: ref('confederations')
              field: confederation
      - name: slug
        description: >
          The competition's URL segment, e.g. "bundesliga". Authored in the registry and assigned
          once, never derived from a name — renaming a competition must not silently move its URL.
        tests:
          - not_null
          - unique
      - name: sort_order
        description: >
          Authored display rank WITHIN a display_group; lower sorts first. Hand-set rather than
          computed, so competition ordering can be changed without a code change.

          Not a global order, and not dense: the rank restarts per group and is spaced in tens, so
          the same value recurs across groups. Two competitions can therefore share a value, and
          ordering them against each other needs something else.
        tests:
          - not_null
      - name: tier
        description: >
          Division level within its country: 1 for a top flight, 2 for a second tier. EMPTY for
          every competition that is not a domestic_league, because a cup or a tournament has no
          division — structurally not applicable rather than missing, which is why there is no
          not_null test. Non-empty exactly when competition_type is domestic_league;
          tests/test_registry_seed_projection.py pins that both ways.
      - name: season_type
        description: >
          Whether a season sits inside one calendar year ("calendar_year", e.g. MLS, Brasileirão)
          or spans two ("split_year", e.g. the Bundesliga's 2025/26). Drives season labelling and
          the boundaries of a season window.
        tests:
          - not_null
      - name: competition_group
        description: >
          Which leagues this one is ranked alongside when a surface shows one entry per league.
          "elite" the seven strongest European top flights; "europe" the remaining European top
          flights on a SPLIT-YEAR season; "international" top flights outside Europe on a
          split-year season; "calendar" top flights whose season sits inside one calendar year,
          wherever they are (which is why Finland is here and not in "europe"); "secondary" below
          a country's top flight. Mutually exclusive and exhaustive over domestic leagues.

          Authored, not derived: "elite" is a strength judgement no other column expresses, and
          several leagues match every structural rule for it yet sit outside it. EMPTY for anything
          that is not a domestic_league — a cup is not ranked against leagues, so this is
          structurally N/A rather than missing, which is why there is no not_null test. Non-empty
          exactly when competition_type is domestic_league; tests/test_registry_seed_projection.py
          pins that both ways and pins the permitted values.

  - name: metric_catalogue
    description: >
      The single source of truth for every metric we compute. One row per (metric_id, entity), so
      a metric with both a team and a player form has two rows. Each row carries the formula, the
      English name and i18n key, the display format, what it measures, how important it is, and
      which way is better.

      The formula is the correctness contract: any model computing it must match. It is
      window-free — ids carry no window suffix, and the window and any null policy are applied
      where the metric is computed, never here.

      What a metric IS, not where it appears: display order lives in metrics_display.md.
    config:
      +full_refresh: true
      column_types:
        importance_tier: int64
    columns:
      - name: metric_id
        description: >
          Stable semantic id. Window-agnostic — no _recent or _pretournament suffix.
          The key is (metric_id, entity), not metric_id alone: one id may carry a team
          definition and a player definition that differ (enforced by
          assert_metric_catalogue_unique_by_entity). No instance is named here on
          purpose — step 4 of the naming programme renames every player id that
          currently collides, so a quoted example would date.
        tests:
          - not_null
      - name: entity
        description: "Whether this metric describes a team, a player, or both."
        tests:
          - not_null
          - accepted_values:
              values: ["team", "player", "team and player"]
      - name: label_i18n_key
        description: >
          The i18n key for this metric's TRANSLATED label. English does not resolve through it —
          the English words are in label_en.

          Unique per ROW, and never shared between a metric's team and player rows. Two rows
          sharing a key would share one German and one Finnish string while owning separate
          English ones, so the three could drift apart with nothing noticing.
        tests:
          - not_null
          - unique
      - name: label_en
        description: >
          The metric's English display name. This seed owns it; other languages resolve from
          label_i18n_key in the i18n layer.

          Naming rule: a bare noun is a count (`Goals`); `Ø` prefixes an average, per match for
          teams and per 90 for players (`Ø Tackles per 90`); `%` prefixes a share or rate
          (`% Duels won`). The prefix carries the unit, so a reader never has to guess whether 2.9
          is a total or an average.

          Unique per ENTITY, not globally: the same words may appear on a team row and a player
          row, because `% Duels won` means the same thing for both.
        tests:
          - not_null
      - name: description
        description: >
          Plain-English definition: what the metric measures, nullability, and source columns.

          This field is the SOURCE of the generated docs blocks in
          models/docs/metric_columns.md, which every column of that metric's name references, so
          editing it rewrites the description BigQuery holds for hundreds of columns. Regenerate
          after any change: `python scripts/sync_metric_docs_blocks.py`. A generated file that has
          drifted from this column fails `--check`.

          Keep it window-free, as the seed's own contract above requires. These blocks land on
          per-match columns, where a claim about a form window is simply false.
        tests: [not_null]
      - name: base_relation
        description: >
          The int_legs__* per-(entity, fixture) building block the formula aggregates over:
          int_legs__team_match, int_legs__team_from_players or int_legs__player_match.

          BLANK whenever the metric is not a single-leg aggregate — a value looked up from
          elsewhere, a fitted or rank-derived read, or a composition across two grains. A blank
          here is what makes assert_metric_catalogue_expr_resolvable skip the row, so the rule is
          enforced by that test rather than by a list of exceptions kept in prose.
        tests:
          - accepted_values:
              values: ["int_legs__team_match", "int_legs__team_from_players", "int_legs__player_match"]
      - name: numerator_expr
        description: >
          The metric's fixed mathematical numerator as a window-free aggregate over base_relation's
          real columns (e.g. sum(goals_for); sum(goals_for - goals_penalty - goals_own)). The
          expression is the DEFINITION only — data availability (missing stats) decides whether a
          model can APPLY the formula (compute vs null); it is NOT encoded here (no coverage counts,
          no coalesce, no null gates). Blank for the blank-base_relation rows above (lookups + rank-derived reads).
      - name: denominator_expr
        description: >
          The metric's fixed mathematical denominator: count(*) = number of matches in the window
          (per-match rates); sum(<expr>) for ratios; sum(minutes_played) for per-90 (the * 90 sits in
          numerator_expr); 3 * count(*) for points_capture_pct. Like the numerator it is the DEFINITION
          only — coverage/availability handling lives in the model, never here. Blank for raw count
          metrics and the blank-base_relation rows above.
      - name: computation_kind
        description: >
          HOW the number is produced, so that an empty formula is explicit rather than ambiguous.

          `expression` — numerator_expr / denominator_expr over base_relation; the large majority.
          `model` — produced by a dbt model and not expressible as a numerator over a denominator;
          the catalogue still says what it MEANS, the model says how it is computed. `sourced` —
          taken from the provider, never derived from match legs. `cross_grain` — numerator and
          denominator sit at different grains, so one base_relation cannot hold both.

          An `expression` row carrying no formula is a defect, not a gap.
        tests:
          - not_null
          - accepted_values:
              values: ["expression", "model", "sourced", "cross_grain"]
      - name: lower_is_better
        description: >
          True when a lower value indicates better performance.

          LEGACY — the boolean predecessor of `direction`, kept only until the last thing depending
          on it is gone. `direction` is the authority: set this to match it (true exactly when
          direction is lower_better), never the other way round.
          assert_metric_direction_lower_is_better_agree fails the build if the two diverge.
        tests: [not_null]
      - name: format
        description: >
          Display format: integer, decimal_0, decimal_1, percent, points_fraction
          (points of available, e.g. 10/15), or count_fraction (count of games, e.g. 3/5).
        tests:
          - not_null
          - accepted_values:
              values: ["integer", "decimal_0", "decimal_1", "percent", "points_fraction", "count_fraction"]
      - name: metric_group
        description: >
          What the metric MEASURES — a taxonomy, not a layout. Shared across entities: a metric
          family keeps the same group on its team row and its player row. Populated on every row.

          `outcomes` covers the points and standing metrics (points won, points capture, league
          rank, and the deserved trio); `playing_time` covers minutes_per_appearance.
        tests:
          - not_null
          - accepted_values:
              values: ["goals", "shooting", "duels", "defending", "passing", "set_pieces", "goalkeeping", "discipline", "outcomes", "playing_time"]
      - name: importance_tier
        description: >
          Display importance: 1 = survives on a compact surface, 2 = standard, 3 = depth. Tier
          never reorders anything; it gates visibility when space is short. Populated on every row,
          team and player alike.

          The rubric: the core stat line is tier 1, including both the raw counts and their
          headline percentage; a per-90 sits one tier below its own total; breakdowns and rare
          events are tier 3. Redundancy at tier 1 is deliberate — goals, assists and scorer_points
          are all 1, because tier means importance, not deduplication.
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
              quote: false
      - name: direction
        description: >
          Which way is better: higher_better, lower_better, or neutral. It is what turns a rank or
          a percentile into a good/bad reading, and it is required on every row, team and player
          alike (assert_metric_meaning_complete).

          Set by the all-else-equal judgement "is MORE of this better?", NOT by correlation with
          results or league position — so a style or volume metric still carries a direction.
          `neutral` is reserved for a metric with genuinely no better/worse pole, such as a
          narrative gap or a position-dependent share.
        tests:
          - accepted_values:
              values: ["higher_better", "lower_better", "neutral"]
      - name: interpretation
        description: >
          Short plain-English meaning of the metric — what it captures and what a notably high
          value signals. Required on every metric, team and player alike
          (assert_metric_meaning_complete).

          House style: what it captures, then a plain definition, then what a notable value
          signals, with any honest volume, style or role caveat last in parentheses.
    tests:
      # Display names are unique WITHIN an entity, not globally (CPO 2026-08-08). The same words on
      # a player row and a team row are allowed — `% Duels won` means the same thing for both and
      # the surrounding block says which — so a plain `unique` on label_en would be the wrong test
      # and would fail today on five legitimate pairs.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - entity
            - label_en
          name: metric_catalogue_label_en_unique_within_entity

  - name: wc_team_market_value_snapshot
    description: >
      Squad market-value estimates for World Cup national teams, in whole EUR. One row per (team,
      snapshot date, source); rows are appended per snapshot run rather than replaced, so the
      seed is a history. team_sk matches dim_team.team_sk (the provider's national-team id).

      Researched, not ingested from the provider, which offers no market value. Empty until a
      snapshot run loads rows.
    config:
      column_types:
        team_sk: int64
        as_of_date: date
        market_value_eur: int64
        source_code: string
        prompt_version: string
    columns:
      - name: team_sk
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        tests: [not_null]
      - name: prompt_version
        description: "{{ doc('prompt_version') }}"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code

  - name: fixture_event_team_overrides
    description: >
      Corrections for known API-Football fixture-event team-id defects. Hand-authored, one row per
      wrong source team id: what it should resolve to, and how to apply it.

      `alias` replaces the id unconditionally — the provider holds two ids for one club.
      `reattribute_if_cohabiting` replaces it only in fixtures where the correct team is a
      participant and the wrong one is not: a mis-attribution between two DISTINCT clubs, so the
      wrong club's own events are never touched.

      Add a row only with EXTERNALLY verified evidence; never infer a duplicate from name
      similarity within our own data.
    config:
      column_types:
        wrong_team_api_id: int64
        correct_team_api_id: int64
        mode: string
        note: string
    columns:
      - name: wrong_team_api_id
        description: "The team_api_id the provider's event feed wrongly emits."
        tests:
          - not_null
          - unique
      - name: correct_team_api_id
        description: "The team_api_id the event should resolve to."
        tests:
          - not_null
      - name: mode
        description: "alias = unconditional duplicate-id replacement; reattribute_if_cohabiting = participant-gated mis-attribution fix."
        tests:
          - not_null
          - accepted_values:
              values: ["alias", "reattribute_if_cohabiting"]
      - name: note
        description: "Human note + external-evidence reference for the correction (required — the governance control)."
        tests:
          - not_null

  - name: team_name_overrides
    description: >
      Corrections to a team's DISPLAY NAME: one row per team whose provider name is not the name
      we show. Load-bearing — there is no second name field, so this value names the team
      everywhere, including in its URL.

      A row is justified by a COLLISION (two real clubs sharing a label, e.g. "Rangers") or by a
      name unique but incomplete against an external source ("Arsenal" for Arsenal FC); `note`
      says which. Add one only where an authoritative external source disagrees with the provider,
      and cite it — never taste, never a nickname, never a locale preference.

      It does NOT fold duplicate provider ids.
    config:
      column_types:
        team_api_id: int64
        team_name: string
        source: string
        note: string
    columns:
      - name: team_api_id
        description: "The team whose display name this row replaces. Must exist in dim_team."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_team')
              field: team_api_id
      - name: team_name
        description: "The club's actual name, as established by the external source in `source`."
        tests:
          - not_null
      - name: source
        description: "URL of the external source of record establishing the name (required — the governance control)."
        tests:
          - not_null
      - name: note
        description: >
          Why the provider's value is not usable: either what this row's label collides with, or
          why the name is incomplete or informal against the external source even without a
          collision. State which of the two applies.
        tests:
          - not_null

  - name: country_name_overrides
    description: >
      Maps a provider COUNTRY string to the one canonical English name. One row per distinct
      provider string, across the league, team, player and coach surfaces, which are inconsistent
      with each other and themselves.

      NAMING RULE: English, everyday short form, no diacritics. Never the endonym (`Türkiye` ->
      `Turkey`); never the formal state title (`Russian Federation` -> `Russia`); but a genuine
      RENAME stands (`Czechia`). Two rows are deliberate exceptions, citing their authority in
      `source`.

      KNOWN GAP: only the listed strings are mapped, so an unseen spelling passes through
      unchanged.
    config:
      column_types:
        provider_country: string
        country_name: string
        source: string
        note: string
    columns:
      - name: provider_country
        description: "The exact string API-Football sends in `$.country.name`, and the join key."
        tests:
          - not_null
          - unique
      - name: country_name
        description: "The name the product displays."
        tests:
          - not_null
      - name: source
        description: >
          The authority for this name, required as the governance control: an external source of
          record where the name is a factual identity claim, or the recorded decision where it is
          a display choice.
        tests:
          - not_null
      - name: note
        description: "Why the provider's value is not usable as-is."
        tests:
          - not_null

  - name: countries
    description: >
      The canonical country list: hand-authored, one row per country, a stable key and the English
      name we display. Provider spellings map onto it in the base layer.

      NAMING RULE: English, everyday short form, no diacritics — `Turkey` not `Türkiye` — though a
      genuine rename stands (`Czechia`). `Republic of Ireland` and `United States of America` are
      standing exceptions.

      NOT A LIST OF UN MEMBER STATES, and joining it to one drops real rows: it also carries
      football associations (England, Scotland), player-producing territories (Jersey), one
      unrecognised state and one historical country.
    config:
      column_types:
        country_key: string
        country_name: string
    columns:
      - name: country_key
        description: >
          Stable slug of the canonical name, ASSIGNED once and then fixed. Do not re-derive it if
          the name ever changes — the whole point of a key is that a rename does not move it.
        tests:
          - not_null
          - unique
      - name: country_name
        description: "The canonical English name the product displays. ASCII only."
        tests:
          - not_null
          - unique
