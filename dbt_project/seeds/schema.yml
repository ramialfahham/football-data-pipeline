version: 2

seeds:
  - name: competition_types
    description: >
      Canonical competition-type taxonomy. One row per competition_type declaring whether
      it is a club or national-team competition (entity_type). This is the single source
      of truth for the club/national split: downstream models look it up by competition_type
      rather than hardcoding the mapping. Every competition_type used in
      docs/competition_registry.yml must have a row here (enforced by
      scripts/check_competition_type_seed.py). Rule: no competition_type is both club and
      national. `qualifying` = national-team qualifying (WC/EC); club qualifying rounds, if
      onboarded, take their own clearly-club type.
    columns:
      - name: competition_type
        description: "Competition-type enum value, matching docs/competition_registry.yml competition_type."
        tests:
          - not_null
          - unique
      - name: entity_type
        description: "Whether the competition is played by clubs or national teams."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]

  - name: competition_registry
    description: >
      league_code → competition_type mapping, generated from docs/competition_registry.yml
      by scripts/sync_dbt_vars.py (do not hand-edit). dbt models join on this to resolve a
      competition's type, then look up entity_type via the competition_types seed. Kept in
      lockstep with the registry by scripts/check_registry_var_sync.py.
    columns:
      - name: league_code
        description: "Internal competition code (matches docs/competition_registry.yml)."
        tests:
          - not_null
          - unique
      - name: competition_type
        description: "Competition type; must exist in the competition_types taxonomy."
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type

  - name: metric_catalogue
    description: >
      Single source of truth for every metric the platform computes. One row per metric.
      Captures the formula (numerator / denominator), entity type (team/player), i18n key,
      and display format. Formulas reference raw totals from int_legs__* building-block legs;
      the mart applies the window context and computes the final values. Window-agnostic:
      metric IDs carry no window suffix. Part of epic #317.
    config:
      +full_refresh: true
    columns:
      - name: metric_id
        description: "Stable semantic id. Window-agnostic — no _recent or _pretournament suffix."
        tests:
          - not_null
          - unique
      - name: entity
        description: "Whether this metric describes a team or a player."
        tests:
          - not_null
          - accepted_values:
              values: ["team", "player"]
      - name: label_i18n_key
        description: "i18n key for the human-readable label."
        tests: [not_null]
      - name: description
        description: "Plain-English definition: what the metric measures, nullability, and source columns."
        tests: [not_null]
      - name: numerator
        description: "Source column(s) from int_legs__* to sum, or a formula expression for derived values. Blank for lookups."
      - name: denominator
        description: "'games' for per-match rates; a column name to SUM for ratios; blank for raw sums and lookups."
      - name: lower_is_better
        description: "True when a lower value indicates better performance."
        tests: [not_null]
      - name: format
        description: "Display format: integer, decimal_0, decimal_1, percent, or points_fraction."
        tests:
          - not_null
          - accepted_values:
              values: ["integer", "decimal_0", "decimal_1", "percent", "points_fraction"]

  - name: metric_definitions
    description: >
      Canonical metric ids and mart column bindings (no locale-specific copy).
      Labels and descriptions live in site/i18n/*.json under metrics.<metric_id>.
    config:
      +full_refresh: true
    columns:
      - name: metric_id
        description: "Stable semantic metric id (language-neutral)."
        tests:
          - not_null
          - unique
      - name: home_column
        description: "Mart column for the home team value (match-preview paired metrics)."
      - name: away_column
        description: "Mart column for the away team value (match-preview paired metrics)."
      - name: single_column
        description: "Mart column when the metric is not split home/away."
      - name: lower_is_better
        description: "True when a lower numeric value is better for comparison highlighting."
      - name: format
        description: "UI format: integer, decimal_0, decimal_1, percent, points_fraction."
        tests: [not_null]
      - name: context
        description: "Where this binding applies: match_preview, wc_pretournament, etc."
        tests: [not_null]

  - name: wc_supporting_league_codes
    description: >
      Maps parent tournament league_code (WC) to supporting qualifier league_codes for WC qualifier-phase
      form on Group Stage Matchday 1. qualifier_season_api_year is the active qualifying campaign season on API-Football
      (competition_registry current_season per WCQ*). Keep in sync with docs/competition_registry.yml.
    columns:
      - name: parent_league_code
        tests: [not_null]
      - name: supporting_league_code
        tests: [not_null]
      - name: qualifier_season_api_year
        tests: [not_null]

  - name: wc_team_market_value_snapshot
    description: >
      Twice-monthly WC national-team squad market value estimates (EUR). team_sk matches dim_team.team_sk
      (API-Football national team id). Append rows per snapshot run; dbt builds fct_team_market_value_snapshot.
    config:
      column_types:
        team_sk: int64
        as_of_date: date
        market_value_eur: int64
        source_code: string
        prompt_version: string
    columns:
      - name: team_sk
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        tests: [not_null]
      - name: prompt_version
        description: "Version of the research prompt or ingest job (e.g. wc_squad_value_v1)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code
