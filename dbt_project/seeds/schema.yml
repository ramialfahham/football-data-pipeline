version: 2

seeds:
  - name: metric_glossary
    description: >
      Kurze deutsche Labels und Erklärungen für die Match-Preview-UI. metric_key entspricht
      Spalten in mart_matchday_insights; Zahlen und Formatierung kommen aus dem Mart.
    columns:
      - name: metric_key
        description: "Stable id; same as the mart column name for that metric."
        tests:
          - not_null
          - unique
      - name: label
        description: "Kurzbeschriftung (oft Heim/Gast unterscheidbar)."
        tests: [not_null]
      - name: description
        description: "Knappe Erklärung unter der Kennzahl; Formfenster-Bezug steht in der Fußnote der Seite."
        tests: [not_null]
