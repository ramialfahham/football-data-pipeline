version: 2

seeds:
  - name: metric_definitions
    description: >
      Canonical metric ids and mart column bindings (no locale-specific copy).
      Labels and descriptions live in site/i18n/*.json under metrics.<metric_id>.
    config:
      +full_refresh: true
    columns:
      - name: metric_id
        description: "Stable semantic metric id (language-neutral)."
        tests:
          - not_null
          - unique
      - name: home_column
        description: "Mart column for the home team value (match-preview paired metrics)."
      - name: away_column
        description: "Mart column for the away team value (match-preview paired metrics)."
      - name: single_column
        description: "Mart column when the metric is not split home/away."
      - name: lower_is_better
        description: "True when a lower numeric value is better for comparison highlighting."
      - name: format
        description: "UI format: integer, decimal_0, decimal_1, percent, points_fraction."
        tests: [not_null]
      - name: context
        description: "Where this binding applies: match_preview, wc_pretournament, etc."
        tests: [not_null]

  - name: wc_supporting_league_codes
    description: >
      Maps parent tournament league_code (WC) to supporting qualifier league_codes for WC qualifier-phase
      form on Group Stage Matchday 1. qualifier_season_api_year is the active qualifying campaign season on API-Football
      (competition_registry current_season per WCQ*). Keep in sync with docs/competition_registry.yml.
    columns:
      - name: parent_league_code
        tests: [not_null]
      - name: supporting_league_code
        tests: [not_null]
      - name: qualifier_season_api_year
        tests: [not_null]

  - name: wc_team_market_value_snapshot
    description: >
      Twice-monthly WC national-team squad market value estimates (EUR). team_sk matches dim_team.team_sk
      (API-Football national team id). Append rows per snapshot run; dbt builds fct_team_market_value_snapshot.
    config:
      column_types:
        team_sk: int64
        as_of_date: date
        market_value_eur: int64
        source_code: string
        prompt_version: string
    columns:
      - name: team_sk
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        tests: [not_null]
      - name: prompt_version
        description: "Version of the research prompt or ingest job (e.g. wc_squad_value_v1)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code
