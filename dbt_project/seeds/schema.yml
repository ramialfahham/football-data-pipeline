version: 2

seeds:
  - name: metric_glossary
    description: >
      Kurze deutsche Labels und Erklärungen für die Match-Preview-UI. metric_key entspricht
      Spalten in mart_matchday_insights; Zahlen und Formatierung kommen aus dem Mart.
    columns:
      - name: metric_key
        description: "Stable id; same as the mart column name for that metric."
        tests:
          - not_null
          - unique
      - name: label
        description: "Kurzbeschriftung (oft Heim/Gast unterscheidbar)."
        tests: [not_null]
      - name: description
        description: "Knappe Erklärung unter der Kennzahl; Formfenster-Bezug steht in der Fußnote der Seite."
        tests: [not_null]

  - name: wc_supporting_league_codes
    description: >
      Maps parent tournament league_code (WC) to supporting qualifier league_codes for pre-tournament
      form. Keep in sync with docs/competition_registry.yml supporting_leagues for WC.
    columns:
      - name: parent_league_code
        tests: [not_null]
      - name: supporting_league_code
        tests: [not_null]

  - name: wc_team_market_value_snapshot
    description: >
      Twice-monthly WC national-team squad market value estimates (EUR). team_sk matches dim_team.team_sk
      (API-Football national team id). Append rows per snapshot run; dbt builds fct_team_market_value_snapshot.
    config:
      column_types:
        team_sk: int64
        as_of_date: date
        market_value_eur: int64
        source_code: string
        prompt_version: string
    columns:
      - name: team_sk
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        tests: [not_null]
      - name: prompt_version
        description: "Version of the research prompt or ingest job (e.g. wc_squad_value_v1)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code
