version: 2

seeds:
  - name: competition_types
    description: >
      Canonical competition-type taxonomy. One row per competition_type declaring whether
      it is a club or national-team competition (entity_type). This is the single source
      of truth for the club/national split: downstream models look it up by competition_type
      rather than hardcoding the mapping. Every competition_type used in
      docs/competition_registry.yml must have a row here (enforced by
      scripts/check_competition_type_seed.py). Rule: no competition_type is both club and
      national. `qualifying` = national-team qualifying (WC/EC); club qualifying rounds, if
      onboarded, take their own clearly-club type.
    columns:
      - name: competition_type
        description: "Competition-type enum value, matching docs/competition_registry.yml competition_type."
        tests:
          - not_null
          - unique
      - name: entity_type
        description: "Whether the competition is played by clubs or national teams."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: display_group
        description: >
          Hybrid-IA nav group for this competition type (GAP-19 — the taxonomy that
          previously lived as the _GROUP_OF_TYPE dict in scripts/export_site_data.py).
          Empty (null) for types that never appear in the nav (friendlies).
        tests:
          - accepted_values:
              values: ["leagues", "cups", "continental-club", "national-teams"]

  - name: competition_registry
    description: >
      league_code → (competition_type, parent_competition) mapping, generated from
      docs/competition_registry.yml by scripts/sync_dbt_vars.py (do not hand-edit). dbt models
      join on this to resolve a competition's type (then entity_type via the competition_types
      seed) and its parent competition. Kept in lockstep with the registry — including the new
      column and parent-link validity — by scripts/check_registry_var_sync.py.
    columns:
      - name: league_code
        description: "Internal competition code (matches docs/competition_registry.yml)."
        tests:
          - not_null
          - unique
      - name: competition_type
        description: "Competition type; must exist in the competition_types taxonomy."
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type
      - name: parent_competition
        description: >
          The league_code of this competition's parent, or empty when it has none. Links a
          child to its parent: a qualifier → its tournament (e.g. WCQEU → WC), a domestic cup →
          its league (e.g. DFBP → BL1). Lets the form-window selection resolve a tournament's
          qualifier competitions generically (no hardcoded code lists). Validity (every
          non-empty value is a known league_code) is enforced by check_registry_var_sync.py.

  - name: metric_catalogue
    description: >
      Single source of truth for every metric the platform computes. One row per metric
      per entity. Captures the formula as a structured, resolvable expression
      (base_relation + numerator_expr / denominator_expr over the base's real columns), entity
      type (team/player), i18n key, display format, the display dimensions (group, tier, order)
      ruled in docs/wireframes/metrics_display.md, and the performance semantic (direction +
      interpretation). Each formula aggregates over an int_legs__* per-(entity, fixture)
      building-block leg; it is window-free — the consuming model applies the window and any
      coverage/null policy. The formula is the correctness contract every model that computes the
      metric must conform to. Window-agnostic: metric IDs carry no window suffix. Part of epic
      #317; display columns added for #391 (GAP-09); formulas formalized for #530. Two singular
      tests guard its integrity: assert_team_metric_meaning_complete (every team metric carries
      direction + interpretation) and assert_metric_catalogue_expr_resolvable (every
      numerator_expr/denominator_expr column resolves against its base_relation).
    config:
      +full_refresh: true
      column_types:
        importance_tier: int64
        group_display_order: int64
    columns:
      - name: metric_id
        description: >
          Stable semantic id. Window-agnostic — no _recent or _pretournament suffix.
          Unique per (metric_id, entity) — e.g. duels_won_pct exists for both team and
          player (enforced by assert_metric_catalogue_unique_by_entity).
        tests:
          - not_null
      - name: entity
        description: "Whether this metric describes a team, a player, or both."
        tests:
          - not_null
          - accepted_values:
              values: ["team", "player", "team and player"]
      - name: label_i18n_key
        description: "i18n key for the human-readable label."
        tests: [not_null]
      - name: description
        description: "Plain-English definition: what the metric measures, nullability, and source columns."
        tests: [not_null]
      - name: base_relation
        description: >
          The int_legs__* per-(entity, fixture) building block the formula aggregates over
          (int_legs__team_match / int_legs__team_from_players / int_legs__player_match). Blank for:
          lookups not derived from legs (league_rank — sourced from fct_standings); and rank-derived reads
          (deserved_rank, sot_rank_gap).
        tests:
          - accepted_values:
              values: ["int_legs__team_match", "int_legs__team_from_players", "int_legs__player_match"]
      - name: numerator_expr
        description: >
          The metric's fixed mathematical numerator as a window-free aggregate over base_relation's
          real columns (e.g. sum(goals_for); sum(goals_for - goals_penalty - goals_own)). The
          expression is the DEFINITION only — data availability (missing stats) decides whether a
          model can APPLY the formula (compute vs null); it is NOT encoded here (no coverage counts,
          no coalesce, no null gates). Blank for the blank-base_relation rows above (lookups + rank-derived reads).
      - name: denominator_expr
        description: >
          The metric's fixed mathematical denominator: count(*) = number of matches in the window
          (per-match rates); sum(<expr>) for ratios; sum(minutes_played) for per-90 (the * 90 sits in
          numerator_expr); 3 * count(*) for points_capture. Like the numerator it is the DEFINITION
          only — coverage/availability handling lives in the model, never here. Blank for raw count
          metrics and the blank-base_relation rows above.
      - name: lower_is_better
        description: "True when a lower value indicates better performance."
        tests: [not_null]
      - name: format
        description: >
          Display format: integer, decimal_0, decimal_1, percent, points_fraction
          (points of available, e.g. 10/15), or count_fraction (count of games, e.g. 3/5).
        tests:
          - not_null
          - accepted_values:
              values: ["integer", "decimal_0", "decimal_1", "percent", "points_fraction", "count_fraction"]
      - name: metric_group
        description: >
          Display taxonomy block (docs/wireframes/metrics_display.md). Shared across
          entities — a metric family keeps its group on team and player. Null for
          header/context metrics that are not metric rows (league_rank, points_won).
        tests:
          - accepted_values:
              values: ["goals", "shooting", "duels", "defending", "passing", "set_pieces", "goalkeeping", "discipline"]
      - name: importance_tier
        description: >
          Team-only display importance (1 = compact surfaces, 2 = standard, 3 = depth).
          Tier never reorders; it gates visibility under space constraint. Null for all
          player metrics (no player tiers — ruled) and for unrendered team metrics.
        tests:
          - accepted_values:
              values: [1, 2, 3]
              quote: false
      - name: group_display_order
        description: >
          Position within the metric_group. Team: row order. Player: the bundle's
          position within its group (atomics of one bundle share the value). Null for
          unrendered metrics; full row order lives in docs/wireframes/metrics_display.md.
      - name: direction
        description: >
          Performance semantic (the richer successor to lower_is_better): higher_better,
          lower_better, or neutral (a descriptive/style metric with no inherent good-or-bad).
          Orients the competition benchmark and seeds website auto-interpretation. Populated for
          team metrics; null for the not-yet-classified player metrics (player benchmark, v1.x).
          lower_is_better is retained until the full migration. Every team metric must carry BOTH
          direction and interpretation (enforced by assert_team_metric_meaning_complete; player rows
          exempt while v1.x).
        tests:
          - accepted_values:
              values: ["higher_better", "lower_better", "neutral"]
      - name: interpretation
        description: >
          Short plain-English meaning of the metric — what it captures and what a notably high
          value signals — the seed of website auto-narrative. Populated for team metrics; null for
          player metrics (v1.x). Required on every team metric (enforced by
          assert_team_metric_meaning_complete).

  - name: wc_team_market_value_snapshot
    description: >
      Twice-monthly WC national-team squad market value estimates (EUR). team_sk matches dim_team.team_sk
      (API-Football national team id). Append rows per snapshot run; dbt builds fct_team_market_value_snapshot.
    config:
      column_types:
        team_sk: int64
        as_of_date: date
        market_value_eur: int64
        source_code: string
        prompt_version: string
    columns:
      - name: team_sk
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        tests: [not_null]
      - name: prompt_version
        description: "Version of the research prompt or ingest job (e.g. wc_squad_value_v1)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code

  - name: fixture_event_team_overrides
    description: >
      CPO-owned corrections for known API-Football fixture-event team-id defects (#526),
      applied in base_apif__fixture_events. One row per wrong source team id.
      mode = `alias` replaces the id unconditionally (a genuine duplicate provider id for one
      club, e.g. Riga FC 2263 -> 10124). mode = `reattribute_if_cohabiting` replaces it only in
      fixtures where correct_team_api_id is a participant and wrong_team_api_id is not (a
      mis-attribution between two DISTINCT clubs, e.g. ASKO Kara 25274 events mis-tagged to rival
      ASC Kara 6424 — so the wrong club's own legitimate events are never touched). Add a row only
      with EXTERNALLY verified evidence; never infer a duplicate from internal name similarity.
    config:
      column_types:
        wrong_team_api_id: int64
        correct_team_api_id: int64
        mode: string
        note: string
    columns:
      - name: wrong_team_api_id
        description: "The team_api_id the provider's event feed wrongly emits."
        tests:
          - not_null
          - unique
      - name: correct_team_api_id
        description: "The team_api_id the event should resolve to."
        tests:
          - not_null
      - name: mode
        description: "alias = unconditional duplicate-id replacement; reattribute_if_cohabiting = participant-gated mis-attribution fix."
        tests:
          - not_null
          - accepted_values:
              values: ["alias", "reattribute_if_cohabiting"]
      - name: note
        description: "Human note + external-evidence reference for the correction (required — the governance control)."
        tests:
          - not_null
