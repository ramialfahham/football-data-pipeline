name: 'football_data_pipeline'
version: '1.0.0'
config-version: 2

# Connection to the profile defined in profiles.yml
profile: 'football_data_pipeline'

# Path configuration
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variable configuration (Best Practice for BigQuery)
vars:
  # This tells dbt_utils how to handle specific BigQuery syntax if needed
  'dbt_utils:dispatch_list': ['bigquery']
  # BigQuery dataset id for 1:1 ingestion (must match Python `API_FOOTBALL_BIGQUERY_DATASET` default).
  raw_schema: raw
  # Cutoff for tests/assert_no_event_loss_since_cutoff.sql (GitLab #75): only fixtures KICKING OFF
  # on or after this date are asserted. It excludes the 5-fixture, 29-event backlog that the
  # provider can no longer return (kickoffs 2026-08-08 and 2026-08-15). A kickoff date never moves,
  # which is why the scope is taken from the fixture rather than from an ingest timestamp — see
  # that test's header.
  # ⚠ RAISING this silences new loss, which is the defect the test exists to catch. Lower it once
  # the backlog is resolved; never raise it to make a build green.
  event_loss_detector_from: '2026-08-19'
  # Derived from docs/competition_registry.yml (status active or in_progress).
  # DO NOT edit by hand — run scripts/sync_dbt_vars.py after updating the registry.
  # scripts/check_registry_var_sync.py (CI) enforces sorted-set equality with the registry.
  # Base models loop over this var; adding a league here is the only change needed in dbt.
  active_competition_league_codes:
    - ACN
    - AFCCL
    - AFCON
    - APD
    - BL1
    - BL2
    - BPL
    - BSA
    - CAFCL
    - CCCU
    - CDF
    - CDR
    - CIT
    - CNL
    - COAM
    - CWC
    - DFBP
    - ED
    - EKS
    - EURO
    - FAC
    - GCUP
    - J1
    - KL1
    - L1
    - LIBER
    - LMX
    - LP
    - MLS
    - PD
    - PL
    - SA
    - SPL
    - TSL
    - UCL
    - UECL
    - UEL
    - UESC
    - UNL
    - VL
    - WC
    - WCQAF
    - WCQAS
    - WCQCA
    - WCQEU
    - WCQIP
    - WCQOC
    - WCQSA

# Hierarchical Model Configuration
models:
  football_data_pipeline:
    # 1. Staging: Raw cleanup. TABLES since 2026-08-12 (#33 items 9/10). These were views from
    # the project's first commit, on the same "not storing an intermediate result is cheaper"
    # reasoning #547 already disproved one layer up. A view stores nothing, so every reader
    # re-executes the JSON parse underneath it: 59 staging tests plus ~20 base-model reads scan
    # each raw table about five times a night to answer questions a stored table answers for
    # BigQuery's 10 MB minimum. Measured on 2026-08-12, prod build over 24h: tests $0.17 against
    # models $0.07 — the same tests-cost-more-than-models signature #547 was diagnosed from.
    # Storing staging once a night collapses that multiplier to one scan per model.
    # The saving today is ~$3-4/month and the case is NOT today's money: item 8b shrank
    # RAW_APIF_TRANSFERS from 6.99 GiB to 0.178 GiB, so #33's own figures for this item are
    # stale. What is bought is that cost stops scaling with (tests x raw size) as competitions
    # are added. Storage added is ~0.5 GiB — the whole base layer, which is this layer's parsed
    # output, is 0.415 GiB.
    1_staging:
      +materialized: table
      +schema: staging

    # 2. Base: UNION ALL + dedup. TABLES since 2026-08-02 (#547). These were views, on the reasoning
    # that not storing an intermediate result is cheaper. Measured, it is the opposite: staging and
    # base were BOTH views, so nothing stored anything and every TEST on a base model re-executed
    # the whole chain down to the raw JSON. Over 35 days on prod, tests cost $23.91 against $5.84 to
    # build the models. RAW_APIF_TRANSFERS is 6.82 GiB over 1,117 rows and was scanned about seven
    # times a night (six tests plus a fact build) for $8.56 of a $29.79 total. Storing base once a
    # night makes every test read a small table instead. See dbt_project/docs/layering.md.
    2_base:
      +materialized: table

    # 3. Core: Star Schema / Dimensional Entities (Tables)
    3_core:
      +materialized: table
      +schema: core

    # 4. Intermediate: Business logic & heavy math (Tables)
    4_intermediate:
      +materialized: table
      +schema: intermediate

    # 5. Marts: BI-ready data products (Tables)
    5_marts:
      +materialized: table
      +schema: marts

# Snapshots: SCD Type-2 history tables (used for sources the API only exposes as "current").
# Currently DORMANT — no snapshot .sql files exist, so this block binds nothing. NOTE: snapshot
# `target_schema` is applied verbatim and does NOT pass through generate_schema_name, so it is
# NOT environment-isolated. When the first real snapshot lands, make it target-aware, e.g.
#   +target_schema: "{{ 'snapshots' if target.name == 'prod' else target.name ~ '_snapshots' }}"
snapshots:
  football_data_pipeline:
    +target_schema: snapshots
