name: 'football_data_pipeline'
version: '1.0.0'
config-version: 2

# Connection to the profile defined in profiles.yml
profile: 'football_data_pipeline'

# Path configuration
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variable configuration (Best Practice for BigQuery)
vars:
  # This tells dbt_utils how to handle specific BigQuery syntax if needed
  'dbt_utils:dispatch_list': ['bigquery']
  # BigQuery dataset id for 1:1 ingestion (must match Python `API_FOOTBALL_BIGQUERY_DATASET` default).
  raw_schema: raw
  # Mirror of docs/competition_registry.yml — league_code for status active or in_progress.
  # When onboarding a competition: update the registry, ingest, add staging/sources, add refs
  # to unified bases, then add the code here. scripts/check_registry_var_sync.py enforces
  # this list matches the registry (sorted set equality).
  active_competition_league_codes:
    - BL1
    - BL2
    - L1
    - LMX
    - LP
    - PD
    - PL
    - SA
    - VL
    - WC
    - WCQEU
    - WCQAF
    - WCQCA
    - WCQSA
    - WCQAS
    - WCQIP
    - WCQOC
  # API-Football round labels for BL1 relegation play-offs (fixture.league.round).
  bl1_relegation_round_names:
    - Final
    - Relegation Round
  # BL2 promotion play-off (API label on fixture.league.round); excluded from unified mart.
  bl2_playoff_round_names:
    - Final
  # L1 relegation play-off; excluded from unified mart until optional L1 relegation mart exists.
  l1_relegation_round_names:
    - Final

# Hierarchical Model Configuration
models:
  football_data_pipeline:
    # 1. Staging: Raw cleanup (Views for speed and low cost)
    1_staging:
      +materialized: view
      +schema: staging

    # 3. Core: Star Schema / Dimensional Entities (Tables)
    3_core:
      +materialized: table
      +schema: core

    # 4. Intermediate: Business logic & heavy math (Tables)
    4_intermediate:
      +materialized: table
      +schema: intermediate

    # 5. Marts: BI-ready data products (Tables)
    5_marts:
      +materialized: table
      +schema: marts

# Snapshots: SCD Type-2 history tables (used for sources the API only exposes as "current").
snapshots:
  football_data_pipeline:
    +target_schema: snapshots