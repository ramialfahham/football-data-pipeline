name: 'football_data_pipeline'
version: '1.0.0'
config-version: 2

# Connection to the profile defined in profiles.yml
profile: 'football_data_pipeline'

# Path configuration
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Variable configuration (Best Practice for BigQuery)
vars:
  # This tells dbt_utils how to handle specific BigQuery syntax if needed
  'dbt_utils:dispatch_list': ['bigquery']
  # BigQuery dataset id for 1:1 ingestion (must match Python `API_FOOTBALL_BIGQUERY_DATASET` default).
  raw_schema: raw
  # Cutoff for tests/assert_no_event_loss_since_cutoff.sql (GitLab #75): only fixtures KICKING OFF
  # on or after this date are asserted. It excludes the 5-fixture, 29-event backlog that the
  # provider can no longer return (kickoffs 2026-08-08 and 2026-08-15). A kickoff date never moves,
  # which is why the scope is taken from the fixture rather than from an ingest timestamp — see
  # that test's header.
  # ⚠ RAISING this silences new loss, which is the defect the test exists to catch. Lower it once
  # the backlog is resolved; never raise it to make a build green.
  event_loss_detector_from: '2026-08-19'
  # Derived from docs/competition_registry.yml (status active or in_progress).
  # DO NOT edit by hand — run scripts/sync_dbt_vars.py after updating the registry.
  # scripts/check_registry_var_sync.py (CI) enforces sorted-set equality with the registry.
  # Base models loop over this var; adding a league here is the only change needed in dbt.
  active_competition_league_codes:
    - ACN
    - AFCCL
    - AFCON
    - APD
    - BL1
    - BL2
    - BPL
    - BSA
    - CAFCL
    - CCCU
    - CDF
    - CDR
    - CIT
    - CNL
    - COAM
    - CWC
    - DFBP
    - ED
    - EKS
    - EURO
    - FAC
    - GCUP
    - J1
    - KL1
    - L1
    - LIBER
    - LMX
    - LP
    - MLS
    - PD
    - PL
    - SA
    - SPL
    - TSL
    - UCL
    - UECL
    - UEL
    - UESC
    - UNL
    - VL
    - WC
    - WCQAF
    - WCQAS
    - WCQCA
    - WCQEU
    - WCQIP
    - WCQOC
    - WCQSA

# Hierarchical Model Configuration
models:
  football_data_pipeline:
    # Descriptions are pushed to BigQuery as table and column metadata, so `bq show --schema`,
    # the console and any BI tool show what a column means. Until 2026-08-21 they were pushed
    # NOWHERE: the audit that started the description programme found the field had been used as
    # a decision log, and the root cause it identified was that nothing read it. This is the
    # reader. Set ONCE at project level rather than per layer — unlike +materialized, which is a
    # cost decision taken per layer, this is a property of the whole project.
    #
    # ⚠ THIS CAN BREAK THE PROD BUILD. BigQuery hard-rejects a column description over 1,024
    # characters and a relation description over 16,384, and a rejected description fails the
    # model that carries it. 15 descriptions were over 1,024 when the programme started, which is
    # why turning this on was sequenced behind the cleanup rather than done first.
    # scripts/check_description_hygiene.py now holds every description under those limits and
    # measures the RENDERED text, so a {{ doc() }} block counts as what it resolves to and not as
    # its reference. Do not treat a docs block as a way around the limit.
    +persist_docs:
      relation: true
      columns: true

    # Materialisation: dbt_project/docs/layering.md §Materialisation.

    # 1. Staging: Raw cleanup
    1_staging:
      +materialized: table
      +schema: staging

    # 2. Base: UNION ALL + dedup
    2_base:
      +materialized: table

    # 3. Core: Star Schema / Dimensional Entities
    3_core:
      +materialized: table
      +schema: core

    # 4. Intermediate: Business logic & heavy math
    4_intermediate:
      +materialized: table
      +schema: intermediate

    # 5. Marts: BI-ready data products
    5_marts:
      +materialized: table
      +schema: marts

# Seeds: the configuration and mapping tables. This block exists ONLY to carry persist_docs, and
# it is new — seeds had no config block at all, which is part of why they were the audit's worst
# offender (seeds/schema.yml alone held 38% of the contaminated text, having tripled in four weeks
# while describing the same 9 seeds).
#
# ⚠ KEEP IT persist_docs-ONLY. Seeds declare no +schema, so they ride target.schema — the profile's
# `dataset:`, which is `dbt_analytics` on prod — through macros/generate_schema_name.sql. Adding a
# +schema here would silently move every seed to a different dataset and break every ref() to one.
seeds:
  football_data_pipeline:
    +persist_docs:
      relation: true
      columns: true

# Snapshots: SCD Type-2 history tables (used for sources the API only exposes as "current").
# Currently DORMANT — no snapshot .sql files exist, so this block binds nothing. NOTE: snapshot
# `target_schema` is applied verbatim and does NOT pass through generate_schema_name, so it is
# NOT environment-isolated. When the first real snapshot lands, make it target-aware, e.g.
#   +target_schema: "{{ 'snapshots' if target.name == 'prod' else target.name ~ '_snapshots' }}"
snapshots:
  football_data_pipeline:
    +target_schema: snapshots
