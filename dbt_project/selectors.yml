selectors:
  - name: staging
    description: "Staging models (raw cleanup only). Tests run automatically via dbt build."
    definition:
      method: path
      value: models/1_staging

  - name: base
    description: "Base models (unions/alignment). Tests run automatically via dbt build."
    definition:
      method: path
      value: models/2_base

  - name: intermediate
    description: "Intermediate models (4_intermediate), including raw ingestion spread."
    definition:
      method: path
      value: models/4_intermediate

  - name: downstream
    description: >
      Base through marts (excludes 1_staging); use once models exist under 2_base–5_marts.
      Excludes freshness_check tests: they assert live-data freshness and only make sense
      after ingestion (scheduled run via the dq selector), not in PR CI where no ingestion
      runs. The exclusion must live in the selector because dbt ignores a CLI --exclude
      when --selector is supplied.
    definition:
      union:
        - method: path
          value: models/2_base
        - method: path
          value: models/3_core
        - method: path
          value: models/4_intermediate
        - method: path
          value: models/5_marts
        - exclude:
            - method: tag
              value: freshness_check

  - name: dq
    description: "All models and all tests (full data-quality suite)."
    definition:
      method: fqn
      value: "*"
