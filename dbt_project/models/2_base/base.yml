version: 2

models:
  - name: base_football__fixtures
    description: "Conformed fixture preparation model for core. Grain: (league_code, fixture_api_id). Deduplicates to latest raw_ingested_at per competition fixture."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["base", "football", "multi_competition"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_api_id
    columns:
      - name: league_code
        description: "Internal competition code."
        tests: [not_null]
      - name: fixture_api_id
        description: "API-Football fixture id, unique within league_code grain."
        tests: [not_null]
      - name: fixture_date
        description: "Kickoff date in UTC."
        tests: [not_null]
      - name: status_short
        description: "API-Football short fixture status code."
      - name: home_team_api_id
        description: "Home team id from API-Football."
      - name: away_team_api_id
        description: "Away team id from API-Football."
      - name: raw_ingested_at
        description: "Latest raw ingestion timestamp selected for this fixture."
