version: 2

models:
  - name: base_apif__teams
    description: >
      Unified teams across all onboarded competitions (explicit ref() per
      competition staging). Same enrichment as BL1: /teams plus fixture-derived
      keys and name fallback. Output grain: (league_code, team_api_id).
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, team_api_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: team_api_id
        tests: [not_null]

  - name: base_apif__teams_global
    description: >
      One row per team_api_id: latest ingest across (league_code, team_api_id) rows
      from base_apif__teams. Entity resolution for dim_team. Grain: team_api_id.

      Also applies the CPO-owned display-name corrections from the team_name_overrides seed
      (#850). This is the layer where they belong: base prepares the entity, the core dim
      publishes an already-settled one (CPO ruling, 2026-07-27). It matters because the
      provider's short name is the ONLY team name in the product — it drives the fixture
      card, the page H1, the title, the meta description and the URL slug (#851) — so the
      correction has to land once, upstream of all of them.

      Note for anyone reading a historical row elsewhere: fct_fixture_event's
      team_name_snapshot is written on insert and never revisited, so it deliberately keeps
      the name as it stood at ingest time and will not reflect a later correction.

      Also derives team_slug, the permanent locale-independent URL segment (#852), from the
      CORRECTED name via a symmetric, closed collision ladder. Symmetric: a contested name is
      given to nobody, so no ranking or per-collision adjudication is ever needed. Each
      candidate is tested against the strings already assigned, not merely against its own
      contending group, because a country-anchored candidate can equal a DIFFERENT team's bare
      slug (the Ararat / Ararat-Armenia pair is that shape, though both sit at level 1 today so
      the anti-join has not fired) and a `{name}-{id}` candidate can equal a bare slug too,
      since club names embed digits (`1899 Hoffenheim` owns `hoffenheim-1899`).

      STATED RESIDUAL, not closed: if a level-3 `{name}-{id}` candidate is itself already taken,
      team_slug is NULL and the not_null test stops the build naming the team. Reaching it takes
      a club named "<X> <another club's provider id>" in the same country as that club. That is a
      data situation for a human, and the fix is an override row — not a wider rule and not an
      automatic escape hatch. An earlier revision added a doubled-hyphen terminal here because
      kebab_slug can never emit `--`; it was provably unique and it was a hack, buying closure
      with a URL no reader should see, for a case that fires zero times. Removed deliberately.

      Note the two most common level-3 triggers are DATA DEFECTS rather than naming problems:
      a same-country duplicate record (#850's open alias decision) and a null country (#853 — 39
      teams, 22 of which have a country in stg_apif__teams). Fixing those mostly empties level 3.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_api_id]
    columns:
      - name: team_api_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__leagues
    description: >
      Unified league-season rows across all onboarded competitions (explicit
      ref() per competition staging). Deduplicated per
      (league_code, league_api_id, season_api_year). Feeds base_apif__league_entity,
      base_apif__competition_seasons, and core dims built from those. Output grain:
      (league_code, league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, league_api_id, season_api_year]
    columns:
      - name: league_code
        tests: [not_null]
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]

  - name: base_apif__league_entity
    description: >
      One row per league_api_id: latest league-season row by season_api_year then
      raw_ingested_at. Entity resolution for dim_league. Grain: league_api_id.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id]
    columns:
      - name: league_api_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__competition_seasons
    description: >
      One row per (league_api_id, season_api_year); tie-breaks duplicate keys by
      raw_ingested_at desc. Feeds dim_competition_season. Grain:
      (league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id, season_api_year]
    columns:
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__fixtures_next
    description: >
      Unified fixtures across all onboarded competitions (explicit ref() per
      competition staging). Deduplicated per fixture_id. Feeds fct_fixture.
      Output grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__standings
    description: >
      Unified standings across all onboarded competitions (generic staging).
      Deduplicated per (league_code, season, team_id, group_name). Feeds
      fct_standings. group_name is the API standings section/table name (true
      table identity); group_description is the API zone/stage annotation.
      Output grain: (league_code, season, team_id, group_name).
    config:
      tags: ["base", "api_football", "standings_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season, team_id, group_name]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: standing_rank
        tests: [not_null]

  - name: base_apif__fixture_statistics
    description: >
      Unified per-team fixture statistics across all onboarded competitions
      (explicit ref() per competition staging). Deduplicated per
      (league_code, fixture_id, team_id). Feeds fct_fixture_team_stats.
      Output grain: (league_code, fixture_id, team_id).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]

  - name: base_apif__fixture_players
    description: >
      Unified per-player match statistic rows across all onboarded competitions.
      League list driven by var('active_competition_league_codes').
      Deduplicated per (league_code, fixture_id, team_id, player_id).
      Feeds fct_fixture_player_stats. Output grain: (league_code, fixture_id, team_id, player_id).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: base_apif__players
    description: >
      Global player identity: one row per player_api_id, unioned from /players,
      fixture player stats, and fixture events, deduplicated in a single pass that
      prefers the most authoritative named source (source_priority) then the most
      recent ingest. Identity only — no league_code or team/season affiliation
      (those live in dim_player_team_season_mapping and the facts). Feeds dim_player.
      Grain: player_api_id.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        tests: [not_null]

  - name: base_apif__player_profiles
    description: >
      Current per-player bio from the rich /players/profiles source
      (stg_apif__player_profiles), reduced to the latest row per player_id.
      Identity-level only — no league_code/team/season. Enriches dim_player.
      Grain: player_api_id.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        tests: [not_null]

  - name: base_apif__fixture_events
    description: >
      Deduplicated fixture event rows from stg_apif__fixture_events. Keeps
      the most recently ingested version per event position.
      Output grain: (league_code, fixture_id, event_index).
      event_index is the 0-based position in the $.events array and is the
      stable identity for each event. The API occasionally returns duplicate
      event content at different positions; base deduplicates on position,
      not content. team_id is then resolved: a null team_id is recovered from the same
      team's other events in the fixture (by team_name), and known provider team-id defects
      are corrected via the CPO-owned seeds/fixture_event_team_overrides.csv (#526) — an
      `alias` duplicate-id replacement, or a participant-gated `reattribute_if_cohabiting`
      mis-attribution fix.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - event_index
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__player_team_season
    description: >
      Rostered player↔team↔season membership from the /players squad source
      (stg_apif__players), including squad members who never played a match.
      Grain: (league_code, player_id, team_id, season_year), latest ingest per grain.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
            - team_id
            - season_year
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: season_year
        tests: [not_null]

  - name: base_apif__transfers
    description: >
      Dated player transfers (moves), deduped from stg_apif__transfers. By-team fetching
      returns each move twice (once per involved team), so we keep one row per distinct move;
      provider near-duplicates with different dates are kept distinct (no fuzzy merge).
      transfer_type is the raw provider string. Grain: (player_id, team_in_id, team_out_id,
      transfer_date).
    config:
      tags: ["base", "api_football", "transfers"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - team_in_id
            - team_out_id
            - transfer_date
    columns:
      - name: player_id
        tests: [not_null]
      - name: transfer_date
        tests: [not_null]
      - name: league_code
        description: "Ingest provenance (the tracked league whose team pull surfaced the move, pinned deterministically), NOT a semantic partition — transfers are global."
        tests: [not_null]

  - name: base_apif__coaches
    description: >
      Coach identity (global entity): one row per coach_api_id from stg_apif__coaches, latest ingest.
      Identity / bio only — no league_code. Feeds dim_coach. Grain: coach_api_id.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id]
    columns:
      - name: coach_api_id
        tests: [not_null]

  - name: base_apif__coach_career
    description: >
      Coach↔team career stints, deduped one row per (coach, team, start_date) from
      stg_apif__coach_career — the "clubs managed" history. The career team set exceeds dim_team
      (untracked clubs), so the team link stays on the provider id. Feeds dim_coach_team_mapping.
      Grain: (coach_api_id, team_api_id, start_date).
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id, team_api_id, start_date]
    columns:
      - name: coach_api_id
        tests: [not_null]
      - name: team_api_id
        tests: [not_null]
      - name: start_date
        tests: [not_null]
