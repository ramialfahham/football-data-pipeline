version: 2

models:
  - name: base_apif__teams
    description: >
      One row per team per competition, from the generic stg_apif__teams model. Grain:
      (league_code, team_api_id).

      The key set is a union rather than just /teams: team ids are also collected from fixtures,
      standings, per-fixture statistics, player stats and events. A team that appears in a
      competition's matches is therefore present even when the provider's /teams call never
      returned it, which is common on newly onboarded competitions.

      Every key passes through the fixture_team_id_overrides seed first, so a team id the
      corrections have retired is never minted as an entity here. Only
      the keys are corrected; the display name still comes from whichever source carries one.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, team_api_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]

  - name: base_apif__teams_global
    description: >
      One row per team: the settled entity, from the latest ingest across base_apif__teams'
      per-competition rows that carry provider attributes, and from the latest row only where
      none does. The name and the country take their last non-NULL value in that order. A
      country that changed between the stored deliveries (stg_apif__team_deliveries) is withheld
      unless a team_country_corrections row settles it. Grain: team_api_id.

      Identity is DECIDED here, not carried through: the name and country corrections from the
      override seeds are applied here, so the core dim publishes a settled entity.

      team_slug, the permanent locale-independent URL segment, is derived from the corrected name
      by a closed collision ladder — bare slug, then anchored to the country, then suffixed with
      the provider id. If that is taken too, team_slug is NULL and the not_null test stops the
      build.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_api_id]
    columns:
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: country_needs_research
        description: "{{ doc('country_needs_research') }}"
        tests: [not_null]

  - name: base_apif__fixture_fetches
    description: >
      Each fixture's latest fetch of its fixture-details bundle, over the player stats, line-ups,
      events and statistics staging models, and whether its player stats wait for their second
      fetch (latest fetch under 72 hours after kickoff). Grain: fixture_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: latest_fetch_at
        description: "The newest raw_ingested_at of the fixture in any of the four staging models."
      - name: is_awaiting_second_fetch
        description: "True where the latest fetch came under 72 hours after kickoff, so the player stats are not final; false where the kickoff is unknown."
        tests: [not_null]

  - name: base_apif__leagues
    description: >
      One row per league-season, from the generic stg_apif__leagues model with league_code
      flowing through as a column, deduplicated on the grain.
      Grain: (league_code, league_api_id, season_api_year).

      It also applies the country corrections from the country_name_overrides seed, so
      league_country is already the canonical English name by the time the core dim publishes it,
      and the competition-name corrections from the league_name_overrides seed, so league_name is
      the name we show rather than the provider's.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, league_api_id, season_api_year]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: league_name
        description: >
          The competition's DISPLAY NAME, already corrected. Provider value where no override
          exists, otherwise the league_name_overrides row — the provider's names are neither
          unique (`Serie A` arrives for both Italy's SA and Brazil's BSA) nor current (Primeira
          Liga, CONCACAF Champions League are renames it never took up). dim_league publishes this
          value unchanged; there is no coalesce in the dim.
        tests: [not_null]
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]

  - name: base_apif__league_entity
    description: >
      One row per league_api_id: latest league-season row by season_api_year then
      raw_ingested_at. Entity resolution for dim_league. Grain: league_api_id.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id]
    columns:
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]

  - name: base_apif__venues
    description: >
      One row per provider venue that a fixture names, with the country it lies in. Entity
      resolution for dim_venue. Grain: venue_api_id.

      The fixtures carry a venue id, name and city but no country. The country is taken from the
      competitions the venue's fixtures belong to, else from a team whose home ground the venue
      is, else from the country most of its home teams belong to. It is NULL when no source names
      one.
    config:
      tags: ["base", "api_football", "venue_context"]
    columns:
      - name: venue_api_id
        description: "The provider's venue id, as the fixtures carry it."
        tests: [not_null, unique]
      - name: venue_name
        description: "The venue's name as its latest fixture row spells it."
      - name: venue_city
        description: "The venue's city as its latest fixture row spells it."
      - name: country_name
        description: "The country the venue lies in, as named in `dim_country`; NULL when no competition, team ground or home team names one."

  - name: base_apif__competition_seasons
    description: >
      One row per competition-season, collapsing the same season seen under more than one
      league_code by keeping the most recently ingested row.
      Grain: (league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id, season_api_year]
    columns:
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]

  - name: base_apif__fixtures_next
    description: >
      One row per fixture, from the generic stg_apif__fixtures_next model, deduplicated on
      fixture_id. Where the provider's result differs from the league's official decision, the
      score and status are the official ones from the fixture_result_corrections seed, and the
      provider's stay on the row. Where two clubs share a provider team id in a fixture, the
      home and away team ids are corrected from the fixture_team_id_overrides seed's
      reattribute_in_fixture rows, and a club's duplicate id is replaced by the id it keeps, from
      its alias rows. Where the provider files a fixture under another round's name,
      the round is the organiser's from the fixture_round_corrections seed. A result that fails a
      result check is withheld: result_needs_research is true and the goals, shoot-out and winner
      are blank. Grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: awarded_to_team_id
        description: "The team the league awarded the match to where it set no score, so the score does not show the winner; NULL elsewhere."
      - name: shootout_home
        description: "{{ doc('shootout_home') }} Here, the official one from the fixture_result_corrections seed where the provider gives none or a different one."
      - name: shootout_away
        description: "{{ doc('shootout_away') }} Here, the official one from the fixture_result_corrections seed where the provider gives none or a different one."
      - name: provider_shootout_home
        description: "The provider's home shoot-out goals; differs from shootout_home only where the official result was corrected or the result is withheld."
      - name: provider_shootout_away
        description: "The provider's away shoot-out goals; differs from shootout_away only where the official result was corrected or the result is withheld."
      - name: winner_team_id
        description: "{{ doc('winner_team') }} Here, the team id as home_team_id and away_team_id carry it."
      - name: award_kind
        description: "How an awarded result came about: not_played, played (to the end, the result decided afterwards) or abandoned. NULL where the result is not awarded."
      - name: on_pitch_home
        description: "The home goals at the final whistle or at the abandonment of a played or abandoned match that was awarded afterwards; NULL otherwise."
      - name: on_pitch_away
        description: "The away goals at the final whistle or at the abandonment of a played or abandoned match that was awarded afterwards; NULL otherwise."
      - name: provider_goals_home
        description: "The provider's home goals; differs from goals_home only where the official result was corrected or the result is withheld."
      - name: provider_goals_away
        description: "The provider's away goals; differs from goals_away only where the official result was corrected or the result is withheld."
      - name: result_needs_research
        description: "{{ doc('result_needs_research') }}"
        tests: [not_null]
      - name: provider_status_short
        description: "The provider's status code; differs from status_short only where the league awarded a match the provider files as played."
      - name: result_correction_source
        description: "Where the result was corrected, the source of the official result: the league's or federation's decision or record, or two independent match reports. NULL elsewhere."
      - name: round_name
        description: "{{ doc('round_name') }}"
      - name: provider_round_name
        description: "The provider's round text; differs from round_name only where the round was corrected."
      - name: round_correction_source
        description: "Where the round was corrected, the source of the organiser's round: its published draw or results, or two independent match reports. NULL elsewhere."
      - name: is_finished
        description: "True when the provider closed the match: played to full time, extra time or a shoot-out, or decided off the pitch as a technical loss or walkover. A finished match whose result is withheld stays finished and keeps blank goals."
        tests: [not_null]
      - name: is_played
        description: "True when the match was played to the end on the pitch: full time, extra time or a shoot-out. False for a match decided off the pitch."
        tests: [not_null]
      - name: is_awarded_result
        description: "True where the match was decided off the pitch, a technical loss or a walkover. It counts for points and goals and never has a stat line."
        tests: [not_null]
      - name: is_shootout
        description: "True where the match went to a penalty shoot-out."
        tests: [not_null]
      - name: round_order
        description: "{{ doc('round_order') }}"

  - name: base_apif__fixtures_checked
    description: >
      The rows of base_apif__fixtures_next, with the score of a match decided after extra time
      withheld where it stopped at 90 minutes: the match's goal events of the first 90 minutes add
      up to its score while an open-play goal or an own goal comes after minute 90. The match then
      has result_needs_research true and its goals, shoot-out and winner blank, until a row in
      fixture_result_corrections settles it. Every model downstream of the match events that reads
      a score reads it here. Grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
      - dbt_utils.equal_rowcount:
          compare_model: ref('base_apif__fixtures_next')
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: result_needs_research
        description: "{{ doc('result_needs_research') }}"
        tests: [not_null]
      - name: score_stops_at_90
        description: "True where the match was decided after extra time and its score equals its goal events of the first 90 minutes while an open-play goal or an own goal comes after minute 90. Its goals, shoot-out and winner are then blank."
        tests: [not_null]

  - name: base_apif__fixture_rounds
    description: >
      Every distinct round text of a competition-season in base_apif__fixtures_next, named the way
      the competition names it: a copy key from the round_names seed (the competition-season's own
      row, then the competition's, then the general one) with the number and group letter the name
      shows, and the stage kind the row gives. Grain: (league_code, season_api_year, round_name).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, round_name]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: round_name
        description: "{{ doc('round_name') }}"
        tests: [not_null]
      - name: round_label_i18n_key
        description: The copy key a page names the round by. NULL when no round_names pattern covers the text.
      - name: round_stage_kind
        description: "table for a round played for a table, final, placement for a third-place match, or knockout for every other round of ties, from the round_names row that names it; NULL when no row covers the text."
        tests:
          - accepted_values:
              values: ["table", "knockout", "final", "placement"]
      - name: round_number
        description: The number the round's name shows (the matchday, or the round in a cup's sequence); NULL when the name shows none.
      - name: round_letter
        description: The group letter the round's name shows; NULL when the name shows none.
      - name: needs_number
        description: True when the matched name shows a number.
      - name: needs_letter
        description: True when the matched name shows a group letter.

  - name: base_apif__standings
    description: >
      One row per team per standings section, from the generic stg_apif__standings model,
      deduplicated on the grain. Grain: (league_code, season, team_id, group_name).

      group_name is the provider's section or table name and is the true table identity — a league
      name for a single table, a group name for a group stage. group_description is a zone or
      stage annotation and is never an identity.

      Where the provider's row differs from the league's official table, its figures are the
      official ones from the standings_corrections seed, and the provider's stay on the row as
      provider_*.
    config:
      tags: ["base", "api_football", "standings_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season, team_id, group_name]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: standing_section_order
        description: "The section's position in the provider's standings list for the season, 1 for the first."
        tests: [not_null]
      - name: standing_rank
        description: "The team's position in this standings table (1 = leader), from the official standings row ($.rank)."
        tests: [not_null]
      - name: goals_for_all
        description: Goals scored across all matches of the section, from the official standings row.
      - name: goals_against_all
        description: Goals conceded across all matches of the section, from the official standings row.
      - name: provider_team_id
        description: "The team the provider files the row under; differs from team_id only on a row corrected to its official team."
      - name: provider_standing_rank
        description: "The provider's rank; differs from standing_rank only on a corrected row."
      - name: provider_points
        description: "The provider's points; differs from points only on a corrected row."
      - name: provider_goals_diff
        description: "The provider's goal difference; differs from goals_diff only on a corrected row."
      - name: provider_played_all
        description: "The provider's matches played; differs from played_all only on a corrected row."
      - name: provider_wins_all
        description: "The provider's wins; differs from wins_all only on a corrected row."
      - name: provider_draws_all
        description: "The provider's draws; differs from draws_all only on a corrected row."
      - name: provider_losses_all
        description: "The provider's losses; differs from losses_all only on a corrected row."
      - name: provider_goals_for_all
        description: "The provider's goals scored; differs from goals_for_all only on a corrected row."
      - name: provider_goals_against_all
        description: "The provider's goals conceded; differs from goals_against_all only on a corrected row."
      - name: result_correction_source
        description: "Where the row was corrected, the source of the official figures: the league's or federation's decision or record, or two independent match reports. NULL elsewhere."

  - name: base_apif__fixture_statistics
    description: >
      The team's line in a match: one row per team with a statistics line (the generic
      stg_apif__fixture_statistics model pivoted to one column per stat, each from the newest fetch
      that carries it) and
      per team of every finished match, cleaned once and named in our own words.
      Grain: (league_code, fixture_id, team_id).

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication, so a corrected row cannot collide with one the correct team already has.

      {{ doc('cleaning_rules') }}
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this row, after applying the known-defect corrections in the fixture_team_id_overrides seed (the same alias, reattribute-if-cohabiting and reattribute-in-fixture logic as base_apif__fixture_players.team_id). Corrected before the (league_code, fixture_id, team_id) dedup, so a corrected row cannot collide with one the correct team already has."
        tests: [not_null]
      - name: has_stat_line
        description: "{{ doc('has_stat_line') }}"
        tests: [not_null]
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }} Here, the newest fetch among the inputs the row rests on: the team's and the other team's statistics lines, the match events and the fixture."
      - name: team_needs_research
        description: "{{ doc('team_needs_research') }}"
        tests: [not_null]
      - name: stat_corrections
        description: "Every value the cleaning changed on this row because a stat contradicted a result, a stat vouched for by its own check or its own total: one entry per changed stat. Empty on a row nothing changed. The blank rule's zeros are not listed."
      - name: stat_corrections.stat
        description: "The column that was changed, by its name in this model (e.g. saves, shots_on_target)."
      - name: stat_corrections.provider_value
        description: "The provider's figure before the change."
      - name: stat_corrections.cleaned_value
        description: "{{ doc('stat_corrections_cleaned_value') }}"
      - name: stat_corrections.rule
        description: "{{ doc('stat_corrections_rule') }}"

  - name: base_apif__fixture_player_lines
    description: >
      One row per player per fixture before the blank rule: the player's line in the match's picked
      fetch (its newest in the provider's complete format, else its newest), his goals, assists,
      cards and minutes settled by the match's events where the fetches disagree, and for each
      fillable stat the newest value another fetch gives him that agrees with him on those results,
      as donated_<stat>. Players of a team-match are filed under the team id the players model
      keeps them under. Grain: (league_code, fixture_id, team_id, player_id).

      It is the first half of base_apif__fixture_players, split out so that
      base_apif__fixture_statistics can read a player's offsides without a cycle.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The player's team id, as base_apif__fixture_players keeps it."
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__fixture_players
    description: >
      One row per player per fixture with that player's match statistics, from the generic
      stg_apif__fixture_players model, deduplicated on the grain (all of a match's rows come from
      one fetch: its newest in the provider's complete format, where any player has goals
      conceded, else its newest; a player the provider lists twice in one fetch keeps the row with
      more values; a stat that fetch leaves blank comes from another fetch under the Fetches rule),
      cleaned once and named in
      our own words. Grain: (league_code, fixture_id, team_id, player_id).

      {{ doc('cleaning_rules') }}

      Many competitions supply no player statistics at all, so a fixture missing from here has
      none rather than zeroes.

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication and before the cross-team collision guard, so a lineup the provider filed
      under the wrong team id is attributed to the team that actually played it.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this player's side, after applying the known-defect corrections in the fixture_team_id_overrides seed: an unconditional alias swap for a duplicate id, a reattribution when the correct id is a fixture participant and the wrong id is not, or a replacement inside the one fixture a row names; and the team the player's-team rule above decides, where his events name the other team of the match. Corrected before this model's own (league_code, fixture_id, team_id, player_id) dedup."
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: stat_corrections
        description: "Every value the cleaning changed on this row because two sources disagreed or a stat contradicted a result or its own total: one entry per changed stat. Empty on a row nothing changed. The blank rule's zeros and the conversion of a pass percentage to a count are not listed."
      - name: stat_corrections.stat
        description: "The column that was changed, by its name in this model (e.g. saves, goals)."
      - name: stat_corrections.provider_value
        description: "The provider's figure before the change: for accurate passes, the count after any percentage was converted; for penalty goals, the events' count, or the provider's per-player count in a match without events."
      - name: stat_corrections.cleaned_value
        description: "{{ doc('stat_corrections_cleaned_value') }}"
      - name: stat_corrections.rule
        description: "{{ doc('stat_corrections_rule') }}"

  - name: base_apif__fixture_players_from_lineups
    description: >
      One row per player on a confirmed or researched team sheet of a played team match with no
      player statistics, and one per sheet player with a card and no stat line of a match that has
      them, in the columns of base_apif__fixture_players. Minutes come from the sheet
      and the substitutions, goals and assists from the goal events, cards from the card events.
      Every other statistic is blank, but for a row of 0 minutes in a team with stat lines: a count
      the provider counted in the match is 0. fct_fixture_player_stats adds these rows to the
      provider's.
      Grain: (league_code, fixture_id, team_id, player_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this player's side, as base_apif__lineups carries it."
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: goals_need_research
        description: "True where the team scored and its goal events do not add up to its score. Its players' goals are then withheld, blank until sourced research stands in fixture_goal_corrections."
        tests: [not_null]
      - name: team_needs_research
        description: "{{ doc('team_needs_research') }}"
        tests: [not_null]
      - name: player_team_needs_research
        description: "{{ doc('player_team_needs_research') }}"
        tests: [not_null]

  - name: base_apif__lineup_fetches
    description: >
      Every stored fetch of a team's sheet, under the team id after fixture_team_id_overrides.
      provider_team_id is the id the provider filed the sheet under, and team_id is the id it is
      kept under. base_apif__lineup_fetch_ties, base_apif__lineup_sheets and base_apif__fixture_players
      read it. Grain: (league_code, fixture_id, provider_team_id, raw_ingested_at).
    config:
      tags: ["base", "api_football", "fixture_context"]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: provider_team_id
        description: "The team id the provider filed the sheet under."
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]

  - name: base_apif__lineup_fetch_ties
    description: >
      The sheets of each team in each match that carry the newest ingest time of the team's sheets.
      The team is the team after fixture_team_id_overrides. Each group is counted, with whether its
      sheets differ. A team with a differing tie has no sheet. base_apif__lineup_sheets and
      base_apif__fixture_players leave it out, and its match has one sheet. base_apif__lineups then
      says not_available. mart_competition_research_list lists the match.
      Grain: (league_code, fixture_id, team_id).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: tied_rows
        description: "How many sheets of the team carry that ingest time: 1 when the provider stored the sheet once."
        tests: [not_null]
      - name: rows_differ
        description: "True when the tied sheets are not all identical, so none can be picked."
        tests: [not_null]

  - name: base_apif__fixture_lines_without_key
    description: >
      The matches where base loses a value to its team-id filter: a statistics line or a line-up of
      the match came with no team id, and a team of the match has no value base could otherwise have
      used. A match whose teams all have their values from lines with a team id is not here. A line
      with no fixture id names no match. mart_competition_research_list reads it.
      Grain: (fixture_id, line_table, missing_key).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id, line_table, missing_key]
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: line_table
        description: "The staging model the line is in: stg_apif__fixture_statistics or stg_apif__lineups."
        tests:
          - not_null
          - accepted_values:
              values: ["stg_apif__fixture_statistics", "stg_apif__lineups"]
      - name: missing_key
        description: "The key the provider left NULL: team_id."
        tests:
          - not_null
          - accepted_values:
              values: ["team_id"]

  - name: base_apif__lineup_sheets
    description: >
      One row per player each team's latest fetch of the stg_apif__lineups model names on its
      sheet: the starting eleven and the bench, in the provider's order. When the latest fetch has
      no grid places, the latest earlier fetch that has them and names the same starting eleven
      lends its starters' grid places and the formation. Known provider team-id defects are
      corrected from the fixture_team_id_overrides seed before the latest fetch is chosen
      (base_apif__lineup_fetches). Sheets the provider stored twice at the latest ingest time
      collapse to one when they are identical. A team whose tied sheets differ has no sheet here
      (base_apif__lineup_fetch_ties). base_apif__lineups reads it.
      Grain: (league_code, fixture_id, team_id, is_starter, sheet_index).

      The provider sometimes files one player under two ids in a match. A sheet player whose id has
      no stats line in that match takes the id of the same team's stats-line player with his shirt
      number, when that player is on no sheet row. This holds for that match only. The ids in the
      player_id_overrides seed come first, and an id a card or goal correction names in the match
      keeps its own id there.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, is_starter, sheet_index]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this sheet, after the known-defect corrections in the fixture_team_id_overrides seed."
        tests: [not_null]
      - name: formation
        description: "The team's formation as the provider writes it, such as 4-2-3-1: the latest fetch's, or the lending fetch's when the latest has none."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }} Here, the chosen fetch's."
        tests: [not_null]
      - name: is_starter
        description: "{{ doc('is_starter__lineup') }}"
        tests: [not_null]
      - name: sheet_index
        description: "The player's place in the provider's list: the starting eleven and the bench are each counted from 0."
        tests: [not_null]
      - name: player_name
        description: "{{ doc('player_name') }}"
      - name: shirt_number
        description: "{{ doc('shirt_number__lineup') }}"
      - name: provider_position
        description: "The position code or word the sheet gives the player, as the provider sends it."
      - name: grid_position
        description: "{{ doc('grid_position') }} The lending fetch's place when the latest fetch has none."
      - name: sheet_player_id
        description: "The player's id as the sheet files him, after the player_id_overrides seed and before the shirt pairing."
      - name: player_id
        description: "{{ doc('player_api_id') }} Here it is the stats-line player's id where the sheet files him under another id in that match."

  - name: base_apif__lineups
    description: >
      One row per player the team sheets name for a match: the starting eleven and the bench, from
      each team's latest fetch of the stg_apif__lineups model or, for a researched match, from the
      fixture_lineup_corrections seed. Each row carries the minute a substitution brought the
      player on or took the player off, whom a substitute replaced, and the match's line-up state.
      Grain: (league_code, fixture_id, team_id, player_id).

      {{ doc('cleaning_rules') }}

      A player a sheet names without a player id has no row; the sheet then fails the eleven
      starters check. A sheet that names two people under one player id fails the
      two_people_one_id check; one person listed twice keeps his first listing. Known provider
      team-id defects are corrected from the
      fixture_team_id_overrides seed before the latest fetch is chosen.

      The provider sometimes files one player under two ids in a match. A sheet player whose id has
      no stats line in that match takes the id of the same team's stats-line player with his shirt
      number, when that player is on no sheet row. This holds for that match only. The ids in the
      player_id_overrides seed come first, and an id a card or goal correction names in the match
      keeps its own id there.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, lineup_order]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this player's side, after the known-defect corrections in the fixture_team_id_overrides seed, as base_apif__fixture_statistics.team_id."
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }} Here it is the stats-line player's id where the sheet files him under another id in that match."
        tests: [not_null]
      - name: is_starter
        description: "{{ doc('is_starter__lineup') }}"
        tests: [not_null]
      - name: shirt_number
        description: "{{ doc('shirt_number__lineup') }}"
      - name: position_code
        description: "The player's position as the line-ups give it (G, D, M or F); a position given in words maps to its letter, a winger by its row on the grid. NULL where they give none."
        tests:
          - accepted_values:
              values: ["G", "D", "M", "F"]
      - name: grid_position
        description: "{{ doc('grid_position') }}"
      - name: team_formation
        description: "{{ doc('team_formation') }}"
      - name: midfield_role
        description: "{{ doc('midfield_role') }}"
        tests:
          - accepted_values:
              values: ["DM", "CM", "AM"]
      - name: minute_on
        description: "{{ doc('minute_on') }}"
      - name: minute_on_extra
        description: "{{ doc('minute_on_extra') }}"
      - name: replaced_player_id
        description: "The provider's player id of the player this substitute replaced. NULL for a player who did not come on as a substitute."
      - name: minute_off
        description: "{{ doc('minute_off') }}"
      - name: minute_off_extra
        description: "{{ doc('minute_off_extra') }}"
      - name: lineup_order
        description: "{{ doc('lineup_order') }}"
        tests: [not_null]
      - name: lineup_state
        description: "{{ doc('lineup_state__sheet') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["confirmed", "researched", "not_available"]
      - name: failed_checks
        description: "{{ doc('failed_checks') }}"
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }} NULL on a researched match's rows."

  - name: base_apif__players
    description: >
      Global player identity: one row per player_api_id, unioned from /players, fixture player
      stats, the players and assisting players of fixture events, and the match line-ups, then deduplicated by preferring the most
      authoritative named source and, within that, the most recent ingest. Each identity field
      (name, first and last name, birth date, nationality) takes its last non-NULL value in that
      order, so a delivery that leaves it empty never blanks it.
      Grain: player_api_id.

      IDENTITY ONLY — no league_code, and no team or season affiliation. A player belongs to
      clubs over time, not to one competition, so affiliation lives in
      dim_player_team_season_mapping and in the facts.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: birth_date_needs_research
        description: "True when the player's rows from the delivery that gave his birth date hold two real birth dates and player_bio_corrections has no row for it. His birth date is then blank."
        tests: [not_null]
      - name: nationality_needs_research
        description: "True when the player's rows from the delivery that gave his nationality hold two real nationalities and player_bio_corrections has no row for it. His nationality is then blank."
        tests: [not_null]

  - name: base_apif__player_profiles
    description: >
      Current per-player bio from the rich /players/profiles source
      (stg_apif__player_profiles), reduced to the latest row per player_id; each identity field
      (name, first and last name, birth date, nationality) takes its last non-NULL value.
      Identity-level only — no league_code, team or season. Grain: player_api_id.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__fixture_events
    description: >
      One row per event in a fixture, from stg_apif__fixture_events, keeping the events of the
      match's latest fetch that has events, and one row per goal from fixture_goal_corrections.
      Grain: (league_code, fixture_id, event_index).

      A goal from fixture_goal_corrections is no provider event: it stands at event_index 10000
      plus its place in the match, with goal_correction_source set.

      A match in fixture_card_corrections has its cards from that seed in place of the provider's,
      at event_index 20000 plus their place in the match, with card_correction_source set.

      event_index is the 0-based position in the provider's events array and is the stable
      identity of an event. Deduplication is on POSITION, not content: the provider sometimes
      repeats event content at different positions, and both are kept.

      team_id is then resolved. A null one is recovered from the same team's other events in that
      fixture, matched by name, and known provider team-id defects are corrected from the
      fixture_team_id_overrides seed. Where a player's events and his statistics row name different
      teams of the match, the player's-team rule of the cleaning rules on base_apif__fixture_players
      decides, and his events move when they are the side it contradicts.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - event_index
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: resolved_player_team_id
        description: >
          On the events of a player on a researched line-up, his team on that line-up; on the events
          of a player whose statistics row names the other team of the match, the team the
          player's-team rule decides for him. His events and his row then both carry it. NULL on
          every other event, on an own goal, and where nothing decides.
      - name: assist_player_id
        description: "The assisting player's provider id. NULL where the goal has no assist or the provider names the assist without an id."
      - name: is_shootout_kick
        description: "TRUE for a penalty shoot-out kick, scored or missed: a Goal event the provider labels as a shoot-out, or files at a negative minute."
        tests: [not_null]
      - name: is_goal
        description: >
          TRUE for a goal that counts: a Goal event that is a normal goal, a penalty or an own goal,
          and not a shoot-out kick. A goal event with neither scorer id nor scorer name is left out
          in a match whose goal events add up to its score only without such events: there it is a
          goal that did not count. The score is the one on the pitch where a played or abandoned
          match was awarded afterwards. team_id is the side the goal counts for, own goals included.
        tests: [not_null]
      - name: is_own_goal
        description: "TRUE where the Goal event is an own goal. Its team_id is the side the goal counts for, not the scorer's team."
        tests: [not_null]
      - name: is_missed_penalty
        description: "TRUE for a penalty missed or saved during the match; a missed shoot-out kick is not one."
        tests: [not_null]
      - name: has_full_events
        description: "TRUE on every event of a match whose events include a substitution or a card, which every played match has: only then do its events show that a team or player had none of something."
        tests: [not_null]
      - name: goal_correction_source
        description: "On a goal from fixture_goal_corrections, the source's https URLs; NULL on every event the provider sent. Such a goal stands at event_index 10000 plus its place in the match."
      - name: card_correction_source
        description: "On a card from fixture_card_corrections, the source's https URLs; NULL on every event the provider sent."
      - name: provider_cards_match_research
        description: "On every event of a match in fixture_card_corrections, TRUE where the provider's own events of the match include a substitution or a card, and its card events, cleaned, equal the seed's cards one for one by player id, card, minute and added minute, with no card the seed lacks; NULL on every other match."
      - name: is_provider_goal
        description: "TRUE where the provider files the event as a goal that counts: a normal goal, a penalty or an own goal, not a shoot-out kick. On a match whose goals come from fixture_goal_corrections, is_goal is FALSE on these events and TRUE on the corrections."
        tests: [not_null]

  - name: base_apif__fixture_players_checked
    description: >
      The rows of base_apif__fixture_players, with a player's goals withheld where he is the
      withheld scorer of a goal that counts in base_apif__fixture_events_checked, and his assists
      where he is its withheld assister. Grain: (league_code, fixture_id, team_id, player_id).

      This is its own model because base_apif__lineups reads base_apif__fixture_players.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: goals
        description: "The player's goals in the match, as in base_apif__fixture_players. NULL where it is NULL there, and where he is the withheld scorer of a goal that counts."
      - name: goals_penalty
        description: "The player's penalty goals in the match, as in base_apif__fixture_players. NULL where it is NULL there, and where he is the withheld scorer of a goal that counts."
      - name: penalties_scored
        description: "The player's scored penalties in the match, as in base_apif__fixture_players. NULL where it is NULL there, and where he is the withheld scorer of a goal that counts."
      - name: assists
        description: "The player's assists in the match, as in base_apif__fixture_players. NULL where it is NULL there, and where he is the withheld assister of a goal that counts."
      - name: team_needs_research
        description: "{{ doc('team_needs_research') }}"
        tests: [not_null]
      - name: player_team_needs_research
        description: "{{ doc('player_team_needs_research') }}"
        tests: [not_null]

  - name: base_apif__fixture_events_checked
    description: >
      The events of base_apif__fixture_events, with each provider goal's scorer and assister checked
      against the match's confirmed or researched line-up. A scorer or assister not on the pitch at
      the goal's minute is withheld: player or assist id and name are NULL and the flag says so.
      The goal itself, its team and its minute stay. A goal from fixture_goal_corrections is not
      checked. Grain: (league_code, fixture_id, event_index).

      {{ doc('cleaning_rules') }}

      This is its own model because base_apif__lineups reads base_apif__fixture_events.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - event_index
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: player_id
        description: "The event player's provider id, as in base_apif__fixture_events. NULL where the provider gives none, and on a goal whose scorer is withheld."
      - name: assist_player_id
        description: "The assisting player's provider id. NULL where the goal has no assist, the provider names the assist without an id, or the assister is withheld."
      - name: scorer_needs_research
        description: "{{ doc('scorer_needs_research') }}"
        tests: [not_null]
      - name: assist_needs_research
        description: "{{ doc('assist_needs_research') }}"
        tests: [not_null]
      - name: team_needs_research
        description: "{{ doc('team_needs_research') }}"
        tests: [not_null]
      - name: player_team_needs_research
        description: "{{ doc('player_team_needs_research') }}"
        tests: [not_null]

  - name: base_apif__player_team_season
    description: >
      Rostered player↔team↔season membership from the /players squad source
      (stg_apif__players), including squad members who never played a match.
      Grain: (league_code, player_id, team_id, season_year), latest ingest per grain.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
            - team_id
            - season_year
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: season_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]

  - name: base_apif__squads
    description: >
      The provider's current squad list of each team, deduped from stg_apif__squads: the players the
      team's newest fetch carried, whichever league's row that fetch was written under. A team whose
      newest fetch found no player has none here. Grain: (team_api_id, player_api_id).
    config:
      tags: ["base", "api_football", "squads"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_api_id, player_api_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]

  - name: base_apif__transfers
    description: >
      Dated player transfers (moves), deduped from stg_apif__transfers. By-team fetching
      returns each move twice (once per involved team), so we keep one row per distinct move;
      provider near-duplicates with different dates are kept distinct (no fuzzy merge).
      transfer_type is the raw provider string. Grain: (player_id, team_in_id, team_out_id,
      transfer_date).
    config:
      tags: ["base", "api_football", "transfers"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - team_in_id
            - team_out_id
            - transfer_date
    columns:
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: transfer_date
        description: "The date the provider records the move on. It is the date the transfer was reported, not necessarily the date the player was first registered or first played."
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]

  - name: base_apif__coaches
    description: >
      Coach identity as a global entity: one row per coach_api_id from stg_apif__coaches. Each bio
      field is the newest value any fetch carried; age and photo are the latest fetch's. Identity
      and bio only — no league_code, because a coach is not scoped to one competition.
      Grain: coach_api_id.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]

  - name: base_apif__coach_career
    description: >
      A coach's career stints: one row per spell at a club, from stg_apif__coach_career — the
      "clubs managed" history. Grain: (coach_api_id, team_api_id, start_date).

      The team link stays on the raw provider id rather than resolving to dim_team, because the
      career history names clubs we do not track, so many of these teams have no dim_team row.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id, team_api_id, start_date]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: start_date
        description: "The date this coaching stint began, as the provider's career record gives it. Never NULL: a stint with no known start date is dropped before this model is built."
        tests: [not_null]

  - name: base_apif__crest_objects
    description: >
      One row per crest or league logo whose files are stored in the crest bucket, from the newest
      state the crest phase wrote. An image the provider answered 404 for has no files and no row.
      dim_team and dim_league publish a crest path only for a team or league with a row here.
      Grain: (crest_kind, provider_id).
    config:
      tags: ["base", "api_football", "crest_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [crest_kind, provider_id]
    columns:
      - name: crest_kind
        description: "What the image shows: teams for a team crest, leagues for a league logo."
        tests:
          - not_null
          - accepted_values:
              values: ["teams", "leagues"]
      - name: provider_id
        description: "The provider's id of the team or league the image belongs to."
        tests: [not_null]
      - name: source_sha256
        description: "The SHA-256 of the provider's image as last fetched."
        tests: [not_null]
      - name: fetched_at
        description: "When the stored files were last written."
      - name: checked_at
        description: "When the provider's image was last fetched to look for a change."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
