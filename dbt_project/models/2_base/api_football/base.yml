version: 2

models:
  - name: base_apif__teams
    description: >
      One row per team per competition, from the generic stg_apif__teams model. Grain:
      (league_code, team_api_id).

      The key set is a union rather than just /teams: team ids are also collected from fixtures,
      standings, per-fixture statistics, player stats and events. A team that appears in a
      competition's matches is therefore present even when the provider's /teams call never
      returned it, which is common on newly onboarded competitions.

      The ids taken from the three fixture-level feeds pass through the fixture_team_id_overrides
      seed first, so a team id the corrections have retired is never minted as an entity here. Only
      the keys are corrected; the display name still comes from whichever source carries one.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, team_api_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]

  - name: base_apif__teams_global
    description: >
      One row per team: the settled entity, from the latest ingest across base_apif__teams'
      per-competition rows. Grain: team_api_id.

      Identity is DECIDED here, not carried through: the name and country corrections from the
      override seeds are applied here, so the core dim publishes a settled entity.

      team_slug, the permanent locale-independent URL segment, is derived from the corrected name
      by a closed collision ladder — bare slug, then anchored to the country, then suffixed with
      the provider id. If that is taken too, team_slug is NULL and the not_null test stops the
      build.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_api_id]
    columns:
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]

  - name: base_apif__leagues
    description: >
      One row per league-season, from the generic stg_apif__leagues model with league_code
      flowing through as a column, deduplicated on the grain.
      Grain: (league_code, league_api_id, season_api_year).

      It also applies the country corrections from the country_name_overrides seed, so
      league_country is already the canonical English name by the time the core dim publishes it,
      and the competition-name corrections from the league_name_overrides seed, so league_name is
      the name we show rather than the provider's.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, league_api_id, season_api_year]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: league_name
        description: >
          The competition's DISPLAY NAME, already corrected. Provider value where no override
          exists, otherwise the league_name_overrides row — the provider's names are neither
          unique (`Serie A` arrives for both Italy's SA and Brazil's BSA) nor current (Primeira
          Liga, CONCACAF Champions League are renames it never took up). dim_league publishes this
          value unchanged; there is no coalesce in the dim.
        tests: [not_null]
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]

  - name: base_apif__league_entity
    description: >
      One row per league_api_id: latest league-season row by season_api_year then
      raw_ingested_at. Entity resolution for dim_league. Grain: league_api_id.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id]
    columns:
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]

  - name: base_apif__competition_seasons
    description: >
      One row per competition-season, collapsing the same season seen under more than one
      league_code by keeping the most recently ingested row.
      Grain: (league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id, season_api_year]
    columns:
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]

  - name: base_apif__fixtures_next
    description: >
      One row per fixture, from the generic stg_apif__fixtures_next model, deduplicated on
      fixture_id. Where the provider's result differs from the league's official decision, the
      score and status are the official ones from the fixture_result_corrections seed, and the
      provider's stay on the row. Grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: awarded_to_team_id
        description: "The team the league awarded the match to where it set no score, so the score does not show the winner; NULL elsewhere."
      - name: provider_goals_home
        description: "The provider's home goals; differs from goals_home only where the official result was corrected."
      - name: provider_goals_away
        description: "The provider's away goals; differs from goals_away only where the official result was corrected."
      - name: provider_status_short
        description: "The provider's status code; differs from status_short only where the league awarded a match the provider files as played."
      - name: result_correction_source
        description: "Where the result was corrected, the source of the official result: the league's or federation's decision or record, or two independent match reports. NULL elsewhere."

  - name: base_apif__standings
    description: >
      One row per team per standings section, from the generic stg_apif__standings model,
      deduplicated on the grain. Grain: (league_code, season, team_id, group_name).

      group_name is the provider's section or table name and is the true table identity — a league
      name for a single table, a group name for a group stage. group_description is a zone or
      stage annotation and is never an identity.

      Where the provider's row differs from the league's official table, its figures are the
      official ones from the standings_corrections seed, and the provider's stay on the row as
      provider_*.
    config:
      tags: ["base", "api_football", "standings_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season, team_id, group_name]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: standing_rank
        description: "The team's position in this standings table (1 = leader), from the official standings row ($.rank)."
        tests: [not_null]
      - name: goals_for_all
        description: Goals scored across all matches of the section, from the official standings row.
      - name: goals_against_all
        description: Goals conceded across all matches of the section, from the official standings row.
      - name: provider_team_id
        description: "The team the provider files the row under; differs from team_id only on a row corrected to its official team."
      - name: provider_standing_rank
        description: "The provider's rank; differs from standing_rank only on a corrected row."
      - name: provider_points
        description: "The provider's points; differs from points only on a corrected row."
      - name: provider_goals_diff
        description: "The provider's goal difference; differs from goals_diff only on a corrected row."
      - name: provider_played_all
        description: "The provider's matches played; differs from played_all only on a corrected row."
      - name: provider_wins_all
        description: "The provider's wins; differs from wins_all only on a corrected row."
      - name: provider_draws_all
        description: "The provider's draws; differs from draws_all only on a corrected row."
      - name: provider_losses_all
        description: "The provider's losses; differs from losses_all only on a corrected row."
      - name: provider_goals_for_all
        description: "The provider's goals scored; differs from goals_for_all only on a corrected row."
      - name: provider_goals_against_all
        description: "The provider's goals conceded; differs from goals_against_all only on a corrected row."
      - name: result_correction_source
        description: "Where the row was corrected, the source of the official figures: the league's or federation's decision or record, or two independent match reports. NULL elsewhere."

  - name: base_apif__fixture_statistics
    description: >
      The team's line in a match: one row per team with a statistics line (the generic
      stg_apif__fixture_statistics model pivoted to one column per stat, the latest fetch kept) and
      per team of every finished match, cleaned once and named in our own words.
      Grain: (league_code, fixture_id, team_id).

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication, so a corrected row cannot collide with one the correct team already has.

      {{ doc('cleaning_rules') }}
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this row, after applying the known-defect corrections in the fixture_team_id_overrides seed (the same alias and reattribute-if-cohabiting logic as base_apif__fixture_players.team_id). Corrected before the (league_code, fixture_id, team_id) dedup, so a corrected row cannot collide with one the correct team already has."
        tests: [not_null]
      - name: has_stat_line
        description: "{{ doc('has_stat_line') }}"
        tests: [not_null]
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }} Here, the newest fetch among the inputs the row rests on: the team's and the other team's statistics lines, the match events and the fixture."
      - name: stat_corrections
        description: "Every value the cleaning changed on this row because a stat contradicted a result, a stat vouched for by its own check or its own total: one entry per changed stat. Empty on a row nothing changed. The blank rule's zeros are not listed."
      - name: stat_corrections.stat
        description: "The column that was changed, by its name in this model (e.g. saves, shots_on_target)."
      - name: stat_corrections.provider_value
        description: "The provider's figure before the change."
      - name: stat_corrections.cleaned_value
        description: "{{ doc('stat_corrections_cleaned_value') }}"
      - name: stat_corrections.rule
        description: "{{ doc('stat_corrections_rule') }}"

  - name: base_apif__fixture_players
    description: >
      One row per player per fixture with that player's match statistics, from the generic
      stg_apif__fixture_players model, deduplicated on the grain (all of a match's rows come from
      one fetch: its newest in the provider's complete format, where any player has goals
      conceded, else its newest; a player the provider lists twice in one fetch keeps the row with
      more values), cleaned once and named in
      our own words. Grain: (league_code, fixture_id, team_id, player_id).

      {{ doc('cleaning_rules') }}

      Many competitions supply no player statistics at all, so a fixture missing from here has
      none rather than zeroes.

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication and before the cross-team collision guard, so a lineup the provider filed
      under the wrong team id is attributed to the team that actually played it.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "The provider's numeric team id for this player's side, after applying the known-defect corrections in the fixture_team_id_overrides seed: an unconditional alias swap for a duplicate id, or a reattribution when the correct id is a fixture participant and the wrong id is not; and the team the player's-team rule above decides, where his events name the other team of the match. Corrected before this model's own (league_code, fixture_id, team_id, player_id) dedup."
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: stat_corrections
        description: "Every value the cleaning changed on this row because two sources disagreed or a stat contradicted a result or its own total: one entry per changed stat. Empty on a row nothing changed. The blank rule's zeros and the conversion of a pass percentage to a count are not listed."
      - name: stat_corrections.stat
        description: "The column that was changed, by its name in this model (e.g. saves, goals)."
      - name: stat_corrections.provider_value
        description: "The provider's figure before the change: for accurate passes, the count after any percentage was converted; for penalty goals, the events' count, or the provider's per-player count in a match without events."
      - name: stat_corrections.cleaned_value
        description: "{{ doc('stat_corrections_cleaned_value') }}"
      - name: stat_corrections.rule
        description: "{{ doc('stat_corrections_rule') }}"

  - name: base_apif__players
    description: >
      Global player identity: one row per player_api_id, unioned from /players, fixture player
      stats and fixture events, then deduplicated in a single pass that prefers the most
      authoritative named source and, within that, the most recent ingest.
      Grain: player_api_id.

      IDENTITY ONLY — no league_code, and no team or season affiliation. A player belongs to
      clubs over time, not to one competition, so affiliation lives in
      dim_player_team_season_mapping and in the facts.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__player_profiles
    description: >
      Current per-player bio from the rich /players/profiles source
      (stg_apif__player_profiles), reduced to the latest row per player_id.
      Identity-level only — no league_code, team or season. Grain: player_api_id.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__fixture_events
    description: >
      One row per event in a fixture, from stg_apif__fixture_events, keeping the events of the
      match's latest fetch that has events. Grain: (league_code, fixture_id, event_index).

      event_index is the 0-based position in the provider's events array and is the stable
      identity of an event. Deduplication is on POSITION, not content: the provider sometimes
      repeats event content at different positions, and both are kept.

      team_id is then resolved. A null one is recovered from the same team's other events in that
      fixture, matched by name, and known provider team-id defects are corrected from the
      fixture_team_id_overrides seed. Where a player's events and his statistics row name different
      teams of the match, the player's-team rule of the cleaning rules on base_apif__fixture_players
      decides, and his events move when they are the side it contradicts.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - event_index
    columns:
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: resolved_player_team_id
        description: >
          On the events of a player whose statistics row names the other team of the match, the team
          the player's-team rule decides for him, which his events and his row then both carry. NULL
          on every other event, on an own goal, and where nothing decides.

  - name: base_apif__player_team_season
    description: >
      Rostered player↔team↔season membership from the /players squad source
      (stg_apif__players), including squad members who never played a match.
      Grain: (league_code, player_id, team_id, season_year), latest ingest per grain.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
            - team_id
            - season_year
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: season_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]

  - name: base_apif__transfers
    description: >
      Dated player transfers (moves), deduped from stg_apif__transfers. By-team fetching
      returns each move twice (once per involved team), so we keep one row per distinct move;
      provider near-duplicates with different dates are kept distinct (no fuzzy merge).
      transfer_type is the raw provider string. Grain: (player_id, team_in_id, team_out_id,
      transfer_date).
    config:
      tags: ["base", "api_football", "transfers"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - team_in_id
            - team_out_id
            - transfer_date
    columns:
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: transfer_date
        description: "The date the provider records the move on. It is the date the transfer was reported, not necessarily the date the player was first registered or first played."
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]

  - name: base_apif__coaches
    description: >
      Coach identity as a global entity: one row per coach_api_id from stg_apif__coaches, latest
      ingest. Identity and bio only — no league_code, because a coach is not scoped to one
      competition. Grain: coach_api_id.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]

  - name: base_apif__coach_career
    description: >
      A coach's career stints: one row per spell at a club, from stg_apif__coach_career — the
      "clubs managed" history. Grain: (coach_api_id, team_api_id, start_date).

      The team link stays on the raw provider id rather than resolving to dim_team, because the
      career history names clubs we do not track, so many of these teams have no dim_team row.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id, team_api_id, start_date]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: start_date
        description: "The date this coaching stint began, as the provider's career record gives it. Never NULL: a stint with no known start date is dropped before this model is built."
        tests: [not_null]
