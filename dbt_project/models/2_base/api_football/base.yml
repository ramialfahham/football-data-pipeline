version: 2

models:
  - name: base_apif__teams
    description: >
      One row per team per competition, from the generic stg_apif__teams model. Grain:
      (league_code, team_api_id).

      The key set is a union rather than just /teams: team ids are also collected from fixtures,
      standings, per-fixture statistics, player stats and events. A team that appears in a
      competition's matches is therefore present even when the provider's /teams call never
      returned it, which is common on newly onboarded competitions.

      The ids taken from the three fixture-level feeds pass through the fixture_team_id_overrides
      seed first, so a team id the corrections have retired is never minted as an entity here. Only
      the keys are corrected; the display name still comes from whichever source carries one.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, team_api_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]

  - name: base_apif__teams_global
    description: >
      One row per team: the settled entity, from the latest ingest across base_apif__teams'
      per-competition rows. Grain: team_api_id.

      Identity is DECIDED here, not carried through: the name and country corrections from the
      override seeds are applied here, so the core dim publishes a settled entity.

      team_slug, the permanent locale-independent URL segment, is derived from the corrected name
      by a closed collision ladder — bare slug, then anchored to the country, then suffixed with
      the provider id. If that is taken too, team_slug is NULL and the not_null test stops the
      build.
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_api_id]
    columns:
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__leagues
    description: >
      One row per league-season, from the generic stg_apif__leagues model with league_code
      flowing through as a column, deduplicated on the grain.
      Grain: (league_code, league_api_id, season_api_year).

      It also applies the country corrections from the country_name_overrides seed, so
      league_country is already the canonical English name by the time the core dim publishes it,
      and the competition-name corrections from the league_name_overrides seed, so league_name is
      the name we show rather than the provider's.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, league_api_id, season_api_year]
    columns:
      - name: league_code
        tests: [not_null]
      - name: league_name
        description: >
          The competition's DISPLAY NAME, already corrected. Provider value where no override
          exists, otherwise the league_name_overrides row — the provider's names are neither
          unique (`Serie A` arrives for both Italy's SA and Brazil's BSA) nor current (Primeira
          Liga, CONCACAF Champions League are renames it never took up). dim_league publishes this
          value unchanged; there is no coalesce in the dim.
        tests: [not_null]
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]

  - name: base_apif__league_entity
    description: >
      One row per league_api_id: latest league-season row by season_api_year then
      raw_ingested_at. Entity resolution for dim_league. Grain: league_api_id.
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id]
    columns:
      - name: league_api_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__competition_seasons
    description: >
      One row per competition-season, collapsing the same season seen under more than one
      league_code by keeping the most recently ingested row.
      Grain: (league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_api_id, season_api_year]
    columns:
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__fixtures_next
    description: >
      One row per fixture, from the generic stg_apif__fixtures_next model, deduplicated on
      fixture_id. Grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__standings
    description: >
      One row per team per standings section, from the generic stg_apif__standings model,
      deduplicated on the grain. Grain: (league_code, season, team_id, group_name).

      group_name is the provider's section or table name and is the true table identity — a league
      name for a single table, a group name for a group stage. group_description is a zone or
      stage annotation and is never an identity.
    config:
      tags: ["base", "api_football", "standings_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season, team_id, group_name]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: standing_rank
        tests: [not_null]

  - name: base_apif__fixture_statistics
    description: >
      One row per team per fixture with that team's match statistics, from the generic
      stg_apif__fixture_statistics model, deduplicated on the grain.
      Grain: (league_code, fixture_id, team_id).

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication, so a corrected row cannot collide with one the correct team already has.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]

  - name: base_apif__fixture_players
    description: >
      One row per player per fixture with that player's match statistics, from the generic
      stg_apif__fixture_players model, deduplicated on the grain.
      Grain: (league_code, fixture_id, team_id, player_id).

      Many competitions supply no player statistics at all, so a fixture missing from here has
      none rather than zeroes.

      Known provider team-id defects are corrected from the fixture_team_id_overrides seed before
      the deduplication and before the cross-team collision guard, so a lineup the provider filed
      under the wrong team id is attributed to the team that actually played it.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_id, team_id, player_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: base_apif__players
    description: >
      Global player identity: one row per player_api_id, unioned from /players, fixture player
      stats and fixture events, then deduplicated in a single pass that prefers the most
      authoritative named source and, within that, the most recent ingest.
      Grain: player_api_id.

      IDENTITY ONLY — no league_code, and no team or season affiliation. A player belongs to
      clubs over time, not to one competition, so affiliation lives in
      dim_player_team_season_mapping and in the facts.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__player_profiles
    description: >
      Current per-player bio from the rich /players/profiles source
      (stg_apif__player_profiles), reduced to the latest row per player_id.
      Identity-level only — no league_code, team or season. Grain: player_api_id.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_api_id]
    columns:
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]

  - name: base_apif__fixture_events
    description: >
      One row per event in a fixture, from stg_apif__fixture_events, keeping the most recent
      ingest. Grain: (league_code, fixture_id, event_index).

      event_index is the 0-based position in the provider's events array and is the stable
      identity of an event. Deduplication is on POSITION, not content: the provider sometimes
      repeats event content at different positions, and both are kept.

      team_id is then resolved. A null one is recovered from the same team's other events in that
      fixture, matched by name, and known provider team-id defects are corrected from the
      fixture_team_id_overrides seed.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - event_index
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__player_team_season
    description: >
      Rostered player↔team↔season membership from the /players squad source
      (stg_apif__players), including squad members who never played a match.
      Grain: (league_code, player_id, team_id, season_year), latest ingest per grain.
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
            - team_id
            - season_year
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: season_year
        tests: [not_null]

  - name: base_apif__transfers
    description: >
      Dated player transfers (moves), deduped from stg_apif__transfers. By-team fetching
      returns each move twice (once per involved team), so we keep one row per distinct move;
      provider near-duplicates with different dates are kept distinct (no fuzzy merge).
      transfer_type is the raw provider string. Grain: (player_id, team_in_id, team_out_id,
      transfer_date).
    config:
      tags: ["base", "api_football", "transfers"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - team_in_id
            - team_out_id
            - transfer_date
    columns:
      - name: player_id
        tests: [not_null]
      - name: transfer_date
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]

  - name: base_apif__coaches
    description: >
      Coach identity as a global entity: one row per coach_api_id from stg_apif__coaches, latest
      ingest. Identity and bio only — no league_code, because a coach is not scoped to one
      competition. Grain: coach_api_id.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]

  - name: base_apif__coach_career
    description: >
      A coach's career stints: one row per spell at a club, from stg_apif__coach_career — the
      "clubs managed" history. Grain: (coach_api_id, team_api_id, start_date).

      The team link stays on the raw provider id rather than resolving to dim_team, because the
      career history names clubs we do not track, so many of these teams have no dim_team row.
    config:
      tags: ["base", "api_football", "coach_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_api_id, team_api_id, start_date]
    columns:
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: start_date
        tests: [not_null]
