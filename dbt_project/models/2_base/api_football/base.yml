version: 2

models:
  - name: base_apif__teams
    description: >
      Unified teams across all onboarded competitions (explicit ref() per
      competition staging). Same enrichment as BL1: /teams plus fixture-derived
      keys and name fallback. Output grain: (league_code, team_api_id).
    config:
      tags: ["base", "api_football", "team_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, team_api_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: team_api_id
        tests: [not_null]

  - name: base_apif__leagues
    description: >
      Unified league-season rows across all onboarded competitions (explicit
      ref() per competition staging). Deduplicated per
      (league_code, league_api_id, season_api_year). Feeds dim_league and
      dim_competition_season. Output grain: (league_code, league_api_id, season_api_year).
    config:
      tags: ["base", "api_football", "league_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, league_api_id, season_api_year]
    columns:
      - name: league_code
        tests: [not_null]
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]

  - name: base_apif__fixtures_next
    description: >
      Unified fixtures across all onboarded competitions (explicit ref() per
      competition staging). Deduplicated per fixture_id. Feeds fct_fixture.
      Output grain: fixture_id.
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id]
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__standings
    description: >
      Unified standings across all onboarded competitions (explicit ref() per
      competition staging). Deduplicated per (league_code, season, team_id).
      Feeds fct_standings. group_description is the API zone/stage label.
      Output grain: (league_code, season, team_id).
    config:
      tags: ["base", "api_football", "standings_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season, team_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: standing_rank
        tests: [not_null]

  - name: base_apif__bl1_fixture_events
    description: >
      Deduplicated fixture event rows from stg_apif__bl1_fixture_events. Keeps
      the most recently ingested version per event grain
      (fixture_id, minute_elapsed, minute_extra, team_id, player_id,
      event_type, event_detail).
      Output grain: (fixture_id, minute_elapsed, minute_extra, team_id,
      player_id, event_type, event_detail).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_id
            - minute_elapsed
            - minute_extra
            - team_id
            - player_id
            - event_type
            - event_detail
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__bl1_fixture_players
    description: >
      Deduplicated per-player match statistic rows from
      stg_apif__bl1_fixture_players. Keeps the most recently ingested version
      per (fixture_id, team_id, player_id).
      Output grain: (fixture_id, team_id, player_id).
    config:
      tags: ["base", "api_football", "fixture_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_id, team_id, player_id]
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: league_code
        tests: [not_null]

  - name: base_apif__bl1_players
    description: >
      Canonical player entity resolved from two sources: stg_apif__bl1_players
      (primary — has biographical attributes) and base_apif__bl1_transfers
      (fallback — covers players known only from transfer history). Deduplicates
      to one row per (league_code, player_api_id), preferring the players
      endpoint and the most recent season snapshot.
      Output grain: (league_code, player_api_id).
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, player_api_id]
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_api_id
        tests: [not_null]

  - name: base_apif__bl1_transfers
    description: >
      Deduplicated transfer events from stg_apif__bl1_transfers.
      Resolves duplicate entries that the API occasionally returns within a
      single player's transfers array by keeping the most recently ingested row
      per transfer grain. Grain: (league_code, player_id, transfer_date,
      from_team_api_id, to_team_api_id, transfer_type).
    config:
      tags: ["base", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
            - transfer_date
            - from_team_api_id
            - to_team_api_id
            - transfer_type
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: transfer_date
        tests: [not_null]
