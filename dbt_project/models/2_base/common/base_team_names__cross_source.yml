version: 2

models:
  - name: base_team_names__cross_source
    description: >
      Cross-source team name normalization map with a canonical team-name candidate per league.
      Source systems included: football-data.co.uk (historical fixtures) and API-Football (upcoming fixtures).
      Canonical picks prefer API-Football names when both disagree.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["base", "entity_resolution", "team_names"]
    columns:
      - name: source_system
        description: "Source system where the original team name was observed."
        tests: [not_null]
      - name: league_code
        description: "League code in internal convention."
        tests: [not_null]
      - name: source_team_name
        description: "Original team name as provided by the source system."
        tests: [not_null]
      - name: normalized_team_key
        description: "Normalization key used for cross-source entity matching."
        tests: [not_null]
      - name: canonical_team_name
        description: "Preferred canonical team name (API-Football over football-data.co.uk when both exist)."
        tests: [not_null]
