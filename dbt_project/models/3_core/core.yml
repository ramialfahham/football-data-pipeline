version: 2

# Core layer is source-agnostic: dimensions and facts are the canonical system of record and may conform data from multiple sources in the future.
# Surrogate keys use API-Football integer IDs directly where they are globally unique (league, team, player, fixture). Composite keys use ``dbt_utils.generate_surrogate_key`` where no single integer suffices (e.g. competition-season).
#
# Core test policy:
#   - surrogate key: unique + not_null
#   - natural key: dbt_utils.unique_combination_of_columns
#   - not_null on the attributes the dimension would be useless without (name / date)
#   - accepted_values where the attribute is a closed, stable enum
# Fact test policy:
#   - surrogate key: unique + not_null
#   - natural-key grain: dbt_utils.unique_combination_of_columns
#   - every FK to a dim: not_null + relationships (severity error by default)
#   - accepted_values on closed API enums (severity warn while the data still backfills)

models:
  - name: dim_date
    description: >
      Global calendar dimension: one row per day from 1900 through 2100. Grain: date_day.

      Deliberately far wider than any football data we hold, so it never needs extending. Not
      scoped to a competition — every fact carrying a date joins it through `date_sk`.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: date_sk
        description: "Surrogate key: ``YYYYMMDD`` as INT64. Stable and human-readable."
        tests: [not_null, unique]
      - name: date_day
        description: "Calendar date (DATE)."
        tests: [not_null]
      - name: calendar_year
        description: "Four-digit Gregorian year."
      - name: calendar_quarter
        description: "Quarter of the year, 1-4."
      - name: calendar_month
        description: "Month of the year, 1-12."
      - name: calendar_month_name
        description: "Full English month name (January..December)."
      - name: iso_year
        description: "ISO-8601 week-based year."
      - name: iso_week
        description: "ISO-8601 week number, 1-53."
      - name: day_of_month
        description: "Day of month, 1-31."
      - name: day_of_week
        description: "BigQuery day-of-week (1=Sunday..7=Saturday)."
      - name: day_of_week_name
        description: "Full English weekday name."
      - name: is_weekend
        description: "True when day_of_week is Sunday or Saturday."

  - name: dim_country
    description: >
      The canonical country dimension, published from the `countries` seed. Grain: country_key.

      It publishes and never corrects: provider spellings are mapped onto these names in base, so
      anything arriving here is already canonical.

      NOT A LIST OF UN MEMBER STATES, and joining it to one drops real rows. Most entries are UN
      states; the rest are football associations (England, Scotland, Kosovo), territories, one
      unrecognised state and one historical country.

      NO SURROGATE KEY: a country has no provider id, so the assigned country_key is the key.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: country_key
        description: "Stable assigned slug of the canonical name. Never re-derived on a rename."
        tests: [not_null, unique]
      - name: country_name
        description: "The canonical English name the product displays. ASCII only."
        tests: [not_null, unique]

  - name: dim_region
    description: >
      The region dimension, the counterpart to dim_country, published from the `confederations`
      seed. Grain: region_key.

      A competition points at ONE of the two: a domestic competition has a country, a continental
      or international one has a region. Which of the two is populated IS the answer, so no
      separate flag is needed to tell them apart.

      region_key holds a CONFEDERATION CODE — UEFA, CONMEBOL, CONCACAF, CAF, AFC, OFC, FIFA. The
      seed calls that column `confederation` because it is the authoring surface; the dim
      publishes it as region_key. `FIFA -> World` is a judgement, not geography.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "low"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: region_key
        description: "Confederation code, matching `competition_registry.confederation`."
        tests: [not_null, unique]
      - name: region_name
        description: "English display name for the region, e.g. UEFA -> Europe."
        tests: [not_null, unique]
      - name: region_name_i18n_key
        description: "i18n key for the translated region label. English resolves from region_name, not through this."
        tests: [not_null, unique]

  - name: dim_league
    description: "Canonical league dimension. Grain: league_api_id. Sourced from base_apif__league_entity (latest season row per league_api_id); surrogate key is the API integer directly."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests: [not_null, unique]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: league_api_id
        description: "API-Football league id (78 for Bundesliga)."
        tests: [not_null]
      - name: league_name
        description: "League display name from API-Football."
        tests: [not_null]
      - name: league_type
        description: "League type as reported by API-Football."
        tests:
          - accepted_values:
              values: ['League', 'Cup']
              severity: warn
      - name: league_country
        description: >
          The country a league belongs to, already canonicalised and reconciled against
          dim_country in base.

          NULL for every international and continental competition: the provider's 'World'
          sentinel is not a country, so those rows carry none and take their region from
          `confederation` instead. Whether this column or the region is populated IS the answer to
          "does this competition show a country or a region".
        tests:
          - relationships:
              to: ref('dim_country')
              field: country_name
      - name: league_logo_url
        description: "League logo URL."
      - name: country_flag_url
        description: "Country flag URL. NULL for international competitions — the provider returns a flag only for the single-country ones (21 of 45), so this is deliberately untested for nullity."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_competition_season
    description: "Canonical competition-season dimension with per-season coverage flags. Grain: (league_api_id, season_api_year). Sourced from base_apif__competition_seasons. Coverage flags describe which API-Football endpoints return data for that league-season and drive conditional logic downstream. Season expansion/parsing is performed in staging."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_api_id
            - season_api_year
    columns:
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null, unique]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: league_api_id
        description: "API-Football league id."
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: season_start_date
        description: "Season start date from API-Football."
      - name: season_end_date
        description: "Season end date from API-Football."
      - name: season_is_current
        description: "True when this season is marked ``current`` by API-Football for the league."
      - name: has_coverage_fixture_events
        description: "Coverage flag for per-fixture events."
      - name: has_coverage_fixture_lineups
        description: "Coverage flag for per-fixture lineups."
      - name: has_coverage_fixture_statistics
        description: "Coverage flag for per-fixture team statistics."
      - name: has_coverage_fixture_players
        description: "Coverage flag for per-fixture player statistics."
      - name: has_coverage_standings
        description: "Coverage flag for league standings."
      - name: has_coverage_players
        description: "Coverage flag for squad players."
      - name: has_coverage_top_scorers
        description: "Coverage flag for top scorers."
      - name: has_coverage_top_assists
        description: "Coverage flag for top assists."
      - name: has_coverage_top_cards
        description: "Coverage flag for top yellow/red cards."
      - name: has_coverage_injuries
        description: "Coverage flag for injuries."
      - name: has_coverage_predictions
        description: "Coverage flag for predictions."
      - name: has_coverage_odds
        description: "Coverage flag for pre-match odds."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_team
    description: "Canonical team ENTITY (identity only). Grain: team_api_id (globally unique in API-Football). Carries no competition/season affiliation — competition/season membership lives in dim_team_competition_season_mapping, per-match facts in fct_fixture. Sourced from base_apif__teams_global (one row per team; identity/venue attributes from the latest ingest)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null, unique]
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: team_name
        description: >
          The team's display name: the provider's value with the corrections from the
          team_name_overrides seed already applied in base.

          There is no second team-name field anywhere, so this value names the team wherever a
          team is named, and a wrong value here is wrong in every one of those places at once.
        tests: [not_null]
      - name: team_slug
        description: "{{ doc('team_slug') }}"
        tests: [not_null, unique]
      - name: team_code
        description: "{{ doc('team_code') }}"
      - name: team_country
        description: >
          The country a team is registered in, already canonicalised and reconciled against
          dim_country in base. Can be NULL — not every provider row carries one.
        tests:
          - relationships:
              to: ref('dim_country')
              field: country_name
      - name: team_founded_year
        description: "Year the team was founded."
      - name: team_logo_url
        description: "Team crest URL."
      - name: venue_api_id
        description: "API-Football venue id for the current home venue."
      - name: venue_name
        description: "Home venue name."
      - name: venue_address
        description: "Home venue address."
      - name: venue_city
        description: "Home venue city."
      - name: venue_capacity
        description: "Home venue capacity."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_player
    description: >
      Canonical player dimension — a pure global entity. Grain: player_api_id (globally
      unique in API-Football). Identity from base_apif__players, enriched with bio from
      base_apif__player_profiles (the richer /players/profiles source preferred via coalesce
      for overlapping descriptors: name, birth_date, nationality, photo). Entity attributes
      only; a player is one entity across competitions, so this carries NO league_code and NO
      team/season affiliation — "which team/season" lives in dim_player_team_season_mapping
      (roster membership) and the facts (appearances).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null, unique]
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: player_name
        description: "Player display name from API-Football."
        tests: [not_null]
      - name: player_first_name
        description: "{{ doc('player_first_name') }}"
      - name: player_last_name
        description: "{{ doc('player_last_name') }}"
      - name: player_birth_date
        description: "Player birth date (DATE) when parseable from API ``birth.date``."
      - name: player_nationality
        description: "Nationality string from API-Football."
      - name: player_photo_url
        description: "Player photo URL."
      - name: player_birth_place
        description: "Birth place (city), from /players/profiles."
      - name: player_birth_country
        description: >
          Birth country, from the provider's player profiles, already canonicalised and reconciled
          against dim_country in base. Can be NULL — not every provider row carries one.
        tests:
          - relationships:
              to: ref('dim_country')
              field: country_name
      - name: player_height
        description: "Height (e.g. '180 cm'), from /players/profiles."
      - name: player_weight
        description: "Weight (e.g. '75 kg'), from /players/profiles."
      - name: player_position
        description: "General/listed position, from /players/profiles."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_player_team_season_mapping
    description: >
      Which team a player was rostered at, in which competition-season. Grain: (player_sk,
      team_sk, league_code, season_api_year) — one row per player per team per season they
      appeared in the roster, squad members with zero appearances included.

      A mapping dimension: an association between dimensions, holding participating keys and
      lineage only, with no measures and no descriptive attributes.

      Join it on the FULL grain for a one-row lookup. Joining on a single key such as player_sk
      resolves a many-to-many and returns many rows — by design, not a defect.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - league_code
            - season_api_year
    columns:
      - name: player_team_season_sk
        description: "Surrogate key over (player_id, team_id, league_code, season_year) — the relationship grain."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }} Resolved here by lookup on (league_code, season_api_year), because the roster source carries league_code. Nullable: a roster season uncovered by /leagues yields null rather than dropping the membership."
        tests:
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }} Resolved here via dim_competition_season, and nullable for the same reason as season_sk."
        tests:
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests:
          - not_null
          # Every rostered competition must be registered. Without this, a league_code
          # present here but absent from competition_registry would be silently dropped by
          # downstream club/national filters that resolve entity_type via the registry → types
          # seeds (e.g. mart_roster's `where entity_type = 'club'`). Verified clean today.
          - relationships:
              to: ref('competition_registry')
              field: league_code
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the roster's season."
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_team_competition_season_mapping
    description: >
      Which teams were in which competition-season. Grain: (team_sk, league_code,
      season_api_year) — one row per team per competition-season in which it has at least one
      fixture, finished or scheduled.

      Membership is derived from FIXTURES, not the roster, because a team in a competition always
      plays in it. Scheduled fixtures count, so membership exists as soon as a schedule is
      published.

      A mapping dimension: participating keys only, and no raw_ingested_at, because it is
      distilled from many fixtures rather than one source row. Join it on the FULL grain; a
      single-key join returns many rows by design.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "dimension"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - league_code
            - season_api_year
    columns:
      - name: team_competition_season_sk
        description: "Surrogate key over (team_sk, league_code, season_api_year) — the relationship grain."
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_sk
        description: "{{ doc('league_sk') }} Derived from the fixture, as in fct_fixture."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }} Conforms to fct_fixture and dim_competition_season; every fixture's (league, season) is covered, so this is non-null."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the membership's season."
        tests: [not_null]

  - name: fct_fixture
    description: >
      Match-level fact, one row per fixture. Grain: fixture_sk (= fixture_api_id).

      The measures are FINAL-TIME goals only. Half-time, extra-time and penalty shoot-out splits
      are deliberately not carried, so a score here is the result and never a stage of it. Status,
      round and venue ride along as degenerate attributes.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["core", "fact"]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null, unique]
      - name: fixture_api_id
        description: "API-Football fixture id."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: kickoff_date_sk
        description: "FK to dim_date on the kickoff day (UTC date)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: home_team_api_id
        description: "API-Football home team id."
      - name: away_team_api_id
        description: "API-Football away team id."
      - name: fixture_date
        description: "{{ doc('fixture_date') }}"
        tests: [not_null]
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: kickoff_timezone
        description: "Kickoff timezone string as delivered by the API."
      - name: status_short
        description: "{{ doc('status_short') }}"
        tests:
          - accepted_values:
              values:
                ['TBD', 'NS', '1H', 'HT', '2H', 'ET', 'BT', 'P', 'SUSP', 'INT',
                 'FT', 'AET', 'PEN', 'PST', 'CANC', 'ABD', 'AWD', 'WO', 'LIVE']
              severity: warn
      - name: status_long
        description: "API-Football long status description."
      - name: status_elapsed
        description: "Elapsed minutes as reported by API-Football (in-play only)."
      - name: round_name
        description: "Round label (e.g. ``Regular Season - 12``). Degenerate attribute."
      - name: goals_home
        description: "Final-time goals scored by home team."
      - name: goals_away
        description: "Final-time goals scored by away team."
      - name: venue_api_id
        description: "API-Football venue id."
      - name: venue_name_snapshot
        description: "Venue name at the time the fixture was ingested."
      - name: venue_city_snapshot
        description: "Venue city at the time the fixture was ingested."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: fct_standings
    description: "Current standings. Grain: (season_sk, team_sk, group_name). Sources from base_apif__standings. group_name is the API standings section (league name for a single-table league, group name for a group stage, phase name for split-season leagues) — the true table identity. A team appears once per section, so split-season leagues yield more than one row per (team, season)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["core", "fact"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_sk
            - team_sk
            - group_name
    columns:
      - name: standing_sk
        description: "Surrogate key from (league_code, season, team_id, group_name)."
        tests: [not_null, unique]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
      - name: group_name
        description: "Standings section/table name from the API ($.group): the league name for a single-table league (e.g. 'Premier League'), the group for a group stage (e.g. 'Group A'), or the phase for a split-season league (e.g. '… Championship Round'). Part of the grain."
      - name: group_description
        description: "Standings zone label assigned by the API ($.description, e.g. 'Promotion - Champions League', 'Relegation - Bundesliga 2'). Null for mid-table teams. Annotation only — NOT a grain key (use group_name for table identity)."
      - name: standing_rank
        description: "Table position (1 = leader)."
      - name: points
        description: "Accumulated points."
      - name: goals_diff
        description: "{{ doc('goals_diff') }}"
      - name: form
        description: "Recent form string (``WDLWW`` etc.). Degenerate attribute."
      - name: played
        description: "Games played (all)."
      - name: wins
        description: "{{ doc('wins') }}"
      - name: draws
        description: "{{ doc('draws') }}"
      - name: losses
        description: "{{ doc('losses') }}"
      - name: goals_scored
        description: "Goals scored in the section, as the provider's standings row reports them. A published fact of the official table, not a metric computed from fixtures."
      - name: goals_conceded
        description: "Goals conceded in the section, as the provider's standings row reports them. A published fact of the official table, not a metric computed from fixtures."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: fct_fixture_team_stats
    description: "Per-team, per-fixture statistics. Grain: (fixture_sk, team_sk). Sources from unified base_apif__fixture_statistics; staging pivots API lines to typed columns."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["core", "fact"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
            - team_sk
    columns:
      - name: fixture_team_stat_sk
        description: "Surrogate key from (fixture_id, league_code, team_id)."
        tests: [not_null, unique]
      - name: fixture_sk
        description: >
          {{ doc('fixture_sk') }} Every fixture with rows here must have a fixture header. This
          fact is incremental and accumulates historical seasons, and fct_fixture carries the same
          history forward on full refresh, so the foreign key holds for active and idle
          competitions alike.
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
