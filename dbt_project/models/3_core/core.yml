  - name: fct_fixture_player_stats
    description: "Per-player, per-fixture statistics. Grain: (fixture_sk, team_sk, player_sk). Staging flattens and types player statistics; core keys and constrains the fact grain."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["core", "fact"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
            - team_sk
            - player_sk
    columns:
      - name: fixture_player_stat_sk
        description: "Surrogate key from (fixture_id, league_code, team_id, player_id)."
        tests: [not_null, unique]
      - name: fixture_sk
        description: >
          {{ doc('fixture_sk') }} Every fixture with rows here must have a fixture header. This
          fact is incremental and accumulates historical seasons, and fct_fixture carries the same
          history forward on full refresh, so the foreign key holds for active and idle
          competitions alike.
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
