  - name: fct_fixture_event
    description: "In-match events (goals, cards, substitutions, VAR decisions). Grain: (fixture_id, event_index) — event_index is the zero-based array position from the API-Football /fixtures/events response, which does not emit event IDs."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["core", "fact"]
    columns:
      - name: event_sk
        description: "Surrogate key hashing (fixture_id, event_index)."
        tests: [not_null, unique]
      - name: event_index
        description: "Zero-based array position of the event within the fixture's event list. Combined with fixture_id, this is the unique grain of the fact."
        tests: [not_null]
      - name: fixture_sk
        description: >
          {{ doc('fixture_sk') }} Every fixture with rows here must have a fixture header. This
          fact is incremental and accumulates historical seasons, and fct_fixture carries the same
          history forward on full refresh, so the foreign key holds for active and idle
          competitions alike.
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} The team the event is attributed to."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }} Here it is the event's primary actor (goalscorer, card recipient, and so on). Nullable: a VAR decision or a team-level event may not carry a player."
        tests:
          - relationships:
              to: ref('dim_player')
              field: player_sk
              where: "player_sk is not null"
      - name: league_code
        tests: [not_null]
      - name: fixture_api_id
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
      - name: player_api_id
        description: "{{ doc('player_api_id') }}"
      - name: minute_elapsed
        description: "The minute of normal time the event is recorded at, counting from 1. Added time is not folded in here: a goal in the 90+3rd minute is 90 with minute_extra set to 3."
      - name: minute_extra
        description: "Minutes into added time, on top of minute_elapsed. NULL for an event in normal play, which is most of them."
      - name: event_type
        description: "High-level event type (e.g. Goal, Card, subst, Var)."
      - name: event_detail
        description: "Event subtype (e.g. Normal Goal, Yellow Card, Substitution 1)."
      - name: event_comments
        description: "The provider's own free-text note on the event, passed through unparsed. Mostly NULL, and its wording is not a controlled vocabulary, so branch on event_type and event_detail rather than on this."
      - name: team_name_snapshot
        description: "The team's name as the events feed spelled it when this row was ingested. It is kept as a record of what the feed said, NOT as a name to display: it is neither corrected nor kept in step with the team dimension, so join on team_api_id for a current name."
      - name: player_name_snapshot
        description: "The player's name as the events feed spelled it when this row was ingested. It is kept as a record of what the feed said, NOT as a name to display: it is neither corrected nor kept in step with the player dimension, and it is the only name available for an event the feed gives no player id for."
      - name: assist_player_name
        description: "Assisting player name. Degenerate attribute because the API does not emit an id in the events payload."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: fct_team_market_value_snapshot
    description: >
      Team-level squad market value estimate snapshots (published-style total EUR). Grain:
      (team_sk, as_of_date, source_code). Sourced from seed wc_team_market_value_snapshot until
      automated ingest exists.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "fact", "market_value"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - as_of_date
            - source_code
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: as_of_date
        description: "{{ doc('as_of_date') }}"
        tests: [not_null]
      - name: market_value_eur
        description: "Whole EUR; null when unknown."
      - name: source_code
        description: "{{ doc('source_code') }}"
        tests: [not_null]
      - name: prompt_version
        description: "{{ doc('prompt_version') }}"

  - name: fct_transfer
    description: >
      Dated player transfers: one row per distinct move, carrying the provider's raw transfer
      type. Grain: (player_sk, team_out_sk, team_in_sk, transfer_date). The dated source of a
      player's affiliation timeline.

      NO relationship tests to dim_player or dim_team, deliberately: transfers legitimately name
      clubs and players outside the competitions we cover, so a foreign key here would fail on
      correct data.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["core", "fact", "transfers"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_in_sk
            - team_out_sk
            - transfer_date
      # every move has at least one known side (both-null is filtered in base); a single
      # missing side (team_in_sk OR team_out_sk null) is legitimate provider behaviour
      - dbt_utils.expression_is_true:
          expression: "team_in_sk is not null or team_out_sk is not null"
          name: fct_transfer_has_a_side
    columns:
      - name: transfer_sk
        description: "Identity key for one move: a surrogate built from the player, both clubs and the transfer date. A player moving between the same two clubs twice gets two rows, one per date."
        tests: [unique, not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: transfer_date
        description: "The date the provider records the move on. It is the date the transfer was reported, not necessarily the date the player was first registered or first played."
        tests: [not_null]
      - name: transfer_type
        description: "Raw provider transfer type (N/A, Loan, Free, Transfer, fee, …); no canonical taxonomy."
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: team_in_sk
        description: "The club the player moved TO, as a team_sk. It joins to dim_team like any other, but not every club in a career appears there - youth, reserve and untracked clubs show up in transfers without a dimension row, so treat this as a soft link."
      - name: team_out_sk
        description: "The club the player moved FROM, as a team_sk. The same soft link as team_in_sk: a club may appear here without a dim_team row."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_coach
    description: >
      Pure coach entity: one row per coach_api_id (identity / bio only; no league_code — mirrors
      dim_player / dim_team). Managerial career lives in dim_coach_team_mapping. Grain: coach_sk.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_sk]
    columns:
      - name: coach_sk
        description: "{{ doc('coach_sk') }}"
        tests: [not_null, unique]
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: coach_name
        description: "Coach display name from API-Football."
        tests: [not_null]
      - name: coach_birth_country
        description: >
          Birth country, already canonicalised and reconciled against dim_country in base. Can be
          NULL — not every provider row carries one.
        tests:
          - relationships:
              to: ref('dim_country')
              field: country_name
      - name: coach_first_name
        description: "The coach's given name as the provider spells it. Held separately from the family name because the feed supplies the two parts, not because a display name is built from them here."
      - name: coach_last_name
        description: "The coach's family name as the provider spells it."
      - name: coach_age
        description: "The age the provider reported for this coach. It is a point-in-time value carried through from the feed rather than something recomputed here, so coach_birth_date is the field to derive an age from."
      - name: coach_birth_date
        description: "The coach's date of birth as the provider gives it. NULL where the feed omits it, which is common for coaches outside the major European leagues."
      - name: coach_birth_place
        description: "The town or city of birth as the provider gives it, free text and not a code. It is not a country - coach_nationality carries that."
      - name: coach_nationality
        description: "The coach's nationality as the provider names it, in English and as free text rather than a country code, so it will not join to a country dimension without mapping."
      - name: coach_photo_url
        description: "URL of the coach's portrait on the provider's image host. The image is served by the provider, so a link here is only as durable as their hosting."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"

  - name: dim_coach_team_mapping
    description: >
      Coach↔team affiliation (managerial career stints) with start/end dates, from
      base_apif__coach_career. team_sk is a SOFT link to dim_team — the career team set (youth /
      reserve / untracked clubs) exceeds our tracked set, so NO strict relationships test on team_sk;
      the provider team_api_id + team_name are kept for display. Grain: (coach_sk, team_api_id, start_date).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coach_sk, team_api_id, start_date]
    columns:
      - name: coach_team_stint_sk
        description: "Identity key for one spell in charge: a surrogate built from the coach, the team and the start date, so a coach returning to a club later in their career gets a second row rather than overwriting the first."
        tests: [not_null, unique]
      - name: coach_sk
        description: "{{ doc('coach_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_coach')
              field: coach_sk
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: start_date
        description: "The date the coach's spell at this club began, as the provider's career record gives it. NULL where the feed omits it."
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
      - name: coach_api_id
        description: "{{ doc('coach_api_id') }}"
      - name: team_name
      - name: end_date
        description: "The date the coach's spell at this club ended. NULL for a spell the provider still shows as current - and also where the feed simply omits the date, so a NULL is not proof the coach is still in post."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
