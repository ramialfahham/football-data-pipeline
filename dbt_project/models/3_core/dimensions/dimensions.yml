version: 2

models:
  - name: dim_team
    description: "Canonical team dimension across source systems and leagues."
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: league_code
        tests: [not_null]
      - name: normalized_team_key
        tests: [not_null]
      - name: team_name
        tests: [not_null]

  - name: dim_player
    description: "Player dimension from API-Football player payloads."
    columns:
      - name: player_id
        tests: [not_null, unique]
      - name: league_code
        tests: [not_null]
      - name: player_source_id
        tests: [not_null]
      - name: player_name
        tests: [not_null]

  - name: dim_league
    description: "League reference dimension for target competitions."
    columns:
      - name: league_code
        tests: [not_null, unique]
      - name: league_name
        tests: [not_null]
      - name: country
        tests: [not_null]

  - name: dim_season
    description: "Season dimension by league, combining historical and upcoming season signals."
    columns:
      - name: season_id
        tests: [not_null, unique]
      - name: league_code
        tests: [not_null]
      - name: season_code
        tests: [not_null]

  - name: dim_date
    description: "Calendar date dimension for historical and near-future football analysis."
    columns:
      - name: date_id
        tests: [not_null, unique]
      - name: date_day
        tests: [not_null]
