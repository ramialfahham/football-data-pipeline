version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_team_season_insights
    description: >
      Latest-season team insights per league (full finished-leg window, same metric depth as matchday
      form). Grain: one row per team in max(season_api_year) for each league_code. Use for off-season
      consumption and before matchday 1 when mart_matchday_insights has no upcoming fixtures.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - team_sk
      # finishing_efficiency is open-play conversion in [0,1] (CPO Option A); passthrough
      # from int_team_season__metrics — range-checked here as the consumer-contract guard.
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: tsi_finishing_efficiency_in_range
    columns:
      - name: team_season_sk
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: season_games_played
        tests: [not_null]
      - name: played
        description: "Finished matches from mart_team_season; null when standings rollup absent."
      - name: team_code
        description: "{{ doc('team_code') }}"
      - name: team_country
      - name: team_logo_url
      - name: wins
        description: "{{ doc('wins') }}"
      - name: draws
        description: "{{ doc('draws') }}"
      - name: losses
        description: "{{ doc('losses') }}"
      - name: goals_for
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: goal_diff
      - name: points
      - name: clean_sheets
        description: "{{ doc('clean_sheets') }}"
      - name: latest_rank
        description: "{{ doc('latest_rank') }}"
      - name: latest_form
        description: "{{ doc('latest_form') }}"
      - name: standings_group_description
        description: "{{ doc('standings_group_description') }}"
      - name: season_matchdays_used
      - name: stat_coverage_season_games
      - name: points_won_sum_season
        description: "{{ doc('points_won_sum_season__team') }}"
      - name: goals_for_sum_season
      - name: goals_against_sum_season
      - name: total_shots_sum_season
      - name: opponent_total_shots_sum_season
      - name: shots_inside_box_sum_season
      - name: shots_on_goal_sum_season
      - name: corner_kicks_sum_season
      - name: opponent_corner_kicks_sum_season
      - name: passes_accurate_sum_season
      - name: passes_total_sum_season
      - name: goalkeeper_saves_sum_season
      - name: points_capture
        description: "{{ doc('points_capture') }}"
      - name: goals_per_match
        description: "{{ doc('goals_per_match') }}"
      - name: goals_against_per_match
        description: "{{ doc('goals_against_per_match') }}"
      - name: shots_per_match
        description: "{{ doc('shots_per_match') }}"
      - name: shot_share
        description: "{{ doc('shot_share') }}"
      - name: danger_zone_ratio
        description: "{{ doc('danger_zone_ratio') }}"
      - name: shot_accuracy
        description: "{{ doc('shot_accuracy') }}"
      - name: finishing_efficiency
        description: "{{ doc('finishing_efficiency__team') }}"
      - name: pass_accuracy
        description: "{{ doc('pass_accuracy') }}"
      - name: passes_per_match
        description: "{{ doc('passes_per_match') }}"
      - name: corner_kicks_per_match
        description: "{{ doc('corner_kicks_per_match') }}"
      - name: corners_against_per_match
        description: "{{ doc('corners_against_per_match') }}"
      - name: save_ratio
        description: "{{ doc('save_ratio') }}"

  - name: mart_matchday_insights
    description: >
      Wide fixture-preview mart for pre-match comparison. Grain: one row per upcoming fixture
      (next round per league_code). Form metrics sourced from mart_team_momentum (same-layer
      ref — deliberate presentation pivot; see layering.md). Cross-competition and cross-type:
      covers all active competitions without per-league hardcoding. Slice by league_code at
      export or in the app.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "consumer", "pre_match"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
      - dbt_utils.expression_is_true:
          expression: "length(trim(home_team_name)) > 0"
      - dbt_utils.expression_is_true:
          expression: "length(trim(away_team_name)) > 0"
      # Ratio bounds [0,1]. Formula/coverage consistency is guarded upstream in
      # mart_team_momentum; this mart only renames those columns, so range checks
      # are the consumer-contract guard here.
      - dbt_utils.expression_is_true:
          expression: "home_shot_accuracy_recent is null or (home_shot_accuracy_recent between 0 and 1)"
          name: mmi_home_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "away_shot_accuracy_recent is null or (away_shot_accuracy_recent between 0 and 1)"
          name: mmi_away_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "home_danger_zone_ratio_recent is null or (home_danger_zone_ratio_recent between 0 and 1)"
          name: mmi_home_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "away_danger_zone_ratio_recent is null or (away_danger_zone_ratio_recent between 0 and 1)"
          name: mmi_away_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "home_finishing_efficiency_recent is null or (home_finishing_efficiency_recent between 0 and 1)"
          name: mmi_home_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "away_finishing_efficiency_recent is null or (away_finishing_efficiency_recent between 0 and 1)"
          name: mmi_away_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "home_pass_accuracy_recent is null or (home_pass_accuracy_recent between 0 and 1)"
          name: mmi_home_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "away_pass_accuracy_recent is null or (away_pass_accuracy_recent between 0 and 1)"
          name: mmi_away_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "home_save_ratio_recent is null or (home_save_ratio_recent between 0 and 1)"
          name: mmi_home_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "away_save_ratio_recent is null or (away_save_ratio_recent between 0 and 1)"
          name: mmi_away_save_ratio_in_range
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }} This model's grain: one row per upcoming fixture in the next round per league."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: fixture_api_id
        description: "API fixture id for UI linking."
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: fixture_date
        description: "{{ doc('fixture_date') }}"
        tests: [not_null]
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
        tests: [not_null]
      - name: round_name
        description: "API round name for the upcoming matchday (e.g. Regular Season - 31)."
      - name: upcoming_round_order
        description: "Trailing integer parsed from round_name for ordering (null if not parseable)."
      - name: upcoming_matchday_fixture_count
        description: "Number of fixtures in this upcoming round (same round_name, league, season)."
        tests: [not_null]
      - name: home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: home_team_name
        tests: [not_null]
      - name: home_team_logo_url
        description: "Home team crest URL from dim_team (API-Football); nullable."
      - name: away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_name
        tests: [not_null]
      - name: away_team_logo_url
        description: "Away team crest URL from dim_team (API-Football); nullable."
      - name: league_name
        description: "Human-readable league name from dim_league."
      - name: home_league_rank
        description: "Home team's rank in its own competition+season table (mart_standings). Null for knockout rounds and for overlapping-table leagues (team in >1 section that season), or before standings exist."
      - name: away_league_rank
        description: "Away team's rank in its own competition+season table (mart_standings). Null for knockout rounds and for overlapping-table leagues (team in >1 section that season), or before standings exist."
      - name: home_form_games_played
        description: "Home: finished matches in the W1 form window (= games_in_window; last-5 normally, cumulative for tournament fixtures). 0 when none; never null."
        tests: [not_null]
      - name: away_form_games_played
        description: "Away: finished matches in the W1 form window (last-5 normally, cumulative for tournament fixtures). 0 when none; never null."
        tests: [not_null]
      - name: home_points_won_sum_form
        description: "Home: league points (3/1/0) over the form window. UI shows points captured as pts/(3*games)."
      - name: away_points_won_sum_form
        description: "Away: league points over the form window."
      - name: home_form_from_qualifiers
        description: >
          True when the home side's recent-form window is the qualifier window — the team's opener
          in a tournament, where the form shown is its qualifying matches rather than matches in
          the tournament itself. Never NULL; false where it does not apply.
        tests: [not_null]
      - name: away_form_from_qualifiers
        description: >
          Away: true when the side's recent-form window is the qualifier window. Never NULL.
        tests: [not_null]
      - name: home_goals_per_match_recent
        description: "Home: goals scored per game (scoreline window)."
      - name: away_goals_per_match_recent
        description: "Away: goals scored per game."
      - name: home_goals_against_per_match_recent
        description: "Home: goals conceded per game."
      - name: away_goals_against_per_match_recent
        description: "Away: goals conceded per game."
      - name: home_shots_per_match_recent
        description: "Home: total shots per game with team stats."
      - name: away_shots_per_match_recent
        description: "Away: total shots per game with team stats."
      - name: home_shot_accuracy_recent
        description: "Home: shots on target / total shots."
      - name: away_shot_accuracy_recent
        description: "Away: shots on target / total shots."
      - name: home_danger_zone_ratio_recent
        description: "Home: shots inside box / total shots."
      - name: away_danger_zone_ratio_recent
        description: "Away: shots inside box / total shots."
      - name: home_finishing_efficiency_recent
        description: >
          Home: open-play goal conversion — open-play goals (goals minus penalties minus own
          goals) over shots on goal, across a fully shot-covered window. Range 0 to 1.
      - name: away_finishing_efficiency_recent
        description: "Away: open-play goal conversion (open-play goals / shots on goal, in [0, 1])."
      - name: home_pass_accuracy_recent
        description: "Home: accurate passes / total passes."
      - name: away_pass_accuracy_recent
        description: "Away: accurate passes / total passes."
      - name: home_passes_per_match_recent
        description: "Home: total passes per game with team stats."
      - name: away_passes_per_match_recent
        description: "Away: total passes per game with team stats."
      - name: home_corner_kicks_per_match_recent
        description: "Home: corners won per game with team stats."
      - name: away_corner_kicks_per_match_recent
        description: "Away: corners won per game with team stats."
      - name: home_corners_against_per_match_recent
        description: "Home: corners conceded per game with opponent stats."
      - name: away_corners_against_per_match_recent
        description: "Away: corners conceded per game with opponent stats."
      - name: home_save_ratio_recent
        description: "Home: saves / (saves + goals conceded in save-covered games); self-bounded."
      - name: away_save_ratio_recent
        description: "Away: save ratio over the form window."

