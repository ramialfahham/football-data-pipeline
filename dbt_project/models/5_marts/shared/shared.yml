version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_momentum__team
    description: >
      W1 last-5 momentum mart — team. One row per upcoming fixture side. Computes all
      final team performance metrics from int_momentum__team raw sums. All ratios and
      per-match rates live here; none in the builder. league_rank is excluded — it comes
      from the standings surface (#322). Player-derived metrics (key_passes_per_match
      through dribbles_success_pct) are NULL when no player stats exist for the window.
      Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["last_5"]
      - name: games_in_window
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_momentum__player
    description: >
      W1 last-5 momentum mart — player. One row per player per upcoming fixture side.
      Raw counts (goals, assists, cards, …) are passed through directly from the builder.
      Ratios (save_pct, dribbles_success_pct, pass_accuracy_pct, duels_won_pct) are
      computed here via safe_divide. save_pct is only meaningful for goalkeepers
      (position_code = 'G'). Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["last_5"]
      - name: games_in_window
        tests: [not_null]
      - name: position_code
        description: "Player position code (e.g. G, D, M, F). Used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_team_season
    description: "Per-team, per-season rollup. Grain: (team_sk, season_sk). Aggregates are over finished matches only (status_short in FT, AET, PEN). latest_rank, latest_form, and standings_group_description come from fct_standings (null when absent). Interpret latest_rank together with standings_group_description for multi-group competitions."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = played"
    columns:
      - name: team_season_sk
        description: "Surrogate key from (team_sk, season_sk)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: team_code
      - name: team_country
      - name: team_logo_url
      - name: played
        description: "Count of finished matches this team took part in during the season."
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]
      - name: goals_for
        tests: [not_null]
      - name: goals_against
        tests: [not_null]
      - name: goal_diff
        tests: [not_null]
      - name: points
        description: "3 points per win, 1 per draw."
        tests: [not_null]
      - name: clean_sheets
        tests: [not_null]
      - name: latest_rank
        description: "Rank from fct_standings for the team's standings row (after deduping multiple fct rows per team-season). Not unique across teams in the same league-season: qualifiers and tournaments reuse rank numbers across parallel groups or phases, and the API may repeat the same group_description label for different groups."
      - name: latest_form
        description: "Recent-form string from fct_standings (e.g. WDLWW). Null when standings are absent for that season."
      - name: standings_group_description
        description: "API standings row description (e.g. group or stage label) from the same fct_standings row as latest_rank. Null when standings are absent. The provider may reuse the same label across different physical groups."

  - name: mart_player_season
    description: "Per-player, per-season rollup. Grain: (player_sk, season_sk). Aggregates come from fct_fixture_player_stats joined to fct_fixture filtered to finished matches. A player who transfers mid-season produces one row per season; per-fixture team attribution lives in the core fact."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "starts + substitute_appearances <= appearances"
    columns:
      - name: player_season_sk
        description: "Surrogate key from (player_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
      - name: player_first_name
      - name: player_last_name
      - name: player_nationality
      - name: player_birth_date
      - name: appearances
        description: "Fixtures the player appears on the team sheet for (any minutes, or 0-minute substitutes)."
        tests: [not_null]
      - name: starts
        description: "Fixtures where the player started (derived is_starter in core)."
      - name: substitute_appearances
        description: "Fixtures where the player was flagged as a substitute in the source payload."
      - name: minutes
        description: "Sum of minutes played."
      - name: goals
      - name: assists
      - name: shots
      - name: shots_on_target
      - name: key_passes
      - name: pass_accuracy_avg_percent
        description: "Average pass accuracy percent across fixtures (unweighted; a weighted version can be added later)."
      - name: rating_avg
        description: "Average API-Football rating across fixtures (unweighted)."
      - name: yellow_cards
      - name: red_cards

  - name: mart_top_scorers
    description: "Top scorers per (league_code, season_api_year) derived from mart_player_season. View (cheap to rebuild). Replaces the /players/topscorers endpoint. DENSE_RANK ties share a rank and no ranks are skipped; filter is scorer_rank <= 25 (inclusive of ties at rank 25)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "scorer_rank <= 25"
      - dbt_utils.expression_is_true:
          expression: "goals > 0"
    columns:
      - name: player_season_sk
        description: "FK to mart_player_season."
        tests:
          - not_null
          - relationships:
              to: ref('mart_player_season')
              field: player_season_sk
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
      - name: player_nationality
      - name: appearances
      - name: starts
      - name: minutes
      - name: goals
        tests: [not_null]
      - name: assists
      - name: shots_on_target
      - name: scorer_rank
        description: "DENSE_RANK over goals desc (ties share a rank). 1 is top."
        tests: [not_null]

  - name: mart_team_market_value
    description: >
      WC national teams with latest squad market value estimate. Grain: team_sk. Metric name:
      market_value_eur. Populated when wc_team_market_value_snapshot seed (or future ingest) has rows.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "market_value", "wc"]
    columns:
      - name: team_sk
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests:
          - not_null
          - accepted_values:
              values: ["WC"]
      - name: team_name
        tests: [not_null]
      - name: as_of_date
        description: "Snapshot date for market_value_eur; null when no estimate loaded."
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        description: "Provenance (e.g. GEMINI_RESEARCH_V1); null when no estimate loaded."

  - name: mart_matchday_player_insights
    description: >
      Player insights for upcoming fixtures, per leaderboard. Grain: (fixture_sk, team_sk,
      player_sk, leaderboard_id). One row per player per leaderboard (9 leaderboards).
      rank_for_leaderboard is 1–5 for eligible top-5 players; null for players ranked 6+ or
      ineligible (form_source_unavailable_reason set). Eligible players have
      form_source_unavailable_reason IS NULL and matches_in_window > 0.
      Export writes data/{league}/matchday_player_insights.json filtered to rank IS NOT NULL.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "consumer", "player_insights"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
            - team_sk
            - player_sk
            - leaderboard_id

      # ── leaderboard_id enum ─────────────────────────────────────────────
      - dbt_utils.expression_is_true:
          expression: >
            leaderboard_id in (
              'scorer_points', 'shots_on_target', 'dribbles', 'key_passes',
              'pass_accuracy', 'duels', 'defensive_actions', 'save_pct', 'cards'
            )
          name: leaderboard_id_valid_enum

      # ── rank bounds ──────────────────────────────────────────────────────
      - dbt_utils.expression_is_true:
          expression: "rank_for_leaderboard is null or (rank_for_leaderboard between 1 and 5)"
          name: rank_for_leaderboard_in_range

      # ── sort consistency: rank 1 has the highest sort_score per group ────
      - dbt_utils.expression_is_true:
          expression: >
            rank_for_leaderboard is null
            or rank_for_leaderboard = 1
            or sort_score <= (
              select max(s.sort_score)
              from {{ ref('mart_matchday_player_insights') }} s
              where s.fixture_sk = mart_matchday_player_insights.fixture_sk
                and s.team_sk = mart_matchday_player_insights.team_sk
                and s.leaderboard_id = mart_matchday_player_insights.leaderboard_id
                and s.rank_for_leaderboard = mart_matchday_player_insights.rank_for_leaderboard - 1
            )
          name: rank_sort_score_descending
          config:
            severity: warn

      # ── ratio bounds [0, 1] when non-null ────────────────────────────────
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: save_pct_in_range

      # ── formula consistency ──────────────────────────────────────────────
      - dbt_utils.expression_is_true:
          expression: "passes_accurate is null or passes_total is null or passes_accurate <= passes_total"
          name: passes_accurate_le_total
      - dbt_utils.expression_is_true:
          expression: "dribbles_success is null or dribbles_attempts is null or dribbles_success <= dribbles_attempts"
          name: dribbles_success_le_attempts
      - dbt_utils.expression_is_true:
          expression: "duels_won is null or duels_total is null or duels_won <= duels_total"
          name: duels_won_le_total
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (goals_saves is not null and goals_conceded is not null and goals_saves + goals_conceded > 0)"
          name: save_pct_has_valid_denominator

      # ── source transparency consistency ─────────────────────────────────
      - dbt_utils.expression_is_true:
          expression: "form_source_unavailable_reason is null or goals is null"
          name: atoms_null_when_source_unavailable
      - dbt_utils.expression_is_true:
          expression: "form_window_kind is not null"
          name: form_window_kind_not_null

    columns:
      - name: fixture_sk
        description: "FK to fct_fixture."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: fixture_api_id
        description: "API fixture ID for UI linking."
        tests: [not_null]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_api_id
        description: "API team ID for UI logo lookup."
        tests: [not_null]
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: player_api_id
        description: "API player ID for UI."
        tests: [not_null]
      - name: player_name
        description: "Denormalized player name."
        tests: [not_null]
      - name: player_position_code
        description: "Most recently seen position code; informational only."
      - name: league_code
        description: "The fixture's competition code."
        tests: [not_null]
      - name: leaderboard_id
        description: "One of 9 leaderboard identifiers."
        tests: [not_null]
      - name: rank_for_leaderboard
        description: "1–5 for top-5 eligible players; null if ranked 6+ or ineligible."
      - name: sort_score
        description: "Value the rank is derived from; null for ineligible players."
      - name: form_source_league_code
        description: "Competition the form window was drawn from."
        tests: [not_null]
      - name: form_window_kind
        description: "Enum: domestic_last_5, domestic_prev_season_fallback, wc_pre_via_domestic_full_season, wc_tournament_cumulative."
        tests: [not_null]
      - name: form_source_unavailable_reason
        description: "Null when data is available; league_not_covered, no_appearances_in_window, or data_unavailable otherwise."
      - name: matches_in_window
        description: "Number of matches in the form window."
        tests: [not_null]
      - name: minutes_played_window
        description: "Total minutes played in the form window. Tie-break for ranking."
        tests: [not_null]
      - name: goals
      - name: assists
      - name: shots_on
      - name: dribbles_success
      - name: dribbles_attempts
      - name: dribbles_success_pct
        description: "Null when dribbles_attempts = 0."
      - name: passes_key
      - name: passes_total
      - name: passes_accurate
        description: "Derived: sum(floor(passes_total * passes_accuracy_percent / 100)) per fixture."
      - name: pass_accuracy_pct
        description: "Null when passes_total = 0."
      - name: duels_total
      - name: duels_won
      - name: duels_won_pct
        description: "Null when duels_total = 0."
      - name: tackles
      - name: interceptions
      - name: blocks
      - name: goals_saves
      - name: goals_conceded
      - name: save_pct
        description: "Null when goals_saves + goals_conceded = 0."
      - name: cards_yellow
      - name: cards_red
