version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_momentum__team
    description: >
      W1 last-5 momentum mart — team. One row per upcoming fixture side. Computes all
      final team performance metrics from int_momentum__team raw sums. All ratios and
      per-match rates live here; none in the builder. league_rank is excluded — it comes
      from the standings surface (#322). Player-derived metrics (key_passes_per_match
      through dribbles_success_pct) are NULL when no player stats exist for the window.
      Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      # Ratio bounds [0,1] — guards the same-window contract at the source.
      # A value > 1 means numerator and denominator were computed over different
      # game sets (a coverage-window bug), so these must stay strict.
      - dbt_utils.expression_is_true:
          expression: "shot_accuracy is null or (shot_accuracy between 0 and 1)"
          name: momentum_team_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "danger_zone_ratio is null or (danger_zone_ratio between 0 and 1)"
          name: momentum_team_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: momentum_team_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy is null or (pass_accuracy between 0 and 1)"
          name: momentum_team_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "save_ratio is null or (save_ratio between 0 and 1)"
          name: momentum_team_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: momentum_team_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: momentum_team_dribbles_success_pct_in_range
      # clean sheets are scoreline-based: always present, bounded by the window
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_in_window"
          name: momentum_team_clean_sheets_in_range
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18).
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        tests: [not_null]
      - name: games_with_team_stats
        description: "Window legs with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_momentum__player
    description: >
      W1 last-5 momentum mart — player. One row per player per upcoming fixture side.
      Raw counts (goals, assists, cards, …) are passed through directly from the builder.
      Ratios (save_pct, dribbles_success_pct, pass_accuracy_pct, duels_won_pct) are
      computed here via safe_divide. save_pct is only meaningful for goalkeepers
      (position_code = 'G'). Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      # top_player_rank (GAP-19.2): strict per-side pick order, starts at 1 and is
      # unique within each (upcoming_fixture_sk, team_sk) side (guards upstream fan-out)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, top_player_rank]
      - dbt_utils.expression_is_true:
          expression: "top_player_rank >= 1"
          name: momentum_player_rank_positive
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["last_5"]
      - name: games_in_window
        tests: [not_null]
      - name: position_code
        description: "Player position code (e.g. G, D, M, F). Used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_momentum_window__team
    description: >
      W1 momentum-window list mart — team (#323). The drill-down behind the momentum
      metrics: the same window matches mart_momentum__team aggregates, exposed
      un-aggregated — one row per (upcoming fixture side, past match). played_fixture_sk
      is the click-through key into mart_fixture_stats__team / __player; has_team_stats
      and has_player_stats are derived from those detail marts (same-layer refs, the
      documented layering exception), so true literally means the drill-down returns
      rows. Consistency with the momentum aggregate is guarded by
      assert_momentum_window_matches_momentum. Grain: (upcoming_fixture_sk, team_sk,
      played_fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, played_fixture_sk]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, recency_rank]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key of the UPCOMING fixture — app slices by this. The past match's own competition is played_league_code."
        tests: [not_null]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18). Tournament windows are cumulative, so a side can have >5 rows.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent past match in the window."
        tests: [not_null]
      - name: played_fixture_sk
        description: "Click-through key into the per-fixture stat marts."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: opponent_team_sk
        tests: [not_null]
      - name: has_team_stats
        description: "True when mart_fixture_stats__team has rows for this played fixture + team (API shell rows with all-NULL stats count as no data)."
        tests: [not_null]
      - name: has_player_stats
        description: "True when mart_fixture_stats__player has rows for this played fixture + team. False is the common case — many competitions lack player stats."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_fixture_stats__team
    description: >
      Per-fixture team stat line (#323) — the match detail view behind the form-window
      list. Pure projection of fct_fixture_team_stats (no derived metrics) plus fixture
      metadata and team identity. Both sides of a fixture are two rows. Covers all
      finished fixtures with team stats; API shell rows (statistics block present but
      every value NULL) are excluded, so a fixture absent here has no usable stats —
      the honest "not available" state. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]

  - name: mart_fixture_stats__player
    description: >
      Per-fixture player stat lines (#323) — the player half of the match detail view.
      Pure projection of fct_fixture_player_stats (no derived metrics) plus player and
      team identity. A fixture with no rows here has no player stats — the COMMON case
      (many competitions lack statistics_players), rendered honestly by the app as
      "player stats not available". Grain: (fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk, player_sk]
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]

  - name: mart_team_profile
    description: >
      Team profile (#324). One row per (team, competition-season): identity + record +
      rank/form (composed from dim_team and mart_team_season) + full-season metric rates
      (int_team_season__full_season_metrics) + two signature differentiators and a streaks
      layer. Deserved-vs-actual surfaces shot_share_season and points_capture_season with a
      transparent performance_vs_results_gap (no composite score). Year-over-year columns
      (this season vs last, games-played-aligned) come from int_team_profile__yoy and are
      domestic-league only — NULL elsewhere and where the prior season is not ingested.
      Streaks come from int_team_profile__streaks. Grain: (team_sk, season_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "shot_share_season is null or (shot_share_season between 0 and 1)"
          name: team_profile_shot_share_in_range
      - dbt_utils.expression_is_true:
          expression: "points_capture_season is null or (points_capture_season between 0 and 1)"
          name: team_profile_points_capture_in_range
      - dbt_utils.expression_is_true:
          expression: "performance_vs_results_gap is null or (performance_vs_results_gap between -1 and 1)"
          name: team_profile_perf_gap_in_range
      # GAP-13 season variant of the duel win rate — same-window ratio bound
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct_season is null or (duels_won_pct_season between 0 and 1)"
          name: team_profile_duels_won_pct_season_in_range
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: competition_type
        description: "From the registry; YoY columns are populated only for domestic_league."
      - name: performance_vs_results_gap
        description: "shot_share_season - points_capture_season. Positive = dominates play more than results reward; both inputs are real [0,1] shares (transparent, not a composite score)."
      - name: points_delta_yoy
        description: "This season minus last season, points through the same games played. Domestic only; NULL when no prior season."

  - name: mart_season_record__team
    description: >
      W2 season-record mart — team. One row per upcoming fixture side: the team's
      cumulative record in the fixture's own competition this season (shown beside W1
      momentum). Falls back to the same competition's previous season before the team has
      played (window_type='prev_season'). Same metric_ids/formulas as mart_momentum__team;
      same-window coverage rule. Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "shot_accuracy is null or (shot_accuracy between 0 and 1)"
          name: std_team_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "danger_zone_ratio is null or (danger_zone_ratio between 0 and 1)"
          name: std_team_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: std_team_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy is null or (pass_accuracy between 0 and 1)"
          name: std_team_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "save_ratio is null or (save_ratio between 0 and 1)"
          name: std_team_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: std_team_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: std_team_dribbles_success_pct_in_range
      # W/D/L counts (GAP-10): must reconcile with games and points exactly
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = games_played"
          name: std_team_wdl_sums_to_games
      - dbt_utils.expression_is_true:
          expression: "3 * wins + draws = points_won"
          name: std_team_points_match_wdl
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_played"
          name: std_team_clean_sheets_in_range
    columns:
      - name: upcoming_fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: season_api_year
        description: "The season the W2 value is drawn from (current, or previous when window_type='prev_season')."
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date", "prev_season"]
      - name: games_played
        description: "Cumulative matches in the season-to-date window."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_season_record__player
    description: >
      W2 season-record mart — player. One row per player per upcoming fixture side: the
      player's cumulative record in the fixture's own competition this season (complement to
      mart_momentum__player). Previous-season fallback before the team has played. Raw counts
      passed through; ratios via safe_divide. Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: std_player_save_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: std_player_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: std_player_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: std_player_dribbles_success_pct_in_range
    columns:
      - name: upcoming_fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date", "prev_season"]
      - name: position_code
        description: "Player position code; used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_standings
    description: >
      Generic standings table for every competition that has standings. Job 1: the
      competition's own table (league table for domestic_league; group tables for group
      stages — one section per group_name). Job 2: a club's domestic-league standing as
      fixture context — filter to competition_type = 'domestic_league'. Rank, points,
      form, W/D/L only (no zones). Grain: (league_code, season_api_year, group_name, team_sk).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "standings"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - group_name
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "standing_rank >= 1"
          name: mart_standings_rank_positive
      - dbt_utils.expression_is_true:
          expression: "played is null or played = wins + draws + losses"
          name: mart_standings_played_equals_results
    columns:
      - name: standing_sk
        description: "FK to fct_standings; surrogate from (league_code, season, team, group_name)."
        tests:
          - not_null
          - relationships:
              to: ref('fct_standings')
              field: standing_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a competition's table."
        tests: [not_null]
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        tests: [not_null]
      - name: group_name
        description: "Standings section: league name (single-table), group ('Group A'), or phase. Distinguishes group tables and split-season sections."
      - name: competition_type
        description: "From competition_registry + competition_types seeds."
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "Team crest URL from dim_team; nullable."
      - name: standing_rank
        description: "Table position within the section (1 = top)."
        tests: [not_null]
      - name: points
        description: "Accumulated points in the section."
      - name: form
        description: "Recent results string from the API (e.g. WWDLW)."
      - name: group_description
        description: "API zone annotation ($.description); display context only, not a key."

  - name: mart_team_season
    description: "Per-team, per-season rollup. Grain: (team_sk, season_sk). Aggregates are over finished matches only (status_short in FT, AET, PEN). latest_rank, latest_form, and standings_group_description come from fct_standings (null when absent). Interpret latest_rank together with standings_group_description for multi-group competitions."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = played"
    columns:
      - name: team_season_sk
        description: "Surrogate key from (team_sk, season_sk)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: team_code
      - name: team_country
      - name: team_logo_url
      - name: played
        description: "Count of finished matches this team took part in during the season."
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]
      - name: goals_for
        tests: [not_null]
      - name: goals_against
        tests: [not_null]
      - name: goal_diff
        tests: [not_null]
      - name: points
        description: "3 points per win, 1 per draw."
        tests: [not_null]
      - name: clean_sheets
        tests: [not_null]
      - name: latest_rank
        description: "Rank from fct_standings for the team's standings row (after deduping multiple fct rows per team-season). Not unique across teams in the same league-season: qualifiers and tournaments reuse rank numbers across parallel groups or phases, and the API may repeat the same group_description label for different groups."
      - name: latest_form
        description: "Recent-form string from fct_standings (e.g. WDLWW). Null when standings are absent for that season."
      - name: standings_group_description
        description: "API standings row description (e.g. group or stage label) from the same fct_standings row as latest_rank. Null when standings are absent. The provider may reuse the same label across different physical groups."

  - name: mart_player_profile
    description: >
      Player profile (#325). One row per (player, competition-season): the player's
      season profile, composed with dim_player identity and modal position. Metric
      governance is catalogue-only (v1): every metric is a metric_catalogue row (#327)
      computed by its catalogue formula — counts plus the four catalogued ratios
      (pass_accuracy_pct, duels_won_pct, dribbles_success_pct, save_pct). No invented
      metrics (no per-90, no goal_conversion, no player shot_accuracy) — those await a
      CPO-approved catalogue extension. Beyond catalogue metrics, only raw descriptors
      are carried (appearances/starts/minutes, identity, position). pass_accuracy_pct
      uses the catalogue's derived passes_accurate (per-fixture round then sum). save_pct
      is only meaningful for goalkeepers (position_code = 'G'); saves and
      shots_on_target_faced (GAP-12) carry its numerator/denominator for the GK
      full-triple display. Grain: (player_sk, season_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: player_profile_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: player_profile_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: player_profile_dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: player_profile_save_pct_in_range
      # GK full-triple (GAP-12): saves can never exceed shots on target faced
      - dbt_utils.expression_is_true:
          expression: "saves <= shots_on_target_faced"
          name: player_profile_saves_lte_faced
    columns:
      - name: player_season_sk
        tests: [unique, not_null]
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: appearances
        tests: [not_null]
      - name: position_code
        description: "Most-frequent position that season (role badge). NULL when no fixture carried a position."
      - name: player_birth_place
        description: "Birth place (city), from dim_player bio."
      - name: player_birth_country
        description: "Birth country, from dim_player bio."
      - name: player_height
        description: "Height (e.g. '180 cm'), from dim_player bio."
      - name: player_weight
        description: "Weight (e.g. '75 kg'), from dim_player bio."
      - name: player_position
        description: "General/listed position from bio (distinct from position_code, the season modal)."

  - name: mart_player_match_log
    description: >
      Player match log (#325). One row per (player, finished fixture): the player's stat
      line plus match context (opponent, score, result from the player's team's
      perspective). Player-history-shaped (one player over time), distinct from the
      fixture-detail-shaped mart_fixture_stats__player (#323). Grain: (player_sk,
      fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, fixture_sk]
    columns:
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: is_home
        tests: [not_null]

  - name: mart_fixture_standing_context
    description: >
      Phase-relevant standings context per upcoming-fixture side (epic #361). The single
      source of "this team's table position going into this fixture", shared by the MVP's
      mart_matchday_insights and the v2 fixtures export. league_rank (and the standing
      fields) are NULL for knockout rounds (is_knockout_round) and for overlapping-table
      leagues (a team with >1 section that season); group_name is kept regardless.
      Covers all upcoming fixtures. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "league_rank is null or league_rank >= 1"
          name: fixture_standing_context_rank_positive
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: is_knockout
        tests: [not_null]

  - name: mart_head_to_head
    description: >
      Head-to-head (#375). All-time past meetings between two teams, directed: one row
      per (team_sk, opponent_team_sk) = that team's record vs that opponent, across all
      competitions. Feeds the fixture-page H2H context. Built from int_legs__team_match
      (core -> intermediate -> mart, not mart-from-mart). Raw record facts only — no
      derived ratios (the H2H record is fact, not a catalogue metric). recent_meetings is
      the most-recent ≤10 meetings (date, competition, score, result). A pair that never
      met has no row. Grain: (team_sk, opponent_team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, opponent_team_sk]
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = total_meetings"
          name: head_to_head_record_sums_to_total
      - dbt_utils.expression_is_true:
          expression: "wins_last5 + draws_last5 + losses_last5 = meetings_last5"
          name: head_to_head_last5_sums_to_meetings_last5
      - dbt_utils.expression_is_true:
          expression: "meetings_last5 = least(total_meetings, 5)"
          name: head_to_head_last5_capped_at_5
      # pair_key (GAP-19.4): the canonical pair identity is always present, and
      # is_canonical marks exactly the lower-id direction (derivation consistency)
      - dbt_utils.expression_is_true:
          expression: "pair_key is not null"
          name: head_to_head_pair_key_not_null
      - dbt_utils.expression_is_true:
          expression: "is_canonical = (team_sk < opponent_team_sk)"
          name: head_to_head_is_canonical_consistent
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: total_meetings
        tests: [not_null]
      - name: last_meeting_result
        tests:
          - accepted_values:
              values: ["W", "D", "L"]

  - name: mart_leaderboards
    description: >
      Per-board player leaderboards (the Leaderboards block; content_architecture §3). LONG — one row
      per (player, board): the player's rank on that board within its competition-season. Generalises
      the retired mart_top_scorers to 9 COUNT boards (goals, scorer_points, shots_on_target,
      dribbles_success, passes_total, passes_key, duels_won, defensive_actions, cards_total).
      Season-to-date, composed from int_player_season__metrics + dim_player. rank = DENSE_RANK over the
      board's metric desc within (league_code, season_api_year): ties share a rank, top-10 inclusive of
      ties; only positive-value players are ranked. The 5 rate boards + their qualification floor are
      deferred (#506). View. Grain: (player_sk, season_sk, metric_key).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "leaderboards"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and 10"
          name: mart_leaderboards_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "sort_value > 0"
          name: mart_leaderboards_sort_value_positive
    columns:
      - name: player_leaderboard_sk
        description: "Surrogate from (player_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: metric_key
        description: "The board — a metric_catalogue metric_id (the 9 count boards)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals", "scorer_points", "shots_on_target", "dribbles_success", "passes_total", "passes_key", "duels_won", "defensive_actions", "cards_total"]
      - name: rank
        description: "DENSE_RANK over the board's metric desc (ties share a rank). 1 is top; cut at 10."
        tests: [not_null]
      - name: sort_value
        description: "The board's own value the rank is computed from (always > 0)."
        tests: [not_null]
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a competition's boards."
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."
      # Denormalised season-to-date display atoms (from int_player_season__metrics): the per-board
      # breakdown values the UI shows alongside sort_value (the board's own ranked metric).
      - name: appearances
      - name: minutes
      - name: goals
      - name: assists
      - name: shots_on_target
      - name: dribbles_attempts
      - name: dribbles_success
      - name: passes_total
      - name: passes_key
      - name: duels_total
      - name: duels_won
      - name: tackles_total
      - name: tackles_interceptions
      - name: tackles_blocks
      - name: cards_yellow
      - name: cards_red
      - name: scorer_points
        description: "goals + assists (the 'scorer_points' board's value)."
      - name: defensive_actions
        description: "tackles + interceptions + blocks (the 'defensive_actions' board's value)."
      - name: cards_total
        description: "cards_yellow + cards_red (the 'cards_total' board's value)."

  - name: mart_team_market_value
    description: >
      WC national teams with latest squad market value estimate. Grain: team_sk. Metric name:
      market_value_eur. Populated when wc_team_market_value_snapshot seed (or future ingest) has rows.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "market_value", "wc"]
    columns:
      - name: team_sk
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests:
          - not_null
          - accepted_values:
              values: ["WC"]
      - name: team_name
        tests: [not_null]
      - name: as_of_date
        description: "Snapshot date for market_value_eur; null when no estimate loaded."
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        description: "Provenance (e.g. GEMINI_RESEARCH_V1); null when no estimate loaded."

  - name: mart_team_fixtures
    description: >
      Team fixtures (GAP-15). One row per (team, fixture), team perspective — the
      team-profile "next fixture + recent results" surface. Spine = fct_fixture
      unpivoted to two team rows per fixture; opponent identity from dim_team;
      finished result (goals_for/against, W/D/L) reused from int_legs__team_match
      (not re-derived). Rank columns make consumption pure selection: upcoming_rank
      = 1 is the next fixture, recency_rank <= 5 the last five results. Live /
      postponed / cancelled rows carry null ranks. No slug (GAP-19 item 5, separate
      PR). Grain: (team_sk, fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, fixture_sk]
      # a result-leg row always carries its perspective result, and the ranked
      # recency population is exactly the result-leg rows
      - dbt_utils.expression_is_true:
          expression: "not has_result or result is not null"
          name: team_fixtures_result_present
      - dbt_utils.expression_is_true:
          expression: "recency_rank is null or result is not null"
          name: team_fixtures_recency_has_result
      - dbt_utils.expression_is_true:
          expression: "(upcoming_rank is null or upcoming_rank >= 1) and (recency_rank is null or recency_rank >= 1)"
          name: team_fixtures_ranks_positive
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "Partition key — the app slices by this."
        tests: [not_null]
      - name: opponent_team_sk
        description: "The other side's team_sk; the row carries the team's perspective of the fixture."
      - name: result
        description: "W/D/L from int_legs__team_match for finished rows; null otherwise."
        tests:
          - accepted_values:
              values: ["W", "D", "L"]

  - name: mart_roster
    description: >
      Identity-only club squad list (the Squad block; content_architecture §3). One row per
      rostered player per (club team, competition-season), from dim_player_team_season_mapping
      joined to dim_player. Scoped to club competitions (entity_type = 'club', via
      competition_registry + competition_types — never a dim_team flag). Identity only: name,
      listed position, nationality, birth_date, photo; NO per-club season stats (the deferred
      per-club grain, #480 §8.3). Age is derived at render from player_birth_date (a stored age
      would be non-deterministic). dim_player is LEFT-joined so a membership with no player
      entity surfaces via the relationships test, not a silent drop. View. league_code is the
      partition key; season_sk is nullable (roster season with no competition-season row).
      Grain: (team_sk, league_code, season_api_year, player_sk).
    config:
      tags: ["marts", "football", "roster"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, player_sk]
    columns:
      - name: player_team_season_sk
        description: "Surrogate carried from dim_player_team_season_mapping (player, team, league_code, season)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team (the club)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a club's squad for a competition-season."
        tests: [not_null]
      - name: season_api_year
        description: "The roster season; always present (anchors the grain even when season_sk is null)."
        tests: [not_null]
      - name: season_sk
        description: "FK to dim_competition_season; nullable (roster season with no competition-season row)."
      - name: competition_type
        description: "From competition_registry; the mart is filtered to club types."
      - name: entity_type
        description: "Always 'club' — the mart is club-scoped via competition_types."
        tests:
          - not_null
          - accepted_values:
              values: ["club"]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player (general position, not a per-season modal)."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_birth_date
        description: "Birth date from dim_player bio; age is computed at render."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."

