  - name: mart_fixture_standing_context
    description: >
      Each side of an upcoming fixture with the table position it goes into that fixture on. The
      single source of that fact. Covers every upcoming fixture. Grain: (fixture_sk, team_sk).

      league_rank and the other standing fields are NULL for a knockout round, and for a team
      sitting in more than one table section that season, where no single position would be the
      right one. group_name is kept either way.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "league_rank is null or league_rank >= 1"
          name: fixture_standing_context_rank_positive
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: is_knockout
        description: "True when the fixture's round looks like a knockout tie rather than table play. It is a heuristic over the provider's free-text round label, matching the common shapes (round of 16, quarter-final, final, play-off), and it is false when the label is missing or unrecognised - so a false is not a promise the round has a table."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: group_name
        description: "Which standings section (league table, group or split-season phase) the team's table position is drawn from, from mart_standings.group_name. Kept when the fixture itself is a knockout tie, since it still says which group the team came from; NULL when the team has no single resolvable standings row for that competition-season (no row, or more than one section)."
      - name: league_rank
        description: "{{ doc('league_rank') }}"
      - name: standing_points
        description: "The team's points in its standings section going into this fixture, from mart_standings.points. NULL for a knockout round, and NULL when the team sits in more than one standings section that competition-season, so no single table position applies."
      - name: standing_played
        description: "The team's matches played in its standings section going into this fixture, from mart_standings.played — the provider's own standings count, not a fixture count. NULL for a knockout round, and NULL when the team sits in more than one standings section that competition-season."
      - name: standing_goals_diff
        description: "The team's goal difference in its standings section going into this fixture, from mart_standings.goals_diff. NULL for a knockout round, and NULL when the team sits in more than one standings section that competition-season."
      - name: standing_form
        description: "The team's recent-results string (for example WWDLW) in its standings section going into this fixture, from mart_standings.form — the provider's own field, not derived from fixtures here. NULL for a knockout round, and NULL when the team sits in more than one standings section that competition-season."

  - name: mart_competition_season_summary
    description: >
      One row per competition-season with the season's headline numbers: matches and goals,
      goals per match, how results split between home wins, away wins and draws, the match with
      the biggest margin, the match with the most goals, and the longest unbeaten and winless
      runs of the season with every team that holds them. Grain: (league_code, season_api_year).

      Built over the finished legs of int_legs__team_match, so every count reconciles with the
      team-season rollups. Tallies of match results at competition grain, not catalogue metrics:
      no team or player is measured here. A tie on the biggest margin goes to the match with more
      goals, a tie on the most goals to the bigger margin, then the earlier kickoff. A run is the longest unbroken stretch of the season, not the current
      one. Home and away wins are null for national-team competitions, whose matches are mostly
      played at neutral venues.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "competition"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year]
      - dbt_utils.expression_is_true:
          expression: "home_wins is null or matches_played = home_wins + away_wins + drawn_matches"
          name: competition_season_summary_results_sum_to_matches
      - dbt_utils.expression_is_true:
          expression: "matches_played >= 1"
          name: competition_season_summary_has_matches
      - dbt_utils.expression_is_true:
          expression: "abs(goals_per_match_played - total_goals / matches_played) < 0.01"
          name: competition_season_summary_goals_per_match_is_goals_over_matches
      - dbt_utils.expression_is_true:
          expression: "biggest_margin_fixture_sk is null or (biggest_margin_goals_home is not null and biggest_margin_goals_away is not null and most_goals_goals_home is not null and most_goals_goals_away is not null)"
          name: competition_season_summary_referenced_fixtures_carry_their_scores
      - dbt_utils.expression_is_true:
          expression: "(longest_unbeaten_run is null) = (array_length(longest_unbeaten_team_sks) = 0) and (longest_winless_run is null) = (array_length(longest_winless_team_sks) = 0)"
          name: competition_season_summary_runs_and_holders_appear_together
      - dbt_utils.expression_is_true:
          expression: "longest_unbeaten_run is null or longest_unbeaten_run >= 2"
          name: competition_season_summary_a_run_is_two_matches_or_more
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: competition_type
        description: "{{ doc('competition_type') }}"
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: matches_played
        description: "Finished matches of the season, both scores known."
        tests: [not_null]
      - name: total_goals
        description: "Goals scored in those matches, both sides."
        tests: [not_null]
      - name: goals_per_match_played
        description: "Total goals divided by matches played, two decimals. A tally of the season, not the team metric of the same idea."
      - name: home_wins
        description: "Matches the home side won; null for national-team competitions."
      - name: away_wins
        description: "Matches the away side won; null for national-team competitions."
      - name: drawn_matches
        description: "Matches drawn."
      - name: biggest_margin_fixture_sk
        description: "The finished match with the largest goal margin; on a tie the match with more goals, then the earlier one."
        tests:
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: biggest_margin_home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: biggest_margin_away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: biggest_margin_goals_home
        description: "Home goals of that match."
      - name: biggest_margin_goals_away
        description: "Away goals of that match."
      - name: biggest_margin_round_name
        description: "The provider's round text of that match."
      - name: biggest_margin_kickoff_datetime
        description: "Kickoff of that match, UTC."
      - name: most_goals_fixture_sk
        description: "The finished match with the most goals, both sides; on a tie the match with the bigger margin, then the earlier one."
        tests:
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: most_goals_home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: most_goals_away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: most_goals_goals_home
        description: "Home goals of that match."
      - name: most_goals_goals_away
        description: "Away goals of that match."
      - name: most_goals_round_name
        description: "The provider's round text of that match."
      - name: most_goals_kickoff_datetime
        description: "Kickoff of that match, UTC."
      - name: longest_unbeaten_run
        description: "The longest stretch of matches without a loss any team had in the season; null until some team has strung two together, a run of one match being no run."
      - name: longest_unbeaten_team_sks
        description: "Every team that had a run of that length, in team_sk order."
      - name: longest_winless_run
        description: "The longest stretch of matches without a win any team had in the season; null until some team has strung two together, a run of one match being no run."
      - name: longest_winless_team_sks
        description: "Every team that had a run of that length, in team_sk order."

  - name: mart_head_to_head
    description: >
      One team's all-time record against one opponent, across every competition. Directed, so a
      pair appears twice, once from each side. Grain: (team_sk, opponent_team_sk).

      Built from int_legs__team_match. Raw record facts only, with no derived ratios — a
      head-to-head record is a fact rather than a catalogue metric. recent_meetings holds up to
      the ten most recent meetings, each with date, competition, score and result.

      A pair that has never met has no row at all.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, opponent_team_sk]
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = total_meetings"
          name: head_to_head_record_sums_to_total
      - dbt_utils.expression_is_true:
          expression: "wins_last5 + draws_last5 + losses_last5 = meetings_last5"
          name: head_to_head_last5_sums_to_meetings_last5
      - dbt_utils.expression_is_true:
          expression: "meetings_last5 = least(total_meetings, 5)"
          name: head_to_head_last5_capped_at_5
      # pair_key (GAP-19.4): the canonical pair identity is always present, and
      # is_canonical marks exactly the lower-id direction (derivation consistency)
      - dbt_utils.expression_is_true:
          expression: "pair_key is not null"
          name: head_to_head_pair_key_not_null
      - dbt_utils.expression_is_true:
          expression: "is_canonical = (team_sk < opponent_team_sk)"
          name: head_to_head_is_canonical_consistent
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: total_meetings
        description: "Count of finished meetings between this team and this opponent, across every competition, all time — the number of legs behind this row. Never NULL: a row exists only once the pair has met."
        tests: [not_null]
      - name: last_meeting_result
        description: "The result of the most recent meeting between this team and this opponent, from this team's side: W, D or L."
        tests:
          - accepted_values:
              values: ["W", "D", "L"]
      - name: wins
        description: "{{ doc('wins') }}"
      - name: draws
        description: "{{ doc('draws') }}"
      - name: losses
        description: "{{ doc('losses') }}"
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: meetings_last5
        description: "How many of the most recent five meetings between this team and this opponent are counted here: the smaller of total_meetings and 5."
      - name: wins_last5
        description: "Wins for this team over its most recent meetings_last5 meetings against this opponent."
      - name: draws_last5
        description: "Draws for this team over its most recent meetings_last5 meetings against this opponent."
      - name: losses_last5
        description: "Losses for this team over its most recent meetings_last5 meetings against this opponent."
      - name: last_meeting_at
        description: "Kick-off of the most recent meeting between this team and this opponent, UTC."
      - name: last_meeting_league_code
        description: "{{ doc('league_code') }} Here it is the competition the most recent meeting was played in."
      - name: last_meeting_goals_for
        description: "{{ doc('goals') }} Here it is this team's goals in the most recent meeting between the two."
      - name: last_meeting_goals_against
        description: "{{ doc('goals_against') }} Here it is the goals this team conceded in the most recent meeting between the two."
      - name: recent_meetings
        description: "The up to ten most recent meetings between this team and this opponent, most recent first, each carrying its kick-off, competition, score and result — enough to render a head-to-head strip without a further join. At least one element whenever the row exists, never more than ten."
      - name: recent_meetings.goals_against
        description: "{{ doc('goals_against') }} Here it is the goals this team conceded in that one past meeting, inside the recent_meetings array."
      - name: recent_meetings.goals_for
        description: "{{ doc('goals') }} Here it is this team's goals in that one past meeting, inside the recent_meetings array."
      - name: recent_meetings.kickoff_datetime
        description: "{{ doc('kickoff_datetime') }} Here it is that one past meeting's kick-off, inside the recent_meetings array."
      - name: recent_meetings.league_code
        description: "{{ doc('league_code') }} Here it is the competition that one past meeting was played in, inside the recent_meetings array."
      - name: recent_meetings.result
        description: "This team's result (W, D or L) in that one past meeting, inside the recent_meetings array."
      - name: pair_key
        description: "Order-independent identity for this pair of teams: the lower team_sk and the higher team_sk joined with a hyphen, so both directed rows of a pairing (team to opponent, opponent to team) share the same value."
      - name: is_canonical
        description: "True on exactly one of the two rows a pairing produces. Every pairing is held twice, once from each team's point of view; filter on this to count a pairing once, and ignore it when reading the record from one named team's side."

  - name: mart_leaderboards
    description: >
      One row per (player, board): where that player ranks on that board within a
      competition-season. Long-shaped — the board is a value in metric_key, not a column.
      Grain: (player_sk, season_sk, metric_key).

      Season-to-date, composed from int_player_season__metrics, dim_player and dim_team. rank is a
      DENSE_RANK over the board's metric descending within (league_code, season_api_year), so ties
      share a rank and the top 10 includes them. Only a positive value is ranked.

      Because ties share a rank, a league can hold several rank-1 players. league_leader_order is
      the tie-broken order in the same partition, so a consumer that must show one player per league
      filters on it instead of choosing between the joint leaders itself. Fewer minutes wins a tie.

      Each row also carries the club the player belonged to that competition-season, so a row
      identifies a team as well as a player. The club is null when the player has no finished
      match in that competition-season.

      RATE boards carry a qualification floor so a small sample cannot game a rate: 270 minutes, a
      position scope, 10 shots on target for finishing.

      is_current_season marks the latest season a competition has, so a consumer showing one season
      filters on a served fact instead of choosing a season itself.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "leaderboards"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and 10"
          name: mart_leaderboards_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "sort_value > 0"
          name: mart_leaderboards_sort_value_positive
      # RATE-board ratios are all bounded [0,1]. finishing_efficiency_player_pct is now open-play
      # conversion in [0,1], so it is range-checked here like the other rates.
      # Rates are null when their denominator is zero.
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_player_pct is null or (passes_accuracy_player_pct between 0 and 1)"
          name: mart_leaderboards_passes_accuracy_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_player_pct is null or (duels_won_player_pct between 0 and 1)"
          name: mart_leaderboards_duels_won_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_player_pct is null or (dribbles_success_player_pct between 0 and 1)"
          name: mart_leaderboards_dribbles_success_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "saves_player_pct is null or (saves_player_pct between 0 and 1)"
          name: mart_leaderboards_saves_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency_player_pct is null or (finishing_efficiency_player_pct between 0 and 1)"
          name: mart_leaderboards_finishing_efficiency_player_pct_in_range
    columns:
      - name: player_leaderboard_sk
        description: "Surrogate from (player_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: metric_key
        description: "The board — a metric_catalogue metric_id (11 count + 2 rate boards = 13, the competition page's Rankings tab)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_player", "assists_player", "shots_on_goal_player", "passes_player", "passes_key_player", "dribbles_attempts_player", "duels_player", "defensive_actions_player", "cards_yellow_player", "cards_red_player", "saves_player", "passes_accuracy_player_pct", "finishing_efficiency_player_pct"]
      - name: rank
        description: "DENSE_RANK over the board's metric desc (ties share a rank). 1 is top; cut at 10."
        tests: [not_null]
      - name: league_leader_order
        description: >
          The tie-broken position within (league_code, season_api_year) on this board. 1 is the
          league's leader, and exactly one row per league-board carries it. Use this and not rank
          when a consumer must show ONE player per league: rank is a DENSE_RANK, so joint leaders
          share it and a league can hold several 1s. Ties break by fewer minutes played, then by
          player_sk. Fewer minutes wins because the same tally in less time is the better
          performance; player_sk is a stable last resort and means nothing on its own.
        tests: [not_null]
      - name: board_leader_order
        description: >
          The order the league leaders appear in on this board, across every league, by the same
          rule: best value, then fewer minutes, then player_sk. league_leader_order says WHO
          represents a league; this says in what ORDER those representatives are shown, so a
          consumer orders by one served column and compares nothing itself. NULL on any row that is
          not a league leader. It is a GLOBAL position, not a position within whatever set a
          consumer shows, so filtered to a handful of leagues the values are sparse - that is
          expected, because the order is total and any subset of a total order keeps its relative
          sequence. Not partitioned by season: is_current_season is per league, so leagues shown
          side by side can sit in different season years.
      - name: sort_value
        description: "The board's own value the rank is computed from (always > 0). FLOAT64 — holds the integer counts and the 0-1 rates."
        tests: [not_null]
      - name: is_current_season
        description: >
          True on every row of a competition's latest season, false on earlier ones. It answers
          "is this the season the site currently shows for this competition", so a surface that
          displays one season filters on it rather than deciding which season to show.

          Per LEAGUE, not per player, so all rows of a league's latest season agree. Latest by
          season_api_year alone; it does not ask whether that season has started or how many
          matches have been played.
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: player_name
        description: "{{ doc('player_name') }}"
      - name: player_nationality
        description: "{{ doc('player_nationality') }}"
      - name: player_position
        description: "Listed/bio position from dim_player."
      - name: player_photo_url
        description: "{{ doc('player_photo_url') }}"
      # The club the player belonged to that competition-season, resolved upstream in
      # int_player_season__metrics as the club of his most recent finished match. All four are
      # null together when he has no finished match in that competition-season.
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_name
        description: "Denormalised from dim_team; null when the row has no club."
      - name: team_slug
        description: "{{ doc('team_slug') }}"
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }} Also NULL when the row has no club."
      # Denormalised season-to-date display atoms (from int_player_season__metrics): the per-board
      # breakdown values the UI shows alongside sort_value (the board's own ranked metric).
      - name: appearances
        description: "{{ doc('appearances__season_to_date') }}"
      - name: minutes
        description: "{{ doc('minutes__season_to_date') }}"
      - name: goals_player
        description: "{{ doc('goals_player') }}"
      - name: assists_player
        description: "{{ doc('assists_player') }}"
      - name: shots_on_goal_player
        description: "{{ doc('shots_on_goal_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: scorer_points_player
        description: "{{ doc('scorer_points_player') }}"
      - name: defensive_actions_player
        description: "{{ doc('defensive_actions_player') }}"
      - name: cards_player
        description: "{{ doc('cards_player') }}"
      # RATE-board values (#506) — the player's season rate, carried on every row as a display
      # atom; each is the ranked value of its own board. Null when the denominator is zero.
      - name: passes_accuracy_player_pct
        description: "{{ doc('passes_accuracy_player_pct') }}"
      - name: duels_won_player_pct
        description: "{{ doc('duels_won_player_pct') }}"
      - name: dribbles_success_player_pct
        description: "{{ doc('dribbles_success_player_pct') }}"
      - name: saves_player_pct
        description: "{{ doc('saves_player_pct') }}"
      - name: finishing_efficiency_player_pct
        description: "{{ doc('finishing_efficiency_player_pct') }}"

  - name: mart_team_leaderboards
    description: >
      One row per (team, board): where that team ranks on that board within a competition-season.
      The team mirror of mart_leaderboards. Long-shaped — the board is a value in metric_key, not a
      column. Grain: (team_sk, season_sk, metric_key).

      Twelve boards (the competition page's Rankings tab: goals and goals against per match, shots
      on goal for, against and difference per match, passes per match, pass accuracy, defensive
      actions per match, duels per match, duels won, yellow cards, red cards), season-to-date,
      composed from int_team_season__metrics, the metric catalogue and dim_team. rank is a
      DENSE_RANK over the board's metric within (league_code, season_api_year) in the board's
      rank_order, so ties share a rank and the top 10 includes them. rank_order is the catalogue's
      direction for the metric (asc for lower_better, fewest first), except the two card boards,
      which rank most first by ruling. A zero is not a ranking on a most-first board and is the top
      row on a fewest-first one.

      The rank is per league by design: a board is each league's leading team collected and ordered,
      never a ranking across competitions. A team ranks from its first finished game — there is
      no games floor, so early-season boards carry one-game rates by design — and the minutes and
      position floors the player boards use have no analogue. A team with no value for a metric is
      absent from that board rather than ranked on a null.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "leaderboards"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and 10"
          name: mart_team_leaderboards_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "sort_value > 0 or rank_order = 'asc'"
          name: mart_team_leaderboards_sort_value_positive_on_most_first
      - dbt_utils.expression_is_true:
          expression: "season_games_played >= 1"
          name: mart_team_leaderboards_games_gate_holds
    columns:
      - name: team_leaderboard_sk
        description: "Surrogate from (team_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: metric_key
        description: >
          The board — a metric_catalogue team metric_id (12 boards).
          accepted_values pins the set against an ADDED board; it cannot catch a REMOVED one, since
          a smaller set is still a subset. assert_mart_team_leaderboards_all_boards_present covers
          that direction.
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "passes_per_match", "passes_accuracy_pct", "defensive_actions_per_match", "duels_per_match", "duels_won_pct", "cards_yellow", "cards_red"]
      - name: rank_order
        description: >
          The direction this board ranks in: asc (fewest first, the top row holds the smallest
          value) or desc (most first). The catalogue's direction for the metric — lower_better is
          asc — except cards_yellow and cards_red, most first by ruling. A page says "fewest first"
          beside an asc board from this column and computes nothing.
        tests:
          - not_null
          - accepted_values:
              values: ["asc", "desc"]
      - name: rank
        description: "DENSE_RANK over the board's metric in its rank_order (ties share a rank). 1 is top; cut at 10."
        tests: [not_null]
      - name: sort_value
        description: "The board's own value the rank is computed from, in the metric's own unit: a per-match rate, a share in 0-1, or a season card total. Above 0 on a desc board; 0 is a valid top row on an asc board."
        tests: [not_null]
      - name: league_leader_order
        description: >
          The tie-broken position within (league_code, season_api_year) on this board. 1 is the
          league's leading team, and exactly one row per league-board-season carries it. Use this and
          not rank when a consumer must show ONE team per league: rank is a DENSE_RANK, so joint
          leaders share it and a league can hold several 1s. Ties break on team_sk, which carries no
          sporting meaning and exists only to make the order stable; there is no criterion that
          separates two teams on an equal per-match rate.
        tests: [not_null]
      - name: board_leader_order
        description: >
          The order the league leaders appear in on this board, across every league, by the same
          rule: best rate, then team_sk. league_leader_order says WHICH team represents a league;
          this says in what ORDER those representatives are shown, so a consumer orders by one served
          column and compares nothing itself. NULL on any row that is not a league leader. It is a
          GLOBAL position, not a position within whatever set a consumer shows, so filtered to a
          handful of leagues the values are sparse - expected, because the order is total and any
          subset of a total order keeps its relative sequence. Not partitioned by season:
          is_current_season is per league, so leagues shown side by side can sit in different season
          years.
      - name: is_current_season
        description: >
          True on every row of a competition's latest season, false on earlier ones. It answers
          "is this the season the site is currently showing for this competition" as a served fact,
          so a consumer filters on it instead of choosing a season itself. Per LEAGUE, not per team,
          so every row of a league agrees.
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_slug
        description: "{{ doc('team_slug') }}"
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }}"
      - name: season_games_played
        description: "Finished games behind the ranked value this competition-season. Always >= 1: a team ranks from its first finished game; there is no games floor."
        tests: [not_null]

  - name: mart_team_market_value
    description: >
      WC national teams with latest squad market value estimate. Grain: team_sk. Metric name:
      market_value_eur. Populated when wc_team_market_value_snapshot seed (or future ingest) has rows.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "market_value", "wc"]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }} Always WC here: the mart is the World Cup squad-value view."
        tests:
          - not_null
          - accepted_values:
              values: ["WC"]
      - name: team_name
        description: "{{ doc('team_name') }}"
        tests: [not_null]
      - name: as_of_date
        description: "{{ doc('as_of_date') }}"
      - name: market_value_eur
        description: "{{ doc('market_value_eur') }} Here it is the squad's total, the team's most recent snapshot."
      - name: source_code
        description: "{{ doc('source_code') }}"
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
      - name: team_country
        description: "{{ doc('team_country') }}"
      - name: prompt_version
        description: "{{ doc('prompt_version') }}"

  - name: mart_next_matchday
    description: >
      Every competition's next matchday: one row per upcoming fixture in the round of that
      competition's earliest fixture not yet started. Grain: fixture_sk.

      Upcoming means a scheduled status (NS or TBD) and a date on or after the build day, so a
      fixture left at NS in the past is excluded. Every competition with an upcoming fixture is
      present, cups and tournaments included; nothing is capped or ordered here. A postponed
      match keeps its original round name, so a rescheduled straggler can be a one-match matchday
      until it is played.

      The Home page's Next matches block reads this table whole; the page orders the competitions
      and folds rows past the third. Rebuilt nightly, so it is correct as of the morning it was
      built.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "fixtures"]
    tests:
      - dbt_utils.expression_is_true:
          expression: "status_short in ('NS', 'TBD')"
          name: next_matchday_is_scheduled
      - dbt_utils.expression_is_true:
          expression: "fixture_date >= current_date()"
          name: next_matchday_is_not_in_the_past
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: round_name
        description: "{{ doc('round_name') }} One value per competition in this table: the round that is the competition's next matchday."
        tests: [not_null]
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: fixture_date
        description: "{{ doc('fixture_date') }}"
        tests: [not_null]
      - name: status_short
        description: "{{ doc('status_short') }}"
      - name: home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: is_match_that_matters
        description: "True on at most one fixture per competition: the one of the matchday whose two teams have the lowest sum of table positions, ties to the earlier kickoff then fixture_sk. A position is a team's rank in the one standings section it belongs to that season; where either side has none (a knockout round, a split season) no fixture of that competition is flagged."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: mart_competition_fixtures
    description: >
      Every match of a competition-season, played and unplayed: one row per fixture with both
      teams named and linked, the round it belongs to, the score once played and the kick-off
      until then. Grain: fixture_sk.

      Rounds are the provider's labels, ordered within a competition-season by each round's first
      kick-off; a league round also carries its matchday number. A fixture is played when it has a
      finished leg in int_legs__team_match, the one definition of a result. The next round is the
      round of the competition-season's earliest fixture not yet started, by mart_next_matchday's
      rule, and that mart's match-that-matters flag is carried onto its fixture.

      The fixture slug is the match's permanent URL segment, built from the kick-off date and the
      two published team slugs. Rebuilt nightly, so the next-round flag is correct as of the
      morning it was built.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "fixtures"]
    tests:
      - dbt_utils.expression_is_true:
          expression: "not is_played or (goals_home is not null and goals_away is not null)"
          name: competition_fixtures_played_has_a_score
      - dbt_utils.expression_is_true:
          expression: "not is_match_that_matters or is_next_round"
          name: competition_fixtures_top_match_is_in_the_next_round
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, fixture_slug]
          name: competition_fixtures_slug_unique_per_competition
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, fixture_order]
          name: competition_fixtures_order_unique_per_season
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: round_name
        description: "{{ doc('round_name') }}"
        tests: [not_null]
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: round_sequence
        description: "The round's rank among the competition-season's rounds, ordered by each round's first kick-off, 1 first. A postponed match keeps its round, so a match played late does not move its round."
        tests: [not_null]
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
        tests: [not_null]
      - name: fixture_date
        description: "{{ doc('fixture_date') }}"
        tests: [not_null]
      - name: status_short
        description: "{{ doc('status_short') }}"
        tests: [not_null]
      - name: is_played
        description: "True when the fixture has a result: a finished leg in int_legs__team_match, which counts full time, extra time, penalties and an awarded result. A played fixture carries both scores."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: goals_home
        description: "Final-time goals scored by the home team; null until the fixture is played."
      - name: goals_away
        description: "Final-time goals scored by the away team; null until the fixture is played."
      - name: home_team_sk
        description: "{{ doc('home_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: home_team_name
        description: "The home team's display name from dim_team."
      - name: home_team_slug
        description: "The home team's permanent URL segment from dim_team."
      - name: home_team_logo_url
        description: "The home team's crest URL from dim_team."
      - name: away_team_sk
        description: "{{ doc('away_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_name
        description: "The away team's display name from dim_team."
      - name: away_team_slug
        description: "The away team's permanent URL segment from dim_team."
      - name: away_team_logo_url
        description: "The away team's crest URL from dim_team."
      - name: fixture_slug
        description: "The match's permanent URL segment: the kick-off date, the home team's slug, -vs-, the away team's slug, e.g. YYYY-MM-DD-bayern-munchen-vs-1-fc-union-berlin. Present on every row: both teams resolve on dim_team, whose slug is never null."
        tests: [not_null]
      - name: is_next_round
        description: "True on every fixture, played or not, of the round mart_next_matchday serves as the competition's next matchday; false on every other row, including every row of a competition with no upcoming fixture."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_match_that_matters
        description: "mart_next_matchday's flag on the one fixture of the next round whose two teams have the lowest sum of table positions; false on every other row."
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: fixture_order
        description: "The reading order of the competition-season's fixtures, 1 first: rounds in their sequence, and within a round by kick-off. Consumers render rows in this order and sort nothing."
        tests: [not_null]

  - name: mart_team_fixtures
    description: >
      Every fixture from one team's perspective, upcoming and finished alike. Each fixture appears
      twice, once per side. Grain: (team_sk, fixture_sk).

      Built on fct_fixture, with opponent identity from dim_team and the finished result reused
      from int_legs__team_match rather than re-derived.

      The rank columns reduce selection to a filter: upcoming_rank = 1 is the next fixture, and
      recency_rank <= 5 the last five results. Live, postponed and cancelled rows carry NULL
      ranks, having no honest place in either.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, fixture_sk]
      # a result-leg row always carries its perspective result, and the ranked
      # recency population is exactly the result-leg rows
      - dbt_utils.expression_is_true:
          expression: "not has_result or result is not null"
          name: team_fixtures_result_present
      - dbt_utils.expression_is_true:
          expression: "recency_rank is null or result is not null"
          name: team_fixtures_recency_has_result
      - dbt_utils.expression_is_true:
          expression: "(upcoming_rank is null or upcoming_rank >= 1) and (recency_rank is null or recency_rank >= 1)"
          name: team_fixtures_ranks_positive
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: result
        description: "{{ doc('result') }} NULL for a fixture that is not a finished result."
        tests:
          - accepted_values:
              values: ["W", "D", "L"]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
        description: "{{ doc('round_name') }}"
      - name: status_short
        description: "{{ doc('status_short') }}"
      - name: is_home
        description: "{{ doc('is_home__own_fixture') }}"
      - name: opponent_name
        description: "{{ doc('opponent_name') }}"
      - name: opponent_logo_url
        description: "{{ doc('opponent_logo_url') }}"
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: has_result
        description: "True when a finished result is attached to this fixture. It is NOT the opposite of is_upcoming: a postponed, abandoned or cancelled fixture is false on both, so test the flag you mean rather than negating the other one."
      - name: is_upcoming
        description: "True when the fixture is still to be played - the provider has it as not started or its date is still to be confirmed. It is NOT the opposite of has_result: a postponed or abandoned fixture is false on both."
      - name: upcoming_rank
        description: "1 for this team's next fixture in this competition-season, 2 for the one after, and so on by kickoff time. NULL for any fixture that is not upcoming, so the ranks run 1..n over upcoming fixtures alone with no gaps."
      - name: recency_rank
        description: "1 for this team's most recent finished result in this competition-season, 2 for the one before, and so on by kickoff time descending. NULL for any fixture that is not a finished result (upcoming, live, postponed, cancelled, or without a result leg), so the ranks run 1..n over finished results alone with no gaps."

  - name: mart_roster
    description: >
      Who was on a club's roster in a competition-season, from dim_player_team_season_mapping
      joined to dim_player. Grain: (team_sk, league_code, season_api_year, player_sk).

      Identity only — name, listed position, nationality, birth date, photo. No per-club stats;
      those are in mart_player_career. Age is not stored, because a stored age stops being true;
      derive it from player_birth_date.

      Scoped to club competitions via the registry and competition_types, never a flag on
      dim_team. dim_player is LEFT-joined, so a membership with no player entity fails the
      relationships test rather than vanishing.
    config:
      tags: ["marts", "football", "roster"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, player_sk]
    columns:
      - name: player_team_season_sk
        description: "Surrogate carried from dim_player_team_season_mapping (player, team, league_code, season)."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_player_team_season_mapping')
              field: player_team_season_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the roster season, always present: it anchors the grain even when season_sk is null."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }} Nullable here: a roster season with no competition-season row."
        tests:
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: competition_type
        description: "{{ doc('competition_type') }} Only club competition types appear here: the mart is filtered to them."
      - name: entity_type
        description: "{{ doc('entity_type') }} Always club here: the mart is filtered to club competitions."
        tests:
          - not_null
          - accepted_values:
              values: ["club"]
      - name: player_name
        description: "{{ doc('player_name') }}"
      - name: player_position
        description: "Listed/bio position from dim_player (general position, not a per-season modal)."
      - name: player_nationality
        description: "{{ doc('player_nationality') }}"
      - name: player_birth_date
        description: "{{ doc('player_birth_date') }}"
      - name: player_photo_url
        description: "{{ doc('player_photo_url') }}"

  - name: mart_team_competition_benchmarks
    description: >
      Where a team sits against its own league on each team metric: its value, the league median
      and mean, the p25/p75 spread, its rank out of team_count, and its distance from the median.
      Long-shaped, one row per (team, season, metric). Grain: (team_sk, season_sk, metric_key).

      DIRECTION-AGNOSTIC: rank is by value descending, so rank 1 is the highest value and not
      necessarily the best. The good/bad reading comes from the metric's catalogue direction.

      Median-led and ranked rather than percentiled, which stays honest at around 18 teams.
      Season-to-date, and only teams with at least 3 games.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and team_count"
          name: mart_competition_benchmarks_team_rank_in_range
    columns:
      - name: team_benchmark_sk
        description: "Surrogate from (team_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 22-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets_pct", "shots_per_match", "shots_on_goal_pct", "shots_inside_box_pct", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "finishing_efficiency_pct", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "passes_accuracy_pct", "passes_key_per_match", "corners_per_match", "corners_against_per_match", "saves_pct"]
      - name: metric_value
        description: "The team's season-to-date value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: league_mean
        description: "Mean team value this league-season (the 'league average'; skew-sensitive)."
      - name: league_median
        description: "Median team value this league-season (the typical team — the headline reference)."
      - name: league_p25
        description: "25th-percentile team value (distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (distribution spread)."
      - name: team_count
        description: "N — teams ranked for this metric this league-season."
        tests: [not_null]
      - name: rank
        description: "Rank by value desc (1 = highest), k of team_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - league_median."
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }}"

  - name: mart_player_competition_benchmarks
    description: >
      Where a player sits against their positional peers on each metric: value, peer median and
      mean, p25/p75 spread, rank out of peer_count, percentile, distance from the median. Grain:
      (player_sk, season_sk, position_group, metric_key).

      DIRECTION-AGNOSTIC: rank is by value descending and percentile by value, so neither says
      whether high is good — that comes from the metric's catalogue direction.

      Floor: 270 minutes in the position, and 10 shots on target for finishing. A player
      qualifying in two positions appears once per position; the player_benchmark_metrics() macro
      decides which metrics apply.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, position_group, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and peer_count"
          name: mart_competition_benchmarks_player_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "percentile >= 0 and percentile <= 1"
          name: mart_competition_benchmarks_player_percentile_in_range
      # finishing_efficiency_player_pct is the one bounded metric in the LONG metric_value column (the
      # per-90 metrics are unbounded). It is open-play conversion in [0,1] —
      # range-check the finishing rows; this is the only finishing surface on the player benchmark.
      - dbt_utils.expression_is_true:
          expression: "metric_key != 'finishing_efficiency_player_pct' or metric_value is null or (metric_value between 0 and 1)"
          name: mart_competition_benchmarks_player_finishing_in_range
      # GAP-21 (#391): the 5 ratio metrics carry their volume (num/den) for the no-naked-% triple; the 13
      # per-90 metrics do not. num AND den are non-null EXACTLY on the ratio rows (and, since a ranked row
      # always has a non-null metric_value, safe_divide guarantees a non-null, non-zero den there).
      - dbt_utils.expression_is_true:
          expression: "(metric_key in ('saves_player_pct', 'passes_accuracy_player_pct', 'finishing_efficiency_player_pct', 'dribbles_success_player_pct', 'duels_won_player_pct')) = (metric_numerator is not null and metric_denominator is not null)"
          name: mart_competition_benchmarks_player_ratio_atoms_present
    columns:
      - name: player_benchmark_sk
        description: "Surrogate from (player_sk, season_sk, position_group, metric_key)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT (from the match-time position_code)."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id (the 18-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "passes_key_per90", "dribbles_success_per90", "passes_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "passes_accuracy_player_pct", "duels_won_player_pct", "dribbles_success_player_pct", "finishing_efficiency_player_pct", "saves_player_pct"]
      - name: metric_value
        description: "The player's in-position value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: metric_numerator
        description: >
          The count behind a RATIO metric's percentage — duels_won_player for duels_won_player_pct, for example
          — so the rate can always be shown with the volume it rests on.

          Non-null ONLY on the five ratio rows (saves_player_pct, passes_accuracy_player_pct, finishing_efficiency_player_pct,
          dribbles_success_player_pct, duels_won_player_pct), and NULL on the per-90 rows, which have no such
          pair. From int_player_season_position__metrics, gated identically to metric_value.
      - name: metric_denominator
        description: >
          The denominator behind a ratio metric's percentage, e.g. duels_player. Non-null on
          exactly the same rows as metric_numerator, and NULL on the per-90 rows.
      - name: peer_mean
        description: "Mean peer value this league-season-position (skew-sensitive)."
      - name: peer_median
        description: "Median peer value this league-season-position (the typical player — the headline reference)."
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
      - name: peer_count
        description: "N — players ranked for this metric in this league-season-position."
        tests: [not_null]
      - name: rank
        description: "Rank by value desc (1 = highest), k of peer_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: percentile
        description: "percent_rank by value asc in [0, 1] — fraction of peers strictly below this value (0 = lowest or tied-lowest, ~1 = top). Direction-agnostic; orient at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - peer_median (always present — both inputs are non-null)."
        tests: [not_null]
      - name: minutes
        description: "Minutes played in the position this season (the sample behind the value)."
      - name: appearances
        description: "Appearances in the position this season."
      - name: player_name
        description: "{{ doc('player_name') }}"
      - name: player_nationality
        description: "{{ doc('player_nationality') }}"
      - name: player_photo_url
        description: "{{ doc('player_photo_url') }}"

  - name: mart_player_career
    description: >
      A player's record at one club in one competition-season: appearances, goals, assists, plus
      player and club identity. Composed from int_player_club_season__metrics. Grain: (player_sk,
      team_sk, season_sk).

      A mid-season transfer is two rows: two clubs, one season. National-team rows are built the
      same way but count only appearances in competitions WE COVER, so they are not true career
      caps.

      Built from finished-match player-stat rows, so a row means the player was in that club's
      matchday squad at least once. `appearances` counts only matches actually PLAYED, so 0 is
      legitimate and the row is kept.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - season_sk
      # Appearances cannot be negative but CAN be 0: an appearance requires pitch time, and a squad
      # member who was never brought on keeps his row scoring 0. An `appearances >= 1` assertion
      # would claim this mart excludes never-played members — the opposite of the rule, and never
      # true of the data anyway (26,530 such rows). So the test asserts what holds, not less.
      - dbt_utils.expression_is_true:
          expression: "appearances >= 0"
          name: player_career_appearances_non_negative
      # minutes never negative (sum of coalesce(minutes_played, 0) in the atoms base).
      - dbt_utils.expression_is_true:
          expression: "minutes >= 0"
          name: player_career_minutes_non_negative
      # minutes_per_appearance = safe_divide(minutes, appearances): null exactly when appearances = 0
      # (a squad member who never played — 26,657 such rows since #813), non-negative otherwise. Both
      # branches fire on real rows, so this is not vacuous: it catches a raw divide (would error on the
      # 0-appearance rows), a negative minutes, or a stray value on a never-played row.
      - dbt_utils.expression_is_true:
          expression: "(appearances = 0 and minutes_per_appearance is null) or (appearances > 0 and minutes_per_appearance >= 0)"
          name: player_career_minutes_per_appearance_null_safe
    columns:
      - name: player_career_sk
        description: "Surrogate key — generate_surrogate_key(player_sk, team_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club, or national team, the player turned out for that competition-season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: appearances
        description: >
          Finished matches the player actually PLAYED for this club that competition-season, that
          is minutes > 0. 0 is legitimate rather than missing: a squad member who was never
          brought on keeps his row.
        tests: [not_null]
      - name: minutes
        description: "Minutes played at this club that competition-season (raw seasonal sum, carried up unchanged from int_player_club_season__metrics; a playing-time dimension, not a catalogue metric — exempt in assert_no_uncatalogued_season_metric)."
      - name: minutes_per_appearance
        description: "{{ doc('minutes_per_appearance') }}"
      - name: national_appearances_total
        description: "Per-player denormalised sum of appearances across national-entity rows only (covered comps — not true career caps)."
        tests: [not_null]
      - name: last_kickoff_at
        description: "{{ doc('last_kickoff_at') }}"
      - name: club_latest_kickoff_at
        description: >
          The club's latest match across all of this player's seasons there — a window max of
          last_kickoff_at over (player, club). An ordering signal that keeps a player's spells at
          one club together and in order; not a displayed metric.
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: player_name
        description: "{{ doc('player_name') }}"
      - name: player_nationality
        description: "{{ doc('player_nationality') }}"
      - name: player_photo_url
        description: "{{ doc('player_photo_url') }}"
      - name: team_name
        description: "{{ doc('team_name') }}"
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }}"
      - name: team_country
        description: "{{ doc('team_country') }}"
      - name: goals_player
        description: "{{ doc('goals_player') }}"
      - name: assists_player
        description: "{{ doc('assists_player') }}"
