  - name: mart_team_season_record
    description: >
      Each side of an upcoming fixture with its cumulative record in that fixture's own
      competition this season. Grain: (upcoming_fixture_sk, team_sk).

      Before a team has played any of it, the row falls back to the same competition's previous
      season and window_type says so.

      Uses the same metric ids, formulas and same-window coverage rule as mart_team_momentum, so
      the two are directly comparable — a season figure beside a form figure.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_pct is null or (shots_on_goal_pct between 0 and 1)"
          name: std_team_shots_on_goal_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "shots_inside_box_pct is null or (shots_inside_box_pct between 0 and 1)"
          name: std_team_shots_inside_box_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency_pct is null or (finishing_efficiency_pct between 0 and 1)"
          name: std_team_finishing_efficiency_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_pct is null or (passes_accuracy_pct between 0 and 1)"
          name: std_team_passes_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "saves_pct is null or (saves_pct between 0 and 1)"
          name: std_team_saves_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: std_team_duels_won_pct_in_range
      # W/D/L counts (GAP-10): must reconcile with games and points exactly
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = games_played"
          name: std_team_wdl_sums_to_games
      - dbt_utils.expression_is_true:
          expression: "3 * wins + draws = points_won"
          name: std_team_points_match_wdl
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_played"
          name: std_team_clean_sheets_in_range
      - dbt_utils.expression_is_true:
          expression: "goals_per_match is null or goals_per_match >= 0"
          name: std_team_goals_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "goals_against_per_match is null or goals_against_per_match >= 0"
          name: std_team_goals_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_per_match is null or shots_per_match >= 0"
          name: std_team_shots_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_per_match is null or shots_on_goal_per_match >= 0"
          name: std_team_shots_on_goal_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_per_match is null or passes_per_match >= 0"
          name: std_team_passes_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_per_match is null or corners_per_match >= 0"
          name: std_team_corners_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_against_per_match is null or corners_against_per_match >= 0"
          name: std_team_corners_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_key_per_match is null or passes_key_per_match >= 0"
          name: std_team_passes_key_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "tackles_per_match is null or tackles_per_match >= 0"
          name: std_team_tackles_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "interceptions_per_match is null or interceptions_per_match >= 0"
          name: std_team_interceptions_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "blocks_per_match is null or blocks_per_match >= 0"
          name: std_team_blocks_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "defensive_actions_per_match is null or defensive_actions_per_match >= 0"
          name: std_team_defensive_actions_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "duels_per_match is null or duels_per_match >= 0"
          name: std_team_duels_per_match_non_negative
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the season the W2 value is drawn from: the current one, or the previous one when window_type is 'prev_season'."
        tests: [not_null]
      - name: window_type
