  - name: mart_standings
    description: >
      The standings table for every competition that has one, in a single shape: a league table
      for a domestic league, and one section per group for a group stage. Grain: (league_code,
      season_api_year, group_name, team_sk).

      Rank, points, form and W/D/L. The provider's zone annotation ("Promotion - Champions League",
      "Relegation") is carried verbatim in group_description but never interpreted, so there is no
      derived qualification or relegation field.

      Filtering to competition_type = 'domestic_league' gives a club's league position on its own,
      which is the form a team's fixture context needs.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "standings"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - group_name
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "standing_rank >= 1"
          name: mart_standings_rank_positive
      - dbt_utils.expression_is_true:
          expression: "played is null or played = wins + draws + losses"
          name: mart_standings_played_equals_results
    columns:
      - name: standing_sk
        description: "FK to fct_standings; surrogate from (league_code, season, team, group_name)."
        tests:
          - not_null
          - relationships:
              to: ref('fct_standings')
              field: standing_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: group_name
        description: "Standings section: league name (single-table), group ('Group A'), or phase. Distinguishes group tables and split-season sections."
      - name: competition_type
        description: "From competition_registry + competition_types seeds."
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "Team crest URL from dim_team; nullable."
      - name: standing_rank
        description: "Table position within the section (1 = top)."
        tests: [not_null]
      - name: points
        description: "Accumulated points in the section."
      - name: form
        description: "Recent results string from the API (e.g. WWDLW)."
      - name: group_description
        description: "API zone annotation ($.description); display context only, not a key."
      - name: team_api_id
      - name: goals_diff
      - name: played
      - name: wins
      - name: draws
      - name: losses

  - name: mart_team_season
    description: "Per-team, per-season rollup. Grain: (team_sk, season_sk). Aggregates are over finished matches only (status_short in FT, AET, PEN). latest_rank, latest_form, and standings_group_description come from fct_standings (null when absent). Interpret latest_rank together with standings_group_description for multi-group competitions."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = played"
    columns:
      - name: team_season_sk
        description: "Surrogate key from (team_sk, season_sk)."
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: team_code
      - name: team_country
      - name: team_logo_url
      - name: played
        description: "Count of finished matches this team took part in during the season."
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]
      - name: goals_for
        tests: [not_null]
      - name: goals_against
        description: "{{ doc('goals_against') }}"
        tests: [not_null]
      - name: goal_diff
        tests: [not_null]
      - name: points
        description: "3 points per win, 1 per draw."
        tests: [not_null]
      - name: clean_sheets
        description: "{{ doc('clean_sheets') }}"
        tests: [not_null]
      - name: latest_rank
        description: "Rank from fct_standings for the team's standings row (after deduping multiple fct rows per team-season). Not unique across teams in the same league-season: qualifiers and tournaments reuse rank numbers across parallel groups or phases, and the API may repeat the same group_description label for different groups."
      - name: latest_form
        description: "Recent-form string from fct_standings (e.g. WDLWW). Null when standings are absent for that season."
      - name: standings_group_description
        description: "API standings row description (e.g. group or stage label) from the same fct_standings row as latest_rank. Null when standings are absent. The provider may reuse the same label across different physical groups."

  - name: mart_player_profile
    description: >
      A player's season in one row: season metrics plus identity and modal position from
      dim_player. Grain: (player_sk, season_sk).

      Every metric here is a metric_catalogue row computed by its catalogue formula: the counts
      plus the four catalogued ratios. Nothing is invented — no per-90s, no goal conversion, no
      player shot accuracy. Otherwise only raw descriptors are carried: appearances, starts,
      minutes, identity, position.

      save_pct is only meaningful for goalkeepers (position_code = 'G'); saves and
      shots_on_goal_against carry its numerator and denominator, so it can be shown with its
      volume.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: player_profile_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: player_profile_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: player_profile_dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: player_profile_save_pct_in_range
      # GK full-triple (GAP-12): saves can never exceed shots on target faced
      - dbt_utils.expression_is_true:
          expression: "saves <= shots_on_goal_against"
          name: player_profile_saves_lte_faced
    columns:
      - name: is_featured_season
        description: >
          True on the one season that represents this player: their most recent CLUB season,
          preferring a domestic league, falling back to their most recent season of any kind when
          they have no club football at all.

          Exactly one row per player is true, by construction. Both that and the no-row-true case
          are asserted by tests/assert_one_featured_season_per_entity.sql.
        tests: [not_null]
      - name: competition_type
        description: >
          The competition's type from the registry (domestic_league, domestic_cup,
          continental_cup, world_championship, …). Carried here so a league can be told from a cup
          without re-joining the registry, which is what lets the featured-season rule prefer one.
      - name: entity_type
        description: >
          club or national, resolved through the competition_types seed. It is what scopes the
          featured season to club football.

          NULL is reachable two ways, not one: a league_code absent from the registry, and a
          league_code PRESENT in the registry but carrying a blank competition_type. The second is
          silent, because the sync and both registry guards skip a blank entry on the same
          condition — registry and seed then agree by being equally empty.

          The not_null test is here because a NULL would not fail loudly on its own: it reads as
          non-club, so the player would quietly open on the wrong season.
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: player_season_sk
        tests: [unique, not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: appearances
        tests: [not_null]
      - name: position_code
        description: "Most-frequent position that season (role badge). NULL when no fixture carried a position."
      - name: player_birth_place
        description: "Birth place (city), from dim_player bio."
      - name: player_birth_country
        description: "Birth country, from dim_player bio."
      - name: player_height
        description: "Height (e.g. '180 cm'), from dim_player bio."
      - name: player_weight
        description: "Weight (e.g. '75 kg'), from dim_player bio."
      - name: player_position
        description: "General/listed position from bio (distinct from position_code, the season modal)."
      # team affiliation (GAP-16): most-recent-match club this competition-season + current-club flag
      - name: team_sk
