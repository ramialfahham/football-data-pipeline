        description: "Rank by value desc (1 = highest), k of team_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - league_median."
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "Denormalised from dim_team; nullable."

  - name: mart_player_competition_benchmarks
    description: >
      Where a player sits against their positional peers on each metric: value, peer median and
      mean, p25/p75 spread, rank out of peer_count, percentile, distance from the median. Grain:
      (player_sk, season_sk, position_group, metric_key).

      DIRECTION-AGNOSTIC: rank is by value descending and percentile by value, so neither says
      whether high is good — that comes from the metric's catalogue direction.

      Floor: 270 minutes in the position, and 10 shots on target for finishing. A player
      qualifying in two positions appears once per position; the player_benchmark_metrics() macro
      decides which metrics apply.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, position_group, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and peer_count"
          name: mart_competition_benchmarks_player_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "percentile >= 0 and percentile <= 1"
          name: mart_competition_benchmarks_player_percentile_in_range
      # finishing_efficiency is the one bounded metric in the LONG metric_value column (the
      # per-90 metrics are unbounded). It is open-play conversion in [0,1] (CPO Option A) —
      # range-check the finishing rows; this is the only finishing surface on the player benchmark.
      - dbt_utils.expression_is_true:
          expression: "metric_key != 'finishing_efficiency' or metric_value is null or (metric_value between 0 and 1)"
          name: mart_competition_benchmarks_player_finishing_in_range
      # GAP-21 (#391): the 5 ratio metrics carry their volume (num/den) for the no-naked-% triple; the 13
      # per-90 metrics do not. num AND den are non-null EXACTLY on the ratio rows (and, since a ranked row
      # always has a non-null metric_value, safe_divide guarantees a non-null, non-zero den there).
      - dbt_utils.expression_is_true:
          expression: "(metric_key in ('save_pct', 'pass_accuracy_pct', 'finishing_efficiency', 'dribbles_success_pct', 'duels_won_pct')) = (metric_numerator is not null and metric_denominator is not null)"
          name: mart_competition_benchmarks_player_ratio_atoms_present
    columns:
      - name: player_benchmark_sk
        description: "Surrogate from (player_sk, season_sk, position_group, metric_key)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT (from the match-time position_code)."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id (the 18-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "key_passes_per90", "dribbles_success_per90", "passes_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency", "save_pct"]
      - name: metric_value
        description: "The player's in-position value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: metric_numerator
        description: >
          The count behind a RATIO metric's percentage — duels_won for duels_won_pct, for example
          — so the rate can always be shown with the volume it rests on.

          Non-null ONLY on the five ratio rows (save_pct, pass_accuracy_pct, finishing_efficiency,
          dribbles_success_pct, duels_won_pct), and NULL on the per-90 rows, which have no such
          pair. From int_player_season_position__metrics, gated identically to metric_value.
      - name: metric_denominator
        description: >
          The denominator behind a ratio metric's percentage, e.g. duels_total. Non-null on
          exactly the same rows as metric_numerator, and NULL on the per-90 rows.
      - name: peer_mean
        description: "Mean peer value this league-season-position (skew-sensitive)."
      - name: peer_median
        description: "Median peer value this league-season-position (the typical player — the headline reference)."
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
      - name: peer_count
        description: "N — players ranked for this metric in this league-season-position."
        tests: [not_null]
      - name: rank
        description: "Rank by value desc (1 = highest), k of peer_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: percentile
        description: "percent_rank by value asc in [0, 1] — fraction of peers strictly below this value (0 = lowest or tied-lowest, ~1 = top). Direction-agnostic; orient at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - peer_median (always present — both inputs are non-null)."
        tests: [not_null]
      - name: minutes
        description: "Minutes played in the position this season (the sample behind the value)."
      - name: appearances
        description: "Appearances in the position this season."
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_nationality
        description: "Denormalised from dim_player; nullable."
      - name: player_photo_url
        description: "Denormalised from dim_player; nullable."

  - name: mart_player_career
    description: >
      A player's record at one club in one competition-season: appearances, goals, assists, plus
      player and club identity. Composed from int_player_club_season__metrics. Grain: (player_sk,
      team_sk, season_sk).

      A mid-season transfer is two rows: two clubs, one season. National-team rows are built the
      same way but count only appearances in competitions WE COVER, so they are not true career
      caps.

      Built from finished-match player-stat rows, so a row means the player was in that club's
      matchday squad at least once. `appearances` counts only matches actually PLAYED, so 0 is
      legitimate and the row is kept.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - season_sk
      # Appearances can no longer be negative but CAN be 0: since 2026-07-23 an appearance requires pitch
      # time, and a squad member who was never brought on keeps his row scoring 0 (CPO ruling). The old
      # expression here was `appearances >= 1`, which asserted this mart excluded never-played members —
      # the exact premise the CPO overturned, and which the data never satisfied anyway (26,530 rows).
      # So this is narrowed to what still holds, not loosened to make a change pass.
      - dbt_utils.expression_is_true:
          expression: "appearances >= 0"
          name: player_career_appearances_non_negative
      # minutes never negative (sum of coalesce(minutes_played, 0) in the atoms base).
      - dbt_utils.expression_is_true:
          expression: "minutes >= 0"
          name: player_career_minutes_non_negative
      # minutes_per_appearance = safe_divide(minutes, appearances): null exactly when appearances = 0
      # (a squad member who never played — 26,657 such rows since #813), non-negative otherwise. Both
      # branches fire on real rows, so this is not vacuous: it catches a raw divide (would error on the
      # 0-appearance rows), a negative minutes, or a stray value on a never-played row.
      - dbt_utils.expression_is_true:
          expression: "(appearances = 0 and minutes_per_appearance is null) or (appearances > 0 and minutes_per_appearance >= 0)"
          name: player_career_minutes_per_appearance_null_safe
    columns:
      - name: player_career_sk
        description: "Surrogate key — generate_surrogate_key(player_sk, team_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club, or national team, the player turned out for that competition-season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "club or national (from the registry -> competition_types seeds); null if the competition is unmapped."
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: appearances
        description: >
          Finished matches the player actually PLAYED for this club that competition-season, that
          is minutes > 0. 0 is legitimate rather than missing: a squad member who was never
          brought on keeps his row.
        tests: [not_null]
      - name: minutes
        description: "Minutes played at this club that competition-season (raw seasonal sum, carried up unchanged from int_player_club_season__metrics; a playing-time dimension, not a catalogue metric — exempt in assert_no_uncatalogued_season_metric)."
      - name: minutes_per_appearance
        description: "{{ doc('minutes_per_appearance') }}"
      - name: national_appearances_total
        description: "Per-player denormalised sum of appearances across national-entity rows only (covered comps — not true career caps)."
        tests: [not_null]
      - name: last_kickoff_at
        description: "The player's latest match at this club that competition-season (max kickoff, from int_player_club_season__metrics); a career-log ordering signal (within-club season order), not a displayed metric."
      - name: club_latest_kickoff_at
        description: >
          The club's latest match across all of this player's seasons there — a window max of
          last_kickoff_at over (player, club). An ordering signal that keeps a player's spells at
          one club together and in order; not a displayed metric.
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: player_name
      - name: player_nationality
      - name: player_photo_url
      - name: team_name
      - name: team_logo_url
      - name: team_country
      - name: goals
        description: "{{ doc('goals') }}"
      - name: assists
        description: "{{ doc('assists') }}"
