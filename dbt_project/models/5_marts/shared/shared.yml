  - name: mart_team_profile
    description: >
      A team's season in one row: identity, record, rank and form, full-season metric rates,
      year-over-year movement, streaks and the deserved-versus-actual points gap.
      Grain: (team_sk, season_sk).

      Composed from dim_team, mart_team_season and the int_team_season__* / int_team_profile__*
      models. Those columns are selected unchanged, so their tests stay upstream.

      DOMESTIC LEAGUES ONLY for the deserved-versus-actual and year-over-year columns: every
      tournament row is NULL there, a within-group standing not being a comparable league
      position. Year-over-year is also NULL without an ingested prior season.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "shots_share_pct is null or (shots_share_pct between 0 and 1)"
          name: team_profile_shots_share_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "points_capture_pct is null or (points_capture_pct between 0 and 1)"
          name: team_profile_points_capture_pct_in_range
      # GAP-13 season variant of the duel win rate — same-window ratio bound
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: team_profile_duels_won_pct_in_range
      # finishing_efficiency_pct is open-play conversion in [0,1]
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency_pct is null or (finishing_efficiency_pct between 0 and 1)"
          name: team_profile_finishing_efficiency_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "goals_per_match is null or goals_per_match >= 0"
          name: team_profile_goals_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "goals_against_per_match is null or goals_against_per_match >= 0"
          name: team_profile_goals_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_per_match is null or shots_per_match >= 0"
          name: team_profile_shots_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_pct is null or (shots_on_goal_pct between 0 and 1)"
          name: team_profile_shots_on_goal_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "shots_inside_box_pct is null or (shots_inside_box_pct between 0 and 1)"
          name: team_profile_shots_inside_box_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_pct is null or (passes_accuracy_pct between 0 and 1)"
          name: team_profile_passes_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "passes_per_match is null or passes_per_match >= 0"
          name: team_profile_passes_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_per_match is null or corners_per_match >= 0"
          name: team_profile_corners_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_against_per_match is null or corners_against_per_match >= 0"
          name: team_profile_corners_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "saves_pct is null or (saves_pct between 0 and 1)"
          name: team_profile_saves_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_per_match is null or shots_on_goal_per_match >= 0"
          name: team_profile_shots_on_goal_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0"
          name: team_profile_shots_on_goal_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_key_per_match is null or passes_key_per_match >= 0"
          name: team_profile_passes_key_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "duels_per_match is null or duels_per_match >= 0"
          name: team_profile_duels_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "defensive_actions_per_match is null or defensive_actions_per_match >= 0"
          name: team_profile_defensive_actions_per_match_non_negative
      # Year-over-year copies take the bounds int_team_profile.yml fixed for the same columns:
      # structural ratios [0,1], the provider-subset ratios >= 0 only, per-match counts >= 0.
      - dbt_utils.expression_is_true:
          expression: "goals_per_match_this_season is null or goals_per_match_this_season >= 0"
          name: team_profile_goals_per_match_this_season_non_negative
