  - name: mart_leaderboards
    description: >
      One row per (player, board): where that player ranks on that board within a
      competition-season. Long-shaped — the board is a value in metric_key, not a column.
      Grain: (player_sk, season_sk, metric_key).

      Season-to-date, composed from int_player_season__metrics and dim_player. rank is a
      DENSE_RANK over the board's metric descending within (league_code, season_api_year), so ties
      share a rank and the top 10 includes them. Only a positive value is ranked.

      RATE boards carry a qualification floor so a small sample cannot game a rate: 270 minutes, a
      position scope, 10 shots on target for finishing.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "leaderboards"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and 10"
          name: mart_leaderboards_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "sort_value > 0"
          name: mart_leaderboards_sort_value_positive
      # RATE-board ratios are all bounded [0,1]. finishing_efficiency is now open-play
      # conversion in [0,1] (CPO Option A), so it is range-checked here like the other rates.
      # Rates are null when their denominator is zero.
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: mart_leaderboards_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: mart_leaderboards_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: mart_leaderboards_dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: mart_leaderboards_save_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: mart_leaderboards_finishing_efficiency_in_range
    columns:
      - name: player_leaderboard_sk
        description: "Surrogate from (player_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: metric_key
        description: "The board — a metric_catalogue metric_id (9 count + 5 rate boards = 14)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals", "scorer_points", "shots_on_goal", "dribbles_success", "passes_total", "passes_key", "duels_won", "defensive_actions", "cards_total", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency", "save_pct"]
      - name: rank
        description: "DENSE_RANK over the board's metric desc (ties share a rank). 1 is top; cut at 10."
        tests: [not_null]
      - name: sort_value
        description: "The board's own value the rank is computed from (always > 0). FLOAT64 — holds the integer counts and the 0-1 rates."
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."
      # Denormalised season-to-date display atoms (from int_player_season__metrics): the per-board
      # breakdown values the UI shows alongside sort_value (the board's own ranked metric).
      - name: appearances
      - name: minutes
      - name: goals
        description: "{{ doc('goals') }}"
      - name: assists
        description: "{{ doc('assists') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_key
        description: "{{ doc('passes_key') }}"
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: tackles_total
        description: "{{ doc('tackles_total') }}"
      - name: tackles_interceptions
        description: "{{ doc('tackles_interceptions') }}"
      - name: tackles_blocks
        description: "{{ doc('tackles_blocks') }}"
      - name: cards_yellow
        description: "{{ doc('cards_yellow') }}"
      - name: cards_red
        description: "{{ doc('cards_red') }}"
      - name: scorer_points
