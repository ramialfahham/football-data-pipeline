  - name: mart_team_fixtures
    description: >
      Every fixture from one team's perspective, upcoming and finished alike. Each fixture appears
      twice, once per side. Grain: (team_sk, fixture_sk).

      Built on fct_fixture, with opponent identity from dim_team and the finished result reused
      from int_legs__team_match rather than re-derived.

      The rank columns reduce selection to a filter: upcoming_rank = 1 is the next fixture, and
      recency_rank <= 5 the last five results. Live, postponed and cancelled rows carry NULL
      ranks, having no honest place in either.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, fixture_sk]
      # a result-leg row always carries its perspective result, and the ranked
      # recency population is exactly the result-leg rows
      - dbt_utils.expression_is_true:
          expression: "not has_result or result is not null"
          name: team_fixtures_result_present
      - dbt_utils.expression_is_true:
          expression: "recency_rank is null or result is not null"
          name: team_fixtures_recency_has_result
      - dbt_utils.expression_is_true:
          expression: "(upcoming_rank is null or upcoming_rank >= 1) and (recency_rank is null or recency_rank >= 1)"
          name: team_fixtures_ranks_positive
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: opponent_team_sk
        description: "The other side's team_sk; the row carries the team's perspective of the fixture."
      - name: result
        description: "W/D/L from int_legs__team_match for finished rows; null otherwise."
        tests:
          - accepted_values:
              values: ["W", "D", "L"]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
      - name: round_name
      - name: status_short
      - name: is_home
      - name: opponent_name
      - name: opponent_logo_url
      - name: goals_for
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: has_result
      - name: is_upcoming
      - name: upcoming_rank
      - name: recency_rank

  - name: mart_roster
    description: >
      Who was on a club's roster in a competition-season, from dim_player_team_season_mapping
      joined to dim_player. Grain: (team_sk, league_code, season_api_year, player_sk).

      Identity only — name, listed position, nationality, birth date, photo. No per-club stats;
      those are in mart_player_career. Age is not stored, because a stored age stops being true;
      derive it from player_birth_date.

      Scoped to club competitions via the registry and competition_types, never a flag on
      dim_team. dim_player is LEFT-joined, so a membership with no player entity fails the
      relationships test rather than vanishing.
    config:
      tags: ["marts", "football", "roster"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, player_sk]
    columns:
      - name: player_team_season_sk
        description: "Surrogate carried from dim_player_team_season_mapping (player, team, league_code, season)."
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the roster season, always present: it anchors the grain even when season_sk is null."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }} Nullable here: a roster season with no competition-season row."
      - name: competition_type
        description: "From competition_registry; the mart is filtered to club types."
      - name: entity_type
        description: "Always 'club' — the mart is club-scoped via competition_types."
        tests:
          - not_null
          - accepted_values:
              values: ["club"]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player (general position, not a per-season modal)."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_birth_date
        description: "Birth date from dim_player bio; age is computed at render."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."

  - name: mart_team_competition_benchmarks
    description: >
      Where a team sits against its own league on each team metric: its value, the league median
      and mean, the p25/p75 spread, its rank out of team_count, and its distance from the median.
      Long-shaped, one row per (team, season, metric). Grain: (team_sk, season_sk, metric_key).

      DIRECTION-AGNOSTIC: rank is by value descending, so rank 1 is the highest value and not
      necessarily the best. The good/bad reading comes from the metric's catalogue direction.

      Median-led and ranked rather than percentiled, which stays honest at around 18 teams.
      Season-to-date, and only teams with at least 3 games.
    meta:
      owner: "data-platform"
