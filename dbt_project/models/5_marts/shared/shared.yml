  - name: mart_player_profile
    description: >
      A player's season in one row: season metrics plus identity and modal position from
      dim_player. Grain: (player_sk, season_sk).

      Every metric here is a metric_catalogue row computed by its catalogue formula: the counts
      plus the four catalogued ratios. Nothing is invented — no per-90s, no goal conversion, no
      player shot accuracy. Otherwise only raw descriptors are carried: appearances, starts,
      minutes, identity, position.

      saves_player_pct is only meaningful for goalkeepers (position_code = 'G'); saves_player and
      shots_on_goal_against_player carry its numerator and denominator, so it can be shown with its
      volume.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_player_pct is null or (passes_accuracy_player_pct between 0 and 1)"
          name: player_profile_passes_accuracy_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_player_pct is null or (duels_won_player_pct between 0 and 1)"
          name: player_profile_duels_won_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_player_pct is null or (dribbles_success_player_pct between 0 and 1)"
          name: player_profile_dribbles_success_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "saves_player_pct is null or (saves_player_pct between 0 and 1)"
          name: player_profile_saves_player_pct_in_range
      # GK full-triple (GAP-12): saves_player can never exceed shots on target faced
      - dbt_utils.expression_is_true:
          expression: "saves_player <= shots_on_goal_against_player"
          name: player_profile_saves_player_lte_faced
      - dbt_utils.expression_is_true:
          expression: "contribution_player_pct is null or (contribution_player_pct between 0 and 1)"
          name: player_profile_contribution_player_pct_in_range
    columns:
      - name: is_featured_season
        description: >
          True on the one season that represents this player: their most recent CLUB season,
          preferring a domestic league, falling back to their most recent season of any kind when
          they have no club football at all.

          Exactly one row per player is true, by construction. Both that and the no-row-true case
          are asserted by tests/assert_one_featured_season_per_entity.sql.
        tests: [not_null]
      - name: competition_type
        description: >
          {{ doc('competition_type') }} Carried here so a league can be told from a cup without
          re-joining the registry, which is what lets the featured-season rule prefer one.
      - name: entity_type
        description: >
          {{ doc('entity_type') }} It is what scopes the featured season to club football.

          The defect has a silent form here: a league_code present in the registry but carrying a
          blank competition_type, which the sync and both registry guards skip on the same
          condition. The not_null test is here because such a NULL would not fail loudly on its
          own: it reads as non-club, so the player would quietly open on the wrong season.
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: player_season_sk
        description: "Identity key for one player in one competition-season: a surrogate built from player_sk and season_sk. It is this row's own key, and the handle to use when a player-season needs referring to as a single thing."
        tests: [unique, not_null]
