  - name: mart_standings
    description: >
      The standings table for every competition that has one, in a single shape: a league table
      for a domestic league, and one section per group for a group stage. Grain: (league_code,
      season_api_year, group_name, team_sk).

      Rank, points, form, W/D/L, goals scored and conceded, goal difference: every value is the
      provider's official standings row as published, nothing computed from fixtures. The
      provider's zone annotation ("Promotion - Champions League", "Relegation") is carried
      verbatim in group_description but never interpreted, so there is no derived qualification
      or relegation field.

      table_kind classifies the section (league, group, conference, split_round, ranking)
      through the standings_table_kinds seed, so a page filters on a served column and never on
      a section name.

      Filtering to competition_type = 'domestic_league' gives a club's league position on its own,
      which is the form a team's fixture context needs.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "standings"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - group_name
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "standing_rank >= 1"
          name: mart_standings_rank_positive
      - dbt_utils.expression_is_true:
          expression: "played is null or played = wins + draws + losses"
          name: mart_standings_played_equals_results
      - dbt_utils.expression_is_true:
          expression: "goals_scored is null or goals_conceded is null or goals_diff = goals_scored - goals_conceded"
          name: mart_standings_goals_reconcile_with_goal_difference
    columns:
      - name: standing_sk
        description: "FK to fct_standings; surrogate from (league_code, season, team, group_name)."
        tests:
          - not_null
          - relationships:
              to: ref('fct_standings')
              field: standing_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: group_name
        description: "Standings section: league name (single-table), group ('Group A'), or phase. Distinguishes group tables and split-season sections."
      - name: table_kind
        description: "What kind of table the section is: league (the competition's own ladder), group, conference, split_round (a split season's championship, relegation, qualifying or play-off round, an Apertura or Clausura), or ranking (the provider's cross-group ranking of second- or third-placed teams). Resolved from the section name through the standings_table_kinds seed; a name no pattern matches is league."
        tests:
          - not_null
          - accepted_values:
              values: ["league", "group", "conference", "split_round", "ranking"]
      - name: competition_type
        description: "{{ doc('competition_type') }}"
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }}"
      - name: standing_rank
        description: "Table position within the section (1 = top)."
        tests: [not_null]
      - name: points
        description: "Accumulated points in the section."
      - name: goals_scored
        description: "Goals scored in the section, as the provider's standings row reports them; null only where the provider row lacks the field."
      - name: goals_conceded
        description: "Goals conceded in the section, as the provider's standings row reports them; null only where the provider row lacks the field."
      - name: form
        description: "Recent results string from the API (e.g. WWDLW)."
      - name: group_description
        description: "API zone annotation ($.description); display context only, not a key."
      - name: team_api_id
        description: "{{ doc('team_api_id') }}"
      - name: goals_diff
        description: "{{ doc('goals_diff') }}"
      - name: played
        description: "Matches played in this standings section, as the provider's own standings row reports it — not counted from fixtures. NULL only where the provider's row lacks the field."
      - name: wins
        description: "{{ doc('wins') }}"
      - name: draws
        description: "{{ doc('draws') }}"
      - name: losses
        description: "{{ doc('losses') }}"

  - name: mart_team_season
