      - dbt_utils.expression_is_true:
          expression: "rank between 1 and team_count"
          name: mart_competition_benchmarks_team_rank_in_range
    columns:
      - name: team_benchmark_sk
        description: "Surrogate from (team_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 22-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets", "shots_per_match", "shot_accuracy", "danger_zone_ratio", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "sot_difference_per_match", "finishing_efficiency", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "pass_accuracy", "key_passes_per_match", "corner_kicks_per_match", "corners_against_per_match", "save_ratio"]
      - name: metric_value
        description: "The team's season-to-date value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: league_mean
        description: "Mean team value this league-season (the 'league average'; skew-sensitive)."
      - name: league_median
        description: "Median team value this league-season (the typical team — the headline reference)."
      - name: league_p25
        description: "25th-percentile team value (distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (distribution spread)."
      - name: team_count
