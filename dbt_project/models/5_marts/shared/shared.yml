version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_competition_index
    description: >
      One row per competition — the single mart the competitions page (#54) reads. Replaces the
      four sources that page would otherwise read directly (docs/competition_registry.yml,
      competition_types.csv, confederations.csv, dim_league), which content_architecture.md §1
      forbids (#62 step 3). Carries the CPO-approved ordering INPUTS as facts
      (next_kickoff_datetime, last_kickoff_datetime, region_rank) without pre-baking the ORDER BY,
      which the page spec declares (CPO, 2026-08-16: sorting is arrangement, not a fact a visitor
      reads). region_label resolves the country-vs-region branch here: league_country is NULL for
      every international/continental competition (#69 step 5), so which of league_country /
      confed.label_en is populated IS the answer, with no flag. Grain: league_code. LEAF — #62
      step 4 (export repoint) is its first reader and is not built yet.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code]
    columns:
      - name: league_code
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('competition_registry')
              field: league_code
      - name: competition_type
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type
      - name: entity_type
        description: "From competition_types.entity_type — club or national. Also a page filter axis."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: slug
        description: "From competition_registry.slug — the row's link target."
        tests: [not_null]
      - name: category_label_en
        description: "From competition_types.label_en — the category heading text."
        tests: [not_null]
      - name: category_label_i18n_key
        description: "From competition_types.label_i18n_key — the category heading's i18n key."
        tests: [not_null]
      - name: confederation
        description: "From competition_registry.confederation — also a page filter axis."
        tests:
          - not_null
          - relationships:
              to: ref('confederations')
              field: confederation
      - name: region_rank
        description: "From confederations.region_rank — the one hand-set ordering input (#54, 2026-08-16)."
        tests: [not_null]
      - name: competition_name
        description: >
          From dim_league.league_name. NULL when the competition has never been ingested — #55's
          display-name gap is not fixed here.
      - name: logo_url
        description: >
          From dim_league.league_logo_url. NULL for a competition with no crest ingested (#36's
          gap) or never ingested at all.
      - name: region_label_en
        description: >
          The competition's country if it has one (league_country), else its region's English
          label (confederation's label_en). Resolves the country-vs-region branch (#69 step 5) —
          never both, never neither, because every registry row's confederation is FK-guaranteed
          to resolve.
        tests: [not_null]
      - name: region_label_i18n_key
        description: >
          The region's i18n key, or NULL when region_label_en is a country name — a country name
          is an entity name, not chrome (#62, 2026-08-14).
      - name: next_kickoff_datetime
        description: "Earliest upcoming fixture kickoff for this league_code. NULL when nothing is scheduled."
      - name: last_kickoff_datetime
        description: "Most recent past fixture kickoff for this league_code. NULL when nothing has ever been played."

  - name: mart_team_momentum
    description: >
      W1 last-5 momentum mart — team. One row per upcoming fixture side. Computes all
      final team performance metrics from int_team_momentum__metrics raw sums. All ratios and
      per-match rates live here; none in the builder. league_rank is excluded — it comes
      from the standings surface (#322). Player-derived metrics (key_passes_per_match
      through duels_won_pct) are NULL when no player stats exist for the window.
      Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      # Ratio bounds [0,1] — guards the same-window contract at the source.
      # A value > 1 means numerator and denominator were computed over different
      # game sets (a coverage-window bug), so these must stay strict.
      - dbt_utils.expression_is_true:
          expression: "shot_accuracy is null or (shot_accuracy between 0 and 1)"
          name: momentum_team_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "danger_zone_ratio is null or (danger_zone_ratio between 0 and 1)"
          name: momentum_team_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: momentum_team_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy is null or (pass_accuracy between 0 and 1)"
          name: momentum_team_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "save_ratio is null or (save_ratio between 0 and 1)"
          name: momentum_team_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: momentum_team_duels_won_pct_in_range
      # clean sheets are scoreline-based: always present, bounded by the window
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_in_window"
          name: momentum_team_clean_sheets_in_range
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18).
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        tests: [not_null]
      - name: games_with_team_stats
        description: "Window legs with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_player_momentum
    description: >
      W1 momentum mart — player. One row per player per upcoming fixture side.
      Raw counts (goals, assists, cards, …) are passed through directly from the builder.
      Ratios (save_pct, dribbles_success_pct, pass_accuracy_pct, duels_won_pct) are
      computed here via safe_divide. save_pct is only meaningful for goalkeepers
      (position_code = 'G'). window_type is last_5 for most fixtures, or the cumulative
      tournament_to_date / qualifiers window on tournament fixtures (GAP-18/#484) — the same
      window the team form panel uses. Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      # top_player_rank (GAP-19.2): strict per-side pick order, starts at 1 and is
      # unique within each (upcoming_fixture_sk, team_sk) side (guards upstream fan-out)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, top_player_rank]
      - dbt_utils.expression_is_true:
          expression: "top_player_rank >= 1"
          name: momentum_player_rank_positive
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this to retrieve fixtures for a competition."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window, carried from the builder: last_5 (default) or tournament_to_date /
          qualifiers for tournament fixtures (GAP-18/#484).
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "The player's appearance count within the side's window (1..5 for last_5, uncapped for tournament windows)."
        tests: [not_null]
      - name: position_code
        description: "Player position code (e.g. G, D, M, F). Used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_team_momentum_window
    description: >
      W1 momentum-window list mart — team (#323). The drill-down behind the momentum
      metrics: the same window matches mart_team_momentum aggregates, exposed
      un-aggregated — one row per (upcoming fixture side, past match). played_fixture_sk
      is the click-through key into mart_team_fixture_stats / mart_player_fixture_stats; has_team_stats
      and has_player_stats are derived from those detail marts (same-layer refs, the
      documented layering exception), so true literally means the drill-down returns
      rows. Consistency with the momentum aggregate is guarded by
      assert_momentum_window_matches_momentum. Grain: (upcoming_fixture_sk, team_sk,
      played_fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, played_fixture_sk]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, recency_rank]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key of the UPCOMING fixture — app slices by this. The past match's own competition is played_league_code."
        tests: [not_null]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18). Tournament windows are cumulative, so a side can have >5 rows.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent past match in the window."
        tests: [not_null]
      - name: played_fixture_sk
        description: "Click-through key into the per-fixture stat marts."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: opponent_team_sk
        tests: [not_null]
      - name: has_team_stats
        description: "True when mart_team_fixture_stats has rows for this played fixture + team (API shell rows with all-NULL stats count as no data)."
        tests: [not_null]
      - name: has_player_stats
        description: "True when mart_player_fixture_stats has rows for this played fixture + team. False is the common case — many competitions lack player stats."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_team_fixture_stats
    description: >
      Per-fixture team stat line (#323) — the match detail view behind the form-window
      list. Pure projection of fct_fixture_team_stats (no derived metrics) plus fixture
      metadata and team identity. Both sides of a fixture are two rows. Covers all
      finished fixtures with team stats; API shell rows (statistics block present but
      every value NULL) are excluded, so a fixture absent here has no usable stats —
      the honest "not available" state. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]

  - name: mart_player_fixture_stats
    description: >
      Per-fixture player stat lines (#323) — the player half of the match detail view.
      Pure projection of fct_fixture_player_stats (no derived metrics) plus player and
      team identity. A fixture with no rows here has no player stats — the COMMON case
      (many competitions lack statistics_players), rendered honestly by the app as
      "player stats not available". Grain: (fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk, player_sk]
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]

  - name: mart_team_profile
    description: >
      Team profile (#324). One row per (team, competition-season): identity + record +
      rank/form (composed from dim_team and mart_team_season) + full-season metric rates
      (int_team_season__metrics, incl. shot_share + points_capture) + a
      year-over-year differentiator, a streaks layer, and the deserved-vs-actual points gap
      (int_team_season__deserved_vs_actual; DOMESTIC LEAGUES ONLY, so every tournament row carries
      NULL there — a within-group standing is not a comparable league position).
      Carries the on-target pair the deserved read is built from —
      shots_on_goal_against_per_match and sot_difference_per_match — so a consumer can show the
      inputs beside the verdict rather than only the outcome. Coverage differs between the two, so
      it is stated separately rather than summarised: shots_on_goal_against_per_match is NULL
      unless OPPONENT shots-on-target data covers every season game, while
      sot_difference_per_match needs BOTH the team's own and the opponent's coverage (two
      independent counters that can diverge). Matches int_team_season.yml, which documents the
      same columns at source. The gate and the non-negative / signed-value tests live upstream
      there and are not duplicated here, since this mart selects them unchanged. Year-over-year columns
      (this season vs last, games-played-aligned) come from int_team_profile__yoy and are
      domestic-league only — NULL elsewhere and where the prior season is not ingested.
      Streaks come from int_team_profile__streaks. Grain: (team_sk, season_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "shot_share is null or (shot_share between 0 and 1)"
          name: team_profile_shot_share_in_range
      - dbt_utils.expression_is_true:
          expression: "points_capture is null or (points_capture between 0 and 1)"
          name: team_profile_points_capture_in_range
      # GAP-13 season variant of the duel win rate — same-window ratio bound
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: team_profile_duels_won_pct_in_range
      # finishing_efficiency is open-play conversion in [0,1] (CPO Option A)
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: team_profile_finishing_efficiency_in_range
    columns:
      # #846: the season this team's page opens on — the most recent domestic-league season,
      # falling back to the most recent of any type. Exactly one row per team is true BY
      # CONSTRUCTION: the model computes it as `row_number() over (partition by team_sk ...) = 1`,
      # which cannot produce two. tests/assert_one_featured_season_per_entity.sql asserts it
      # explicitly across BOTH profile marts, so a future rewrite of that window cannot silently
      # produce NONE either. One rule, one failure surface, which is what keeps the two marts from
      # drifting apart again.
      - name: is_featured_season
        tests: [not_null]
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: competition_type
        description: "From the registry; YoY columns are populated only for domestic_league."
      - name: points_delta_yoy
        description: "This season minus last season, points through the same games played. Domestic only; NULL when no prior season."
      - name: goals_per_match_delta_yoy
        description: >
          Representative rate-metric YoY delta — every LOCKED 16-row rate metric has _this_season /
          _prev_season / _delta_yoy (matchday-aligned this-vs-last, the team Stats tab's per-metric
          vs-last-season column). Passthrough from int_team_profile__yoy; domestic only, NULL where
          no prior season or coverage is incomplete through N.
      - name: deserved_rank
        description: "Rank by deserved_points within the league-season (1 = best) — the process-deserved table position. Derived from deserved_points, so the two cannot disagree and they null together. From int_team_season__deserved_vs_actual. NULL for every non-domestic-league row, and wherever the league-season is not fittable: incomplete SoT coverage, no league rank, fewer than 3 finished games, or a table that is not a single ladder (MLS conferences, Apertura/Clausura)."
      - name: deserved_points
        description: "Points deserved by the on-target process: the league-season least-squares fit of points-per-match on sot_difference_per_match, times this team's games played. Compare against `points`. From int_team_season__deserved_vs_actual. NULL for every non-domestic-league row, and when the league-season is not fittable — which includes any league whose table is not a single ladder (MLS conferences, and the Apertura/Clausura formats where a season spans two separate tournaments, so even the points total is not one comparable figure)."
      - name: sot_points_gap
        description: "`points` minus deserved_points; NEGATIVE = under-performing (fewer points than the process deserved), POSITIVE = over-performing. NOTE the sign is INVERTED relative to the retired sot_rank_gap, where positive meant under-performing. From int_team_season__deserved_vs_actual. NULL when not fittable."
      # identity (GAP-01): founded year + venue, denormalised from dim_team. Nullable (sparse feed).
      - name: team_founded_year
        description: "Club founded year, from dim_team (GAP-01). Nullable — sparse in the feed."
      - name: venue_name
        description: "Home venue name, from dim_team (GAP-01). Nullable."
      - name: venue_city
        description: "Home venue city, from dim_team (GAP-01). Nullable."
      - name: venue_capacity
        description: "Home venue capacity, from dim_team (GAP-01). Nullable."

  - name: mart_team_season_record
    description: >
      W2 season-record mart — team. One row per upcoming fixture side: the team's
      cumulative record in the fixture's own competition this season (shown beside W1
      momentum). Falls back to the same competition's previous season before the team has
      played (window_type='prev_season'). Same metric_ids/formulas as mart_team_momentum;
      same-window coverage rule. Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "shot_accuracy is null or (shot_accuracy between 0 and 1)"
          name: std_team_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "danger_zone_ratio is null or (danger_zone_ratio between 0 and 1)"
          name: std_team_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: std_team_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy is null or (pass_accuracy between 0 and 1)"
          name: std_team_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "save_ratio is null or (save_ratio between 0 and 1)"
          name: std_team_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: std_team_duels_won_pct_in_range
      # W/D/L counts (GAP-10): must reconcile with games and points exactly
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = games_played"
          name: std_team_wdl_sums_to_games
      - dbt_utils.expression_is_true:
          expression: "3 * wins + draws = points_won"
          name: std_team_points_match_wdl
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_played"
          name: std_team_clean_sheets_in_range
    columns:
      - name: upcoming_fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: season_api_year
        description: "The season the W2 value is drawn from (current, or previous when window_type='prev_season')."
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date", "prev_season"]
      - name: games_played
        description: "Cumulative matches in the season-to-date window."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_player_season_record
    description: >
      W2 season-record mart — player. One row per player per upcoming fixture side: the
      player's cumulative record in the fixture's own competition this season (complement to
      mart_player_momentum). Previous-season fallback before the team has played. Raw counts
      passed through; ratios via safe_divide. Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: std_player_save_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: std_player_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: std_player_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: std_player_dribbles_success_pct_in_range
    columns:
      - name: upcoming_fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date", "prev_season"]
      - name: position_code
        description: "Player position code; used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]

  - name: mart_standings
    description: >
      Generic standings table for every competition that has standings. Job 1: the
      competition's own table (league table for domestic_league; group tables for group
      stages — one section per group_name). Job 2: a club's domestic-league standing as
      fixture context — filter to competition_type = 'domestic_league'. Rank, points,
      form, W/D/L only (no zones). Grain: (league_code, season_api_year, group_name, team_sk).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "standings"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - group_name
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "standing_rank >= 1"
          name: mart_standings_rank_positive
      - dbt_utils.expression_is_true:
          expression: "played is null or played = wins + draws + losses"
          name: mart_standings_played_equals_results
    columns:
      - name: standing_sk
        description: "FK to fct_standings; surrogate from (league_code, season, team, group_name)."
        tests:
          - not_null
          - relationships:
              to: ref('fct_standings')
              field: standing_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a competition's table."
        tests: [not_null]
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        tests: [not_null]
      - name: group_name
        description: "Standings section: league name (single-table), group ('Group A'), or phase. Distinguishes group tables and split-season sections."
      - name: competition_type
        description: "From competition_registry + competition_types seeds."
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "Team crest URL from dim_team; nullable."
      - name: standing_rank
        description: "Table position within the section (1 = top)."
        tests: [not_null]
      - name: points
        description: "Accumulated points in the section."
      - name: form
        description: "Recent results string from the API (e.g. WWDLW)."
      - name: group_description
        description: "API zone annotation ($.description); display context only, not a key."

  - name: mart_team_season
    description: "Per-team, per-season rollup. Grain: (team_sk, season_sk). Aggregates are over finished matches only (status_short in FT, AET, PEN). latest_rank, latest_form, and standings_group_description come from fct_standings (null when absent). Interpret latest_rank together with standings_group_description for multi-group competitions."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = played"
    columns:
      - name: team_season_sk
        description: "Surrogate key from (team_sk, season_sk)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: team_code
      - name: team_country
      - name: team_logo_url
      - name: played
        description: "Count of finished matches this team took part in during the season."
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]
      - name: goals_for
        tests: [not_null]
      - name: goals_against
        tests: [not_null]
      - name: goal_diff
        tests: [not_null]
      - name: points
        description: "3 points per win, 1 per draw."
        tests: [not_null]
      - name: clean_sheets
        tests: [not_null]
      - name: latest_rank
        description: "Rank from fct_standings for the team's standings row (after deduping multiple fct rows per team-season). Not unique across teams in the same league-season: qualifiers and tournaments reuse rank numbers across parallel groups or phases, and the API may repeat the same group_description label for different groups."
      - name: latest_form
        description: "Recent-form string from fct_standings (e.g. WDLWW). Null when standings are absent for that season."
      - name: standings_group_description
        description: "API standings row description (e.g. group or stage label) from the same fct_standings row as latest_rank. Null when standings are absent. The provider may reuse the same label across different physical groups."

  - name: mart_player_profile
    description: >
      Player profile (#325). One row per (player, competition-season): the player's
      season profile, composed with dim_player identity and modal position. Metric
      governance is catalogue-only (v1): every metric is a metric_catalogue row (#327)
      computed by its catalogue formula — counts plus the four catalogued ratios
      (pass_accuracy_pct, duels_won_pct, dribbles_success_pct, save_pct). No invented
      metrics (no per-90, no goal_conversion, no player shot_accuracy) — those await a
      CPO-approved catalogue extension. Beyond catalogue metrics, only raw descriptors
      are carried (appearances/starts/minutes, identity, position). pass_accuracy_pct
      uses the catalogue's derived passes_accurate (per-fixture round then sum). save_pct
      is only meaningful for goalkeepers (position_code = 'G'); saves and
      shots_on_goal_against (GAP-12) carry its numerator/denominator for the GK
      full-triple display. Grain: (player_sk, season_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: player_profile_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: player_profile_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: player_profile_dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: player_profile_save_pct_in_range
      # GK full-triple (GAP-12): saves can never exceed shots on target faced
      - dbt_utils.expression_is_true:
          expression: "saves <= shots_on_goal_against"
          name: player_profile_saves_lte_faced
    columns:
      # #846: the season this player's page opens on — the most recent CLUB season, preferring a
      # domestic league, falling back to the most recent of any kind for a player with no club
      # football. Scoped to club because #848 made Overview, Performance and Career club-only.
      # Exactly one row per player is true by construction (`row_number() ... = 1`) and asserted
      # explicitly, including the NONE case, by tests/assert_one_featured_season_per_entity.sql.
      - name: is_featured_season
        tests: [not_null]
      - name: competition_type
        description: >
          The competition's type from the registry (domestic_league, domestic_cup,
          continental_cup, world_championship, …). Carried so the featured-season rule can prefer
          a league over a cup within club football, and so a consumer can tell the two apart
          without re-joining the registry.
      - name: entity_type
        description: >
          club or national, from the competition_types seed — what scopes the featured season to
          club football (#846/#848). NULL is reachable two ways, not one: a league_code absent from
          the registry, and a league_code PRESENT in the registry with a blank competition_type.
          The second is silent — sync_dbt_vars.py writes a seed row only `if code and ctype`, and
          both check_competition_type_seed.py and check_registry_var_sync.py skip such an entry on
          the same condition, so registry and seed agree by both being empty (#883). Every
          registry entry carries a competition_type today. not_null is here because a NULL would
          not break the page: the featured-season CASE simply treats it as non-club, so the entity
          would quietly open on the wrong season instead of failing.
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: player_season_sk
        tests: [unique, not_null]
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests: [not_null]
      - name: league_code
        description: "Partition key — app slices by this."
        tests: [not_null]
      - name: appearances
        tests: [not_null]
      - name: position_code
        description: "Most-frequent position that season (role badge). NULL when no fixture carried a position."
      - name: player_birth_place
        description: "Birth place (city), from dim_player bio."
      - name: player_birth_country
        description: "Birth country, from dim_player bio."
      - name: player_height
        description: "Height (e.g. '180 cm'), from dim_player bio."
      - name: player_weight
        description: "Weight (e.g. '75 kg'), from dim_player bio."
      - name: player_position
        description: "General/listed position from bio (distinct from position_code, the season modal)."
      # team affiliation (GAP-16): most-recent-match club this competition-season + current-club flag
      - name: team_sk
        description: >
          Club of the player's most recent finished match this competition-season (Option B,
          CPO-ruled 2026-06-30). FK to dim_team; null only when the player-season has no finished leg.
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: is_current_team
        description: >
          True on the player's current-club row (the season holding their globally most-recent finished
          match). Exactly one true per player by construction; the export selects current_team by this flag.
        tests: [not_null]
      - name: team_name
        description: "Affiliated club display name, from dim_team."
      - name: team_logo_url
        description: "Affiliated club crest URL, from dim_team."
      - name: team_country
        description: "Affiliated club country, from dim_team."

  - name: mart_player_match_log
    description: >
      Player match log (#325). One row per (player, finished fixture): the player's stat
      line plus match context (opponent, score, result from the player's team's
      perspective). Player-history-shaped (one player over time), distinct from the
      fixture-detail-shaped mart_player_fixture_stats (#323). Grain: (player_sk,
      fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, fixture_sk]
    columns:
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Partition key — the played fixture's competition."
        tests: [not_null]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: is_home
        tests: [not_null]

  - name: mart_fixture_standing_context
    description: >
      Phase-relevant standings context per upcoming-fixture side (epic #361). The single
      source of "this team's table position going into this fixture", shared by the MVP's
      mart_matchday_insights and the v2 fixtures export. league_rank (and the standing
      fields) are NULL for knockout rounds (is_knockout_round) and for overlapping-table
      leagues (a team with >1 section that season); group_name is kept regardless.
      Covers all upcoming fixtures. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "league_rank is null or league_rank >= 1"
          name: fixture_standing_context_rank_positive
    columns:
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: is_knockout
        tests: [not_null]

  - name: mart_head_to_head
    description: >
      Head-to-head (#375). All-time past meetings between two teams, directed: one row
      per (team_sk, opponent_team_sk) = that team's record vs that opponent, across all
      competitions. Feeds the fixture-page H2H context. Built from int_legs__team_match
      (core -> intermediate -> mart, not mart-from-mart). Raw record facts only — no
      derived ratios (the H2H record is fact, not a catalogue metric). recent_meetings is
      the most-recent ≤10 meetings (date, competition, score, result). A pair that never
      met has no row. Grain: (team_sk, opponent_team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, opponent_team_sk]
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = total_meetings"
          name: head_to_head_record_sums_to_total
      - dbt_utils.expression_is_true:
          expression: "wins_last5 + draws_last5 + losses_last5 = meetings_last5"
          name: head_to_head_last5_sums_to_meetings_last5
      - dbt_utils.expression_is_true:
          expression: "meetings_last5 = least(total_meetings, 5)"
          name: head_to_head_last5_capped_at_5
      # pair_key (GAP-19.4): the canonical pair identity is always present, and
      # is_canonical marks exactly the lower-id direction (derivation consistency)
      - dbt_utils.expression_is_true:
          expression: "pair_key is not null"
          name: head_to_head_pair_key_not_null
      - dbt_utils.expression_is_true:
          expression: "is_canonical = (team_sk < opponent_team_sk)"
          name: head_to_head_is_canonical_consistent
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: total_meetings
        tests: [not_null]
      - name: last_meeting_result
        tests:
          - accepted_values:
              values: ["W", "D", "L"]

  - name: mart_leaderboards
    description: >
      Per-board player leaderboards (the Leaderboards block; content_architecture §3). LONG — one row
      per (player, board): the player's rank on that board within its competition-season. Generalises
      the retired mart_top_scorers to 14 boards: 9 COUNT (goals, scorer_points, shots_on_goal,
      dribbles_success, passes_total, passes_key, duels_won, defensive_actions, cards_total) + 5 RATE
      (pass_accuracy_pct, duels_won_pct, dribbles_success_pct, finishing_efficiency, save_pct).
      Season-to-date, composed from int_player_season__metrics + dim_player. rank = DENSE_RANK over the
      board's metric desc within (league_code, season_api_year): ties share a rank, top-10 inclusive of
      ties; only positive-value players are ranked. RATE boards add a qualification rule (#506) so a tiny
      sample can't game a rate: minutes >= 270, a position scope (pass/duels/dribble/finishing = outfield,
      save = GK), plus shots_on_goal >= 10 for finishing. sort_value is FLOAT64 (holds the counts and
      the 0-1 rates). View. Grain: (player_sk, season_sk, metric_key).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "leaderboards"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and 10"
          name: mart_leaderboards_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "sort_value > 0"
          name: mart_leaderboards_sort_value_positive
      # RATE-board ratios are all bounded [0,1]. finishing_efficiency is now open-play
      # conversion in [0,1] (CPO Option A), so it is range-checked here like the other rates.
      # Rates are null when their denominator is zero.
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: mart_leaderboards_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: mart_leaderboards_duels_won_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_pct is null or (dribbles_success_pct between 0 and 1)"
          name: mart_leaderboards_dribbles_success_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "save_pct is null or (save_pct between 0 and 1)"
          name: mart_leaderboards_save_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: mart_leaderboards_finishing_efficiency_in_range
    columns:
      - name: player_leaderboard_sk
        description: "Surrogate from (player_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: metric_key
        description: "The board — a metric_catalogue metric_id (9 count + 5 rate boards = 14)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals", "scorer_points", "shots_on_goal", "dribbles_success", "passes_total", "passes_key", "duels_won", "defensive_actions", "cards_total", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency", "save_pct"]
      - name: rank
        description: "DENSE_RANK over the board's metric desc (ties share a rank). 1 is top; cut at 10."
        tests: [not_null]
      - name: sort_value
        description: "The board's own value the rank is computed from (always > 0). FLOAT64 — holds the integer counts and the 0-1 rates."
        tests: [not_null]
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a competition's boards."
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."
      # Denormalised season-to-date display atoms (from int_player_season__metrics): the per-board
      # breakdown values the UI shows alongside sort_value (the board's own ranked metric).
      - name: appearances
      - name: minutes
      - name: goals
      - name: assists
      - name: shots_on_goal
      - name: dribbles_attempts
      - name: dribbles_success
      - name: passes_total
      - name: passes_key
      - name: duels_total
      - name: duels_won
      - name: tackles_total
      - name: tackles_interceptions
      - name: tackles_blocks
      - name: cards_yellow
      - name: cards_red
      - name: scorer_points
        description: "goals + assists (the 'scorer_points' board's value)."
      - name: defensive_actions
        description: "tackles + interceptions + blocks (the 'defensive_actions' board's value)."
      - name: cards_total
        description: "cards_yellow + cards_red (the 'cards_total' board's value)."
      # RATE-board values (#506) — the player's season rate, carried on every row as a display
      # atom; each is the ranked value of its own board. Null when the denominator is zero.
      - name: pass_accuracy_pct
        description: "Pass completion rate — the 'pass_accuracy_pct' board's ranked value."
      - name: duels_won_pct
        description: "Duel win rate — the 'duels_won_pct' board's ranked value."
      - name: dribbles_success_pct
        description: "Dribble success rate — the 'dribbles_success_pct' board's ranked value."
      - name: save_pct
        description: "Goalkeeper save rate — the 'save_pct' board's ranked value."
      - name: finishing_efficiency
        description: "Open-play goal conversion (open-play goals per shot on target, in [0, 1]) — the 'finishing_efficiency' board's ranked value."

  - name: mart_team_market_value
    description: >
      WC national teams with latest squad market value estimate. Grain: team_sk. Metric name:
      market_value_eur. Populated when wc_team_market_value_snapshot seed (or future ingest) has rows.
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "market_value", "wc"]
    columns:
      - name: team_sk
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests:
          - not_null
          - accepted_values:
              values: ["WC"]
      - name: team_name
        tests: [not_null]
      - name: as_of_date
        description: "Snapshot date for market_value_eur; null when no estimate loaded."
      - name: market_value_eur
        description: "Published-style total squad estimate in whole EUR; null when unknown."
      - name: source_code
        description: "Provenance (e.g. GEMINI_RESEARCH_V1); null when no estimate loaded."

  - name: mart_team_fixtures
    description: >
      Team fixtures (GAP-15). One row per (team, fixture), team perspective — the
      team-profile "next fixture + recent results" surface. Spine = fct_fixture
      unpivoted to two team rows per fixture; opponent identity from dim_team;
      finished result (goals_for/against, W/D/L) reused from int_legs__team_match
      (not re-derived). Rank columns make consumption pure selection: upcoming_rank
      = 1 is the next fixture, recency_rank <= 5 the last five results. Live /
      postponed / cancelled rows carry null ranks. No slug (GAP-19 item 5, separate
      PR). Grain: (team_sk, fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, fixture_sk]
      # a result-leg row always carries its perspective result, and the ranked
      # recency population is exactly the result-leg rows
      - dbt_utils.expression_is_true:
          expression: "not has_result or result is not null"
          name: team_fixtures_result_present
      - dbt_utils.expression_is_true:
          expression: "recency_rank is null or result is not null"
          name: team_fixtures_recency_has_result
      - dbt_utils.expression_is_true:
          expression: "(upcoming_rank is null or upcoming_rank >= 1) and (recency_rank is null or recency_rank >= 1)"
          name: team_fixtures_ranks_positive
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: fixture_sk
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_code
        description: "Partition key — the app slices by this."
        tests: [not_null]
      - name: opponent_team_sk
        description: "The other side's team_sk; the row carries the team's perspective of the fixture."
      - name: result
        description: "W/D/L from int_legs__team_match for finished rows; null otherwise."
        tests:
          - accepted_values:
              values: ["W", "D", "L"]

  - name: mart_roster
    description: >
      Club roster identity list — feeds the Squad tab alongside mart_player_career (content_architecture §3). One row per
      rostered player per (club team, competition-season), from dim_player_team_season_mapping
      joined to dim_player. Scoped to club competitions (entity_type = 'club', via
      competition_registry + competition_types — never a dim_team flag). Identity only: name,
      listed position, nationality, birth_date, photo; NO per-club stat columns of its own — the
      Squad tab's per-player stats come from mart_player_career (#480), joined at the export. Age is derived at render from player_birth_date (a stored age
      would be non-deterministic). dim_player is LEFT-joined so a membership with no player
      entity surfaces via the relationships test, not a silent drop. View. league_code is the
      partition key; season_sk is nullable (roster season with no competition-season row).
      Grain: (team_sk, league_code, season_api_year, player_sk).
    config:
      tags: ["marts", "football", "roster"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, player_sk]
    columns:
      - name: player_team_season_sk
        description: "Surrogate carried from dim_player_team_season_mapping (player, team, league_code, season)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team (the club)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a club's squad for a competition-season."
        tests: [not_null]
      - name: season_api_year
        description: "The roster season; always present (anchors the grain even when season_sk is null)."
        tests: [not_null]
      - name: season_sk
        description: "FK to dim_competition_season; nullable (roster season with no competition-season row)."
      - name: competition_type
        description: "From competition_registry; the mart is filtered to club types."
      - name: entity_type
        description: "Always 'club' — the mart is club-scoped via competition_types."
        tests:
          - not_null
          - accepted_values:
              values: ["club"]
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_position
        description: "Listed/bio position from dim_player (general position, not a per-season modal)."
      - name: player_nationality
        description: "Denormalised from dim_player."
      - name: player_birth_date
        description: "Birth date from dim_player bio; age is computed at render."
      - name: player_photo_url
        description: "Player photo URL from dim_player; nullable."

  - name: mart_team_competition_benchmarks
    description: >
      Team competition benchmark (the vs-benchmark block; content_architecture §6). LONG — one row per
      (team, season, metric_key) over the 22 team season metrics. Places each team against its league that
      season: value, league_median (+ mean), p25/p75 spread, rank (k of team_count), value - median.
      DIRECTION-AGNOSTIC (positional) — rank is by value desc within (league_code, season_api_year,
      metric_key); the good/bad reading is supplied at display from the catalogue's direction. Median-led,
      rank not percentile (honest at N~18). Season-to-date (W2); teams with >= 3 games. View. Player
      benchmark + percentile = v1.x. Grain: (team_sk, season_sk, metric_key).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and team_count"
          name: mart_competition_benchmarks_team_rank_in_range
    columns:
      - name: team_benchmark_sk
        description: "Surrogate from (team_sk, season_sk, metric_key)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "Partition key — app slices by this to retrieve a competition's benchmarks."
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 22-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets", "shots_per_match", "shot_accuracy", "danger_zone_ratio", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "sot_difference_per_match", "finishing_efficiency", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "pass_accuracy", "key_passes_per_match", "corner_kicks_per_match", "corners_against_per_match", "save_ratio"]
      - name: metric_value
        description: "The team's season-to-date value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: league_mean
        description: "Mean team value this league-season (the 'league average'; skew-sensitive)."
      - name: league_median
        description: "Median team value this league-season (the typical team — the headline reference)."
      - name: league_p25
        description: "25th-percentile team value (distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (distribution spread)."
      - name: team_count
        description: "N — teams ranked for this metric this league-season."
        tests: [not_null]
      - name: rank
        description: "Rank by value desc (1 = highest), k of team_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - league_median."
      - name: team_name
        description: "Denormalised from dim_team."
      - name: team_logo_url
        description: "Denormalised from dim_team; nullable."

  - name: mart_player_competition_benchmarks
    description: >
      Player competition benchmark (the vs-benchmark block; content_architecture §6). LONG — one row per
      (player, season, position_group, metric_key). Places each player against his positional peers that
      competition-season: in-position per-90 (or rate) value, peer_median (+ mean), p25/p75 spread, rank
      (k of peer_count) AND percentile, value - median; minutes + appearances carried (sample visible).
      DIRECTION-AGNOSTIC (positional) — rank by value desc / percentile by value within (league_code,
      season_api_year, position_group, metric_key); the good/bad reading comes from the catalogue direction
      at display. Floor: minutes >= 270 in the position (finishing also >= 10 shots on target). Multi-
      position players appear once per qualifying position. Metric x position eligibility = the
      player_benchmark_metrics() macro (GK = 4 keeper metrics; outfield = the other 16). View.
      Grain: (player_sk, season_sk, position_group, metric_key).
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, position_group, metric_key]
      - dbt_utils.expression_is_true:
          expression: "rank between 1 and peer_count"
          name: mart_competition_benchmarks_player_rank_in_range
      - dbt_utils.expression_is_true:
          expression: "percentile >= 0 and percentile <= 1"
          name: mart_competition_benchmarks_player_percentile_in_range
      # finishing_efficiency is the one bounded metric in the LONG metric_value column (the
      # per-90 metrics are unbounded). It is open-play conversion in [0,1] (CPO Option A) —
      # range-check the finishing rows; this is the only finishing surface on the player benchmark.
      - dbt_utils.expression_is_true:
          expression: "metric_key != 'finishing_efficiency' or metric_value is null or (metric_value between 0 and 1)"
          name: mart_competition_benchmarks_player_finishing_in_range
      # GAP-21 (#391): the 5 ratio metrics carry their volume (num/den) for the no-naked-% triple; the 13
      # per-90 metrics do not. num AND den are non-null EXACTLY on the ratio rows (and, since a ranked row
      # always has a non-null metric_value, safe_divide guarantees a non-null, non-zero den there).
      - dbt_utils.expression_is_true:
          expression: "(metric_key in ('save_pct', 'pass_accuracy_pct', 'finishing_efficiency', 'dribbles_success_pct', 'duels_won_pct')) = (metric_numerator is not null and metric_denominator is not null)"
          name: mart_competition_benchmarks_player_ratio_atoms_present
    columns:
      - name: player_benchmark_sk
        description: "Surrogate from (player_sk, season_sk, position_group, metric_key)."
        tests: [not_null, unique]
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "Partition key — the app slices by this to retrieve a competition's benchmarks."
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT (from the match-time position_code)."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id (the 18-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "key_passes_per90", "dribbles_success_per90", "passes_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency", "save_pct"]
      - name: metric_value
        description: "The player's in-position value for this metric (always present — null values are not ranked)."
        tests: [not_null]
      - name: metric_numerator
        description: >
          GAP-21 (#391): the count behind a RATIO metric's % (e.g. duels_won for duels_won_pct), so the Stats
          screen can render the no-naked-% volume triple {num} of {den} · {pct}%. Non-null ONLY on the 5 ratio
          rows (save_pct, pass_accuracy_pct, finishing_efficiency, dribbles_success_pct, duels_won_pct); null
          on the 13 per-90 rows. From int_player_season_position__metrics atoms, gated identically to
          metric_value — never derived in the export.
      - name: metric_denominator
        description: "The denominator behind a ratio metric's % (see metric_numerator; e.g. duels_total). Null on per-90 rows."
      - name: peer_mean
        description: "Mean peer value this league-season-position (skew-sensitive)."
      - name: peer_median
        description: "Median peer value this league-season-position (the typical player — the headline reference)."
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
      - name: peer_count
        description: "N — players ranked for this metric in this league-season-position."
        tests: [not_null]
      - name: rank
        description: "Rank by value desc (1 = highest), k of peer_count. Positional — orient with the catalogue direction at display."
        tests: [not_null]
      - name: percentile
        description: "percent_rank by value asc in [0, 1] — fraction of peers strictly below this value (0 = lowest or tied-lowest, ~1 = top). Direction-agnostic; orient at display."
        tests: [not_null]
      - name: vs_median_delta
        description: "value - peer_median (always present — both inputs are non-null)."
        tests: [not_null]
      - name: minutes
        description: "Minutes played in the position this season (the sample behind the value)."
      - name: appearances
        description: "Appearances in the position this season."
      - name: player_name
        description: "Denormalised from dim_player."
      - name: player_nationality
        description: "Denormalised from dim_player; nullable."
      - name: player_photo_url
        description: "Denormalised from dim_player; nullable."

  - name: mart_player_career
    description: >
      Player Career log (#480 §8.3): one row per (player, CLUB, competition-season) — the player's
      appearances / goals / assists at that club that season + player identity (dim_player) + club identity
      (dim_team) + the competition entity_type (club / national). Transfermarkt-shaped: a mid-season
      transfer shows as two rows (two clubs, one season); club and national rows are handled uniformly.
      National-entity rows are the player's NATIONAL APPEARANCES IN COVERED COMPETITIONS — honestly NOT true
      career caps (we ingest only a subset of national competitions). national_appearances_total denormalises
      the per-player national-appearance sum (a fact computed in dbt, not the export). Built from
      finished-match player-stat rows, so a row means the player was in that club's matchday squad at least
      once that competition-season; `appearances` counts only the legs he actually PLAYED (minutes > 0) and
      may legitimately be 0 for a squad member who never got on the pitch, whose row is KEPT (CPO
      2026-07-23). Until 2026-07-23 appearances counted every matchday selection, inflating 51.4% of rows.
      Composes int_player_club_season__metrics. Grain: (player_sk, team_sk, season_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - season_sk
      # Appearances can no longer be negative but CAN be 0: since 2026-07-23 an appearance requires pitch
      # time, and a squad member who was never brought on keeps his row scoring 0 (CPO ruling). The old
      # expression here was `appearances >= 1`, which asserted this mart excluded never-played members —
      # the exact premise the CPO overturned, and which the data never satisfied anyway (26,530 rows).
      # So this is narrowed to what still holds, not loosened to make a change pass.
      - dbt_utils.expression_is_true:
          expression: "appearances >= 0"
          name: player_career_appearances_non_negative
      # minutes never negative (sum of coalesce(minutes_played, 0) in the atoms base).
      - dbt_utils.expression_is_true:
          expression: "minutes >= 0"
          name: player_career_minutes_non_negative
      # minutes_per_appearance = safe_divide(minutes, appearances): null exactly when appearances = 0
      # (a squad member who never played — 26,657 such rows since #813), non-negative otherwise. Both
      # branches fire on real rows, so this is not vacuous: it catches a raw divide (would error on the
      # 0-appearance rows), a negative minutes, or a stray value on a never-played row.
      - dbt_utils.expression_is_true:
          expression: "(appearances = 0 and minutes_per_appearance is null) or (appearances > 0 and minutes_per_appearance >= 0)"
          name: player_career_minutes_per_appearance_null_safe
    columns:
      - name: player_career_sk
        description: "Surrogate key — generate_surrogate_key(player_sk, team_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "Player entity key."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "Club (or national team) the player turned out for that competition-season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "Competition-season key (encodes league + year)."
        tests: [not_null]
      - name: league_code
        description: "Competition code (the partition key)."
        tests: [not_null]
      - name: entity_type
        description: "club or national (from the registry -> competition_types seeds); null if the competition is unmapped."
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: appearances
        description: "Finished matches the player actually PLAYED for this club that competition-season (minutes > 0). 0 is legitimate: a squad member never brought on keeps his row. Before 2026-07-23 this counted matchday selections including unused substitutes."
        tests: [not_null]
      - name: minutes
        description: "Minutes played at this club that competition-season (raw seasonal sum, carried up unchanged from int_player_club_season__metrics; a playing-time dimension, not a catalogue metric — exempt in assert_no_uncatalogued_season_metric)."
      - name: minutes_per_appearance
        description: "Average minutes per appearance: safe_divide(minutes, appearances), computed here so the consumption layer never divides. Null when appearances = 0 (a squad member who never played); non-negative otherwise. A catalogue-governed rate (metric_catalogue: minutes_per_appearance, direction neutral, a role read); powers the Squad tab's mins/app."
      - name: national_appearances_total
        description: "Per-player denormalised sum of appearances across national-entity rows only (covered comps — not true career caps)."
        tests: [not_null]
      - name: last_kickoff_at
        description: "The player's latest match at this club that competition-season (max kickoff, from int_player_club_season__metrics); a career-log ordering signal (within-club season order), not a displayed metric."
      - name: club_latest_kickoff_at
        description: "The club's latest match across all the player's seasons there (window max of last_kickoff_at over player+club); the export's primary career-log ordering signal (club-block order + contiguity), not a displayed metric."
