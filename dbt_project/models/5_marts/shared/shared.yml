  - name: mart_head_to_head
    description: >
      One team's all-time record against one opponent, across every competition. Directed, so a
      pair appears twice, once from each side. Grain: (team_sk, opponent_team_sk).

      Built from int_legs__team_match. Raw record facts only, with no derived ratios — a
      head-to-head record is a fact rather than a catalogue metric. recent_meetings holds up to
      the ten most recent meetings, each with date, competition, score and result.

      A pair that has never met has no row at all.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, opponent_team_sk]
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = total_meetings"
          name: head_to_head_record_sums_to_total
      - dbt_utils.expression_is_true:
          expression: "wins_last5 + draws_last5 + losses_last5 = meetings_last5"
          name: head_to_head_last5_sums_to_meetings_last5
      - dbt_utils.expression_is_true:
          expression: "meetings_last5 = least(total_meetings, 5)"
          name: head_to_head_last5_capped_at_5
      # pair_key (GAP-19.4): the canonical pair identity is always present, and
      # is_canonical marks exactly the lower-id direction (derivation consistency)
      - dbt_utils.expression_is_true:
          expression: "pair_key is not null"
          name: head_to_head_pair_key_not_null
      - dbt_utils.expression_is_true:
          expression: "is_canonical = (team_sk < opponent_team_sk)"
          name: head_to_head_is_canonical_consistent
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: opponent_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: total_meetings
        tests: [not_null]
      - name: last_meeting_result
        tests:
          - accepted_values:
              values: ["W", "D", "L"]
      - name: wins
      - name: draws
      - name: losses
      - name: goals_for
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: meetings_last5
      - name: wins_last5
      - name: draws_last5
      - name: losses_last5
      - name: last_meeting_at
      - name: last_meeting_league_code
      - name: last_meeting_goals_for
      - name: last_meeting_goals_against
      - name: recent_meetings
      - name: recent_meetings.goals_against
      - name: recent_meetings.goals_for
      - name: recent_meetings.kickoff_datetime
      - name: recent_meetings.league_code
      - name: recent_meetings.result
