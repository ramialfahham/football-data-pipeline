version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_competition_index
    description: >
      One row per competition: its identity, type, region, crest and the facts needed to put a
      list of competitions in order. Grain: league_code.

      Composed from the registry, competition-type and confederation seeds, dim_league and
      fct_fixture, so everything about a competition is available from one place.

      It carries the ordering INPUTS as facts — next_kickoff_datetime, last_kickoff_datetime,
      region_rank — and deliberately does not pre-bake an ORDER BY: sorting is arrangement, not a
      fact about a competition.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code]
    columns:
      - name: league_code
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('competition_registry')
              field: league_code
      - name: competition_type
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type
      - name: entity_type
        description: "From competition_types.entity_type — club or national. Also a page filter axis."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: slug
        description: "From competition_registry.slug — the row's link target."
        tests: [not_null]
      - name: category_label_en
        description: "From competition_types.label_en — the category heading text."
        tests: [not_null]
      - name: category_label_i18n_key
        description: "From competition_types.label_i18n_key — the category heading's i18n key."
        tests: [not_null]
      - name: confederation
        description: "From competition_registry.confederation — also a page filter axis."
        tests:
          - not_null
          - relationships:
              to: ref('confederations')
              field: confederation
      - name: region_rank
        description: "From confederations.region_rank — the one hand-set ordering input."
        tests: [not_null]
      - name: competition_name
        description: >
          From dim_league.league_name. NULL when the competition has never been ingested.
      - name: logo_url
        description: >
          From dim_league.league_logo_url. NULL for a competition with no crest ingested, or
          never ingested at all.
      - name: region_label_en
        description: >
          The competition's country if it has one (league_country), otherwise its region's English
          label (the confederation's label_en). Never both and never neither: every registry row's
          confederation is foreign-key guaranteed to resolve, so exactly one of the two is always
          available.
        tests: [not_null]
      - name: region_label_i18n_key
        description: >
          The region's i18n key, or NULL when region_label_en is a country name. A country name is
          an entity name rather than interface text, so it is not translated.
      - name: next_kickoff_datetime
        description: "Earliest upcoming fixture kickoff for this league_code. NULL when nothing is scheduled."
      - name: last_kickoff_datetime
        description: "Most recent past fixture kickoff for this league_code. NULL when nothing has ever been played."

  - name: mart_team_momentum
    description: >
      Recent-form metrics for each side of an upcoming fixture, over the last-5 window. Grain:
      (upcoming_fixture_sk, team_sk).

      Every final team metric is computed here from the raw sums in int_team_momentum__metrics:
      all ratios and per-match rates live in this model, none in the builder beneath it.

      league_rank is deliberately absent — a table position comes from the standings surface, not
      from a form window. Player-derived metrics (key_passes_per_match through duels_won_pct) are
      NULL when the window has no player stats.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      # Ratio bounds [0,1] — guards the same-window contract at the source.
      # A value > 1 means numerator and denominator were computed over different
      # game sets (a coverage-window bug), so these must stay strict.
      - dbt_utils.expression_is_true:
          expression: "shot_accuracy is null or (shot_accuracy between 0 and 1)"
          name: momentum_team_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "danger_zone_ratio is null or (danger_zone_ratio between 0 and 1)"
          name: momentum_team_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: momentum_team_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy is null or (pass_accuracy between 0 and 1)"
          name: momentum_team_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "save_ratio is null or (save_ratio between 0 and 1)"
          name: momentum_team_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: momentum_team_duels_won_pct_in_range
      # clean sheets are scoreline-based: always present, bounded by the window
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_in_window"
          name: momentum_team_clean_sheets_in_range
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window this row's values were computed over: last_5 by default, or
          tournament_to_date / qualifiers on a tournament fixture.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        tests: [not_null]
      - name: games_with_team_stats
        description: "Window legs with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: contributing_competitions
      - name: games_with_player_stats
      - name: points_won
        description: "{{ doc('points_won') }}"
      - name: clean_sheets
        description: "{{ doc('clean_sheets') }}"
      - name: goals_per_match
        description: "{{ doc('goals_per_match') }}"
      - name: goals_against_per_match
        description: "{{ doc('goals_against_per_match') }}"
      - name: shots_per_match
        description: "{{ doc('shots_per_match') }}"
      - name: shot_accuracy
        description: "{{ doc('shot_accuracy') }}"
      - name: danger_zone_ratio
        description: "{{ doc('danger_zone_ratio') }}"
      - name: shots_on_goal_per_match
        description: "{{ doc('shots_on_goal_per_match') }}"
      - name: finishing_efficiency
        description: "{{ doc('finishing_efficiency__team') }}"
      - name: passes_per_match
        description: "{{ doc('passes_per_match') }}"
      - name: pass_accuracy
        description: "{{ doc('pass_accuracy') }}"
      - name: corner_kicks_per_match
        description: "{{ doc('corner_kicks_per_match') }}"
      - name: corners_against_per_match
        description: "{{ doc('corners_against_per_match') }}"
      - name: save_ratio
        description: "{{ doc('save_ratio') }}"
      - name: key_passes_per_match
        description: "{{ doc('key_passes_per_match') }}"
      - name: tackles_per_match
        description: "{{ doc('tackles_per_match') }}"
      - name: interceptions_per_match
        description: "{{ doc('interceptions_per_match') }}"
      - name: blocks_per_match
        description: "{{ doc('blocks_per_match') }}"
      - name: defensive_actions_per_match
        description: "{{ doc('defensive_actions_per_match') }}"
      - name: duels_per_match
        description: "{{ doc('duels_per_match') }}"
      - name: duels_won_pct
        description: "{{ doc('duels_won_pct__team') }}"

  - name: mart_player_momentum
    description: >
      Recent-form metrics per player for each side of an upcoming fixture, over the same window
      as mart_team_momentum. Grain: (upcoming_fixture_sk, team_sk, player_sk).

      Raw counts (goals, assists, cards, …) pass through unchanged from the builder. The ratios —
      save_pct, dribbles_success_pct, pass_accuracy_pct, duels_won_pct — are computed here with
      safe_divide, so a zero denominator gives NULL rather than an error.

      save_pct is only meaningful for goalkeepers (position_code = 'G').
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      # top_player_rank (GAP-19.2): strict per-side pick order, starts at 1 and is
      # unique within each (upcoming_fixture_sk, team_sk) side (guards upstream fan-out)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, top_player_rank]
      - dbt_utils.expression_is_true:
          expression: "top_player_rank >= 1"
          name: momentum_player_rank_positive
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window this row's values were computed over, carried from the builder: last_5
          by default, or tournament_to_date / qualifiers on a tournament fixture.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "The player's appearance count within the side's window (1..5 for last_5, uncapped for tournament windows)."
        tests: [not_null]
      - name: position_code
        description: "Player position code (e.g. G, D, M, F). Used to scope save_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: goals_total
      - name: goals_assists
      - name: saves
        description: "{{ doc('saves') }}"
      - name: shots_on
      - name: passes_key
        description: "{{ doc('passes_key') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: tackles_total
        description: "{{ doc('tackles_total') }}"
      - name: tackles_blocks
        description: "{{ doc('tackles_blocks') }}"
      - name: tackles_interceptions
        description: "{{ doc('tackles_interceptions') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_past
        description: "{{ doc('dribbles_past') }}"
      - name: offsides
        description: "{{ doc('offsides') }}"
      - name: penalty_won
        description: "{{ doc('penalty_won') }}"
      - name: penalty_committed
        description: "{{ doc('penalty_committed') }}"
      - name: cards_yellow
        description: "{{ doc('cards_yellow') }}"
      - name: cards_red
        description: "{{ doc('cards_red') }}"
      - name: save_pct
        description: "{{ doc('save_pct') }}"
      - name: dribbles_success_pct
        description: "{{ doc('dribbles_success_pct') }}"
      - name: pass_accuracy_pct
        description: "{{ doc('pass_accuracy_pct') }}"
      - name: duels_won_pct
        description: "{{ doc('duels_won_pct__player') }}"
      - name: top_player_rank

  - name: mart_team_momentum_window
    description: >
      The individual past matches behind a side's momentum figures: the same window
      mart_team_momentum aggregates, listed rather than summed. Grain: (upcoming_fixture_sk,
      team_sk, played_fixture_sk).

      played_fixture_sk identifies each past match, so a per-fixture stat line can be looked up
      from here. has_team_stats and has_player_stats are computed against the per-fixture stat
      marts, so true means detail genuinely exists rather than that it ought to.

      assert_momentum_window_matches_momentum guards that these rows and the aggregate stay
      consistent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, played_fixture_sk]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, recency_rank]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }} Here it is the UPCOMING fixture's competition; the past match's own competition is played_league_code."
        tests: [not_null]
      - name: window_type
        description: >
          Which form window this row belongs to: last_5 by default, or tournament_to_date /
          qualifiers on a tournament fixture. Tournament windows are cumulative rather than capped,
          so a side can have more than five rows.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent past match in the window."
        tests: [not_null]
      - name: played_fixture_sk
        description: "The past match this row is about; joins to the per-fixture stat marts."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: opponent_team_sk
        tests: [not_null]
      - name: has_team_stats
        description: "True when mart_team_fixture_stats has rows for this played fixture + team (API shell rows with all-NULL stats count as no data)."
        tests: [not_null]
      - name: has_player_stats
        description: "True when mart_player_fixture_stats has rows for this played fixture + team. False is the common case — many competitions lack player stats."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: entity_type
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: played_league_code
      - name: played_kickoff_datetime
      - name: played_round_name
      - name: home_away
      - name: goals_for
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: opponent_name
      - name: opponent_logo_url

  - name: mart_team_fixture_stats
    description: >
      One team's stat line from one finished match, with the fixture's own details and the team's
      identity alongside. Both sides of a fixture appear, as two rows. Grain: (fixture_sk,
      team_sk).

      A pure projection of fct_fixture_team_stats — nothing is derived here.

      Covers finished fixtures that have team stats. Provider shell rows, where the statistics
      block exists but every value is NULL, are excluded, so a fixture missing from here has no
      usable stats rather than zero of everything.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }} Here it is the PLAYED fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
      - name: round_name
      - name: team_name
      - name: team_logo_url
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal') }}"
      - name: shots_off_goal
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_blocked
      - name: shots_inside_box
      - name: shots_outside_box
      - name: fouls
      - name: corner_kicks
      - name: offsides
        description: "{{ doc('offsides') }}"
      - name: ball_possession_percent
      - name: yellow_cards
      - name: red_cards
      - name: goalkeeper_saves
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate') }}"
      - name: passes_accuracy_percent
      - name: goals_for
      - name: goals_against
        description: "{{ doc('goals_against') }}"

  - name: mart_player_fixture_stats
    description: >
      One player's stat line from one finished match, with player and team identity alongside.
      Grain: (fixture_sk, team_sk, player_sk).

      A pure projection of fct_fixture_player_stats — nothing is derived here.

      A fixture with no rows here has no player stats at all, which is the COMMON case: many
      competitions do not supply them. Absence means unavailable, never zero.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk, player_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "{{ doc('league_code') }} Here it is the PLAYED fixture's competition."
        tests: [not_null]
      - name: is_home
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
      - name: round_name
      - name: team_name
      - name: player_name
      - name: player_photo_url
      - name: position_code
      - name: shirt_number
      - name: minutes_played
      - name: is_captain
      - name: is_substitute
      - name: is_starter
      - name: offsides
        description: "{{ doc('offsides') }}"
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_on
      - name: goals_total
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: goals_assists
      - name: saves
        description: "{{ doc('saves') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_key
        description: "{{ doc('passes_key') }}"
      - name: passes_accuracy_percent
      - name: tackles_total
        description: "{{ doc('tackles_total') }}"
      - name: tackles_blocks
        description: "{{ doc('tackles_blocks') }}"
      - name: tackles_interceptions
        description: "{{ doc('tackles_interceptions') }}"
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: dribbles_past
        description: "{{ doc('dribbles_past') }}"
      - name: fouls_drawn
      - name: fouls_committed
      - name: cards_yellow
        description: "{{ doc('cards_yellow') }}"
      - name: cards_red
        description: "{{ doc('cards_red') }}"
      - name: penalty_won
        description: "{{ doc('penalty_won') }}"
      - name: penalty_committed
        description: "{{ doc('penalty_committed') }}"
      - name: penalty_scored
      - name: penalty_missed
      - name: penalty_saved

  - name: mart_team_profile
    description: >
      A team's season in one row: identity, record, rank and form, full-season metric rates,
      year-over-year movement, streaks and the deserved-versus-actual points gap.
      Grain: (team_sk, season_sk).

      Composed from dim_team, mart_team_season and the int_team_season__* / int_team_profile__*
      models. Those columns are selected unchanged, so their tests stay upstream.

      DOMESTIC LEAGUES ONLY for the deserved-versus-actual and year-over-year columns: every
      tournament row is NULL there, a within-group standing not being a comparable league
      position. Year-over-year is also NULL without an ingested prior season.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "shot_share is null or (shot_share between 0 and 1)"
          name: team_profile_shot_share_in_range
      - dbt_utils.expression_is_true:
          expression: "points_capture is null or (points_capture between 0 and 1)"
          name: team_profile_points_capture_in_range
      # GAP-13 season variant of the duel win rate — same-window ratio bound
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: team_profile_duels_won_pct_in_range
      # finishing_efficiency is open-play conversion in [0,1] (CPO Option A)
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency is null or (finishing_efficiency between 0 and 1)"
          name: team_profile_finishing_efficiency_in_range
    columns:
      - name: is_featured_season
        description: >
          True on the one season that represents this team: its most recent domestic-league
          season, falling back to its most recent season of any type when it has none.

          Exactly one row per team is true, by construction. Both that and the no-row-true case
          are asserted by tests/assert_one_featured_season_per_entity.sql.
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: competition_type
        description: "From the registry; YoY columns are populated only for domestic_league."
      - name: points_delta_yoy
        description: >
          This season's points minus last season's, compared through the same number of games
          played. Domestic leagues only; NULL when there is no prior season.
      - name: goals_per_match_delta_yoy
        description: >
          One example of the year-over-year rate columns: every rate metric carries a
          _this_season, a _prev_season and a _delta_yoy, aligned by matchday so the two seasons
          are compared over the same number of games.

          From int_team_profile__yoy. Domestic leagues only, and NULL where there is no prior
          season or where coverage through that matchday is incomplete.
      - name: deserved_rank
        description: "{{ doc('deserved_rank') }}"
      - name: deserved_points
        description: "{{ doc('deserved_points') }}"
      - name: sot_points_gap
        description: "{{ doc('sot_points_gap') }}"
      - name: team_founded_year
        description: "Club founded year, from dim_team. Nullable — sparse in the provider feed."
      - name: venue_name
        description: "Home venue name, from dim_team. Nullable."
      - name: venue_city
        description: "Home venue city, from dim_team. Nullable."
      - name: venue_capacity
        description: "Home venue capacity, from dim_team. Nullable."
      - name: league_sk
        description: "{{ doc('league_sk') }}"
