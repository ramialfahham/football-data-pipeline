version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_competition_index
    description: >
      One row per competition: its identity, type, region, crest and the facts needed to put a
      list of competitions in order. Grain: league_code.

      Composed from the registry, competition-type and confederation seeds, dim_league and
      fct_fixture, so everything about a competition is available from one place.

      It carries the ordering INPUTS as facts — next_kickoff_datetime, last_kickoff_datetime,
      region_rank — and deliberately does not pre-bake an ORDER BY: sorting is arrangement, not a
      fact about a competition.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('competition_registry')
              field: league_code
      - name: competition_type
        description: "{{ doc('competition_type') }}"
        tests:
          - not_null
          - relationships:
              to: ref('competition_types')
              field: competition_type
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: slug
        description: "From competition_registry.slug — the row's link target."
        tests: [not_null]
      - name: category_label_en
        description: "From competition_types.label_en — the category heading text."
        tests: [not_null]
      - name: category_label_i18n_key
        description: "From competition_types.label_i18n_key — the category heading's i18n key."
        tests: [not_null]
      - name: confederation
        description: "From competition_registry.confederation — also a page filter axis."
        tests:
          - not_null
          - relationships:
              to: ref('confederations')
              field: confederation
      - name: region_rank
        description: "From confederations.region_rank — the one hand-set ordering input."
        tests: [not_null]
      - name: competition_name
        description: >
          From dim_league.league_name. NULL when the competition has never been ingested.
      - name: logo_url
        description: >
          From dim_league.league_logo_url. NULL for a competition with no crest ingested, or
          never ingested at all.
      - name: region_label_en
        description: >
          The competition's country if it has one (league_country), otherwise its region's English
          label (the confederation's label_en). Never both and never neither: every registry row's
          confederation is foreign-key guaranteed to resolve, so exactly one of the two is always
          available.
        tests: [not_null]
      - name: region_label_i18n_key
        description: >
          The region's i18n key, or NULL when region_label_en is a country name. A country name is
          an entity name rather than interface text, so it is not translated.
      - name: next_kickoff_datetime
        description: "Earliest upcoming fixture kickoff for this league_code. NULL when nothing is scheduled."
      - name: last_kickoff_datetime
        description: "Most recent past fixture kickoff for this league_code. NULL when nothing has ever been played."

  - name: mart_team_momentum
    description: >
      Recent-form metrics for each side of an upcoming fixture, over the last-5 window. Grain:
      (upcoming_fixture_sk, team_sk).

      Every final team metric is computed here from the raw sums in int_team_momentum__metrics:
      all ratios and per-match rates live in this model, none in the builder beneath it.

      league_rank is deliberately absent — a table position comes from the standings surface, not
      from a form window. Player-derived metrics (passes_key_per_match through duels_won_pct) are
      NULL when the window has no player stats.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
      # Ratio bounds [0,1] — guards the same-window contract at the source.
      # A value > 1 means numerator and denominator were computed over different
      # game sets (a coverage-window bug), so these must stay strict.
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_pct is null or (shots_on_goal_pct between 0 and 1)"
          name: momentum_team_shots_on_goal_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "shots_inside_box_pct is null or (shots_inside_box_pct between 0 and 1)"
          name: momentum_team_shots_inside_box_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency_pct is null or (finishing_efficiency_pct between 0 and 1)"
          name: momentum_team_finishing_efficiency_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_pct is null or (passes_accuracy_pct between 0 and 1)"
          name: momentum_team_passes_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "saves_pct is null or (saves_pct between 0 and 1)"
          name: momentum_team_saves_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "duels_won_pct is null or (duels_won_pct between 0 and 1)"
          name: momentum_team_duels_won_pct_in_range
      # clean sheets are scoreline-based: always present, bounded by the window
      - dbt_utils.expression_is_true:
          expression: "clean_sheets between 0 and games_in_window"
          name: momentum_team_clean_sheets_in_range
      - dbt_utils.expression_is_true:
          expression: "goals_per_match is null or goals_per_match >= 0"
          name: momentum_team_goals_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "goals_against_per_match is null or goals_against_per_match >= 0"
          name: momentum_team_goals_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_per_match is null or shots_per_match >= 0"
          name: momentum_team_shots_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_per_match is null or shots_on_goal_per_match >= 0"
          name: momentum_team_shots_on_goal_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_per_match is null or passes_per_match >= 0"
          name: momentum_team_passes_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_per_match is null or corners_per_match >= 0"
          name: momentum_team_corners_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "corners_against_per_match is null or corners_against_per_match >= 0"
          name: momentum_team_corners_against_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_key_per_match is null or passes_key_per_match >= 0"
          name: momentum_team_passes_key_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "tackles_per_match is null or tackles_per_match >= 0"
          name: momentum_team_tackles_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "interceptions_per_match is null or interceptions_per_match >= 0"
          name: momentum_team_interceptions_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "blocks_per_match is null or blocks_per_match >= 0"
          name: momentum_team_blocks_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "defensive_actions_per_match is null or defensive_actions_per_match >= 0"
          name: momentum_team_defensive_actions_per_match_non_negative
      - dbt_utils.expression_is_true:
          expression: "duels_per_match is null or duels_per_match >= 0"
          name: momentum_team_duels_per_match_non_negative
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window this row's values were computed over: last_5 by default, or
          tournament_to_date / qualifiers on a tournament fixture.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "How many past matches make up this side's form window: 5 for a last_5 window (fewer only before a team has 5 finished matches to draw on), or the full cumulative count of tournament matches so far on a tournament_to_date or qualifiers window. The denominator every per-match rate on this row divides by."
        tests: [not_null]
      - name: games_expecting_team_stats
        description: "Window legs that COULD carry a team stat line — the window size minus any awarded result (technical loss, walkover), which is decided off the pitch and never has one. Every team-stat rate below is NULL unless its coverage count reaches this, so an awarded match is not read as a missing stat and does not blank a team's form figures."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Window legs with shots_total present — the coverage count of that one input, the gate and denominator of shots_per_match. Every rate here is NULL unless each input it reads is present in every non-awarded leg, each input by its own count in the builder. Never NULL."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: contributing_competitions
        description: "{{ doc('contributing_competitions') }}"
      - name: games_with_player_stats
        description: "Window legs with a row in int_legs__team_from_players — the gate and denominator of the player-derived rates (passes_key_per_match through duels_won_pct), which are NULL unless every non-awarded leg is covered. Never NULL."
        tests: [not_null]
      - name: points_won
        description: "{{ doc('points_won') }}"
      - name: clean_sheets
        description: "{{ doc('clean_sheets') }}"
      - name: goals_per_match
        description: "{{ doc('goals_per_match') }}"
      - name: goals_against_per_match
        description: "{{ doc('goals_against_per_match') }}"
      - name: shots_per_match
        description: "{{ doc('shots_per_match') }}"
      - name: shots_on_goal_pct
        description: "{{ doc('shots_on_goal_pct') }}"
      - name: shots_inside_box_pct
        description: "{{ doc('shots_inside_box_pct') }}"
      - name: shots_on_goal_per_match
        description: "{{ doc('shots_on_goal_per_match') }}"
      - name: finishing_efficiency_pct
        description: "{{ doc('finishing_efficiency_pct') }}"
      - name: passes_per_match
        description: "{{ doc('passes_per_match') }}"
      - name: passes_accuracy_pct
        description: "{{ doc('passes_accuracy_pct') }}"
      - name: corners_per_match
        description: "{{ doc('corners_per_match') }}"
      - name: corners_against_per_match
        description: "{{ doc('corners_against_per_match') }}"
      - name: saves_pct
        description: "{{ doc('saves_pct') }}"
      - name: passes_key_per_match
        description: "{{ doc('passes_key_per_match') }}"
      - name: tackles_per_match
        description: "{{ doc('tackles_per_match') }}"
      - name: interceptions_per_match
        description: "{{ doc('interceptions_per_match') }}"
      - name: blocks_per_match
        description: "{{ doc('blocks_per_match') }}"
      - name: defensive_actions_per_match
        description: "{{ doc('defensive_actions_per_match') }}"
      - name: duels_per_match
        description: "{{ doc('duels_per_match') }}"
      - name: duels_won_pct
        description: "{{ doc('duels_won_pct') }}"

  - name: mart_player_momentum
    description: >
      Recent-form metrics per player for each side of an upcoming fixture, over the same window
      as mart_team_momentum. Grain: (upcoming_fixture_sk, team_sk, player_sk).

      Raw counts (goals, assists, cards, …) pass through unchanged from the builder. The ratios —
      saves_player_pct, dribbles_success_player_pct, passes_accuracy_player_pct, duels_won_player_pct — are computed here with
      safe_divide, so a zero denominator gives NULL rather than an error.

      saves_player_pct is only meaningful for goalkeepers (position_code = 'G').
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
      # top_player_rank (GAP-19.2): strict per-side pick order, starts at 1 and is
      # unique within each (upcoming_fixture_sk, team_sk) side (guards upstream fan-out)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, top_player_rank]
      - dbt_utils.expression_is_true:
          expression: "top_player_rank >= 1"
          name: momentum_player_rank_positive
      - dbt_utils.expression_is_true:
          expression: "saves_player_pct is null or (saves_player_pct between 0 and 1)"
          name: momentum_player_saves_player_pct_in_range
      # The three provider-subset ratios are >= 0 only: over a window as short as one match, a
      # single game where the provider reports numerator > denominator is genuine data, not a
      # model bug — the split int_team_season__metrics_cumulative makes.
      - dbt_utils.expression_is_true:
          expression: "dribbles_success_player_pct is null or dribbles_success_player_pct >= 0"
          name: momentum_player_dribbles_success_player_pct_non_negative
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_player_pct is null or passes_accuracy_player_pct >= 0"
          name: momentum_player_passes_accuracy_player_pct_non_negative
      - dbt_utils.expression_is_true:
          expression: "duels_won_player_pct is null or duels_won_player_pct >= 0"
          name: momentum_player_duels_won_player_pct_non_negative
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window this row's values were computed over, carried from the builder: last_5
          by default, or tournament_to_date / qualifiers on a tournament fixture.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "The player's appearance count within the side's window (1..5 for last_5, uncapped for tournament windows)."
        tests: [not_null]
      - name: position_code
        description: "Player position code (e.g. G, D, M, F). Used to scope saves_player_pct to goalkeepers."
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: goals_total
        description: "This player's goals summed across the side's form-window legs (last_5 by default, or the tournament window on a tournament fixture) over the legs the player appeared in. Each leg's own value is the provider's per-player goals total, penalties included and own goals excluded. NULL only if every contributing leg's value was NULL, which the window's own construction from legs that carry player stats rules out in practice."
      - name: goals_assists
        description: "This player's assists summed across the side's form-window legs (last_5 by default, or the tournament window on a tournament fixture) over the legs the player appeared in."
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: shots_on
        description: "This player's shots on target summed across the side's form-window legs (last_5 by default, or the tournament window on a tournament fixture) over the legs the player appeared in."
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate_player
        description: "{{ doc('passes_accurate_player') }}"
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_past_player
        description: "{{ doc('dribbles_past_player') }}"
      - name: offsides_player
        description: "{{ doc('offsides_player') }}"
      - name: penalty_won_player
        description: "{{ doc('penalty_won_player') }}"
      - name: penalty_committed_player
        description: "{{ doc('penalty_committed_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
      - name: saves_player_pct
        description: "{{ doc('saves_player_pct') }}"
      - name: dribbles_success_player_pct
        description: "{{ doc('dribbles_success_player_pct') }}"
      - name: passes_accuracy_player_pct
        description: "{{ doc('passes_accuracy_player_pct') }}"
      - name: duels_won_player_pct
        description: "{{ doc('duels_won_player_pct') }}"
      - name: top_player_rank
        description: "1 for the player picked first on this side for this fixture, then 2, 3 and so on, ordered by goals, then assists, then key passes over the form window. It is a selection order, not a rating: ties are broken so that no two players share a rank."

  - name: mart_team_momentum_window
    description: >
      The individual past matches behind a side's momentum figures: the same window
      mart_team_momentum aggregates, listed rather than summed. Grain: (upcoming_fixture_sk,
      team_sk, played_fixture_sk).

      played_fixture_sk identifies each past match, so a per-fixture stat line can be looked up
      from here. has_team_stats and has_player_stats are computed against the per-fixture stat
      marts, so true means detail genuinely exists rather than that it ought to.

      assert_momentum_window_matches_momentum guards that these rows and the aggregate stay
      consistent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, played_fixture_sk]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, recency_rank]
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }} Here it is the UPCOMING fixture's competition; the past match's own competition is played_league_code."
        tests: [not_null]
      - name: window_type
        description: >
          Which form window this row belongs to: last_5 by default, or tournament_to_date /
          qualifiers on a tournament fixture. Tournament windows are cumulative rather than capped,
          so a side can have more than five rows.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent past match in the window."
        tests: [not_null]
      - name: played_fixture_sk
        description: "The past match this row is about; joins to the per-fixture stat marts."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: result
        description: "{{ doc('result') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: has_team_stats
        description: "True when mart_team_fixture_stats has rows for this played fixture + team (API shell rows with all-NULL stats count as no data)."
        tests: [not_null]
      - name: has_player_stats
        description: "True when mart_player_fixture_stats has rows for this played fixture + team. False is the common case — many competitions lack player stats."
        tests: [not_null]
      - name: is_home
        description: "True when team_sk is the home side of the upcoming fixture."
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: played_league_code
        description: "The competition this past match was played in. It can differ from the competition of the fixture the window is built for, because form is taken across competitions - a cup tie counts towards the run into a league match."
      - name: played_kickoff_datetime
        description: "When this past match kicked off, in UTC. Ordering by it walks the window from oldest to most recent."
      - name: played_round_name
        description: "The provider's round label for this past match, free text such as 'Regular Season - 12' or 'Quarter-finals'. Its shape varies by competition, so it reads well and sorts badly."
      - name: home_away
        description: "{{ doc('home_away') }}"
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: opponent_name
        description: "{{ doc('opponent_name') }}"
      - name: opponent_logo_url
        description: "{{ doc('opponent_logo_url') }}"

  - name: mart_team_fixture_stats
    description: >
      One team's stat line from one finished match, with the fixture's own details and the team's
      identity alongside. Both sides of a fixture appear, as two rows. Grain: (fixture_sk,
      team_sk).

      A pure projection of fct_fixture_team_stats — nothing is derived here.

      Covers finished fixtures that have team stats. Provider shell rows, where the statistics
      block exists but every value is NULL, are excluded, so a fixture missing from here has no
      usable stats rather than zero of everything.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }} Here it is the PLAYED fixture's competition."
        tests: [not_null]
      - name: is_home
        description: "{{ doc('is_home__own_fixture') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
        description: "{{ doc('round_name') }}"
      - name: team_name
        description: "{{ doc('team_name') }}"
      - name: team_logo_url
        description: "{{ doc('team_logo_url') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal_player') }}"
      - name: shots_off_goal
        description: "{{ doc('shots_off_goal') }}"
      - name: shots_total
        description: "{{ doc('shots_player') }}"
      - name: shots_blocked
