      - name: games_with_team_stats
        description: "Cumulative matches in the season-to-date window with a team statistics line present — the coverage count that gates shots_per_match and the other team-stat rates on this row. The provider's stat line arrives in pieces, so this says nothing about passes, corners or shots inside the box on its own; those inputs carry their own counts upstream."
      - name: points_won
