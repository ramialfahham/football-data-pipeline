version: 2

# Marts are denormalised, consumer-shaped products. Every mart carries ``league_code`` so
# multi-league slicing is a filter, not a schema change.
#
# Mart test policy:
#   - surrogate key: unique + not_null
#   - grain: dbt_utils.unique_combination_of_columns on the business keys
#   - relationships back to the core dims / facts the mart rolls up from
#   - accepted_values where a closed enum is surfaced
#   - one semantic assertion per rollup (e.g. wins + draws + losses = played)

models:
  - name: mart_fixture_results
    description: "Flat fixture table, one row per fixture with both teams, league, season, and kickoff-date denormalised. View (cheap to rebuild). Default consumer shape for dashboards and ad-hoc SQL."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.expression_is_true:
          expression: "(status_short in ('FT', 'AET', 'PEN') and match_outcome is not null) or status_short not in ('FT', 'AET', 'PEN')"
      - dbt_utils.expression_is_true:
          expression: "length(trim(home_team_name)) > 0"
      - dbt_utils.expression_is_true:
          expression: "length(trim(away_team_name)) > 0"
    columns:
      - name: fixture_sk
        description: "FK to fct_fixture. One fixture per row."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: home_team_sk
        description: "FK to dim_team for the home side."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_sk
        description: "FK to dim_team for the away side."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: kickoff_date_sk
        description: "FK to dim_date (UTC kickoff date)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: league_code
        description: "Internal league code."
        tests: [not_null]
      - name: season_api_year
        description: "API season start year."
      - name: fixture_date
        description: "Kickoff date (UTC)."
      - name: kickoff_datetime
      - name: status_short
        description: "API-Football short status code."
        tests:
          - accepted_values:
              values:
                ['TBD', 'NS', '1H', 'HT', '2H', 'ET', 'BT', 'P', 'SUSP', 'INT',
                 'FT', 'AET', 'PEN', 'PST', 'CANC', 'ABD', 'AWD', 'WO', 'LIVE']
              severity: warn
      - name: match_outcome
        description: "HOME, AWAY, or DRAW for finished matches; null otherwise. Derived from goals and status_short."
        tests:
          - accepted_values:
              values: ['HOME', 'AWAY', 'DRAW']
              config:
                where: "match_outcome is not null"
      - name: goals_home
      - name: goals_away
      - name: round_name
      - name: home_team_name
        tests:
          - not_null
      - name: home_team_code
      - name: home_team_country
      - name: away_team_name
        tests:
          - not_null
      - name: away_team_code
      - name: away_team_country
      - name: league_name
      - name: league_country
      - name: season_start_date
      - name: season_end_date
      - name: season_is_current
      - name: kickoff_date
      - name: kickoff_day_of_week
      - name: kickoff_is_weekend
      - name: venue_api_id
      - name: venue_name_snapshot
      - name: venue_city_snapshot
      - name: raw_ingested_at

  - name: mart_team_season
    description: "Per-team, per-season rollup. Grain: (team_sk, season_sk). Aggregates are over finished matches only (status_short in FT, AET, PEN). latest_rank / latest_form come from fct_standings; null for seasons absent from the current /standings API response."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "wins + draws + losses = played"
    columns:
      - name: team_season_sk
        description: "Surrogate key from (team_sk, season_sk)."
        tests: [not_null, unique]
      - name: team_sk
        description: "FK to dim_team."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: team_code
      - name: team_country
      - name: team_logo_url
      - name: played
        description: "Count of finished matches this team took part in during the season."
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]
      - name: goals_for
        tests: [not_null]
      - name: goals_against
        tests: [not_null]
      - name: goal_diff
        tests: [not_null]
      - name: points
        description: "3 points per win, 1 per draw."
        tests: [not_null]
      - name: clean_sheets
        tests: [not_null]
      - name: latest_rank
        description: "Rank from fct_standings. Null if the team is not in the current /standings API response for that season."
      - name: latest_form
        description: "Recent-form string from fct_standings (e.g. WDLWW). Null when standings are absent for that season."

  - name: mart_player_season
    description: "Per-player, per-season rollup. Grain: (player_sk, season_sk). Aggregates come from fct_fixture_player_stats joined to fct_fixture filtered to finished matches. A player who transfers mid-season produces one row per season; per-fixture team attribution lives in the core fact."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "starts + substitute_appearances <= appearances"
    columns:
      - name: player_season_sk
        description: "Surrogate key from (player_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "FK to dim_player."
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "FK to dim_competition_season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "FK to dim_league."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
      - name: player_first_name
      - name: player_last_name
      - name: player_nationality
      - name: player_birth_date
      - name: appearances
        description: "Fixtures the player appears on the team sheet for (any minutes, or 0-minute substitutes)."
        tests: [not_null]
      - name: starts
        description: "Fixtures where the player started (derived is_starter in core)."
      - name: substitute_appearances
        description: "Fixtures where the player was flagged as a substitute in the source payload."
      - name: minutes
        description: "Sum of minutes played."
      - name: goals
      - name: assists
      - name: shots
      - name: shots_on_target
      - name: key_passes
      - name: pass_accuracy_avg_percent
        description: "Average pass accuracy percent across fixtures (unweighted; a weighted version can be added later)."
      - name: rating_avg
        description: "Average API-Football rating across fixtures (unweighted)."
      - name: yellow_cards
      - name: red_cards

  - name: mart_top_scorers
    description: "Top scorers per (league_code, season_api_year) derived from mart_player_season. View (cheap to rebuild). Replaces the /players/topscorers endpoint. DENSE_RANK ties share a rank and no ranks are skipped; filter is scorer_rank <= 25 (inclusive of ties at rank 25)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "scorer_rank <= 25"
      - dbt_utils.expression_is_true:
          expression: "goals > 0"
    columns:
      - name: player_season_sk
        description: "FK to mart_player_season."
        tests:
          - not_null
          - relationships:
              to: ref('mart_player_season')
              field: player_season_sk
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_name
      - name: player_nationality
      - name: appearances
      - name: starts
      - name: minutes
      - name: goals
        tests: [not_null]
      - name: assists
      - name: shots_on_target
      - name: scorer_rank
        description: "DENSE_RANK over goals desc (ties share a rank). 1 is top."
        tests: [not_null]

  - name: mart_team_rankings_current
    description: "Current-season team ranking snapshot per league for product surfaces (standings widgets/API responses). Grain: (league_code, team_sk) for the latest available season in each league."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["marts", "football", "consumer"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "current_rank >= 1"
    columns:
      - name: team_season_sk
        tests:
          - not_null
          - relationships:
              to: ref('mart_team_season')
              field: team_season_sk
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: played
      - name: wins
      - name: draws
      - name: losses
      - name: goal_diff
      - name: points
      - name: current_rank
        tests: [not_null]

  - name: mart_matchday_insights
    description: "Upcoming matchday surface for pre-match comparison. Grain: one row per fixture in the nearest upcoming round per competition. Form metrics aggregate the last five completed matchdays before the upcoming round; per-match rates divide by games in that window."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "high"
    config:
      tags: ["marts", "football", "consumer", "pre_match"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
      - dbt_utils.expression_is_true:
          expression: "length(trim(home_team_name)) > 0"
      - dbt_utils.expression_is_true:
          expression: "length(trim(away_team_name)) > 0"

      # ── Metric consistency: reported rate = sum / count ──────────────────────
      # These catch silent NULL-in-SUM bugs where COUNT includes a game but SUM skips it.
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_goals_per_match_recent - safe_divide(home_goals_for_sum_form, home_form_games_played)) < 0.001"
          name: home_goals_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_goals_per_match_recent - safe_divide(away_goals_for_sum_form, away_form_games_played)) < 0.001"
          name: away_goals_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_goals_against_per_match_recent - safe_divide(home_goals_against_sum_form, home_form_games_played)) < 0.001"
          name: home_goals_against_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_goals_against_per_match_recent - safe_divide(away_goals_against_sum_form, away_form_games_played)) < 0.001"
          name: away_goals_against_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_points_capture_recent - safe_divide(home_points_won_sum_form, 3.0 * home_form_games_played)) < 0.001"
          name: home_points_capture_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_points_capture_recent - safe_divide(away_points_won_sum_form, 3.0 * away_form_games_played)) < 0.001"
          name: away_points_capture_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_total_shots_sum_form = 0 or abs(home_shot_accuracy_recent - safe_divide(home_shots_on_goal_sum_form, home_total_shots_sum_form)) < 0.001"
          name: home_shot_accuracy_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_total_shots_sum_form = 0 or abs(away_shot_accuracy_recent - safe_divide(away_shots_on_goal_sum_form, away_total_shots_sum_form)) < 0.001"
          name: away_shot_accuracy_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_passes_total_sum_form = 0 or abs(home_pass_accuracy_recent - safe_divide(home_passes_accurate_sum_form, home_passes_total_sum_form)) < 0.001"
          name: home_pass_accuracy_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_passes_total_sum_form = 0 or abs(away_pass_accuracy_recent - safe_divide(away_passes_accurate_sum_form, away_passes_total_sum_form)) < 0.001"
          name: away_pass_accuracy_consistent_with_sum

      # ── Ratio bounds: all ratios must be in [0, 1] ───────────────────────────
      - dbt_utils.expression_is_true:
          expression: "home_points_capture_recent between 0 and 1"
          name: home_points_capture_in_range
      - dbt_utils.expression_is_true:
          expression: "away_points_capture_recent between 0 and 1"
          name: away_points_capture_in_range
      - dbt_utils.expression_is_true:
          expression: "home_shot_accuracy_recent between 0 and 1"
          name: home_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "away_shot_accuracy_recent between 0 and 1"
          name: away_shot_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "home_shot_share_recent between 0 and 1"
          name: home_shot_share_in_range
      - dbt_utils.expression_is_true:
          expression: "away_shot_share_recent between 0 and 1"
          name: away_shot_share_in_range
      - dbt_utils.expression_is_true:
          expression: "home_danger_zone_ratio_recent between 0 and 1"
          name: home_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "away_danger_zone_ratio_recent between 0 and 1"
          name: away_danger_zone_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "home_finishing_efficiency_recent between 0 and 1"
          name: home_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "away_finishing_efficiency_recent between 0 and 1"
          name: away_finishing_efficiency_in_range
      - dbt_utils.expression_is_true:
          expression: "home_pass_accuracy_recent between 0 and 1"
          name: home_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "away_pass_accuracy_recent between 0 and 1"
          name: away_pass_accuracy_in_range
      - dbt_utils.expression_is_true:
          expression: "home_save_ratio_recent between 0 and 1"
          name: home_save_ratio_in_range
      - dbt_utils.expression_is_true:
          expression: "away_save_ratio_recent between 0 and 1"
          name: away_save_ratio_in_range

      # ── Form window size: at most 5 rounds, 1 game per round in Bundesliga ────────
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played <= 5"
          name: home_form_games_played_at_most_5
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played <= 5"
          name: away_form_games_played_at_most_5

      # ── Rate metrics: sum / games_played (missing from first pass) ───────────────
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_shots_per_match_recent - safe_divide(home_total_shots_sum_form, home_form_games_played)) < 0.001"
          name: home_shots_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_shots_per_match_recent - safe_divide(away_total_shots_sum_form, away_form_games_played)) < 0.001"
          name: away_shots_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_passes_per_match_recent - safe_divide(home_passes_total_sum_form, home_form_games_played)) < 0.001"
          name: home_passes_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_passes_per_match_recent - safe_divide(away_passes_total_sum_form, away_form_games_played)) < 0.001"
          name: away_passes_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_corner_kicks_per_match_recent - safe_divide(home_corner_kicks_sum_form, home_form_games_played)) < 0.001"
          name: home_corner_kicks_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_corner_kicks_per_match_recent - safe_divide(away_corner_kicks_sum_form, away_form_games_played)) < 0.001"
          name: away_corner_kicks_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_form_games_played = 0 or abs(home_corners_conceded_per_match_recent - safe_divide(home_opponent_corner_kicks_sum_form, home_form_games_played)) < 0.001"
          name: home_corners_conceded_per_match_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_form_games_played = 0 or abs(away_corners_conceded_per_match_recent - safe_divide(away_opponent_corner_kicks_sum_form, away_form_games_played)) < 0.001"
          name: away_corners_conceded_per_match_consistent_with_sum

      # ── Ratio-of-sums metrics: formula consistency ──────────────────────────────
      - dbt_utils.expression_is_true:
          expression: "(home_total_shots_sum_form + home_opponent_total_shots_sum_form) = 0 or abs(home_shot_share_recent - safe_divide(home_total_shots_sum_form, home_total_shots_sum_form + home_opponent_total_shots_sum_form)) < 0.001"
          name: home_shot_share_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "(away_total_shots_sum_form + away_opponent_total_shots_sum_form) = 0 or abs(away_shot_share_recent - safe_divide(away_total_shots_sum_form, away_total_shots_sum_form + away_opponent_total_shots_sum_form)) < 0.001"
          name: away_shot_share_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_total_shots_sum_form = 0 or abs(home_danger_zone_ratio_recent - safe_divide(home_shots_inside_box_sum_form, home_total_shots_sum_form)) < 0.001"
          name: home_danger_zone_ratio_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_total_shots_sum_form = 0 or abs(away_danger_zone_ratio_recent - safe_divide(away_shots_inside_box_sum_form, away_total_shots_sum_form)) < 0.001"
          name: away_danger_zone_ratio_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "home_shots_on_goal_sum_form = 0 or abs(home_finishing_efficiency_recent - safe_divide(home_goals_for_sum_form, home_shots_on_goal_sum_form)) < 0.001"
          name: home_finishing_efficiency_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "away_shots_on_goal_sum_form = 0 or abs(away_finishing_efficiency_recent - safe_divide(away_goals_for_sum_form, away_shots_on_goal_sum_form)) < 0.001"
          name: away_finishing_efficiency_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "(home_goalkeeper_saves_sum_form + home_goals_against_sum_form) = 0 or abs(home_save_ratio_recent - safe_divide(home_goalkeeper_saves_sum_form, home_goalkeeper_saves_sum_form + home_goals_against_sum_form)) < 0.001"
          name: home_save_ratio_consistent_with_sum
      - dbt_utils.expression_is_true:
          expression: "(away_goalkeeper_saves_sum_form + away_goals_against_sum_form) = 0 or abs(away_save_ratio_recent - safe_divide(away_goalkeeper_saves_sum_form, away_goalkeeper_saves_sum_form + away_goals_against_sum_form)) < 0.001"
          name: away_save_ratio_consistent_with_sum

    columns:
      - name: fixture_sk
        description: "Fixture key. One row per upcoming fixture in the selected matchday."
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: home_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: away_team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "Internal pipeline league key (BL1 for Bundesliga in this model). Use league_name for display."
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: fixture_date
        tests: [not_null]
      - name: kickoff_datetime
        tests: [not_null]
      - name: round_name
        description: "API round name for the upcoming matchday batch (e.g. Regular Season - 31)."
      - name: upcoming_round_order
        description: "Trailing integer parsed from round_name for ordering past rounds (null if not parseable)."
      - name: league_name
        description: "Human-readable league name; Bundesliga for all rows in this model."
      - name: home_team_name
        tests:
          - not_null
      - name: away_team_name
        tests:
          - not_null
      - name: upcoming_matchday_fixture_count
        description: "Number of fixtures in this upcoming matchday (same round_name, league, season)."
        tests: [not_null]
      - name: home_league_rank
        description: "Current table rank for the home team from mart_team_season.latest_rank; null if absent from current standings."
        tests:
          - not_null:
              config:
                where: "league_code = 'BL1' and fixture_date >= current_date()"
      - name: away_league_rank
        description: "Current table rank for the away team from mart_team_season.latest_rank; null if absent from current standings."
        tests:
          - not_null:
              config:
                where: "league_code = 'BL1' and fixture_date >= current_date()"
      - name: home_form_games_played
        description: "Home: count of finished matches included in the form window (all games in the last five completed matchdays). 0 when no prior matches exist; never null."
        tests: [not_null]
      - name: away_form_games_played
        description: "Away: count of finished matches included in the form window. 0 when no prior matches exist; never null."
        tests: [not_null]
      - name: home_form_matchdays_used
        description: "Home: distinct completed matchdays (round_name) in the window (at most five)."
      - name: away_form_matchdays_used
        description: "Away: distinct completed matchdays in the window (at most five)."
      - name: home_stat_coverage_form_games
        description: "Home: games in the form window with non-null shots_on_goal in fct_fixture_team_stats."
      - name: away_stat_coverage_form_games
        description: "Away: games in the form window with non-null shots_on_goal in fct_fixture_team_stats."
      - name: home_points_won_sum_form
        description: "Home: sum of league points (3/1/0) over form-window matches."
      - name: away_points_won_sum_form
        description: "Away: sum of league points over form-window matches."
      - name: home_points_capture_recent
        description: "Home: points_won_sum_form / (3 * form_games_played); 0 if no games."
      - name: away_points_capture_recent
        description: "Away: points_won_sum_form / (3 * form_games_played); 0 if no games."
      - name: home_goals_per_match_recent
        description: "Home: goals scored per form-window game (sum / games)."
      - name: away_goals_per_match_recent
