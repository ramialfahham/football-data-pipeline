version: 2

models:
  - name: stg_fdorg__matches_scheduled_bl1
    description: "Staging model for football-data.org scheduled matches payload (BL1) with semantic top-level naming."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "fdorg", "pre_match"]
    columns:
      - name: competition_code
        description: "Competition code (BL1/PL/SA/PD/FL1)."
        tests: [not_null]
      - name: request_filters
        description: "Source request filters returned by football-data.org."
      - name: result_set
        description: "Result-set metadata object returned for match queries."
      - name: competition_info
        description: "Competition metadata object."
      - name: matches_payload
        description: "Nested list of scheduled matches for the competition."

