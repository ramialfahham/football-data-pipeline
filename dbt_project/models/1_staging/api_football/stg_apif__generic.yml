version: 2

# Generic staging tests — all models read from unified raw tables, discriminated by league_code.
# Staging contract: select the latest ingestion snapshot per league_code (append-log raw
# tables hold one complete snapshot row per run), then faithfully flatten the payload 1:1.
# No entity-grain deduplication, no aggregation/pivot, no cross-source unions/joins here —
# all of that is business logic that belongs in base. See dbt_project/docs/layering.md §1_staging.
# Test policy: not_null on grain columns; unique only where a single snapshot is already unique
# at that grain. No unique tests on fixture_detail models (events, players, stats, lineups) or on
# transfers — they carry expected duplicates (multiple ingest snapshots, and for transfers the same
# move fetched under both involved teams); entity dedup is in base.
#
# INCREMENTAL-ACCUMULATION raw tables (RAW_APIF_PLAYER_PROFILES, RAW_APIF_PLAYER_TEAMS): their
# loaders are skip-if-already-ingested (PR-a), so a run's snapshot holds only that run's NEW
# players, NOT a complete snapshot. Their staging models therefore UNION ALL snapshots rather than
# selecting the latest per league_code (which would silently drop players landed on earlier
# backfill days). This is a faithful flatten (no dedup); base assembles current-per-player. The
# "latest snapshot per league_code" clause above is the rule for COMPLETE-snapshot tables; squads
# (re-fetched in full every run) follows it, profiles/teams do not. (check_layer_contract.py
# permits omitting the snapshot select — it only forbids non-league_code partitions, distinct,
# group by, aggregation and cross-domain joins.)

models:
  - name: stg_apif__fixtures_next
    description: >
      One row per upcoming fixture per league from GET /fixtures. Grain: (league_code, fixture_id).
      Latest ingestion snapshot selected per league_code before unnest, so each fixture_id appears once.
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null, unique]
      - name: fixture_date
        tests: [not_null]
      - name: home_team_id
        tests: [not_null]
      - name: away_team_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__standings
    description: >
      One row per team per stage group per season per league from GET /standings.
      Latest ingestion snapshot selected per league_code before unnest.
      Grain: (league_code, season, team_id) — unique within a single league/season snapshot.
    columns:
      - name: league_code
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: team_id
        # Faithful staging: old API-Football standings can carry team.name with a null team.id
        # (e.g. UEL 2017). base_apif__standings drops those rows and fct_standings.team_sk enforces
        # not_null + relationships(dim_team) — the cleanliness guard lives on the cleaned layer.
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__teams
    description: >
      One row per team per season per league from GET /teams. Deduped to latest ingestion per
      league_code. Grain: (league_code, season, team_id).
    columns:
      - name: league_code
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__leagues
    description: >
      One row per season per league from GET /leagues. Deduped to latest ingestion per
      league_code. Grain: (league_code, league_api_id, season_api_year).
    columns:
      - name: league_code
        tests: [not_null]
      - name: league_api_id
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__players
    description: >
      One row per player per team per season per league from GET /players.
      Latest ingestion snapshot selected per league_code. Grain: (league_code, team_id, season_year, player_id).
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__fixture_events
    description: >
      One row per event per fixture from the $.events array in raw_apif_fixture_details.
      No dedup at staging — multiple ingestions may produce duplicate (fixture_id, event_index)
      rows; dedup is in base_apif__fixture_events. Grain at staging: (fixture_id, event_index,
      raw_ingested_at).
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: event_index
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__fixture_players
    description: >
      One row per player per team per fixture from $.players in raw_apif_fixture_details.
      No dedup at staging — dedup happens in base_apif__fixture_players.
      Grain at staging: (fixture_id, team_id, player_id, raw_ingested_at).
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__fixture_statistics
    description: >
      Long format — one row per statistic line per team per fixture from $.statistics in
      raw_apif_fixture_details. Faithful 1:1 flatten only. The pivot to wide columns and the
      dedup both happen in base_apif__fixture_statistics (business reshaping belongs in base).
      Grain at staging: (fixture_id, team_id, stat_type, raw_ingested_at).
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__lineups
    description: >
      One row per team per fixture from $.lineups in raw_apif_fixture_details.
      No dedup at staging — dedup happens downstream.
      Grain at staging: (fixture_id, team_id, raw_ingested_at).
    columns:
      - name: league_code
        tests: [not_null]
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__transfers
    description: >
      One row per transfer move from $.response[].transfers_payload[].transfers in
      raw_apif_transfers (GET /transfers by team). Latest ingestion snapshot per league_code,
      then faithful 1:1 flatten. NO dedup here — by-team fetching returns each move twice
      (once per involved team); entity dedup is in base_apif__transfers. player_id /
      transfer_date may be null (filtered in base). Grain at staging: one raw transfer row.
    columns:
      - name: league_code
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__squads
    description: >
      One row per player per team from GET /players/squads (current squad + shirt number).
      Complete snapshot per run → latest ingestion snapshot selected per league_code, then
      faithful flatten of response[].squad_payload[].players[]. Nominal grain (league_code,
      team_id, player_id), but NO unique test — the provider occasionally lists a player twice
      in a squad (a handful of exact duplicates at that grain in real data); faithful staging
      keeps them and base dedups, exactly as the sibling complete-snapshot model stg_apif__players.
    columns:
      - name: league_code
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__player_profiles
    description: >
      One row per player bio from GET /players/profiles. INCREMENTAL-accumulation source
      (skip-if-present loader) → UNION ALL snapshots, faithful flatten of
      response[].profile_payload[].player. NO dedup here — base assembles current-per-player.
      Grain at staging: one raw profile row (player_id, raw_ingested_at). league_code is
      ingest provenance (MIN per player), not identity.
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]

  - name: stg_apif__player_teams
    description: >
      One row per player per team per season from GET /players/teams (career history).
      INCREMENTAL-accumulation source → UNION ALL snapshots, faithful flatten of
      response[].teams_payload[] then the seasons[] array. NO dedup here — base dedups.
      Grain at staging: (player_id, team_id, season_year, raw_ingested_at). season_year is NOT
      not_null-tested — the provider's seasons[] array carries occasional null/non-year entries
      (~0.4% in real data) which faithful staging passes through and base filters, mirroring the
      nullable keys in stg_apif__transfers. league_code is ingest provenance, not identity.
    columns:
      - name: league_code
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: raw_ingested_at
        tests: [not_null]
