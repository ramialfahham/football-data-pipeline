          combination_of_columns: [league_code, team_id, season, raw_ingested_at]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season
        description: "{{ doc('season_api_year') }}"
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: team_name
        description: "{{ doc('team_name') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: api_errors_json
        description: "The errors object of the provider's response to the call that produced this row ($.errors), as JSON text."
      - name: api_reported_result_count
        description: "The number of results the provider's response says it holds ($.results), for the call that produced this row."
      - name: request_parameters_json
        description: "The query parameters of the call that produced this row, as the provider echoes them back ($.parameters), as JSON text."
      - name: team_code
        description: "{{ doc('team_code') }}"
      - name: team_country
        description: "{{ doc('team_country__provider') }}"
      - name: founded_year
        description: "The year the team was founded, as the provider returns it ($.team.founded)."
      - name: team_logo_url
        description: "{{ doc('team_logo_url__provider') }}"
      - name: venue_id
        description: "The provider's identifier of the team's home stadium ($.venue.id), as text."
      - name: venue_name
        description: "The name of the team's home stadium ($.venue.name), with HTML-encoded characters decoded."
      - name: venue_address
        description: "The street address of the team's home stadium ($.venue.address), with HTML-encoded characters decoded."
      - name: venue_city
        description: "The city of the team's home stadium ($.venue.city), with HTML-encoded characters decoded."
      - name: venue_capacity
        description: "The seating capacity of the team's home stadium, as the provider returns it ($.venue.capacity)."

  - name: stg_apif__team_deliveries
    description: >
      One row per team per delivery from GET /teams, every stored delivery kept, with only the
      team id and country. base_apif__teams_global reads it to see whether a team's country
      changed between deliveries. Grain: (league_code, raw_ingested_at, team_id).
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
      - name: team_country
        description: "{{ doc('team_country') }} Here, as one delivery gives it, in the provider's spelling and before any correction."

  - name: stg_apif__leagues
    description: >
      One row per season per league from GET /leagues. Deduped to latest ingestion per
      league_code. Grain: (league_code, league_api_id, season_api_year).
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_apif__leagues_order_keys_unique
          combination_of_columns: [league_code, league_api_id, season_api_year, raw_ingested_at]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: api_errors_json
        description: "The errors object of the provider's response to the call that produced this row ($.errors), as JSON text."
      - name: api_reported_result_count
        description: "The number of results the provider's response says it holds ($.results), for the call that produced this row."
      - name: request_parameters_json
        description: "The query parameters of the call that produced this row, as the provider echoes them back ($.parameters), as JSON text."
      - name: league_name
        description: "The competition's name as the provider returns it, with HTML-encoded characters decoded."
      - name: league_type
        description: "The provider's competition type, for example 'League' or 'Cup' ($.league.type)."
      - name: country
        description: "The name of the country the competition belongs to ($.country.name), with HTML-encoded characters decoded."
      - name: league_logo_url
        description: "URL of the competition's logo as the provider returns it ($.league.logo)."
      - name: country_flag_url
        description: "URL of the country's flag as the provider returns it ($.country.flag)."
      - name: season_start_date
        description: "The date the season starts, as the provider returns it ($.seasons[].start)."
      - name: season_end_date
        description: "The date the season ends, as the provider returns it ($.seasons[].end)."
      - name: season_is_current
        description: "True when the provider marks this season as the competition's current one ($.seasons[].current)."
      - name: has_coverage_fixture_events
        description: "True when the provider states it covers match events for this season ($.seasons[].coverage.fixtures.events)."
      - name: has_coverage_fixture_lineups
        description: "True when the provider states it covers line-ups for this season ($.seasons[].coverage.fixtures.lineups)."
      - name: has_coverage_fixture_statistics
        description: "True when the provider states it covers team match statistics for this season ($.seasons[].coverage.fixtures.statistics_fixtures)."
      - name: has_coverage_fixture_players
        description: "True when the provider states it covers per-player match statistics for this season ($.seasons[].coverage.fixtures.statistics_players)."
      - name: has_coverage_standings
        description: "True when the provider states it covers league tables for this season ($.seasons[].coverage.standings)."
      - name: has_coverage_players
        description: "True when the provider states it covers player data for this season ($.seasons[].coverage.players)."
      - name: has_coverage_top_scorers
        description: "True when the provider states it covers top-scorer lists for this season ($.seasons[].coverage.top_scorers)."
      - name: has_coverage_top_assists
        description: "True when the provider states it covers top-assist lists for this season ($.seasons[].coverage.top_assists)."
      - name: has_coverage_top_cards
        description: "True when the provider states it covers top-card lists for this season ($.seasons[].coverage.top_cards)."
      - name: has_coverage_injuries
        description: "True when the provider states it covers injuries for this season ($.seasons[].coverage.injuries)."
      - name: has_coverage_predictions
        description: "True when the provider states it covers predictions for this season ($.seasons[].coverage.predictions)."
      - name: has_coverage_odds
        description: "True when the provider states it covers betting odds for this season ($.seasons[].coverage.odds)."

  - name: stg_apif__players
    description: >
      One row per player per team per season per league from GET /players. RAW_APIF_PLAYERS is
      append-only and stores one row per (team, season) PER FETCH, so staging reads ALL rows
      faithfully (no latest-snapshot qualify); current-per-entity is assembled in base. Grain
      after base: (league_code, team_id, season_year, player_id).
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: season_year
        description: "{{ doc('season_api_year') }}"
      - name: player_name
        description: "{{ doc('player_name__provider') }}"
      - name: player_firstname
        description: "{{ doc('player_first_name') }}"
      - name: player_lastname
        description: "{{ doc('player_last_name') }}"
      - name: player_photo_url
        description: "{{ doc('player_photo_url__provider') }}"
      - name: birth_date
        description: "The player's date of birth as the provider returns it ($.player.birth.date)."
      - name: nationality
        description: "The player's nationality as the provider returns it, with HTML-encoded characters decoded."
      - name: statistics_json
        description: "The player's statistics array for the season, as the provider returns it ($.statistics), kept as JSON."

  - name: stg_apif__fixture_events
    description: >
      One row per event per fixture from the $.events array in raw_apif_fixture_details — an
      append-only table holding one row per FETCH of a fixture, so a retried fixture contributes
      several versions (see layering.md §1_staging). Staging reads ALL rows faithfully — no
      latest-snapshot qualify, the grain is sub-league; choosing between versions is
      base_apif__fixture_events' job: it keeps each fixture's latest fetch that has events. Grain at
      staging: (fixture_id, event_index, raw_ingested_at).
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_apif__fixture_events_order_keys_unique
          combination_of_columns: [league_code, fixture_id, event_index, raw_ingested_at]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: event_index
        description: "The zero-based position of this event in the provider's $.events array for the fixture. API-Football does not assign event ids, so this position is the only stable identity for an event within a fixture."
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: minute_elapsed
        description: "The match minute of the event, as the provider returns it ($.time.elapsed)."
      - name: minute_extra
        description: "The added-time minutes of the event beyond the regular period, as the provider returns them ($.time.extra)."
      - name: team_id
        description: "{{ doc('team_api_id') }} The team the event is credited to."
      - name: team_name
        description: "The name of the team the event is credited to ($.team.name), with HTML-encoded characters decoded."
      - name: player_name
        description: "{{ doc('player_name__provider') }}"
      - name: player_id
        description: "{{ doc('player_api_id') }} The player the event is credited to."
      - name: assist_player_name
        description: "The name of the second player involved in the event, for example the assist-maker or the player coming on ($.assist.name), with HTML-encoded characters decoded."
      - name: assist_player_id
        description: "{{ doc('player_api_id') }} The second player involved in the event, for example the assist-maker or the player coming on."
      - name: event_type
        description: "The provider's kind of event, for example 'Goal', 'Card' or 'subst' ($.type)."
      - name: event_detail
        description: "The provider's detail of the event, for example 'Normal Goal' or 'Yellow Card' ($.detail)."
      - name: event_comments
        description: "The provider's free-text comment on the event ($.comments)."

  - name: stg_apif__fixture_players
