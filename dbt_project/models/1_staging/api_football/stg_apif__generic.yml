      only — staging reads ALL rows (no latest-snapshot qualify, sub-league grain); the pivot to
      wide columns and the dedup both happen in base_apif__fixture_statistics (business reshaping
      belongs in base). Grain at staging: (fixture_id, team_id, stat_type, raw_ingested_at).
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: team_name
        description: "The team's name as the provider returns it, with HTML-encoded characters decoded."
      - name: stat_type
        description: "The provider's name of the statistic, for example 'Shots on Goal' or 'Ball Possession' ($.statistics[].type)."
      - name: stat_value_raw
        description: "The statistic's value exactly as the provider sends it, as text ($.statistics[].value)."

  - name: stg_apif__lineups
    description: >
      One row per team per fixture, from $.lineups in raw_apif_fixture_details — an append-only
      table holding one row per FETCH of a fixture. Grain: one row per team per fetch.

      Staging reads every row faithfully, with no latest-snapshot filter, because the raw grain is
      finer than a league. That means a fixture fetched five times has five rows here, and
      resolving which version to use is left to whatever reads it. The provider can list one
      team's sheet twice in one fetch. base_apif__lineup_fetch_ties finds those sheets.
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: team_name
        description: "The team's name as the provider returns it, with HTML-encoded characters decoded."
      - name: formation
        description: "The formation the team lined up in, for example '4-3-3', as the provider returns it ($.formation)."
      - name: coach_name
        description: "The name of the team's coach for the match ($.coach.name), with HTML-encoded characters decoded."
      - name: start_xi_json
        description: "The starting eleven as the provider returns it ($.startXI), kept as JSON."
      - name: substitutes_json
        description: "The named substitutes as the provider returns them ($.substitutes), kept as JSON."

  - name: stg_apif__transfers
    description: >
      One row per transfer move from $.response[].transfers_payload[].transfers in
      raw_apif_transfers (GET /transfers by team). Latest ingestion snapshot per league_code,
      then faithful 1:1 flatten. NO dedup here — by-team fetching returns each move twice
      (once per involved team); entity dedup is in base_apif__transfers. player_id /
      transfer_date may be null (filtered in base). Grain at staging: one raw transfer row.
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
      - name: transfer_date
        description: "The date of the transfer, as the provider returns it ($.date)."
      - name: transfer_type
        description: "The provider's description of the transfer, for example a fee in text, 'Free' or 'Loan' ($.type)."
      - name: team_in_id
        description: "{{ doc('team_api_id') }} The team the player joined."
      - name: team_out_id
        description: "{{ doc('team_api_id') }} The team the player left."

  - name: stg_apif__squads
    description: >
      One row per player per team from GET /players/squads (current squad + shirt number).
      Complete snapshot per run → latest ingestion snapshot selected per league_code, then
      faithful flatten of response[].squad_payload[].players[]. Nominal grain (league_code,
      team_id, player_id), but NO unique test — the provider occasionally lists a player twice
      in a squad (a handful of exact duplicates at that grain in real data); faithful staging
      keeps them and base dedups, exactly as the sibling complete-snapshot model stg_apif__players.
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: player_name
        description: "{{ doc('player_name__provider') }}"
      - name: age
        description: "The player's age in years as the provider states it ($.age)."
      - name: shirt_number
        description: "The player's squad shirt number as the provider lists it ($.number)."
      - name: position
        description: "The player's position as the provider lists it ($.position)."
      - name: player_photo_url
        description: "{{ doc('player_photo_url__provider') }}"

  - name: stg_apif__player_profiles
    description: >
      One row per player bio from GET /players/profiles. INCREMENTAL-accumulation source
      (skip-if-present loader) → UNION ALL snapshots, faithful flatten of
      response[].profile_payload[].player. NO dedup here — base assembles current-per-player.
      Grain at staging: one raw profile row (player_id, raw_ingested_at). league_code is
      ingest provenance (MIN per player), not identity.
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: player_name
        description: "{{ doc('player_name__provider') }}"
      - name: player_firstname
        description: "{{ doc('player_first_name') }}"
      - name: player_lastname
        description: "{{ doc('player_last_name') }}"
      - name: age
        description: "The player's age in years as the provider states it ($.player.age)."
      - name: birth_date
        description: "The player's date of birth as the provider returns it ($.player.birth.date)."
      - name: birth_place
        description: "The player's place of birth as the provider returns it ($.player.birth.place), with HTML-encoded characters decoded."
      - name: birth_country
        description: "The player's country of birth as the provider returns it ($.player.birth.country), with HTML-encoded characters decoded."
      - name: nationality
        description: "The player's nationality as the provider returns it, with HTML-encoded characters decoded."
      - name: height
        description: "The player's height as the provider returns it, as text ($.player.height)."
      - name: weight
        description: "The player's weight as the provider returns it, as text ($.player.weight)."
      - name: squad_number
        description: "The player's squad number as the provider returns it ($.player.number)."
      - name: position
        description: "The player's position as the provider returns it ($.player.position)."
      - name: player_photo_url
        description: "{{ doc('player_photo_url__provider') }}"

  - name: stg_apif__player_teams
    description: >
      One row per player per team per season from GET /players/teams (career history).
      INCREMENTAL-accumulation source → UNION ALL snapshots, faithful flatten of
      response[].teams_payload[] then the seasons[] array. NO dedup here — base dedups.
      Grain at staging: (player_id, team_id, season_year, raw_ingested_at). season_year is NOT
      not_null-tested — the provider's seasons[] array carries occasional null/non-year entries
      (~0.4% in real data) which faithful staging passes through and base filters, mirroring the
      nullable keys in stg_apif__transfers. league_code is ingest provenance, not identity.
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: player_id
        description: "{{ doc('player_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: team_name
        description: "The name of a club the player was registered with ($.team.name), with HTML-encoded characters decoded."
      - name: season_year
        description: "{{ doc('season_api_year') }}"

  - name: stg_apif__coaches
    description: >
      Coach identity and bio, flattened from RAW_APIF_COACHES response[].coach.

      The raw table is a complete snapshot per (league_code, run), and staging reads EVERY
      snapshot rather than the latest per league, deliberately: that preserves every coach ever
      seen, the same way player and team staging do. Deduplication across leagues and snapshots
      happens in base, which is why there is no unique test here.
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: coach_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: coach_name
        description: "The coach's name as the provider returns it ($.coach.name), with HTML-encoded characters decoded."
      - name: coach_first_name
        description: "The coach's first name as the provider returns it ($.coach.firstname), with HTML-encoded characters decoded."
      - name: coach_last_name
        description: "The coach's last name as the provider returns it ($.coach.lastname), with HTML-encoded characters decoded."
      - name: coach_age
        description: "The coach's age in years as the provider states it ($.coach.age)."
      - name: coach_birth_date
        description: "The coach's date of birth as the provider returns it ($.coach.birth.date)."
      - name: coach_birth_place
        description: "The coach's place of birth as the provider returns it ($.coach.birth.place), with HTML-encoded characters decoded."
      - name: coach_birth_country
        description: "The coach's country of birth as the provider returns it ($.coach.birth.country), with HTML-encoded characters decoded."
      - name: coach_nationality
        description: "The coach's nationality as the provider returns it ($.coach.nationality), with HTML-encoded characters decoded."
      - name: coach_photo_url
        description: "URL of the coach's photo as the provider returns it ($.coach.photo)."

  - name: stg_apif__coach_career
    description: >
      Coach managerial-history flatten: one row per (coach, career stint) from
      RAW_APIF_COACHES response[].coach.career[]. Faithful unnest; base dedups the stints. team.id is
      PROVIDER-NULLABLE (~6k career stints carry a team name with a null team.id) — faithful staging
      passes them through and base_apif__coach_career drops them (mirrors the standings team_id pattern).
    columns:
      - name: league_code
        description: "{{ doc('league_code_ingest_provenance') }}"
        tests: [not_null]
      - name: coach_id
        description: "{{ doc('coach_api_id') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        # provider-nullable (see description); base filters null team_id, so no staging not_null test
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: team_name
        description: "The name of the club of this career stint ($.team.name), with HTML-encoded characters decoded."
      - name: start_date
        description: "The date this career stint started, as the provider returns it ($.start)."
      - name: end_date
        description: "The date this career stint ended, as the provider returns it ($.end)."

  - name: stg_apif__crest_objects
    description: >
      One row per crest or league logo in the newest state the crest phase wrote, from
      RAW_APIF_CREST_OBJECTS. Grain: (crest_kind, provider_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_apif__crest_objects_keys_unique
          combination_of_columns: [crest_kind, provider_id]
    columns:
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: crest_kind
        description: "What the image shows: teams for a team crest, leagues for a league logo."
        tests:
          - not_null
          - accepted_values:
              values: ["teams", "leagues"]
      - name: provider_id
        description: "The provider's id of the team or league the image belongs to."
        tests: [not_null]
      - name: crest_status
        description: "ok when the image is stored in the crest bucket, missing when the provider answered 404 for it."
        tests:
          - not_null
          - accepted_values:
              values: ["ok", "missing"]
      - name: source_sha256
        description: "The SHA-256 of the provider's image as last fetched. NULL for a missing image."
      - name: fetched_at
        description: "When the stored files were last written."
      - name: checked_at
        description: "When the provider's image was last fetched to look for a change."
        tests: [not_null]
