version: 2

# Generic staging tests — all models read from unified raw tables, discriminated by league_code.
# Staging contract: select the latest ingestion snapshot per league_code (append-log raw
# tables hold one complete snapshot row per run), then faithfully flatten the payload 1:1.
# No entity-grain deduplication, no aggregation/pivot, no cross-source unions/joins here —
# all of that is business logic that belongs in base. See dbt_project/docs/layering.md §1_staging.
# Test policy: not_null on grain columns; unique only where a single snapshot is already unique
# at that grain. No unique tests on fixture_detail models (events, players, stats, lineups) or on
# transfers — they carry expected duplicates (multiple ingest snapshots, and for transfers the same
# move fetched under both involved teams); entity dedup is in base.
#
# INCREMENTAL-ACCUMULATION raw tables (RAW_APIF_PLAYER_PROFILES, RAW_APIF_PLAYER_TEAMS): their
# loaders are skip-if-already-ingested (PR-a), so a run's snapshot holds only that run's NEW
# players, NOT a complete snapshot. Their staging models therefore UNION ALL snapshots rather than
# selecting the latest per league_code (which would silently drop players landed on earlier
# backfill days). This is a faithful flatten (no dedup); base assembles current-per-player. The
# "latest snapshot per league_code" clause above is the rule for COMPLETE-snapshot tables; squads
# (re-fetched in full every run) follows it, profiles/teams do not. RAW_APIF_COACHES is a
# COMPLETE-snapshot table that ALSO reads all snapshots (not latest-per-league), for entity
# preservation: latest-per-league would drop coaches whose teams later leave a league's pull, so
# all snapshots are read and base dedups to one coach entity.
# (check_layer_contract.py permits omitting the snapshot select — it only forbids non-league_code
# partitions, distinct, group by, aggregation and cross-domain joins.)

models:
  - name: stg_apif__fixtures_next
    description: >
      One row per upcoming fixture per league from GET /fixtures. Grain: (league_code, fixture_id).
      Latest ingestion snapshot selected per league_code before unnest, so each fixture_id appears once.
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: fixture_id
        description: "{{ doc('fixture_api_id') }}"
        tests: [not_null, unique]
      - name: fixture_date
        description: "{{ doc('fixture_date') }}"
        tests: [not_null]
      - name: home_team_id
        description: "API-Football's numeric id for the home side of this fixture ($.teams.home.id)."
        tests: [not_null]
      - name: away_team_id
        description: "API-Football's numeric id for the away side of this fixture ($.teams.away.id)."
        tests: [not_null]
      - name: shootout_home
        description: "{{ doc('shootout_home') }} Read from $.score.penalty.home."
      - name: shootout_away
        description: "{{ doc('shootout_away') }} Read from $.score.penalty.away."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: api_errors_json
        description: "The errors object of the provider's response to the call that produced this row ($.errors), as JSON text."
      - name: api_reported_result_count
        description: "The number of results the provider's response says it holds ($.results), for the call that produced this row."
      - name: request_parameters_json
        description: "The query parameters of the call that produced this row, as the provider echoes them back ($.parameters), as JSON text."
      - name: fixture_api_unix_seconds
        description: "The kickoff time as a Unix timestamp in seconds, as the provider returns it ($.fixture.timestamp)."
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: kickoff_timezone
        description: "The timezone name the provider reports for the kickoff time ($.fixture.timezone)."
      - name: status_long
        description: "The provider's full-text match status, for example 'Match Finished' or 'Not Started' ($.fixture.status.long)."
      - name: status_short
        description: "{{ doc('status_short') }}"
      - name: status_elapsed
        description: "Minutes elapsed in the match at the provider's last status update ($.fixture.status.elapsed)."
      - name: season
        description: "{{ doc('season_api_year') }}"
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
      - name: league_name
        description: "The competition's name as the provider returns it, with HTML-encoded characters decoded."
      - name: round_name
        description: "{{ doc('round_name__provider') }}"
      - name: home_team_name
        description: "The home side's name as the provider returns it ($.teams.home.name), with HTML-encoded characters decoded."
      - name: away_team_name
        description: "The away side's name as the provider returns it ($.teams.away.name), with HTML-encoded characters decoded."
      - name: goals_home
        description: "Goals scored by the home side, as the provider reports them ($.goals.home)."
      - name: goals_away
        description: "Goals scored by the away side, as the provider reports them ($.goals.away)."
      - name: venue_id
        description: "The provider's identifier of the stadium the fixture is played at ($.fixture.venue.id), as text."
      - name: venue_name
        description: "The name of the stadium the fixture is played at ($.fixture.venue.name), with HTML-encoded characters decoded."
      - name: venue_city
        description: "The city of the stadium the fixture is played at ($.fixture.venue.city), with HTML-encoded characters decoded."

  - name: stg_apif__standings
    description: >
      One row per team per stage group per season per league from GET /standings.
      Latest ingestion snapshot selected per league_code before unnest.
      Grain: (league_code, season, team_id) — unique within a single league/season snapshot.
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_apif__standings_order_keys_unique
          combination_of_columns:
            - league_code
            - season
            - team_id
            - group_name
            - raw_ingested_at
            - standing_section_order
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_id
        description: "{{ doc('team_api_id') }}"
        # Faithful staging: old API-Football standings can carry team.name with a null team.id
        # (e.g. UEL 2017). base_apif__standings drops those rows and fct_standings.team_sk enforces
        # not_null + relationships(dim_team) — the cleanliness guard lives on the cleaned layer.
      - name: group_name
        description: "Standings section/table name from the API ($.group): the league name for a single-table league (e.g. 'Premier League'), the group for a group stage (e.g. 'Group A'), or the phase for a split-season league (e.g. '… Championship Round'). Part of the grain."
      - name: raw_ingested_at
        description: "{{ doc('raw_ingested_at') }}"
        tests: [not_null]
      - name: standing_section_order
        description: "The section's position in the provider's standings list for the season, 1 for the first. The provider lists the current or final phase first."
        tests: [not_null]
      - name: goals_for_all
        description: Goals scored across all matches of the section, as the provider's standings row reports them ($.all.goals.for).
      - name: goals_against_all
        description: Goals conceded across all matches of the section, as the provider's standings row reports them ($.all.goals.against).
      - name: api_errors_json
        description: "The errors object of the provider's response to the call that produced this row ($.errors), as JSON text."
      - name: api_reported_result_count
        description: "The number of results the provider's response says it holds ($.results), for the call that produced this row."
      - name: request_parameters_json
        description: "The query parameters of the call that produced this row, as the provider echoes them back ($.parameters), as JSON text."
      - name: league_api_id
        description: "{{ doc('league_api_id') }}"
      - name: league_name
        description: "The competition's name as the provider returns it, with HTML-encoded characters decoded."
      - name: standing_rank
        description: "The team's position in the section's table, as the provider ranks it ($.rank)."
      - name: team_name
        description: "The team's name as the provider returns it, with HTML-encoded characters decoded."
      - name: points
        description: "Points the team has in the section, as the provider reports them ($.points)."
      - name: goals_diff
        description: "{{ doc('goals_diff') }} Here, the team's goal difference in the section as the provider reports it ($.goalsDiff)."
      - name: form
        description: "The team's recent results as a string of letters, as the provider returns it ($.form)."
      - name: group_description
        description: "The provider's note on the team's table position, for example a promotion or relegation place ($.description)."
      - name: played_all
        description: "Matches the team has played in the section, as the provider reports them ($.all.played)."
      - name: wins_all
        description: "Matches the team has won in the section, as the provider reports them ($.all.win)."
      - name: draws_all
        description: "Matches the team has drawn in the section, as the provider reports them ($.all.draw)."
      - name: losses_all
        description: "Matches the team has lost in the section, as the provider reports them ($.all.lose)."

  - name: stg_apif__teams
