version: 2

sources:
  - name: api_football
    description: "Unified raw API-Football payloads. All competitions share one table per entity, discriminated by league_code. See docs/data_contract.md."
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: raw_apif_fixtures_next
        identifier: RAW_APIF_FIXTURES_NEXT
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_standings
        identifier: RAW_APIF_STANDINGS
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_teams
        identifier: RAW_APIF_TEAMS
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_leagues
        identifier: RAW_APIF_LEAGUES
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_players
        identifier: RAW_APIF_PLAYERS
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_fixture_details
        identifier: RAW_APIF_FIXTURE_DETAILS
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}

      - name: raw_apif_transfers
        identifier: RAW_APIF_TRANSFERS
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}
