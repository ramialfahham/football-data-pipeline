version: 2

models:
  - name: stg_apif__fixtures_next_d1
    description: "Staging model for API-Football fixtures_next payload (Bundesliga D1) with cleaned canonical top-level columns."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "player_context"]
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: api_endpoint
        description: "API-Football endpoint identifier returned in the payload metadata."
        tests: [not_null]
      - name: request_parameters
        description: "Request parameters echoed by the source API for traceability."
      - name: api_errors
        description: "API-level errors object returned by API-Football."
      - name: result_count
        description: "Count of records returned by the API for this request."
      - name: paging_info
        description: "Paging metadata returned by API-Football."
      - name: payload_response
        description: "Raw nested response payload used downstream for further extraction."

