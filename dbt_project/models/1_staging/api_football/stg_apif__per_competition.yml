version: 2

# Staging naming: use ``_date`` for ``DATE`` columns; warehouse ``TIMESTAMP`` load markers use ``_at`` (e.g. ``raw_ingested_at``). Other ``_datetime`` columns stay as documented per field.
# Integer epoch fields must not use those suffixes (e.g. ``fixture_api_unix_seconds``).
#
# Staging test policy (source-contract only):
#   - grain declared in the model description
#   - not_null on every entity-identity grain column (ids, codes, season markers)
#   - unique on the grain (single column) or dbt_utils.unique_combination_of_columns (composite)
#   - optional not_null on 1-3 non-grain columns the model would be useless without
# Explicitly not at staging:
#   - accepted_values (API owns the enum; moves to 3_core where the project freezes values)
#   - relationships (FK integrity is a canonical-model concern; moves to 3_core)
# Freshness lives in sources.yml via loaded_at_field: ingested_at.

models:
  - name: stg_apif__d1_fixtures_next
    description: "One row per match from GET /fixtures (D1). Grain: fixture_id. Envelope metadata as JSON strings plus core kickoff / teams / score columns and source_json."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "player_context"]
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: raw_ingested_at
        description: "UTC timestamp when this raw table row was loaded (from ``ingested_at`` in BigQuery raw)."
      - name: fixture_id
        description: "API-Football fixture id. Grain of this model."
        tests: [not_null, unique]
      - name: fixture_date
        description: "Fixture calendar date in UTC (``DATE``), derived from API ``fixture.date``."
        tests: [not_null]
      - name: kickoff_datetime
        description: "Fixture kickoff as ``TIMESTAMP`` from API ``fixture.date`` (RFC3339 string)."
      - name: fixture_api_unix_seconds
        description: "API ``fixture.timestamp`` (Unix seconds), not a warehouse datetime type."
      - name: api_errors_json
        description: "Stringified API `errors` object from the parent response envelope (same on every row for that load)."
      - name: source_json
        description: "Full match object JSON for fields not promoted to columns."

  - name: stg_apif__d1_players
    description: "One row per player per (league, team, season) from the merged /players squad pull. Grain: (league_code, team_id, season_year, player_id)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - team_id
            - season_year
            - player_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: team_id
        description: "Club id for this squad row."
        tests: [not_null]
      - name: season_year
        description: "Competition start year for this squad snapshot (API season); from batch payload when multi-season ingest runs."
        tests: [not_null]
      - name: player_id
        description: "Player id from API-Football."
        tests: [not_null]
      - name: raw_ingested_at
        description: "UTC timestamp when the squad raw row was loaded."
      - name: birth_date
        description: "Player birth date as ``DATE`` when parseable from API ``birth.date``."

  - name: stg_apif__d1_lineups
    description: "One row per team formation block per fixture from the batched lineups payload. Grain: (league_code, fixture_id, team_id)."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - team_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id for this lineup slice."
        tests: [not_null]
      - name: team_id
        description: "Team id for this formation block."
        tests: [not_null]

  - name: stg_apif__d1_injuries
    description: "One row per injury report from GET /injuries. Grain: (league_code, season, player_id, team_id, fixture_id, injury_type, injury_reason). Type and reason are in the grain to disambiguate multiple reports for the same player+fixture and may legitimately be NULL at source."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season
            - player_id
            - team_id
            - fixture_id
            - injury_type
            - injury_reason
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: season
        description: "API season year on the injury row (from `$.league.season` in the response object)."
        tests: [not_null]
      - name: player_id
        description: "Player id from API-Football."
        tests: [not_null]
      - name: team_id
        description: "Team id the injury is reported against."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id the injury is linked to."
        tests: [not_null]

  - name: stg_apif__d1_leagues
    description: "Bundesliga D1 metadata and per-season coverage from GET /leagues. Grain: (league_code, league_api_id)."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - league_api_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: league_api_id
        description: "API-Football league id (78 for Bundesliga)."
        tests: [not_null]

  - name: stg_apif__d1_standings
    description: "League table from GET /standings (skipped when coverage.standings is false). Grain: (league_code, season, team_id, group_description). group_description is part of the grain because some competitions have multiple groups; for Bundesliga it is always a single group."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season
            - team_id
            - group_description
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: season
        description: "API season year for the standings snapshot."
        tests: [not_null]
      - name: team_id
        description: "Team id in the standings row."
        tests: [not_null]

  - name: stg_apif__d1_rounds
    description: "Round names from GET /fixtures/rounds (raw stores one block per API season with ``api_season_year``). Grain: (league_code, api_season_year, round_name)."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - api_season_year
            - round_name
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: api_season_year
        description: "API season year this round list belongs to."
        tests: [not_null]
      - name: round_name
        description: "Round name from API-Football (e.g. 'Regular Season - 27')."
        tests: [not_null]

  - name: stg_apif__d1_teams
    description: "Clubs and venues from GET /teams for league+season. Grain: (league_code, season, team_id)."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season
            - team_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: season
        description: "API season year for this team row (from `$.league.season` in the response object)."
        tests: [not_null]
      - name: team_id
        description: "API-Football team id."
        tests: [not_null]
      - name: team_name
        description: "Team display name from API-Football."
        tests: [not_null]

  - name: stg_apif__d1_transfers
    description: "GET /transfers merged envelope (optional; disable with API_FOOTBALL_FETCH_TRANSFERS=0). Grain: (league_code, player_id) within the current merged snapshot."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - player_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: player_id
        description: "Player id from API-Football."
        tests: [not_null]

  - name: stg_apif__d1_fixture_events
    description: "Per-fixture GET /fixtures/events (batched payload). Grain: (league_code, fixture_id, minute_elapsed, minute_extra, team_id, player_id, event_type, event_detail). Minute and player fields may legitimately be NULL at source (e.g. VAR decisions, team-level events); only entity-identity columns carry not_null."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - minute_elapsed
            - minute_extra
            - team_id
            - player_id
            - event_type
            - event_detail
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id the event belongs to."
        tests: [not_null]
      - name: team_id
        description: "Team id the event is attributed to."
        tests: [not_null]

  - name: stg_apif__d1_fixture_statistics
    description: "Per-fixture GET /fixtures/statistics (batched payload). Grain: (league_code, fixture_id, team_id)."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - team_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id these stats belong to."
        tests: [not_null]
      - name: team_id
        description: "Team id these stats are attributed to."
        tests: [not_null]

  - name: stg_apif__d1_fixture_players
    description: "Per-fixture GET /fixtures/players (batched payload). Grain: (league_code, fixture_id, team_id, player_id)."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - team_id
            - player_id
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id these per-player stats belong to."
        tests: [not_null]
      - name: team_id
        description: "Team id for this player's row in the fixture."
        tests: [not_null]
      - name: player_id
        description: "Player id from API-Football."
        tests: [not_null]

  - name: stg_apif__d1_predictions
    description: "Per-fixture GET /predictions (batched payload). Grain: (league_code, fixture_id, prediction_json). prediction_json is in the grain to disambiguate multiple prediction variants per fixture; it is not asserted not_null because structure can vary at source."
    config:
      tags: ["staging", "api_football", "player_context"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - prediction_json
    columns:
      - name: league_code
        description: "Internal league code; always D1 (Bundesliga) for this MVP."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id the prediction belongs to."
        tests: [not_null]
