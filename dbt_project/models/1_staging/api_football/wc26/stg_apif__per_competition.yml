version: 2

# Staging naming: use ``_date`` for ``DATE`` columns; warehouse ``TIMESTAMP`` load markers use ``_at`` (e.g. ``raw_ingested_at``). Other ``_datetime`` columns stay as documented per field.
# Integer epoch fields must not use those suffixes (e.g. ``fixture_api_unix_seconds``).
#
# Staging test policy (source-contract only):
#   - grain declared in the model description
#   - not_null on every entity-identity grain column (ids, codes, season markers)
#   - unique on the grain (single column) or dbt_utils.unique_combination_of_columns (composite)
#   - optional not_null on 1-3 non-grain columns the model would be useless without
# Explicitly not at staging:
#   - accepted_values (API owns the enum; moves to 3_core where the project freezes values)
#   - relationships (FK integrity is a canonical-model concern; moves to 3_core)
# Freshness lives in sources.yml via loaded_at_field: ingested_at.

models:
  - name: stg_apif__wc26_fixtures_next
    description: "One row per match from GET /fixtures (WC26). Grain: fixture_id. Envelope metadata as JSON strings plus core kickoff / teams / score columns and source_json."
    meta:
      owner: "data-platform"
      domain: "football"
      criticality: "medium"
    config:
      tags: ["staging", "api_football", "wc26"]
    columns:
      - name: league_code
        description: "Internal league code; always WC26 for this model."
        tests: [not_null]
      - name: raw_ingested_at
        description: "UTC timestamp when this raw table row was loaded (from ``ingested_at`` in BigQuery raw)."
      - name: fixture_id
        description: "API-Football fixture id. Grain of this model."
        tests: [not_null, unique]
      - name: fixture_date
        description: "Fixture calendar date in UTC (``DATE``), derived from API ``fixture.date``."
        tests: [not_null]
      - name: kickoff_datetime
        description: "Fixture kickoff as ``TIMESTAMP`` from API ``fixture.date`` (RFC3339 string)."
      - name: fixture_api_unix_seconds
        description: "API ``fixture.timestamp`` (Unix seconds), not a warehouse datetime type."
      - name: api_errors_json
        description: "Stringified API `errors` object from the parent response envelope (same on every row for that load)."
      - name: source_json
        description: "Full match object JSON for fields not promoted to columns."
      - name: api_reported_result_count
        description: "Result count from the API envelope (`payload.results`) for this raw load."
      - name: request_parameters_json
        description: "Stringified API request parameters from the response envelope (`payload.parameters`)."
      - name: season
        description: "API season year from `league.season` on the fixture object."
      - name: league_api_id
        description: "API-Football league id from `league.id` on the fixture object."
      - name: league_name
        description: "League display name from `league.name` on the fixture object."
      - name: round_name
        description: "Round label from `league.round` on the fixture object."
      - name: home_team_id
        description: "Home team id from `teams.home.id`."
      - name: home_team_name
        description: "Home team name from `teams.home.name`."
      - name: away_team_id
        description: "Away team id from `teams.away.id`."
      - name: away_team_name
        description: "Away team name from `teams.away.name`."
      - name: goals_home
        description: "Home goals from `goals.home` in the fixture payload."
      - name: goals_away
        description: "Away goals from `goals.away` in the fixture payload."
      - name: kickoff_timezone
        description: "Kickoff timezone string from `fixture.timezone`."
      - name: status_long
        description: "Verbose fixture status from `fixture.status.long`."
      - name: status_short
        description: "Short fixture status code from `fixture.status.short`."
      - name: status_elapsed
        description: "Elapsed match minutes from `fixture.status.elapsed` when provided."
      - name: venue_id
        description: "Venue id from `fixture.venue.id`."
      - name: venue_name
        description: "Venue name from `fixture.venue.name`."
      - name: venue_city
        description: "Venue city from `fixture.venue.city`."

