  - name: stg_apif__wc26_predictions
    description: "Per-fixture GET /predictions (batched payload). Grain: (league_code, fixture_id, prediction_json)."
    config:
      tags: ["staging", "api_football", "wc26"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - fixture_id
            - prediction_json
    columns:
      - name: league_code
        description: "Internal league code; always WC26 for this model."
        tests: [not_null]
      - name: fixture_id
        description: "Fixture id the prediction belongs to."
        tests: [not_null]
      - name: raw_ingested_at
        description: "UTC timestamp when this raw table row was loaded."
      - name: prediction_doc
        description: "Raw prediction object (JSON type) from the batched prediction payload."
      - name: prediction_json
        description: "Stringified prediction object for stable hashing and lineage."

  - name: stg_apif__wc26_qualifier_fixtures
    description: "Qualifier fixtures from GET /fixtures?league={id}&season={year} for WC26 supporting leagues. Grain: fixture_id (deduplicated on most recent ingest). Used as pre-tournament form fallback when WC26 tournament fixtures have no completed results."
    config:
      tags: ["staging", "api_football", "wc26"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_id
    columns:
      - name: league_code
        description: "Internal league code; always WC26 for this model."
        tests: [not_null]
      - name: queried_league_id
        description: "League id used to query the supporting-league fixtures endpoint."
        tests: [not_null]
      - name: queried_season
        description: "Season year used to query the supporting-league fixtures endpoint."
      - name: fixture_id
        description: "API-Football fixture id from the form response."
        tests: [not_null]
      - name: raw_ingested_at
        description: "UTC timestamp when this raw table row was loaded."
      - name: kickoff_datetime
        description: "Fixture kickoff as TIMESTAMP."
      - name: fixture_date
        description: "Fixture calendar date as DATE."
      - name: status_short
        description: "Short fixture status code (FT, NS, etc.)."
      - name: league_api_id
        description: "API-Football league id the fixture belongs to."
      - name: league_name
        description: "League name the fixture belongs to."
      - name: season
        description: "API season year the fixture belongs to."
      - name: home_team_id
        description: "Home team id."
      - name: home_team_name
        description: "Home team name."
      - name: away_team_id
        description: "Away team id."
      - name: away_team_name
        description: "Away team name."
      - name: goals_home
        description: "Home goals (null if not yet played)."
      - name: goals_away
        description: "Away goals (null if not yet played)."
      - name: source_json
        description: "Full fixture object JSON for fields not promoted to columns."
