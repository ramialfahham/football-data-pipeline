version: 2

models:
  - name: int_team_competition_benchmarks
    description: >
      Competition benchmark engine (team): per (league_code, season_api_year, metric_key) the league
      distribution (median / mean / p25 / p75 / team_count) of the team benchmark metrics. Median-led
      (robust to a dominant team). mart_team_competition_benchmarks ranks each team against this. The
      metric set comes from int_team_competition_benchmark_metrics_long.
      Grain: (league_code, season_api_year, metric_key).

      {{ doc('ranking_rules') }}
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, metric_key]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the benchmark metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets", "clean_sheets_pct", "shots_per_match", "shots_on_goal_pct", "shots_inside_box_pct", "shots_inside_box_per_match", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "finishing_efficiency_pct", "duels_per_match", "duels_won_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "passes_accurate_per_match", "passes_accuracy_pct", "passes_share_pct", "passes_key_per_match", "dribbles_attempts_per_match", "dribbles_success_per_match", "dribbles_success_pct", "corners_per_match", "corners_against_per_match", "free_kicks_per_match", "fouls_per_match", "offsides_per_match", "saves_per_match", "saves_pct", "cards_yellow", "cards_red"]
      - name: team_count
        description: "Teams with a non-null value for this metric this league-season — the N for rank-of-N."
        tests: [not_null]
      - name: league_median
        description: "Median team value (robust central tendency; the headline 'typical team')."
      - name: league_mean
        description: "Mean team value (the 'league average'; carried but skew-sensitive)."
      - name: league_p25
        description: "25th-percentile team value (the distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (the distribution spread)."

  - name: int_team_competition_benchmark_metrics_long
    description: >
      The team competition-benchmark metrics in long form, per team-season: every team metric of the
      site's served list plus the shots-on-target difference and the clean-sheet share, one row per (team_sk, season_sk,
      metric_key) unpivoted from int_team_season__metrics, with the value at the same point last
      season. The single source of
      the benchmark metric set — int_team_competition_benchmarks aggregates it to the league
      distribution and mart_team_competition_benchmarks ranks each team against it, so the two cannot
      drift. Replaces the team_benchmark_metrics() macro. Grain: (team_sk, season_sk, metric_key).

      An international club competition with a league or group phase is benchmarked over that
      phase alone, from int_team_competition_phase__metrics.

      {{ doc('ranking_rules') }}
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk, metric_key]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the benchmark metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets", "clean_sheets_pct", "shots_per_match", "shots_on_goal_pct", "shots_inside_box_pct", "shots_inside_box_per_match", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "finishing_efficiency_pct", "duels_per_match", "duels_won_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "passes_accurate_per_match", "passes_accuracy_pct", "passes_share_pct", "passes_key_per_match", "dribbles_attempts_per_match", "dribbles_success_per_match", "dribbles_success_pct", "corners_per_match", "corners_against_per_match", "free_kicks_per_match", "fouls_per_match", "offsides_per_match", "saves_per_match", "saves_pct", "cards_yellow", "cards_red"]
      - name: metric_value
        description: "The team's season-to-date value for this metric. UNPIVOT excludes nulls, so this is never null."
        tests: [not_null]
      - name: metric_value_prev_season
        description: "The team's value at the same point last season (rule R6): the previous season's latest match at or before this season's match count, domestic leagues only; null otherwise."
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"

  - name: int_player_competition_benchmark_metrics_long
    description: >
      The player competition-benchmark metrics in long form, per player-season and position: one
      row per (player_sk, season_sk, position_group, metric_key) where the player enters the
      benchmark, with the value and, for the 5 ratio metrics, its numerator and denominator. The
      single source of the benchmark metric set and of the positions each metric is benchmarked for
      — int_player_competition_benchmarks aggregates it to the positional distribution and
      mart_player_competition_benchmarks ranks each player against it, so the two cannot drift.
      Grain: (player_sk, season_sk, position_group, metric_key).

      {{ doc('ranking_rules') }}
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, position_group, metric_key]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "The peer pool the player is benchmarked in: GK, DEF, MID or ATT."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: minutes
        description: "The player's minutes in this position this competition-season, carried so the sample is visible."
        tests: [not_null]
      - name: appearances
        description: "The player's appearances in this position this competition-season."
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id."
        tests:
          - not_null
          - accepted_values:
              values: ["shots_per90", "shots_on_goal_player_pct", "fouls_per90", "offsides_per90", "goals_against_per90", "goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "passes_key_per90", "dribbles_success_per90", "passes_per90", "ball_actions_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "passes_accuracy_player_pct", "duels_won_player_pct", "dribbles_success_player_pct", "finishing_efficiency_player_pct", "saves_player_pct"]
      - name: metric_value
        description: "The player's in-position value for this metric. Rows without a value are left out, so this is never null."
        tests: [not_null]
      - name: metric_numerator
        description: "The numerator behind a ratio metric's value (e.g. saves for save %). NULL for a per-90 metric, which has none."
      - name: metric_denominator
        description: "The denominator behind a ratio metric's value (e.g. shots on target faced for save %). NULL for a per-90 metric, which has none."

  - name: int_player_competition_benchmarks
    description: >
      Competition benchmark engine (player): per (league_code, season_api_year, position_group, metric_key)
      the positional-peer distribution (median / mean / p25 / p75 / player_count) of each benchmarked metric.
      Median-led. mart_player_competition_benchmarks ranks each player against this. The metric set,
      position eligibility and who enters are int_player_competition_benchmark_metrics_long.
      Grain: (league_code, season_api_year, position_group, metric_key).

      {{ doc('ranking_rules') }}
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, position_group, metric_key]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id."
        tests:
          - not_null
          - accepted_values:
              values: ["shots_per90", "shots_on_goal_player_pct", "fouls_per90", "offsides_per90", "goals_against_per90", "goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "passes_key_per90", "dribbles_success_per90", "passes_per90", "ball_actions_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "passes_accuracy_player_pct", "duels_won_player_pct", "dribbles_success_player_pct", "finishing_efficiency_player_pct", "saves_player_pct"]
      - name: player_count
        description: "Players with a non-null value for this metric in this league-season-position — the N for rank-of-N / percentile."
        tests: [not_null]
      - name: peer_median
        description: "Median peer value (robust central tendency — the typical player in this position)."
        tests: [not_null]
      - name: peer_mean
        description: "Mean peer value (skew-sensitive)."
        tests: [not_null]
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
        tests: [not_null]
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
        tests: [not_null]
  - name: int_team_competition_phase__metrics
    description: >
      An international club competition's season over its league or group phase only: every team
      with a match in a round whose round_stage_kind is table, and its metrics over those matches,
      each by its metric_catalogue formula. Qualifying rounds, play-offs and the knockout phase are
      left out. An international club competition is a club competition other than a domestic
      league or domestic cup. Grain: (team_sk, season_sk).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "(shots_on_goal_pct is null or shots_on_goal_pct between 0 and 1) and (shots_inside_box_pct is null or shots_inside_box_pct between 0 and 1) and (finishing_efficiency_pct is null or finishing_efficiency_pct between 0 and 1) and (passes_accuracy_pct is null or passes_accuracy_pct between 0 and 1) and (saves_pct is null or saves_pct between 0 and 1) and (duels_won_pct is null or duels_won_pct between 0 and 1) and (passes_share_pct is null or passes_share_pct between 0 and 1) and (clean_sheets_pct is null or clean_sheets_pct between 0 and 1) and (points_capture_pct is null or points_capture_pct between 0 and 1) and (shots_share_pct is null or shots_share_pct between 0 and 1)"
          name: int_team_competition_phase__metrics_shares_between_0_and_1
      - dbt_utils.expression_is_true:
          expression: "(points_won is null or points_won >= 0) and (goals is null or goals >= 0) and (goals_against is null or goals_against >= 0) and (clean_sheets is null or clean_sheets >= 0) and (goals_penalty is null or goals_penalty >= 0) and (goals_own is null or goals_own >= 0) and (goals_open_play is null or goals_open_play >= 0) and (corners is null or corners >= 0) and (saves is null or saves >= 0) and (shots_inside_box is null or shots_inside_box >= 0) and (cards_yellow is null or cards_yellow >= 0) and (cards_red is null or cards_red >= 0) and (goals_per_match is null or goals_per_match >= 0) and (goals_against_per_match is null or goals_against_per_match >= 0) and (shots_per_match is null or shots_per_match >= 0) and (shots_on_goal_per_match is null or shots_on_goal_per_match >= 0) and (passes_per_match is null or passes_per_match >= 0) and (corners_per_match is null or corners_per_match >= 0) and (corners_against_per_match is null or corners_against_per_match >= 0) and (passes_key_per_match is null or passes_key_per_match >= 0) and (tackles_per_match is null or tackles_per_match >= 0) and (interceptions_per_match is null or interceptions_per_match >= 0) and (blocks_per_match is null or blocks_per_match >= 0) and (defensive_actions_per_match is null or defensive_actions_per_match >= 0) and (duels_per_match is null or duels_per_match >= 0) and (shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0) and (shots_off_target_per_match is null or shots_off_target_per_match >= 0) and (shots_blocked_per_match is null or shots_blocked_per_match >= 0) and (shots_inside_box_per_match is null or shots_inside_box_per_match >= 0) and (passes_accurate_per_match is null or passes_accurate_per_match >= 0) and (dribbles_attempts_per_match is null or dribbles_attempts_per_match >= 0) and (dribbles_success_per_match is null or dribbles_success_per_match >= 0) and (dribbles_success_pct is null or dribbles_success_pct >= 0) and (duels_won_per_match is null or duels_won_per_match >= 0) and (saves_per_match is null or saves_per_match >= 0) and (free_kicks_per_match is null or free_kicks_per_match >= 0) and (fouls_per_match is null or fouls_per_match >= 0) and (offsides_per_match is null or offsides_per_match >= 0) and (cards_yellow_per_match is null or cards_yellow_per_match >= 0) and (cards_red_per_match is null or cards_red_per_match >= 0)"
          name: int_team_competition_phase__metrics_counts_and_rates_not_negative
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: season_games_played
        description: "The team's finished matches in the league or group phase, a forfeit included."
        tests: [not_null]
      - name: points_won
