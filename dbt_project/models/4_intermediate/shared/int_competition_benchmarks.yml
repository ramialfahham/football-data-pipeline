version: 2

models:
  - name: int_team_competition_benchmarks
    description: >
      Competition benchmark engine (team): per (league_code, season_api_year, metric_key) the league
      distribution (median / mean / p25 / p75 / team_count) of the 22 team season metrics, over teams
      with >= 3 finished games. Median-led (robust to a dominant team). mart_team_competition_benchmarks
      ranks each team against this. The 22-metric set comes from int_team_competition_benchmark_metrics_long.
      Grain: (league_code, season_api_year, metric_key).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, metric_key]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 22-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets_pct", "shots_per_match", "shots_on_goal_pct", "shots_inside_box_pct", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "finishing_efficiency_pct", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "passes_accuracy_pct", "passes_key_per_match", "corners_per_match", "corners_against_per_match", "saves_pct"]
      - name: team_count
        description: "Teams with a non-null value for this metric this league-season — the N for rank-of-N."
        tests: [not_null]
      - name: league_median
        description: "Median team value (robust central tendency; the headline 'typical team')."
      - name: league_mean
        description: "Mean team value (the 'league average'; carried but skew-sensitive)."
      - name: league_p25
        description: "25th-percentile team value (the distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (the distribution spread)."

  - name: int_team_competition_benchmark_metrics_long
    description: >
      The 22 team competition-benchmark metrics in long form, per team-season: one row per
      (team_sk, season_sk, metric_key) unpivoted from int_team_season__metrics (teams with >= 3 finished
      games). The single source of the benchmark metric set — int_team_competition_benchmarks aggregates
      it to the league distribution and mart_team_competition_benchmarks ranks each team against it, so
      the two cannot drift. Replaces the team_benchmark_metrics() macro. Grain: (team_sk, season_sk, metric_key).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk, metric_key]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 22-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets_pct", "shots_per_match", "shots_on_goal_pct", "shots_inside_box_pct", "shots_on_goal_per_match", "shots_on_goal_against_per_match", "shots_on_goal_difference_per_match", "finishing_efficiency_pct", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "passes_accuracy_pct", "passes_key_per_match", "corners_per_match", "corners_against_per_match", "saves_pct"]
      - name: metric_value
        description: "The team's season-to-date value for this metric. UNPIVOT excludes nulls, so this is never null."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"

  - name: int_player_competition_benchmarks
    description: >
      Competition benchmark engine (player): per (league_code, season_api_year, position_group, metric_key)
      the positional-peer distribution (median / mean / p25 / p75 / player_count) of each benchmarked metric,
      over players with >= 270 minutes IN the position (finishing also >= 10 shots on target). Median-led.
      mart_player_competition_benchmarks ranks each player against this. Metric x position eligibility is the
      player_benchmark_metrics() macro (GK = 4 keeper metrics; outfield = the other 16).
      Grain: (league_code, season_api_year, position_group, metric_key).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, position_group, metric_key]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id (the 18-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "key_passes_per90", "dribbles_success_per90", "passes_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency_player_pct", "save_pct"]
      - name: player_count
        description: "Players with a non-null value for this metric in this league-season-position — the N for rank-of-N / percentile."
        tests: [not_null]
      - name: peer_median
        description: "Median peer value (robust central tendency — the typical player in this position)."
        tests: [not_null]
      - name: peer_mean
        description: "Mean peer value (skew-sensitive)."
        tests: [not_null]
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
        tests: [not_null]
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
        tests: [not_null]
