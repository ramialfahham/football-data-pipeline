version: 2

models:
  - name: int_team_competition_benchmarks
    description: >
      Competition benchmark engine (team): per (league_code, season_api_year, metric_key) the league
      distribution (median / mean / p25 / p75 / team_count) of the 20 team season metrics, over teams
      with >= 3 finished games. Median-led (robust to a dominant team). mart_team_competition_benchmarks
      ranks each team against this. The 20-metric set is the team_benchmark_metrics() macro.
      Grain: (league_code, season_api_year, metric_key).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, metric_key]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue team metric_id (the 20-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per_match", "goals_against_per_match", "clean_sheets", "shots_per_match", "shot_accuracy", "danger_zone_ratio", "shots_on_goal_per_match", "finishing_efficiency", "duels_per_match", "duels_won_pct", "defensive_actions_per_match", "tackles_per_match", "interceptions_per_match", "blocks_per_match", "passes_per_match", "pass_accuracy", "key_passes_per_match", "corner_kicks_per_match", "corners_conceded_per_match", "save_ratio"]
      - name: team_count
        description: "Teams with a non-null value for this metric this league-season — the N for rank-of-N."
        tests: [not_null]
      - name: league_median
        description: "Median team value (robust central tendency; the headline 'typical team')."
      - name: league_mean
        description: "Mean team value (the 'league average'; carried but skew-sensitive)."
      - name: league_p25
        description: "25th-percentile team value (the distribution spread)."
      - name: league_p75
        description: "75th-percentile team value (the distribution spread)."

  - name: int_player_competition_benchmarks
    description: >
      Competition benchmark engine (player): per (league_code, season_api_year, position_group, metric_key)
      the positional-peer distribution (median / mean / p25 / p75 / player_count) of each benchmarked metric,
      over players with >= 270 minutes IN the position (finishing also >= 10 shots on target). Median-led.
      mart_player_competition_benchmarks ranks each player against this. Metric x position eligibility is the
      player_benchmark_metrics() macro (GK = 4 keeper metrics; outfield = the other 16).
      Grain: (league_code, season_api_year, position_group, metric_key).
    config:
      tags: ["intermediate", "football", "benchmark"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, position_group, metric_key]
    columns:
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: position_group
        description: "The peer pool — GK/DEF/MID/ATT."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: metric_key
        description: "The benchmarked metric — a metric_catalogue player metric_id (the 18-metric set)."
        tests:
          - not_null
          - accepted_values:
              values: ["goals_per90", "assists_per90", "scorer_points_per90", "shots_on_goal_per90", "key_passes_per90", "dribbles_success_per90", "passes_per90", "tackles_per90", "interceptions_per90", "blocks_per90", "defensive_actions_per90", "duels_won_per90", "saves_per90", "pass_accuracy_pct", "duels_won_pct", "dribbles_success_pct", "finishing_efficiency", "save_pct"]
      - name: player_count
        description: "Players with a non-null value for this metric in this league-season-position — the N for rank-of-N / percentile."
        tests: [not_null]
      - name: peer_median
        description: "Median peer value (robust central tendency — the typical player in this position)."
        tests: [not_null]
      - name: peer_mean
        description: "Mean peer value (skew-sensitive)."
        tests: [not_null]
      - name: peer_p25
        description: "25th-percentile peer value (distribution spread)."
        tests: [not_null]
      - name: peer_p75
        description: "75th-percentile peer value (distribution spread)."
        tests: [not_null]
