version: 2

models:
  - name: int_player_season_position__metrics
    description: >
      A player's season totals SPLIT BY THE POSITION THEY PLAYED, so a player who appears in two
      roles is aggregated once per role. Grain: (player_sk, season_sk, position_group).

      Positions come from the match-time position code, folded to GK, DEF, MID or ATT. Per-90s and
      rates are computed in-position, over only the minutes played there.

      Atom formulas mirror the whole-season player model, so a single-position player's per-90 here
      equals his per-90 there. No minutes floor is applied at this layer.
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, season_sk, position_group]
      # finishing_efficiency_player_pct is open-play conversion in [0,1] (CPO Option A); range-guarded on this
      # surface itself, not only on the benchmark consumer (covers sub-floor / GK rows too).
      - dbt_utils.expression_is_true:
          expression: "finishing_efficiency_player_pct is null or (finishing_efficiency_player_pct between 0 and 1)"
          name: int_player_season_position_finishing_in_range
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: position_group
        description: "GK/DEF/MID/ATT, mapped from the match-time position_code (G/D/M/F)."
        tests:
          - not_null
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: minutes
        description: "Minutes played IN this position this competition-season (the >= 270 benchmark floor)."
        tests: [not_null]
      - name: appearances
        description: >
          Finished matches the player actually PLAYED IN THIS POSITION this competition-season,
          that is minutes greater than 0. A player who moved role mid-season is counted separately
          in each.
        tests: [not_null]
      - name: goals_player
