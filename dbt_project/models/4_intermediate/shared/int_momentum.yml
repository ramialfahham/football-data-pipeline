version: 2

models:
  - name: int_momentum__team
    description: >
      W1 last-5 momentum builder — team. For each upcoming fixture side, aggregates raw
      totals over the window legs selected by int_momentum_window__team (the selection was
      extracted there in #323 so this aggregate and the drill-down list mart consume the
      same matches). No ratios — those are computed in mart_momentum__team.
      Player-derived columns (key_passes, tackles, …) are NULL when player stats are
      unavailable for the window. Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18). Carried from int_momentum_window__team.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "Finished matches in the window: 1–5 for last_5, the cumulative count for tournament windows."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Count of window legs with team stats present (shots/passes/corners/saves). Denominator for per-match team-stat rates and finishing_efficiency."
        tests: [not_null]
      - name: games_with_opp_stats
        description: "Count of window legs with opponent team stats present. Denominator for corners_conceded_per_match."
        tests: [not_null]
      - name: goals_for_in_shot_games
        description: "Goals scored summed only over legs with shots_on_goal present; keeps finishing_efficiency same-window."
      - name: goals_against_in_save_games
        description: "Goals conceded summed only over legs with goalkeeper_saves present; keeps save_ratio same-window."
      - name: contributing_competitions
        description: "Array of distinct league_codes from which the window legs were drawn."
        tests: [not_null]
      - name: games_with_player_stats
        description: "Count of the window legs that have a matching row in int_legs__team_from_players."

  - name: int_momentum__player
    description: >
      W1 last-5 momentum builder — player. For each upcoming fixture side, identifies the
      team's last 5 finished matches (same logic as int_momentum__team) and aggregates raw
      player stat totals for every player who appeared in those matches. No ratios.
      A player absent from some matches contributes stats only for matches they appeared in.
      Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["last_5"]
      - name: games_in_window
        description: "Team window size (max 5). Not the player's individual appearance count."
        tests: [not_null]
      - name: position_code
        description: "Player position from fct_fixture_player_stats. Used to scope save_pct to GK."
