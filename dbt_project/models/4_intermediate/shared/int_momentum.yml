version: 2

models:
  - name: int_team_momentum__metrics
    description: >
      W1 last-5 momentum builder — team. For each upcoming fixture side, aggregates raw
      totals over the window legs selected by int_team_momentum_window (the selection was
      extracted there in #323 so this aggregate and the drill-down list mart consume the
      same matches). No ratios — those are computed in mart_team_momentum.
      Player-derived columns (key_passes, tackles, …) are NULL when player stats are
      unavailable for the window. Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window: last_5 (default) or tournament_to_date / qualifiers for tournament
          fixtures (GAP-18). Carried from int_team_momentum_window.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "Finished matches in the window: 1–5 for last_5, the cumulative count for tournament windows."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Count of window legs with team stats present (shots/passes/corners). Denominator/gate for per-match team-stat rates and finishing_efficiency."
        tests: [not_null]
      - name: games_with_opp_stats
        description: "Count of window legs with opponent team stats present. Denominator/gate for corners_against_per_match."
        tests: [not_null]
      - name: games_with_save_stats
        description: "Count of window legs with goalkeeper_saves present — save_ratio's own coverage bucket (saves can be null where other team stats are present), used to NULL save_ratio on partial coverage."
        tests: [not_null]
      - name: goals_penalty
        description: "Penalty goals scored by the team over the window (from match events); subtracted from goals_for for the open-play finishing numerator (CPO Option A)."
      - name: goals_own
        description: "Own goals credited to the team over the window (the opponents' own-goal events); subtracted from goals_for for the open-play finishing numerator (CPO Option A)."
      - name: goals_against_in_save_games
        description: "Goals conceded summed only over legs with goalkeeper_saves present; keeps save_ratio same-window."
      - name: contributing_competitions
        description: "Array of distinct league_codes from which the window legs were drawn."
        tests: [not_null]
      - name: games_with_player_stats
        description: "Count of the window legs that have a matching row in int_legs__team_from_players."

  - name: int_player_momentum__metrics
    description: >
      W1 momentum builder — player. For each upcoming fixture side, aggregates raw player stat
      totals for every player who appeared in the side's window legs. The window selection is
      consumed from the shared int_team_momentum_window model (#323) — the SAME selection the team
      aggregate uses — so the player top-players strip and the team form panel stay on one window
      (last_5 default, or the cumulative tournament_to_date / qualifiers window on tournament
      fixtures, GAP-18/#484). No ratios. A player absent from some legs contributes stats only for
      matches they appeared in. Grain: (upcoming_fixture_sk, team_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          The form window, carried from int_team_momentum_window: last_5 (default) or
          tournament_to_date / qualifiers for tournament fixtures (GAP-18/#484). Constant per
          (upcoming_fixture_sk, team_sk).
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "The player's appearance count within the side's window (1..5 for last_5, uncapped for tournament windows)."
        tests: [not_null]
      - name: position_code
        description: "Player position from fct_fixture_player_stats. Used to scope save_pct to GK."
