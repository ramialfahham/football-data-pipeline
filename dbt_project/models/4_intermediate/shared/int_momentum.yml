version: 2

models:
  - name: int_team_momentum__metrics
    description: >
      The recent-form metrics for each side of an upcoming fixture: each its catalogue formula,
      written by scripts/generate_metric_sql.py over the window legs that int_team_momentum_window
      selects, so this model and the match-by-match list cover the same set of matches.
      Grain: (upcoming_fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: "{{ doc('window_type__form') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "Finished matches in the window: 1–5 for last_5, the cumulative count for tournament windows."
        tests: [not_null]
      - name: games_expecting_team_stats
        description: "Games in this form window that COULD carry a team stat line — games in the window minus any awarded result (technical loss, walkover), which is decided off the pitch and never has one."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Count of window legs with shots present. Never NULL."
        tests: [not_null]
      - name: games_with_player_stats
        description: "Count of the window legs that have a matching row in int_legs__team_from_players. Never NULL."
        tests: [not_null]
      - name: contributing_competitions
        description: "{{ doc('contributing_competitions') }}"
        tests: [not_null]
      - name: points_won
        description: "{{ doc('points_won') }}"
      - name: clean_sheets
        description: "{{ doc('clean_sheets') }}"
      - name: goals_per_match
        description: "{{ doc('goals_per_match') }}"
      - name: goals_against_per_match
        description: "{{ doc('goals_against_per_match') }}"
      - name: shots_per_match
        description: "{{ doc('shots_per_match') }}"
      - name: shots_on_goal_pct
        description: "{{ doc('shots_on_goal_pct') }}"
      - name: shots_inside_box_pct
        description: "{{ doc('shots_inside_box_pct') }}"
      - name: shots_on_goal_per_match
        description: "{{ doc('shots_on_goal_per_match') }}"
      - name: finishing_efficiency_pct
        description: "{{ doc('finishing_efficiency_pct') }}"
      - name: passes_per_match
        description: "{{ doc('passes_per_match') }}"
      - name: passes_accuracy_pct
        description: "{{ doc('passes_accuracy_pct') }}"
      - name: corners_per_match
        description: "{{ doc('corners_per_match') }}"
      - name: corners_against_per_match
        description: "{{ doc('corners_against_per_match') }}"
      - name: saves_pct
        description: "{{ doc('saves_pct') }}"
      - name: passes_key_per_match
        description: "{{ doc('passes_key_per_match') }}"
      - name: tackles_per_match
        description: "{{ doc('tackles_per_match') }}"
      - name: interceptions_per_match
        description: "{{ doc('interceptions_per_match') }}"
      - name: blocks_per_match
        description: "{{ doc('blocks_per_match') }}"
      - name: defensive_actions_per_match
        description: "{{ doc('defensive_actions_per_match') }}"
      - name: duels_per_match
        description: "{{ doc('duels_per_match') }}"
      - name: duels_won_pct
        description: "{{ doc('duels_won_pct') }}"
      - name: shots_on_goal_against_per_match
        description: "{{ doc('shots_on_goal_against_per_match') }}"
      - name: shots_off_target_per_match
        description: "{{ doc('shots_off_target_per_match') }}"
      - name: shots_blocked_per_match
        description: "{{ doc('shots_blocked_per_match') }}"
      - name: shots_inside_box_per_match
        description: "{{ doc('shots_inside_box_per_match') }}"
      - name: passes_accurate_per_match
        description: "{{ doc('passes_accurate_per_match') }}"
      - name: passes_share_pct
        description: "{{ doc('passes_share_pct') }}"
      - name: dribbles_attempts_per_match
        description: "{{ doc('dribbles_attempts_per_match') }}"
      - name: dribbles_success_per_match
        description: "{{ doc('dribbles_success_per_match') }}"
      - name: dribbles_success_pct
        description: "{{ doc('dribbles_success_pct') }}"
      - name: duels_won_per_match
        description: "{{ doc('duels_won_per_match') }}"
      - name: saves_per_match
        description: "{{ doc('saves_per_match') }}"
      - name: free_kicks_per_match
        description: "{{ doc('free_kicks_per_match') }}"
      - name: fouls_per_match
        description: "{{ doc('fouls_per_match') }}"
      - name: offsides_per_match
        description: "{{ doc('offsides_per_match') }}"
      - name: cards_yellow_per_match
        description: "{{ doc('cards_yellow_per_match') }}"
      - name: cards_red_per_match
        description: "{{ doc('cards_red_per_match') }}"

  - name: int_player_momentum__metrics
    description: >
      Recent-form metrics per player, for every player who appeared in a side's window legs.
      Grain: (upcoming_fixture_sk, team_sk, player_sk).

      The window comes from the shared int_team_momentum_window model — the SAME selection the
      team aggregate uses — so player and team figures are always over one set of matches.

      Every metric, counts and ratios, is its metric_catalogue formula over the window's leg rows. A
      player who missed some legs contributes only for the matches they actually appeared in, so
      their totals are over a shorter window than the side's.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: "{{ doc('window_type__form') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: >
          How many of the side's window matches this player appeared in: 0 to 5 for last_5,
          uncapped for a tournament window. Counts only legs the player actually PLAYED (minutes
          greater than 0), so 0 means named in the matchday squad and never brought on. NULL when a
          leg's minutes are unknown or a window leg of the side has no player data at all.
      - name: position_code
        description: "Player position from fct_fixture_player_stats."
      - name: goals_player
        description: "{{ doc('goals_player') }}"
      - name: goals_against_player
        description: "{{ doc('goals_against_player') }}"
      - name: assists_player
        description: "{{ doc('assists_player') }}"
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: shots_player
        description: "{{ doc('shots_player') }}"
      - name: shots_on_goal_player
        description: "{{ doc('shots_on_goal_player') }}"
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate_player
        description: "{{ doc('passes_accurate_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
      - name: offsides_player
        description: "{{ doc('offsides_player') }}"
      - name: dribbles_past_player
        description: "{{ doc('dribbles_past_player') }}"
      - name: penalty_won_player
        description: "{{ doc('penalty_won_player') }}"
      - name: penalty_committed_player
        description: "{{ doc('penalty_committed_player') }}"
      - name: saves_player_pct
        description: "{{ doc('saves_player_pct') }}"
      - name: dribbles_success_player_pct
        description: "{{ doc('dribbles_success_player_pct') }}"
      - name: passes_accuracy_player_pct
        description: "{{ doc('passes_accuracy_player_pct') }}"
      - name: duels_won_player_pct
        description: "{{ doc('duels_won_player_pct') }}"
