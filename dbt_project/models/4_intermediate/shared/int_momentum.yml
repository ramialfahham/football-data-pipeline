version: 2

models:
  - name: int_team_momentum__metrics
    description: >
      Raw recent-form totals for each side of an upcoming fixture, summed over the window legs
      that int_team_momentum_window selects. Grain: (upcoming_fixture_sk, team_sk).

      Totals only, no ratios — those are computed one layer up, so this model and the
      match-by-match list are guaranteed to be summing the same set of matches.

      Player-derived columns (key_passes, tackles, …) are NULL when the window has no player
      stats.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk]
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window these totals were summed over: last_5 by default, or
          tournament_to_date / qualifiers on a tournament fixture. Carried from
          int_team_momentum_window.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: "Finished matches in the window: 1–5 for last_5, the cumulative count for tournament windows."
        tests: [not_null]
      - name: games_expecting_team_stats
        description: "Games in this form window that COULD carry a team stat line — games in the window minus any awarded result (technical loss, walkover), which is decided off the pitch and never has one. The mart's team-stat gates divide against this rather than the window size, so an awarded match is not mistaken for missing data. The season surface carries the identical counter; if the two ever disagree, the same match would be treated differently in a team's form and its season."
        # See the twin in int_season_record.yml: a NULL here would not fail a gate, it would bypass
        # one, because `x < NULL` is NULL and the CASE falls through to its ELSE.
        tests: [not_null]
      - name: goals_open_play_in_sot_games
        description: "Open-play goals (goals minus penalties minus own goals) summed ONLY over the window legs that have shots-on-target data, so finishing_efficiency_pct divides over the games its denominator can see. An awarded result's goals are real and enter the full goal sums but carry no shots, so a full-sum numerator would credit goals no shot could explain."
        # ⚠ DELIBERATELY NOT not_null, unlike the counter above. This is a coverage-RESTRICTED sum:
        # where a window has no shots-on-target data at all it sums nothing and is legitimately NULL,
        # which is the honest answer and what makes finishing_efficiency_pct null out. Its precedent
        # sibling `goals_against_in_save_games` is untested for the same reason. A not_null here was
        # deliberately absent: it would fail on real data.
      - name: games_with_team_stats
        description: "Count of window legs with team stats present (shots/passes/corners). Denominator/gate for per-match team-stat rates and finishing_efficiency_pct."
        tests: [not_null]
      - name: games_with_opp_stats
        description: "Count of window legs with opponent team stats present. Denominator/gate for corners_against_per_match."
        tests: [not_null]
      - name: games_with_save_stats
        description: "Count of window legs with goalkeeper_saves present — saves_pct's own coverage bucket (saves can be null where other team stats are present), used to NULL saves_pct on partial coverage."
        tests: [not_null]
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: goals_against_in_save_games
        description: "Goals conceded summed only over legs with goalkeeper_saves present; keeps saves_pct same-window."
      - name: contributing_competitions
        description: "{{ doc('contributing_competitions') }}"
        tests: [not_null]
      - name: games_with_player_stats
        description: "Count of the window legs that have a matching row in int_legs__team_from_players."
      - name: games_with_sot_stats
      - name: points_won
        description: "{{ doc('points_won') }}"
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: clean_sheet_games
      - name: shots_total
        description: "{{ doc('shots_player') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal_player') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: passes_total
        description: "{{ doc('passes_player') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate_player') }}"
      - name: corner_kicks
        description: "{{ doc('corners') }}"
      - name: opponent_corner_kicks
      - name: goalkeeper_saves
        description: "{{ doc('saves') }}"
      - name: key_passes
      - name: tackles
      - name: interceptions
      - name: blocks
      - name: duels_total
        description: "{{ doc('duels_player') }}"
      - name: duels_won
        description: "{{ doc('duels_won_player') }}"

  - name: int_player_momentum__metrics
    description: >
      Raw recent-form totals per player, for every player who appeared in a side's window legs.
      Grain: (upcoming_fixture_sk, team_sk, player_sk).

      The window comes from the shared int_team_momentum_window model — the SAME selection the
      team aggregate uses — so player and team figures are always over one set of matches.

      Totals only, no ratios. A player who missed some legs contributes only for the matches they
      actually appeared in, so their totals are over a shorter window than the side's.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, player_sk]
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: >
          Which form window these totals were summed over, carried from int_team_momentum_window:
          last_5 by default, or tournament_to_date / qualifiers on a tournament fixture. Constant
          across all players on one side.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: games_in_window
        description: >
          How many of the side's window matches this player appeared in: 0 to 5 for last_5,
          uncapped for a tournament window. Counts only legs the player actually PLAYED (minutes
          greater than 0), so 0 means named in the matchday squad and never brought on.
        tests: [not_null]
      - name: position_code
        description: "Player position from fct_fixture_player_stats. Used to scope saves_player_pct to GK."
      - name: goals_total
      - name: goals_against_player
        description: "{{ doc('goals_against_player') }}"
      - name: goals_assists
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: shots_player
        description: "{{ doc('shots_player') }}"
      - name: shots_on
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate_player
        description: "{{ doc('passes_accurate_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
      - name: offsides_player
        description: "{{ doc('offsides_player') }}"
      - name: dribbles_past_player
        description: "{{ doc('dribbles_past_player') }}"
      - name: penalty_won_player
        description: "{{ doc('penalty_won_player') }}"
      - name: penalty_committed_player
        description: "{{ doc('penalty_committed_player') }}"
