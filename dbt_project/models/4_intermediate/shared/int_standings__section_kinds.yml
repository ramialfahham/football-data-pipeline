version: 2

models:
  - name: int_standings__section_kinds
    description: >
      What kind of table each standings section of a league-season is. The kind is the first
      standings_table_kinds pattern by priority that matches the section's name, and league where
      none does; a section that holds one team from each of the league-season's other tables is
      a ranking, and so is a section left as a league whose every team also sits in one of the
      league-season's group or conference tables. mart_standings, int_team_season__table_state and
      int_team_season__standings_primary read it. Grain: (league_code, season_api_year,
      group_name).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_api_year, group_name]
    columns:
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: group_name
        description: "The standings section's name as the provider gives it: the league's name, a group, a conference or a round of a split season."
      - name: table_kind
        description: "The section's kind: league, group, conference, split_round or ranking."
        tests:
          - not_null
          - accepted_values:
              values: ["league", "group", "conference", "split_round", "ranking"]
