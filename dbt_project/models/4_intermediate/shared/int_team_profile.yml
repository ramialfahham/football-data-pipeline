version: 2

models:
  - name: int_team_profile__yoy
    description: >
      This season against last, compared over the same number of games played. One row per
      team's CURRENT domestic season. Grain: (team_sk, league_code, season_api_year).
      DOMESTIC LEAGUES ONLY.

      Carries the three scoreline totals and every rate metric, each as _this_season,
      _prev_season and _delta_yoy. It also carries last season's position at the cutoff,
      points_rank_prev_season.

      Aligned by GAMES PLAYED, not by matchday: parsed round numbers collide across phases in a
      multi-phase format, so games played is the only key safe for every competition shape.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year]
      # Ratio bounds are split by invariant family, mirroring int_team_season__metrics_cumulative
      # (the composed source): the YoY cutoff N is low by construction early in every season, so a
      # provider-subset ratio can legitimately be >1 on a side before dilution. Structurally-capped
      # ratios (finishing_efficiency_pct = open-play goals/shots on target; saves_pct = saves/(saves+
      # goals); clean_sheets_pct = clean_sheet_games/games) stay strict [0,1] on both sides.
      - dbt_utils.expression_is_true:
          expression: "(finishing_efficiency_pct_this_season is null or finishing_efficiency_pct_this_season between 0 and 1) and (saves_pct_this_season is null or saves_pct_this_season between 0 and 1) and (clean_sheets_pct_this_season is null or clean_sheets_pct_this_season between 0 and 1) and (finishing_efficiency_pct_prev_season is null or finishing_efficiency_pct_prev_season between 0 and 1) and (saves_pct_prev_season is null or saves_pct_prev_season between 0 and 1) and (clean_sheets_pct_prev_season is null or clean_sheets_pct_prev_season between 0 and 1)"
          name: team_profile_yoy_structural_ratios_in_range
      # Provider-subset ratios (shots_inside_box_pct = inside_box/shots, passes_accuracy_pct = accurate/total,
      # duels_won_pct = won/total): one provider stat over another. At a low cutoff N a single game
      # where the provider reports numerator > denominator (a known API inconsistency) is not yet
      # diluted, so >1 is genuine data, not a bug — bounded >= 0 only (a negative would be a real
      # sign-flip). Per-match count rates have no upper bound; they are >= 0 like any count.
      - dbt_utils.expression_is_true:
          expression: "(shots_inside_box_pct_this_season is null or shots_inside_box_pct_this_season >= 0) and (passes_accuracy_pct_this_season is null or passes_accuracy_pct_this_season >= 0) and (duels_won_pct_this_season is null or duels_won_pct_this_season >= 0) and (shots_inside_box_pct_prev_season is null or shots_inside_box_pct_prev_season >= 0) and (passes_accuracy_pct_prev_season is null or passes_accuracy_pct_prev_season >= 0) and (duels_won_pct_prev_season is null or duels_won_pct_prev_season >= 0)"
          name: team_profile_yoy_subset_ratios_non_negative
      - dbt_utils.expression_is_true:
          expression: "(goals_per_match_this_season is null or goals_per_match_this_season >= 0) and (goals_against_per_match_this_season is null or goals_against_per_match_this_season >= 0) and (shots_per_match_this_season is null or shots_per_match_this_season >= 0) and (shots_on_goal_per_match_this_season is null or shots_on_goal_per_match_this_season >= 0) and (duels_per_match_this_season is null or duels_per_match_this_season >= 0) and (defensive_actions_per_match_this_season is null or defensive_actions_per_match_this_season >= 0) and (passes_per_match_this_season is null or passes_per_match_this_season >= 0) and (passes_key_per_match_this_season is null or passes_key_per_match_this_season >= 0) and (corners_per_match_this_season is null or corners_per_match_this_season >= 0) and (corners_against_per_match_this_season is null or corners_against_per_match_this_season >= 0) and (goals_per_match_prev_season is null or goals_per_match_prev_season >= 0) and (goals_against_per_match_prev_season is null or goals_against_per_match_prev_season >= 0) and (shots_per_match_prev_season is null or shots_per_match_prev_season >= 0) and (shots_on_goal_per_match_prev_season is null or shots_on_goal_per_match_prev_season >= 0) and (duels_per_match_prev_season is null or duels_per_match_prev_season >= 0) and (defensive_actions_per_match_prev_season is null or defensive_actions_per_match_prev_season >= 0) and (passes_per_match_prev_season is null or passes_per_match_prev_season >= 0) and (passes_key_per_match_prev_season is null or passes_key_per_match_prev_season >= 0) and (corners_per_match_prev_season is null or corners_per_match_prev_season >= 0) and (corners_against_per_match_prev_season is null or corners_against_per_match_prev_season >= 0)"
          name: team_profile_yoy_per_match_rates_non_negative
      - dbt_utils.expression_is_true:
          expression: "points_rank_prev_season is null or (points_rank_prev_season >= 1 and games_played_prev is not null)"
          name: team_profile_yoy_points_rank_is_a_place
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the team's current domestic season, the year-over-year anchor."
        tests: [not_null]
      - name: yoy_games_played_cutoff
        description: "{{ doc('yoy_games_played_cutoff') }}"
        tests: [not_null]
      - name: points_delta_yoy
        description: "{{ doc('table_points') }} Here, this season's minus the previous season's, each on the day of the team's Nth match (yoy_games_played_cutoff)."
      - name: goals_per_match_delta_yoy
        description: "{{ doc('goals_per_match_delta_yoy__team') }}"
      - name: games_played_prev
        description: "The prior season's games played through the same games-played cutoff as yoy_games_played_cutoff (the largest match_number not exceeding it). NULL when the team has no prior domestic season in this league to align against."
      - name: points_this_season
        description: "{{ doc('table_points') }} Here, this season, on the day of the team's Nth match (yoy_games_played_cutoff); empty where the table is not rebuilt."
      - name: goals_for_this_season
        description: "{{ doc('goals') }} Here, this season through the games-played cutoff N (yoy_games_played_cutoff)."
      - name: goals_against_this_season
        description: "{{ doc('goals_against_this_season__team') }}"
      - name: goals_per_match_this_season
        description: "{{ doc('goals_per_match_this_season__team') }}"
      - name: goals_against_per_match_this_season
        description: "{{ doc('goals_against_per_match_this_season__team') }}"
      - name: clean_sheets_pct_this_season
        description: "{{ doc('clean_sheets_pct_this_season__team') }}"
      - name: shots_per_match_this_season
        description: "{{ doc('shots_per_match_this_season__team') }}"
      - name: shots_inside_box_pct_this_season
        description: "{{ doc('shots_inside_box_pct_this_season__team') }}"
      - name: shots_on_goal_per_match_this_season
        description: "{{ doc('shots_on_goal_per_match_this_season__team') }}"
      - name: finishing_efficiency_pct_this_season
        description: "{{ doc('finishing_efficiency_pct_this_season__team') }}"
      - name: duels_per_match_this_season
        description: "{{ doc('duels_per_match_this_season__team') }}"
      - name: duels_won_pct_this_season
        description: "{{ doc('duels_won_pct_this_season__team') }}"
      - name: defensive_actions_per_match_this_season
        description: "{{ doc('defensive_actions_per_match_this_season__team') }}"
      - name: passes_per_match_this_season
        description: "{{ doc('passes_per_match_this_season__team') }}"
      - name: passes_accuracy_pct_this_season
        description: "{{ doc('passes_accuracy_pct_this_season__team') }}"
      - name: passes_key_per_match_this_season
        description: "{{ doc('passes_key_per_match_this_season__team') }}"
      - name: corners_per_match_this_season
        description: "{{ doc('corners_per_match_this_season__team') }}"
      - name: corners_against_per_match_this_season
        description: "{{ doc('corners_against_per_match_this_season__team') }}"
      - name: saves_pct_this_season
