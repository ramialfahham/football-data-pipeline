  - name: int_team_profile__streaks
    description: >
      A team's current runs as of its most recent match: unbeaten, win, winless, clean-sheet and
      scoring. Grain: (team_sk, season_sk).

      A run counts the most-recent consecutive matches satisfying the condition, stopping at the
      first that breaks it — so it is a trailing streak, not the season's longest.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "unbeaten_run >= 0 and win_run >= 0 and winless_run >= 0 and clean_sheet_run >= 0 and scoring_run >= 0"
          name: team_profile_streaks_non_negative
      - dbt_utils.expression_is_true:
          expression: "unbeaten_run <= matches_in_season and clean_sheet_run <= matches_in_season"
          name: team_profile_streaks_within_season
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: matches_in_season
        tests: [not_null]
      - name: league_code
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: unbeaten_run
      - name: win_run
      - name: winless_run
      - name: clean_sheet_run
      - name: scoring_run
