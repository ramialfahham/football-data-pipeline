version: 2

models:
  - name: int_team_momentum_window
    description: >
      WHICH past matches count as a side's recent form. One row per (upcoming fixture side,
      selected match). Grain: (upcoming_fixture_sk, team_sk, leg_fixture_sk).

      By default the team's last 5 finished matches before the fixture, across competitions but
      within the same entity_type, capped to the season for clubs and recency-only for national
      teams. A tournament fixture instead takes a cumulative, uncapped window: the tournament so
      far, or its qualifiers.

      The selection lives here on its own so that everything computing form uses the same set of
      matches, rather than each re-deriving it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, leg_fixture_sk]
      - dbt_utils.expression_is_true:
          expression: "recency_rank >= 1 and (recency_rank <= 5 or window_type in ('tournament_to_date', 'qualifiers'))"
          name: momentum_window_team_recency_rank_capped_for_last_5
    columns:
      - name: upcoming_fixture_sk
        description: "{{ doc('upcoming_fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: leg_fixture_sk
        description: "The past match this row describes; joins to the per-fixture stat marts."
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: window_type
        description: >
          Which window this match belongs to: last_5 by default, or tournament_to_date /
          qualifiers on a tournament fixture. Constant across one side's rows.
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent of the window legs (uncapped for tournament windows)."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: is_awarded_result
        description: "TRUE where the selected match was decided off the pitch — a technical loss or walkover. Carried through from the leg so the form-window aggregate can subtract it from the games expected to have a stat line."
        # not_null for the same reason as games_expecting_team_stats, which is derived FROM it:
        # a NULL here would make countif(not is_awarded_result) undercount and every gate compare
        # against a denominator that is quietly too small. It cannot be NULL today — the leg filter
        # already restricts status_short to five non-null codes — so this guards a future change.
        tests: [not_null]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: leg_league_code
        description: "The competition the past match in this row was played in. It can differ from the competition of the fixture the window is being built for, because form is taken across competitions - a cup tie counts towards the run into a league match."
      - name: leg_kickoff_datetime
        description: "When the past match in this row kicked off, in UTC. Ordering by it walks the window from oldest to most recent."
      - name: leg_round_name
        description: "The provider's round label for the past match in this row, free text such as 'Regular Season - 12' or 'Quarter-finals'. Its shape varies by competition, so it reads well and sorts badly."
      - name: home_away
        description: "{{ doc('home_away') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: shots_total
        description: "{{ doc('shots_player') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal_player') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: passes_total
        description: "{{ doc('passes_player') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate_player') }}"
      - name: corner_kicks
        description: "{{ doc('corners') }}"
      - name: opponent_corner_kicks
      - name: goalkeeper_saves
        description: "{{ doc('saves') }}"
      - name: opponent_shots_on_goal
