version: 2

models:
  - name: int_team_momentum_window
    description: >
      W1 momentum-window selection — team. One row per (upcoming fixture side, window leg).
      Default (window_type='last_5'): the team's last 5 finished matches before the upcoming
      fixture, cross-competition within the same entity_type, season-capped for clubs and
      recency-only for national teams. Tournament fixtures (GAP-18, matrix §4) instead use a
      cumulative window — tournament_to_date (this tournament so far) or qualifiers (its
      opener) — uncapped. Extracted from int_team_momentum__metrics (#323) so the momentum aggregate
      and the drill-down list mart consume the same selection.
      Grain: (upcoming_fixture_sk, team_sk, leg_fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upcoming_fixture_sk, team_sk, leg_fixture_sk]
      - dbt_utils.expression_is_true:
          expression: "recency_rank >= 1 and (recency_rank <= 5 or window_type in ('tournament_to_date', 'qualifiers'))"
          name: momentum_window_team_recency_rank_capped_for_last_5
    columns:
      - name: upcoming_fixture_sk
        tests: [not_null]
      - name: team_sk
        tests: [not_null]
      - name: leg_fixture_sk
        description: "The past match this row describes; click-through key for the drill-down."
        tests: [not_null]
      - name: window_type
        description: >
          Which window this leg belongs to: last_5 (default) or tournament_to_date / qualifiers
          for tournament fixtures (GAP-18). Constant per (upcoming_fixture_sk, team_sk).
        tests:
          - not_null
          - accepted_values:
              values: ["last_5", "tournament_to_date", "qualifiers"]
      - name: recency_rank
        description: "1 = most recent of the window legs (uncapped for tournament windows)."
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
