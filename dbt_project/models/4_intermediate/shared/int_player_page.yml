version: 2

models:
  - name: int_competition_season__club_windows
    description: >
      The club competitions a player's season and the season before it are made of. For each club
      competition-season: this_season is every club edition of the same season, and last_season
      every one of its previous season not already in this_season, as competition_season_map places
      them. Grain: (anchor_season_sk, window_type, season_sk).
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [anchor_season_sk, window_type, season_sk]
    columns:
      - name: anchor_season_sk
        description: "The competition-season the windows are drawn around. {{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: window_type
        description: "this_season or last_season."
        tests:
          - not_null
          - accepted_values:
              values: ["this_season", "last_season"]
      - name: season_sk
        description: "A competition-season in the window. {{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk

  - name: int_player__national_team_minutes
    description: >
      A player's minutes for a national team since 1 July 2025, beside the team's own minutes over
      the same matches: the length of each of its matches with player data, 90, or 120 after extra
      time. A regular played at least a third of the team's minutes. Grain: (player_sk, team_sk).
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, team_sk]
      - dbt_utils.expression_is_true:
          expression: "is_regular = (national_team_minutes * 3 >= national_team_match_minutes)"
          name: national_team_regular_is_a_third_of_the_minutes
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "The national team. {{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: national_team_minutes
        description: "The player's minutes for the team since 1 July 2025; 0 when his matches carry no minutes."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: national_team_match_minutes
        description: "The team's minutes since 1 July 2025 over its matches with player data: 90 a match, 120 after extra time."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 90
      - name: is_regular
        description: "True when the player played at least a third of the team's minutes."
        tests: [not_null]

  - name: int_team__current_national_competitions
    description: >
      A nation's current competitions: every national-team competition of the nation between its
      first and last match, or the most recently finished one when none is running. Grain:
      (team_sk, season_sk).
    config:
      tags: ["intermediate", "football", "team"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, season_sk]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: first_match_at
        description: "Kickoff of the competition's first fixture."
        tests: [not_null]
      - name: last_match_at
        description: "Kickoff of the competition's last fixture listed so far."
        tests: [not_null]
      - name: is_running
        description: "True while the competition's last listed fixture is still to come."
        tests: [not_null]
      - name: window_is_complete
        description: "False when any of the nation's current competitions holds a match of the nation with no player data."
        tests: [not_null]

  - name: int_player__page_profile
    description: >
      One row per player: the choices the Player page opens on. The featured season, the position,
      the current club, the club of the featured season, the nation and which tabs the player has.
      Grain: (player_sk).
    config:
      tags: ["intermediate", "football", "player"]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: featured_season_sk
        description: "The season the player's page opens on: the most recent club season, a domestic league before a cup."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: featured_entity_type
        description: "club, or national for a player with no club football."
        tests: [not_null]
      - name: position_group
        description: "GK, DEF, MID or ATT: the player's most frequent position in the featured season."
        tests:
          - accepted_values:
              values: ["GK", "DEF", "MID", "ATT"]
      - name: current_club_team_sk
        description: "The club of the player's latest club match. NULL for a player with no club football."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: featured_team_sk
        description: "The club of the latest match in the featured season's club competitions."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: national_team_sk
        description: "The nation whose squad the player is in for a current competition. NULL when there is none."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: has_national_team_tab
        description: "True when the player is in a nation's squad for a current competition."
        tests: [not_null]
      - name: has_club_tab
        description: "True when the player has played club football."
        tests: [not_null]
      - name: has_player_page
        description: "{{ doc('has_player_page') }}"
        tests: [not_null]

  - name: int_player_page__window_seasons
    description: >
      The competition-seasons of each window on a player's page: the club competitions of this and
      last season, and the nation's current competitions. Grain: (player_sk, window_type, season_sk).
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, window_type, season_sk]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: window_type
        description: "this_season, last_season or current_competitions."
        tests:
          - not_null
          - accepted_values:
              values: ["this_season", "last_season", "current_competitions"]
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} The nation on a current_competitions row. NULL on a club window, which follows the player across clubs."
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: competition_type
        description: "{{ doc('competition_type') }}"
        tests: [not_null]
      - name: last_match_at
        description: "Kickoff of the competition's last fixture listed so far."
        tests: [not_null]

