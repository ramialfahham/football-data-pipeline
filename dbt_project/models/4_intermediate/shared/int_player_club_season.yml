version: 2

models:
  - name: int_player_club_season__metrics
    description: >
      A player's totals at ONE club in one competition-season — the finest grain the player atoms
      exist at. Grain: (player_sk, team_sk, season_sk). A mid-season transfer gives one row per
      club, with no collapse to a last club.

      The single source of those atoms, so anything needing player-season numbers re-sums these
      rather than re-aggregating the matches itself.

      Atoms follow the metric_catalogue seed exactly: passes_accurate rounded per fixture then
      summed, counts treating NULL as 0, `appearances` counting only matches PLAYED. Ratios and
      per-90s are derived where consumed, never here.
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - season_sk
      # An appearance requires pitch time, so starts and substitute appearances PARTITION appearances
      # exactly: is_starter = (minutes > 0 and not sub), substitute_appearances = (minutes > 0 and sub).
      # This is the guard that would have caught the 2026-07-23 defect, where appearances counted every
      # matchday selection (incl. unused substitutes) while starts already required minutes > 0.
      - dbt_utils.expression_is_true:
          expression: "starts + substitute_appearances = appearances"
          name: player_club_season_starts_plus_subs_equals_appearances
    columns:
      - name: player_club_season_sk
        description: "Surrogate key — generate_surrogate_key(player_sk, team_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club the player turned out for that competition-season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: appearances
        description: >
          Finished matches this player actually PLAYED for this club that competition-season, that
          is minutes greater than 0. 0 is legitimate rather than missing: a squad member named on
          the bench all season and never brought on keeps his row.
        tests: [not_null]
      - name: last_kickoff_at
        description: "{{ doc('last_kickoff_at') }}"
      - name: starts
        description: "{{ doc('starts') }}"
      - name: substitute_appearances
      - name: minutes
      - name: goals
        description: "{{ doc('goals__player') }}"
      - name: goals_penalty
        description: "{{ doc('goals_penalty__player') }}"
      - name: assists
        description: "{{ doc('assists') }}"
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_key
        description: "{{ doc('passes_key') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate') }}"
      - name: tackles_total
        description: "{{ doc('tackles_total') }}"
      - name: tackles_interceptions
        description: "{{ doc('tackles_interceptions') }}"
      - name: tackles_blocks
        description: "{{ doc('tackles_blocks') }}"
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: dribbles_past
        description: "{{ doc('dribbles_past') }}"
      - name: offsides
        description: "{{ doc('offsides') }}"
      - name: cards_yellow
        description: "{{ doc('cards_yellow') }}"
      - name: cards_red
        description: "{{ doc('cards_red') }}"
      - name: penalty_won
        description: "{{ doc('penalty_won') }}"
      - name: penalty_committed
        description: "{{ doc('penalty_committed') }}"
      - name: saves
        description: "{{ doc('saves__player') }}"
      - name: goals_against
        description: "{{ doc('goals_against__player') }}"
