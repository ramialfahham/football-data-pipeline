version: 2

models:
  - name: int_player_club_season__metrics
    description: >
      Per (player, CLUB, competition-season) aggregate over all finished matches — the finest-grain player
      atoms rollup (#480 §8.3). One row per player at one club in one competition-season; a mid-season
      transfer yields one row per club (no last-club collapse). The single atoms source that
      int_player_season__metrics (re-aggregated to the competition-season) and mart_player_career (the
      per-club career log) both COMPOSE. Atoms follow metric_catalogue.csv exactly (per-fixture
      ROUND-weighted passes_accurate; counts coalesce nulls to 0; appearances = finished-match legs the
      player actually PLAYED). Ratios / per-90 are derived where consumed, not here.
      Grain: (player_sk, team_sk, season_sk).
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - team_sk
            - season_sk
      # An appearance requires pitch time, so starts and substitute appearances PARTITION appearances
      # exactly: is_starter = (minutes > 0 and not sub), substitute_appearances = (minutes > 0 and sub).
      # This is the guard that would have caught the 2026-07-23 defect, where appearances counted every
      # matchday selection (incl. unused substitutes) while starts already required minutes > 0.
      - dbt_utils.expression_is_true:
          expression: "starts + substitute_appearances = appearances"
          name: player_club_season_starts_plus_subs_equals_appearances
    columns:
      - name: player_club_season_sk
        description: "Surrogate key — generate_surrogate_key(player_sk, team_sk, season_sk)."
        tests: [not_null, unique]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club the player turned out for that competition-season."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: appearances
        description: "Finished-match legs this player actually PLAYED for this club that competition-season (minutes > 0). 0 is legitimate: a squad member named on the bench all season but never brought on. Before 2026-07-23 this was count(*) of player-stat rows, which counted unused substitutes as appearances (honest absence where stats are off still applies)."
        tests: [not_null]
