version: 2

models:
  - name: int_team_season_record
    description: >
      A team's season totals as they stood after each of its matches — cumulative running totals
      within one competition-season, one row per team-match. The season-long counterpart to
      int_team_momentum__metrics, which does the same over a recent-form window.
      Grain: (team_sk, league_code, season_api_year, fixture_sk).

      Raw sums only; ratios are derived from these one layer up. The whole-season rollup is this
      model's final row, so the two cannot drift apart.

      Carries round_order and match_number so two seasons can be aligned by matchday.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: fixture_sk
        tests: [not_null]
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: "Cumulative count of the team's finished matches through this one (1..N)."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Cumulative count of those matches with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: games_with_save_stats
        description: "Cumulative count of those matches with goalkeeper_saves present — save_ratio's own coverage bucket, used to NULL save_ratio on partial coverage."
        tests: [not_null]
      - name: round_order
        description: "Matchday number parsed from round_name (null if non-numeric). For deferred year-over-year alignment."
      - name: match_number
        description: "The team's Nth match that season by kickoff (always present)."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }} Carried for the int_team_season__metrics projection."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }} Carried for the projection's team_season_sk."
        tests: [not_null]
      - name: opponent_shots_total
        description: >
          Cumulative shots taken by this team's OPPONENTS through this match — the denominator
          half of a shot-share calculation.

  - name: int_player_season_record
    description: >
      A player's season totals as they stood after each match they PLAYED — cumulative running
      totals within one competition-season.
      Grain: (team_sk, player_sk, league_code, season_api_year, fixture_sk).

      A stat row exists wherever the provider reports one, which includes unused substitutes on 0
      minutes. Those are filtered out here, so games_played counts matches played rather than
      matchday selections, and every ratio is over the same set of matches by construction.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, player_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: fixture_sk
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: >
          Cumulative count of matches the player actually PLAYED through this one, that is minutes
          greater than 0 — not matchday selections.
        tests: [not_null]
      - name: position_code
        description: "Player position (any_value over the window). Used to scope save_pct to goalkeepers."
