version: 2

models:
  - name: int_team_season_record
    description: >
      W2 season-record builder — team. Cumulative running totals over int_legs__team_match
      within one competition+season, one row per team-match (totals through that match).
      Complement to int_team_momentum__metrics. Carries round_order + match_number for the deferred
      year-over-year surface. Raw sums only; ratios live in mart_team_season_record. The
      whole-season rollup int_team_season__metrics is the final row of this model (#500 PR1).
      Grain: (team_sk, league_code, season_api_year, fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: fixture_sk
        tests: [not_null]
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: "Cumulative count of the team's finished matches through this one (1..N)."
        tests: [not_null]
      - name: games_with_team_stats
        description: "Cumulative count of those matches with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: games_with_save_stats
        description: "Cumulative count of those matches with goalkeeper_saves present — save_ratio's own coverage bucket, used to NULL save_ratio on partial coverage."
        tests: [not_null]
      - name: round_order
        description: "Matchday number parsed from round_name (null if non-numeric). For deferred year-over-year alignment."
      - name: match_number
        description: "The team's Nth match that season by kickoff (always present)."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }} Carried for the int_team_season__metrics projection."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }} Carried for the projection's team_season_sk."
        tests: [not_null]
      - name: opponent_shots_total
        description: "Cumulative opponent total shots; feeds shot_share on the whole-season projection (#500 PR1)."

  - name: int_player_season_record
    description: >
      W2 season-record builder — player. Cumulative running totals over int_legs__player_match
      within one competition+season, one row per player-match ACTUALLY PLAYED. Complement to
      int_player_momentum__metrics. A leg exists wherever player stats are present, which includes
      0-minute unused substitutes, so legs are filtered to minutes > 0: games_played counts matches
      played (not matchday selections, which it did before 2026-07-23) and player ratios are
      same-window by construction.
      Grain: (team_sk, player_sk, league_code, season_api_year, fixture_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, player_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: fixture_sk
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: "Cumulative count of the matches the player actually PLAYED (minutes > 0) through this match. Before 2026-07-23 this counted matchday selections, so unused substitutes inflated it."
        tests: [not_null]
      - name: position_code
        description: "Player position (any_value over the window). Used to scope save_pct to goalkeepers."
