version: 2

models:
  - name: int_team_season_record
    description: >
      The rows of a team's season in one competition: one row per team-match, with that match's
      inputs (the team-match leg and the team totals from players) and its place in the season.
      int_team_season__metrics_cumulative applies the catalogue formulas to them at every
      matchday; the season-long counterpart to the form window int_team_momentum_window.
      Grain: (team_sk, league_code, season_api_year, fixture_sk).

      Carries round_order and match_number so two seasons can be aligned by matchday.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        description: "{{ doc('window_type__season_record') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: match_number
        description: "The team's Nth match that season by kickoff (always present)."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }} Carried for the int_team_season__metrics projection."
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }} Carried for the projection's team_season_sk."
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: result
        description: "{{ doc('result') }}"
        tests: [not_null]
      - name: is_awarded_result
        description: "TRUE where the match was decided off the pitch — a technical loss or walkover."
        tests: [not_null]
      - name: goals
        description: "Goals the team scored in this match: the scoreline."
      - name: goals_against
        description: "Goals the team conceded in this match: the scoreline."
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: goals_own_against
        description: "The own goals the team conceded in this match."
      - name: shots
        description: "{{ doc('shots_total__team_match') }}"
      - name: shots_on_target
        description: "{{ doc('shots_on_goal__team_match') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: passes
        description: "{{ doc('passes_total__team_match') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate__team_match') }}"
      - name: corners
        description: "{{ doc('corners') }}"
      - name: corners_against
        description: "{{ doc('opponent_corner_kicks__leg') }}"
      - name: shots_against
        description: "Total shots by the opponent in this match."
      - name: shots_on_target_against
        description: "{{ doc('opponent_shots_on_goal__leg') }}"
      - name: saves
        description: "{{ doc('saves') }}"
      - name: cards_yellow
        description: "{{ doc('yellow_cards__leg') }}"
      - name: cards_red
        description: "{{ doc('red_cards__leg') }}"
      - name: has_player_stats
        description: "TRUE where the match has a row in int_legs__team_from_players."
        tests: [not_null]
      - name: passes_key
        description: "Key passes by this team's players in this match (int_legs__team_from_players)."
      - name: tackles
        description: "Tackles by this team's players in this match (int_legs__team_from_players)."
      - name: interceptions
        description: "Interceptions by this team's players in this match (int_legs__team_from_players)."
      - name: blocks
        description: "Blocks by this team's players in this match (int_legs__team_from_players)."
      - name: duels
        description: "{{ doc('duels__team_from_players') }}"
      - name: duels_won
        description: "{{ doc('duels_won__team_from_players') }}"

  - name: int_player_season_record
    description: >
      A player's season totals as they stood after each match they PLAYED — cumulative running
      totals within one competition-season.
      Grain: (team_sk, player_sk, league_code, season_api_year, fixture_sk).

      A stat row exists wherever the provider reports one, which includes unused substitutes on 0
      minutes. Those are not output, so games_played counts matches played rather than matchday
      selections. Every metric, counts and ratios, is its metric_catalogue formula over the
      player's matches through this one.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, player_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: window_type
        description: "{{ doc('window_type__season_record') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: >
          Cumulative count of matches the player actually PLAYED through this one, that is minutes
          greater than 0 — not matchday selections.
        tests: [not_null]
      - name: position_code
        description: "Player position (any_value over the window)."
      - name: entity_type
        description: "{{ doc('entity_type') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: match_number
        description: "The player's Nth finished match played that competition-season, ordered by kickoff (equal to games_played) — the appearance cutoff the year-over-year comparison aligns two seasons on."
      - name: goals_player
        description: "{{ doc('goals_player') }}"
      - name: goals_against_player
        description: "{{ doc('goals_against_player') }}"
      - name: assists_player
        description: "{{ doc('assists_player') }}"
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: shots_player
        description: "{{ doc('shots_player') }}"
      - name: shots_on_goal_player
        description: "{{ doc('shots_on_goal_player') }}"
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate_player
        description: "{{ doc('passes_accurate_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: dribbles_past_player
        description: "{{ doc('dribbles_past_player') }}"
      - name: offsides_player
        description: "{{ doc('offsides_player') }}"
      - name: penalty_won_player
        description: "{{ doc('penalty_won_player') }}"
      - name: penalty_committed_player
        description: "{{ doc('penalty_committed_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
      - name: defensive_actions_player
        description: "{{ doc('defensive_actions_player') }}"
      - name: scorer_points_player
        description: "{{ doc('scorer_points_player') }}"
      - name: minutes
        description: "Cumulative minutes the player played in this competition-season through this match. NULL when a match's minutes are unknown or a team match in the window has no player data."
      - name: saves_player_pct
        description: "{{ doc('saves_player_pct') }}"
      - name: dribbles_success_player_pct
        description: "{{ doc('dribbles_success_player_pct') }}"
      - name: passes_accuracy_player_pct
        description: "{{ doc('passes_accuracy_player_pct') }}"
      - name: duels_won_player_pct
        description: "{{ doc('duels_won_player_pct') }}"
