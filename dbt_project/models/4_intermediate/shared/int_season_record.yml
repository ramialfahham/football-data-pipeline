version: 2

models:
  - name: int_team_season_record
    description: >
      A team's season totals as they stood after each of its matches — cumulative running totals
      within one competition-season, one row per team-match. The season-long counterpart to
      int_team_momentum__metrics, which does the same over a recent-form window.
      Grain: (team_sk, league_code, season_api_year, fixture_sk).

      Raw sums only; ratios are derived from these one layer up. The whole-season rollup is this
      model's final row, so the two cannot drift apart.

      Carries round_order and match_number so two seasons can be aligned by matchday.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null]
      - name: entity_type
        tests:
          - accepted_values:
              values: ["club", "national"]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: "Cumulative count of the team's finished matches through this one (1..N)."
        tests: [not_null]
      - name: games_expecting_team_stats
        description: "Games in the season so far that COULD carry a team stat line — games played minus any awarded result (technical loss, walkover), which is decided off the pitch and never has one. Every team-stat coverage gate divides against this rather than games played, so an awarded match is not read as missing data and does not blank the season's statistics."
        # not_null because every coverage gate downstream reads `x < games_expecting_team_stats`, and
        # a NULL there is not FALSE — the comparison yields NULL, the CASE falls to its ELSE, and an
        # ungated rate is served instead of the honest NULL. A silent wrong number rather than a loud
        # failure. It cannot be NULL today (a countif/sum over a CASE never is), so this guards a
        # future change to how it is derived rather than a live defect.
        tests: [not_null]
      - name: games_with_team_stats
        description: "Cumulative count of those matches with team stats present; denominator for per-match team-stat rates."
        tests: [not_null]
      - name: games_with_save_stats
        description: "Cumulative count of those matches with goalkeeper_saves present — saves_pct's own coverage bucket, used to NULL saves_pct on partial coverage."
        tests: [not_null]
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: match_number
        description: "The team's Nth match that season by kickoff (always present)."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }} Carried for the int_team_season__metrics projection."
        tests: [not_null]
      - name: season_sk
        description: "{{ doc('season_sk') }} Carried for the projection's team_season_sk."
        tests: [not_null]
      - name: opponent_shots_total
        description: >
          Cumulative shots taken by this team's OPPONENTS through this match — the denominator
          half of a shot-share calculation.
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: points_won
        description: "{{ doc('points_won') }}"
      - name: wins
        description: "{{ doc('wins') }}"
      - name: draws
        description: "{{ doc('draws') }}"
      - name: losses
        description: "{{ doc('losses') }}"
      - name: goals_for
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: clean_sheet_games
      - name: games_with_sot_stats
      - name: games_with_opp_stats
      - name: games_with_opp_sot_stats
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: goals_against_in_save_games
        description: "Goals conceded summed only over the legs whose goalkeeper-save data exists, so saves_pct divides a numerator and denominator that cover the same games."
      - name: goals_open_play_in_sot_games
        description: "Open-play goals (goals minus penalties minus own goals) summed ONLY over the legs that have shots-on-target data, so finishing_efficiency_pct divides over the games its denominator can see. Required because awarded results (technical loss, walkover) count as played: their goals are real and enter the full goal sums, but they carry no shots-on-target, so a full-sum numerator would credit goals no shot could explain."
      - name: shots_total
        description: "{{ doc('shots_player') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal_player') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: passes_total
        description: "{{ doc('passes_player') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate_player') }}"
      - name: corner_kicks
        description: "{{ doc('corners') }}"
      - name: opponent_corner_kicks
      - name: opponent_shots_on_goal
      - name: goalkeeper_saves
        description: "{{ doc('saves') }}"
      - name: games_with_player_stats
      - name: key_passes
      - name: tackles
      - name: interceptions
      - name: blocks
      - name: duels_total
        description: "{{ doc('duels_player') }}"
      - name: duels_won
        description: "{{ doc('duels_won_player') }}"

  - name: int_player_season_record
    description: >
      A player's season totals as they stood after each match they PLAYED — cumulative running
      totals within one competition-season.
      Grain: (team_sk, player_sk, league_code, season_api_year, fixture_sk).

      A stat row exists wherever the provider reports one, which includes unused substitutes on 0
      minutes. Those are filtered out here, so games_played counts matches played rather than
      matchday selections, and every ratio is over the same set of matches by construction.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, player_sk, league_code, season_api_year, fixture_sk]
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null]
      - name: window_type
        tests:
          - not_null
          - accepted_values:
              values: ["season_to_date"]
      - name: games_played
        description: >
          Cumulative count of matches the player actually PLAYED through this one, that is minutes
          greater than 0 — not matchday selections.
        tests: [not_null]
      - name: position_code
        description: "Player position (any_value over the window). Used to scope saves_player_pct to goalkeepers."
      - name: entity_type
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: match_number
      - name: goals_total
      - name: goals_against_player
        description: "{{ doc('goals_against_player') }}"
      - name: goals_assists
      - name: saves_player
        description: "{{ doc('saves_player') }}"
      - name: shots_player
        description: "{{ doc('shots_player') }}"
      - name: shots_on
      - name: passes_player
        description: "{{ doc('passes_player') }}"
      - name: passes_key_player
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate_player
        description: "{{ doc('passes_accurate_player') }}"
      - name: tackles_player
        description: "{{ doc('tackles_player') }}"
      - name: blocks_player
        description: "{{ doc('blocks_player') }}"
      - name: interceptions_player
        description: "{{ doc('interceptions_player') }}"
      - name: duels_player
        description: "{{ doc('duels_player') }}"
      - name: duels_won_player
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles_attempts_player
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success_player
        description: "{{ doc('dribbles_success_player') }}"
      - name: dribbles_past_player
        description: "{{ doc('dribbles_past_player') }}"
      - name: offsides_player
        description: "{{ doc('offsides_player') }}"
      - name: penalty_won_player
        description: "{{ doc('penalty_won_player') }}"
      - name: penalty_committed_player
        description: "{{ doc('penalty_committed_player') }}"
      - name: cards_yellow_player
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red_player
        description: "{{ doc('cards_red_player') }}"
