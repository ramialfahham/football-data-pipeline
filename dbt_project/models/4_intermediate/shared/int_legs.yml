version: 2

models:
  - name: int_legs__team_match
    description: >
      Building-block team-match leg: one row per (team, finished match) with the team's and
      opponent's raw stats, competition type/entity classification, and windowing dimensions.
      Cross-competition, cross-type. The shared foundation every team performance metric
      aggregates over. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: competition_type
        description: "Resolved from the competition_registry seed via league_code."
        tests: [not_null]
      - name: entity_type
        description: "club or national, resolved from the competition_types seed."
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: home_away
        description: "{{ doc('home_away') }}"
        tests:
          - accepted_values:
              values: ["home", "away"]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_sk
        description: "{{ doc('season_sk') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
      - name: goals_for
        description: "{{ doc('goals_for') }}"
      - name: goals_against
        description: "{{ doc('goals_against__team') }}"
      - name: shots_on_goal
        description: "{{ doc('shots_on_goal') }}"
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: corner_kicks
        description: "{{ doc('corner_kicks') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate') }}"
      - name: goalkeeper_saves
        description: "{{ doc('goalkeeper_saves') }}"
      - name: opponent_shots_on_goal
      - name: opponent_shots_total
      - name: opponent_shots_inside_box
      - name: opponent_corner_kicks
      - name: goals_penalty
        description: "{{ doc('goals_penalty__team') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"

  - name: int_legs__player_match
    description: >
      Building-block player-match leg: one row per (player, finished match) with raw player
      counts, competition classification, and windowing dimensions. Naturally sparse where a
      competition lacks statistics_players. Grain: (fixture_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, player_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null]
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: league_code
        tests: [not_null]
      - name: entity_type
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: home_away
        description: "{{ doc('home_away') }}"
        tests:
          - accepted_values:
              values: ["home", "away"]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
      - name: competition_type
      - name: minutes_played
        description: "{{ doc('minutes_played') }}"
      - name: is_starter
        description: "{{ doc('is_starter') }}"
      - name: is_substitute
        description: "{{ doc('is_substitute') }}"
      - name: position_code
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_on
      - name: goals_total
      - name: goals_against
        description: "{{ doc('goals_against__player') }}"
      - name: goals_assists
      - name: saves
        description: "{{ doc('saves') }}"
      - name: passes_total
        description: "{{ doc('passes_total') }}"
      - name: passes_key
        description: "{{ doc('passes_key') }}"
      - name: passes_accuracy_percent
        description: "{{ doc('passes_accuracy_percent') }}"
      - name: tackles_total
        description: "{{ doc('tackles_total') }}"
      - name: tackles_blocks
        description: "{{ doc('tackles_blocks') }}"
      - name: tackles_interceptions
        description: "{{ doc('tackles_interceptions') }}"
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: offsides
        description: "{{ doc('offsides') }}"
      - name: fouls_drawn
        description: "{{ doc('fouls_drawn') }}"
      - name: fouls_committed
        description: "{{ doc('fouls_committed') }}"
      - name: cards_yellow
        description: "{{ doc('cards_yellow') }}"
      - name: cards_red
        description: "{{ doc('cards_red') }}"
      - name: dribbles_past
        description: "{{ doc('dribbles_past') }}"
      - name: penalty_won
        description: "{{ doc('penalty_won') }}"
      - name: penalty_committed
        description: "{{ doc('penalty_committed') }}"
      - name: goals_penalty
        description: "{{ doc('goals_penalty__player') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"

  - name: int_legs__team_from_players
    description: >
      Player-match legs summed to (team, finished match) — unlocks team metrics not in
      fct_fixture_team_stats (tackles, interceptions, blocks, duels, dribbles, key passes).
      players_with_stats carries the sample size. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests: [not_null]
      - name: players_with_stats
        description: "Count of players with a stat row for this team-match (completeness signal)."
        tests: [not_null]
      - name: league_code
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: competition_type
      - name: entity_type
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
      - name: key_passes
      - name: tackles
      - name: blocks
      - name: interceptions
      - name: duels_total
        description: "{{ doc('duels_total') }}"
      - name: duels_won
        description: "{{ doc('duels_won') }}"
      - name: dribbles_attempts
        description: "{{ doc('dribbles_attempts') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success') }}"
      - name: fouls_committed
        description: "{{ doc('fouls_committed') }}"
      - name: fouls_drawn
        description: "{{ doc('fouls_drawn') }}"
