version: 2

models:
  - name: int_legs__team_match
    description: >
      Building-block team-match leg: one row per (team, finished match) with the team's and
      opponent's raw stats, competition type/entity classification, and windowing dimensions.
      Cross-competition, cross-type. The shared foundation every team performance metric
      aggregates over. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: competition_type
        description: "{{ doc('competition_type') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: result
        description: "{{ doc('result') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]
      - name: is_awarded_result
        description: "TRUE where the match was decided off the pitch — a technical loss or walkover. It counts for points, goals and games played, and can never carry a stat line, which is why the coverage counters downstream subtract it rather than reading it as missing data."
        # not_null for the same reason as games_expecting_team_stats, which is derived FROM it:
        # a NULL here would make countif(not is_awarded_result) undercount and every gate compare
        # against a denominator that is quietly too small. It cannot be NULL today — the leg filter
        # already restricts status_short to five non-null codes — so this guards a future change.
        tests: [not_null]
      - name: home_away
        description: "{{ doc('home_away') }}"
        tests:
          - accepted_values:
              values: ["home", "away"]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
        description: "{{ doc('round_name') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: goals
        description: "{{ doc('goals') }}"
      - name: goals_against
        description: "{{ doc('goals_against') }}"
      - name: shots_on_target
        description: "{{ doc('shots_on_goal_player') }}"
      - name: shots
        description: "{{ doc('shots_player') }}"
      - name: shots_inside_box
        description: "{{ doc('shots_inside_box') }}"
      - name: corners
        description: "{{ doc('corners') }}"
      - name: passes
        description: "{{ doc('passes_player') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate_player') }}"
      - name: saves
        description: "{{ doc('saves') }}"
      - name: cards_yellow
        description: "{{ doc('yellow_cards__leg') }}"
      - name: cards_red
        description: "{{ doc('red_cards__leg') }}"
      - name: shots_on_target_against
        description: "{{ doc('opponent_shots_on_goal__leg') }}"
      - name: shots_against
        description: "Total shots (on and off target) by the opponent in this match, from the opponent's cleaned statistics line."
      - name: shots_inside_box_against
        description: "Shots the opponent took from inside the penalty area in this match, from the opponent's cleaned statistics line."
      - name: corners_against
        description: "{{ doc('opponent_corner_kicks__leg') }}"
      - name: goals_penalty
        description: "{{ doc('goals_penalty') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: goals_own_against
        description: "Own goals this team conceded in the match: its players put the ball into their own net, and the goal counts for the opponent. Part of goals_against, but not a shot on target the keeper faced, so save percentage leaves them out. The opponent's goals_own."

  - name: int_legs__player_match
    description: >
      Building-block player-match leg: one row per (player, finished match) with the player's
      cleaned counts, competition classification, and windowing dimensions; the base_relation of
      every player formula in metric_catalogue.csv. Naturally sparse where a competition lacks
      statistics_players. Grain: (fixture_sk, player_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, player_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: entity_type
        description: "{{ doc('entity_type') }}"
        tests:
          - not_null
          - accepted_values:
              values: ["club", "national"]
      - name: home_away
        description: "{{ doc('home_away') }}"
        tests:
          - accepted_values:
              values: ["home", "away"]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_name
        description: "{{ doc('round_name') }}"
      - name: competition_type
        description: "{{ doc('competition_type') }}"
      - name: minutes
        description: "{{ doc('minutes_played') }}"
      - name: is_starter
        description: "{{ doc('is_starter') }}"
      - name: is_substitute
        description: "{{ doc('is_substitute') }}"
      - name: position_code
        description: "{{ doc('position_code__leg') }}"
      - name: shots
        description: "{{ doc('shots_player') }}"
      - name: shots_on_target
        description: "{{ doc('shots_on__leg') }}"
      - name: goals
        description: "{{ doc('goals_total__leg') }}"
      - name: goals_against
        description: "{{ doc('goals_against_player') }}"
      - name: assists
        description: "{{ doc('goals_assists__leg') }}"
      - name: saves
        description: "{{ doc('saves_player') }}"
      - name: passes
        description: "{{ doc('passes_player') }}"
      - name: passes_key
        description: "{{ doc('passes_key_player') }}"
      - name: passes_accurate
        description: "{{ doc('passes_accurate_player') }}"
      - name: tackles
        description: "{{ doc('tackles_player') }}"
      - name: blocks
        description: "{{ doc('blocks_player') }}"
      - name: interceptions
        description: "{{ doc('interceptions_player') }}"
      - name: duels
        description: "{{ doc('duels_player') }}"
      - name: duels_won
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success_player') }}"
      - name: offsides
        description: "{{ doc('offsides_player') }}"
      - name: fouls_against
        description: "{{ doc('fouls_drawn') }}"
      - name: fouls
        description: "{{ doc('fouls_committed') }}"
      - name: cards_yellow
        description: "{{ doc('cards_yellow_player') }}"
      - name: cards_red
        description: "{{ doc('cards_red_player') }}"
      - name: dribbles_against
        description: "{{ doc('dribbles_past_player') }}"
      - name: penalties_won
        description: "{{ doc('penalty_won_player') }}"
      - name: penalties_committed
        description: "{{ doc('penalty_committed_player') }}"
      - name: goals_penalty
        description: "{{ doc('goals_penalty_player') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk

  - name: int_legs__team_from_players
    description: >
      Player-match legs summed to (team, finished match) — unlocks team metrics not in
      fct_fixture_team_stats (tackles, interceptions, blocks, duels, dribbles, key passes).
      players_with_stats carries the sample size. Grain: (fixture_sk, team_sk).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fixture_sk, team_sk]
    columns:
      - name: fixture_sk
        description: "{{ doc('fixture_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('fct_fixture')
              field: fixture_sk
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: players_with_stats
        description: "Count of players with a stat row for this team-match (completeness signal)."
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: competition_type
        description: "{{ doc('competition_type') }}"
      - name: entity_type
        description: "{{ doc('entity_type') }}"
      - name: kickoff_datetime
        description: "{{ doc('kickoff_datetime') }}"
      - name: round_order
        description: "{{ doc('round_order') }}"
      - name: opponent_team_sk
        description: "{{ doc('opponent_team_sk') }}"
        tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: passes_key
        description: "Key passes by this team's players in the match, summed from the player legs found for it (players_with_stats is the sample)."
      - name: tackles
        description: "Tackles by this team's players in the match, summed from the player legs found for it (players_with_stats is the sample)."
      - name: blocks
        description: "Blocks by this team's players in the match, summed from the player legs found for it (players_with_stats is the sample)."
      - name: interceptions
        description: "Interceptions by this team's players in the match, summed from the player legs found for it (players_with_stats is the sample)."
      - name: duels
        description: "{{ doc('duels_player') }}"
      - name: duels_won
        description: "{{ doc('duels_won_player') }}"
      - name: dribbles
        description: "{{ doc('dribbles_attempts_player') }}"
      - name: dribbles_success
        description: "{{ doc('dribbles_success_player') }}"
      - name: fouls
        description: "{{ doc('fouls_committed') }}"
      - name: fouls_against
        description: "{{ doc('fouls_drawn') }}"
