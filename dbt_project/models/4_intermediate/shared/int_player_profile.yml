version: 2

models:
  - name: int_player_profile__yoy
    description: >
      A player's season against their last, compared over the same number of appearances. One row
      per player's CURRENT club-league season. DOMESTIC LEAGUES ONLY. Grain: (team_sk, player_sk,
      league_code, season_api_year).

      Carries cumulative goals, assists, shots on target, key passes and defensive actions through
      the latest N appearances this season, against the prior season AT THE SAME CLUB through its
      first N. defensive_actions is tackles plus interceptions plus blocks.

      Deltas are NULL when there is no prior season at this club — a transfer, or a first season.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [team_sk, player_sk, league_code, season_api_year]
      # The prior season's FULL total is a superset of its pace-matched cutoff figure, so
      # full >= pace-matched for every metric (all are monotonic cumulative counts), and a
      # pace-matched prev row implies a full prev row exists. Catches a broken prev_full window.
      - dbt_utils.expression_is_true:
          expression: "appearances_prev is null or (appearances_prev_full >= appearances_prev and goals_prev_season_full >= goals_prev_season and assists_prev_season_full >= assists_prev_season and shots_on_goal_prev_season_full >= shots_on_goal_prev_season and key_passes_prev_season_full >= key_passes_prev_season and defensive_actions_prev_season_full >= defensive_actions_prev_season)"
          name: player_yoy_full_season_ref_ge_pace_matched
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the player's club this season; the year-over-year comparison is per club."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }} Here it is the player's current domestic season, the year-over-year anchor."
        tests: [not_null]
      - name: yoy_appearances_cutoff
        description: "N = appearances this season; the prior season is compared through its first N appearances."
        tests: [not_null]
      - name: goals_delta_yoy
        description: "goals_this_season - goals_prev_season through N appearances. NULL when no prior season."
      - name: appearances_prev_full
        description: "The prior season's TOTAL appearances at this club (full-season reference; >= appearances_prev). NULL when no prior season."
      - name: goals_prev_season_full
        description: "The prior season's FULL-season total, a context anchor for the pace-matched delta (assists / shots_on_goal / key_passes / defensive_actions follow the same *_prev_season_full pattern). Never differenced against the running season."
      - name: goals_this_season
      - name: assists_this_season
      - name: shots_on_goal_this_season
      - name: key_passes_this_season
      - name: defensive_actions_this_season
      - name: appearances_prev
      - name: goals_prev_season
      - name: assists_prev_season
      - name: shots_on_goal_prev_season
      - name: key_passes_prev_season
      - name: defensive_actions_prev_season
      - name: assists_prev_season_full
      - name: shots_on_goal_prev_season_full
      - name: key_passes_prev_season_full
      - name: defensive_actions_prev_season_full
      - name: assists_delta_yoy
      - name: shots_on_goal_delta_yoy
      - name: key_passes_delta_yoy
      - name: defensive_actions_delta_yoy

  - name: int_player_profile__contribution
    description: >
      What share of a club's goals a player was involved in: their goals plus assists over the
      club's WHOLE-SEASON goals for. Grain: (player_sk, team_sk, season_sk). Range 0 to 1.

      NULL when the club scored nothing that competition-season.

      UNDERSTATES the share wherever the player's own match stats are missing, since the numerator
      loses those matches while the denominator keeps them. An accepted limit, not a defect.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "contribution_share is null or (contribution_share >= 0 and contribution_share <= 1)"
          name: player_contribution_share_within_unit
    columns:
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the player's club that competition-season; contribution is measured per club."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests: [not_null]
      - name: scorer_points
        description: "The player's goals + assists this club-competition-season (the numerator)."
      - name: team_goals_season
        description: "The club's whole-season goals_for (the denominator)."
      - name: contribution_share
        description: "scorer_points / team_goals_season. NULL when the club scored 0 that competition-season."
      - name: league_code
      - name: season_api_year
