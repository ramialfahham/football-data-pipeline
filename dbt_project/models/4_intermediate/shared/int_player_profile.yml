version: 2

models:
  - name: int_player_profile__contribution
    description: >
      What share of a club's goals a player was involved in: their goals plus assists over the
      club's WHOLE-SEASON goals for. Grain: (player_sk, team_sk, season_sk). Range 0 to 1.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, team_sk, season_sk]
      - dbt_utils.expression_is_true:
          expression: "contribution_player_pct is null or (contribution_player_pct >= 0 and contribution_player_pct <= 1)"
          name: player_contribution_player_pct_within_unit
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the player's club that competition-season; contribution is measured per club."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: scorer_points_player
        description: "{{ doc('scorer_points_player') }}"
      - name: team_goals_season
        description: "{{ doc('team_goals_season') }}"
      - name: contribution_player_pct
        description: "{{ doc('contribution_player_pct') }}"
      - name: league_code
        description: "{{ doc('league_code') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
