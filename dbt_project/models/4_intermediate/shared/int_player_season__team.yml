version: 2

models:
  - name: int_player_season__team
    description: >
      Which club a player belongs to in a given competition-season: the club of their MOST RECENT
      finished match that season. Grain: (player_sk, league_code, season_api_year).

      Defined from match history rather than from the roster deliberately. The roster affiliation
      source carries no transfer date, so it cannot give a stable answer to "which club that
      season"; the last match played is deterministic and does not move.

      is_current_team marks the one season-row holding the player's most recent finished match
      anywhere — their current club. Exactly one per player, by construction.
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, league_code, season_api_year]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club of the player's most recent finished match that competition-season."
        tests: [not_null]
      - name: is_current_team
        description: "True on the one season-row holding the player's globally most-recent finished match (their current club)."
        tests: [not_null]
