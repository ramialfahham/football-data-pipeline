version: 2

models:
  - name: int_player_season__team
    description: >
      GAP-16 — the player's team per competition-season: the club of the player's MOST RECENT finished
      match that season (Option B, CPO-ruled 2026-06-30 — deterministic + byte-stable; the roster
      affiliation source has no transfer date so cannot give a stable "latest team that season").
      is_current_team flags the single season-row holding the player's globally most-recent finished match
      (their current club) — guaranteed unique per player by the deterministic row_number()=1 window. Built
      on int_legs__player_match (finished player-match legs). Consumed by mart_player_profile.
      Grain: (player_sk, league_code, season_api_year) — 1:1 with mart_player_profile's (player_sk, season_sk).
    config:
      tags: ["intermediate", "football", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [player_sk, league_code, season_api_year]
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }}"
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the club of the player's most recent finished match that competition-season."
        tests: [not_null]
      - name: is_current_team
        description: "True on the one season-row holding the player's globally most-recent finished match (their current club)."
        tests: [not_null]
