version: 2

models:
  - name: int_matchday__fixture_denormalized
    description: >
      One row per fixture with teams, league, season, and kickoff denormalised (same column set as mart_fixture_results).
      Materialised as a table; mart_fixture_results is a thin view for the stable consumer name.
    config:
      tags: ["intermediate", "football", "matchday"]

  - name: int_matchday__finished_fixture_team_leg
    description: >
      Finished matches as two rows per fixture (home and away team) with team stats and opponent shot/corner aggregates.
      Includes league_sk and season_sk for team-season rollups. Grain (fixture_sk, team_sk).
    config:
      tags: ["intermediate", "football", "matchday"]

  - name: int_matchday__upcoming_round_fixtures
    description: >
      Earliest not-started round per (league_code, season_api_year) with one row per fixture in that round.
      League-agnostic; mart_matchday_insights unions domestic leagues via league_code (export slices per code).
    config:
      tags: ["intermediate", "football", "matchday"]

  - name: int_matchday__team_form_metrics
    description: >
      Per (upcoming fixture_sk, team_sk) form aggregates for Step 3 rules (see model SQL header).
      Non-WC: full previous season when the team has no finished leg in the current league season before the
      reference fixture; otherwise last up to five finished games in the current season (kickoff order).
      WC: qualifier supporting leagues (seed wc_supporting_league_codes) until the first WC leg, then last up
      to five WC legs. Sums omit coalesce-to-zero on optional stats; rates are null when undefined.
      form_window_five_capped is true when the window used the five-game cap (not the full prior-season /
      qualifier uncapped window). Grain (fixture_sk, team_sk) for upcoming fixtures only; league_code
      is the upcoming fixture's competition (WC for tournament rows).
    config:
      tags: ["intermediate", "football", "matchday"]
    columns:
      - name: league_code
        tests: [not_null]
      - name: form_games_played
        tests: [not_null]
    tests:
      - dbt_utils.expression_is_true:
          expression: "not form_window_five_capped or form_games_played <= 5"
          name: int_matchday_team_form_five_cap_implies_at_most_five_games

  - name: int_matchday__relegation_upcoming_fixtures
    description: >
      BL1 relegation play-off fixtures (round_name in var bl1_relegation_round_names).
      Subset of int_matchday__upcoming_round_fixtures; same grain.
    config:
      tags: ["intermediate", "football", "matchday", "relegation"]

  - name: int_matchday__relegation_team_form_league
    description: >
      Per (fixture_sk, team_sk) domestic league used for form on relegation ties (BL1 vs BL2).
      Picks the league with the most finished legs in the fixture season; tie-break BL1.
    config:
      tags: ["intermediate", "football", "matchday", "relegation"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - fixture_sk
            - team_sk

  - name: int_matchday__team_form_metrics_relegation
    description: >
      Rolling last-five completed legs for relegation fixtures. Domestic legs use per-team
      form_league_code (BL1 or BL2); completed BL1 play-off legs count for both teams.
    config:
      tags: ["intermediate", "football", "matchday", "relegation"]
    columns:
      - name: form_league_code
        tests: [not_null]
      - name: form_games_played
        tests: [not_null]
    tests:
      - dbt_utils.expression_is_true:
          expression: "not form_window_five_capped or form_games_played <= 5"
          name: int_matchday_relegation_form_five_cap_implies_at_most_five_games
