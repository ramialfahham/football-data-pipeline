  - name: int_team_season__metrics_cumulative
    description: >
      A team's season metrics as they stood after EVERY matchday, not only at the end. Grain:
      (team_sk, league_code, season_api_year, match_number). All competitions.

      THE SINGLE HOME of the team-season rate formulas: the whole-season model is this model's
      final row, byte-identical, so the two can never drift apart.

      The `_sum_season` and `season_games_played` names are inherited from that projection to keep
      it byte-identical; here they mean "cumulative through this matchday", not "for the season".
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - league_code
            - season_api_year
            - match_number
      # Ratio bounds are split by invariant FAMILY (the cumulative grain is weaker than the whole-
      # season one — see below). Structurally-bounded ratios hold [0,1] at EVERY matchday by
      # construction: points_capture_pct (points <= 3*games), clean_sheets_pct (clean_sheet_games <= games),
      # shots_share_pct (for/(for+against)), saves_pct (saves/(saves+goals)), finishing_efficiency_pct
      # (nulled when goals>SoT). A value out of [0,1] here is a real coverage-window/formula bug.
      - dbt_utils.expression_is_true:
          expression: "(saves_pct is null or saves_pct between 0 and 1) and (shots_share_pct is null or shots_share_pct between 0 and 1) and (points_capture_pct is null or points_capture_pct between 0 and 1) and (clean_sheets_pct is null or clean_sheets_pct between 0 and 1) and (finishing_efficiency_pct is null or finishing_efficiency_pct between 0 and 1)"
          name: int_team_season_cumulative_structural_ratios_in_range
      # Provider-subset ratios (one provider stat over another: shots_on_goal_pct = SoT/shots,
      # shots_inside_box_pct = inside_box/shots, passes_accuracy_pct = accurate/total, duels_won_pct =
      # won/total) are bounded >= 0 ONLY. At a low matchday a single game where the provider reports
      # numerator > denominator (a known API inconsistency, e.g. inside_box > total shots) is not yet
      # diluted, so a cumulative value > 1 is a genuine data reality — not a model bug (clamping would
      # hide it). The whole-season projection keeps strict [0,1] (dilution holds at season scale). A
      # negative would still be a real sign-flip bug.
      - dbt_utils.expression_is_true:
          expression: "(shots_on_goal_pct is null or shots_on_goal_pct >= 0) and (shots_inside_box_pct is null or shots_inside_box_pct >= 0) and (passes_accuracy_pct is null or passes_accuracy_pct >= 0) and (duels_won_pct is null or duels_won_pct >= 0)"
          name: int_team_season_cumulative_subset_ratios_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0"
          name: int_team_season_cumulative_sot_against_non_negative
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: match_number
        description: "Games played through this cumulative row (= games_played). The grain key + the YoY alignment cutoff N."
        tests: [not_null]
      - name: season_games_played
        description: "Games played through this matchday (name inherited from the whole-season projection for byte-identity)."
        tests: [not_null]
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_sk
        description: "{{ doc('season_sk') }}"
      - name: entity_type
      - name: stat_coverage_season_games
      - name: player_stat_coverage_season_games
      - name: games_with_team_stats
      - name: points_won_sum_season
        description: "{{ doc('points_won_sum_season__team') }}"
      - name: wins_sum_season
      - name: draws_sum_season
      - name: losses_sum_season
      - name: clean_sheets_sum_season
      - name: goals_for_sum_season
      - name: goals_against_sum_season
      - name: goals_penalty
        description: "{{ doc('goals_penalty__team') }}"
      - name: goals_own
        description: "{{ doc('goals_own') }}"
      - name: goals_open_play
        description: "{{ doc('goals_open_play__team') }}"
      - name: total_shots_sum_season
      - name: opponent_total_shots_sum_season
      - name: shots_inside_box_sum_season
      - name: shots_on_goal_sum_season
      - name: corner_kicks_sum_season
      - name: opponent_corner_kicks_sum_season
      - name: passes_accurate_sum_season
      - name: passes_total_sum_season
      - name: goalkeeper_saves_sum_season
      - name: points_capture_pct
        description: "{{ doc('points_capture_pct') }}"
      - name: shots_share_pct
        description: "{{ doc('shots_share_pct') }}"
      - name: clean_sheets_pct
        description: "{{ doc('clean_sheets_pct') }}"
      - name: goals_per_match
        description: "{{ doc('goals_per_match') }}"
      - name: goals_against_per_match
        description: "{{ doc('goals_against_per_match') }}"
      - name: shots_per_match
        description: "{{ doc('shots_per_match') }}"
      - name: shots_on_goal_pct
        description: "{{ doc('shots_on_goal_pct') }}"
      - name: shots_inside_box_pct
        description: "{{ doc('shots_inside_box_pct') }}"
      - name: shots_on_goal_per_match
        description: "{{ doc('shots_on_goal_per_match') }}"
      - name: shots_on_goal_against_per_match
        description: "{{ doc('shots_on_goal_against_per_match') }}"
      - name: shots_on_goal_difference_per_match
