version: 2

models:
  - name: int_team_season__standings_primary
    description: >
      Deduplicated standings snapshot per team-season: one row per (team_sk, season_sk)
      chosen by latest raw_ingested_at when the core fact has multiple rows (e.g. parallel groups).
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
    columns:
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: standing_rank
        description: "API rank from the chosen row (same semantics as mart_team_season.latest_rank source)."
      - name: form
        description: "Recent-form string from the chosen row (latest_form in marts)."
      - name: group_description
        description: "Standings group/stage label from the chosen row."

  - name: int_team_season__metrics
    description: >
      A team's whole-season rollup: every metric aggregated over all its finished matches, plus
      the W/D/L counts. Grain: (league_code, season_api_year, team_sk).

      Same sum and rate semantics as the recent-form metrics, without the five-game cap — so a
      season figure and a form figure are directly comparable.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "(shots_on_goal_pct is null or shots_on_goal_pct between 0 and 1) and (shots_inside_box_pct is null or shots_inside_box_pct between 0 and 1) and (passes_accuracy_pct is null or passes_accuracy_pct between 0 and 1) and (duels_won_pct is null or duels_won_pct between 0 and 1) and (saves_pct is null or saves_pct between 0 and 1) and (shots_share_pct is null or shots_share_pct between 0 and 1) and (points_capture_pct is null or points_capture_pct between 0 and 1) and (clean_sheets_pct is null or clean_sheets_pct between 0 and 1) and (finishing_efficiency_pct is null or finishing_efficiency_pct between 0 and 1)"
          name: int_team_season_ratios_in_range
      # shots-on-target conceded per match is a count rate — never negative (a sign-flip or bad
      # numerator would trip this). shots_on_goal_difference_per_match is signed, so it is intentionally not range-tested.
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0"
          name: int_team_season_sot_against_non_negative
    columns:
      - name: team_season_sk
        description: "Surrogate over (team_sk, season_sk); the model's grain key. Uniqueness tested at source (relied on by int_team_season__deserved_vs_actual)."
        tests:
          - not_null
          - unique
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: season_games_played
        tests: [not_null]
      - name: shots_on_goal_difference_per_match
        description: "{{ doc('shots_on_goal_difference_per_match') }}"
      - name: shots_on_goal_against_per_match
        description: "{{ doc('shots_on_goal_against_per_match') }}"
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_sk
        description: "{{ doc('season_sk') }}"
      - name: entity_type
      - name: stat_coverage_season_games
      - name: player_stat_coverage_season_games
      - name: games_expecting_team_stats
        description: "Games that COULD carry a team stat line — games played minus any awarded result (technical loss, walkover), which is decided off the pitch and never has one. Every team-stat coverage gate compares against this rather than games played, so an awarded match is not read as missing data and does not blank the statistics."
      - name: games_with_team_stats
