  - name: int_team_season__deserved_vs_actual
    description: >
      The points a team's process deserved, against the points it actually has. Grain: (team_sk,
      season_sk). DOMESTIC LEAGUES ONLY: a group-stage standing is not a comparable league rank.

      Least squares fits points-per-match on shots_on_goal_difference_per_match within each league-season.
      deserved_points is that rate, capped into the [0, 3] a match can yield, times the team's games
      played; deserved_points_gap is actual minus deserved, NEGATIVE meaning under-performing.
      deserved_points_was_capped says when the cap moved a row.

      The gap redistributes: it sums to zero across a balanced season where no deserved_points row
      was capped — the cap breaks that identity by exactly the amount it shaves. NULL unless every team in
      that league-season has full shots-on-target coverage, a league rank and three finished
      games.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.expression_is_true:
          expression: "deserved_rank is null or deserved_rank >= 1"
          name: int_team_season_deserved_rank_positive
      # BICONDITIONAL, restored. rank is derived from deserved_points and the single-ladder
      # condition now sits inside league_season_fittable, so the two null together again and this
      # asserts BOTH directions. It briefly became one-directional, when the single-ladder split
      # applied to the rank alone; deleting the direction rather than narrowing it left the column
      # with no positive-existence guard at all, so it could have gone silently empty with every
      # test still green. A test may become NARROWER when
      # a change makes it partly untrue. It must never become SHORTER.
      - dbt_utils.expression_is_true:
          expression: "(deserved_points is null and deserved_rank is null) or (deserved_points is not null and deserved_rank is not null)"
          name: int_team_season_deserved_rank_tracks_points
      # The gap rank is a TOTAL order over the gap and appears exactly with it: null together,
      # and where present unique within the league-season (row_number, never a shared rank).
      - dbt_utils.expression_is_true:
          expression: "(deserved_points is null and deserved_points_gap_rank is null) or (deserved_points is not null and deserved_points_gap_rank >= 1)"
          name: int_team_season_deserved_points_gap_rank_tracks_points
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [league_code, season_sk, deserved_points_gap_rank]
          where: "deserved_points_gap_rank is not null"
          name: int_team_season_deserved_points_gap_rank_is_a_total_order
      # a published read requires a single-ladder table — the condition is inside the gate, and this
      # asserts it held rather than trusting the gate to have applied it.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or actual_table_is_single_ladder"
          name: int_team_season_deserved_requires_single_ladder
      # gate invariant: a non-null deserved_points means the league-season passed the full-table
      # gate, so this row's own inputs must both be present.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (shots_on_goal_difference_per_match is not null and actual_rank is not null)"
          name: int_team_season_deserved_points_requires_inputs
      # LEGAL-RANGE INVARIANT. ⚠ THIS TEST CAN NO LONGER DISCOVER THE CONDITION IT NAMES, and that is
      # deliberate: the model caps the fitted rate into [0, 3], so the invariant holds by
      # construction. What it still pins is that the cap is WIRED IN — delete the cap and this goes
      # red, which is the mutation the acceptance evidence watches. It is kept at severity=error for
      # that reason and must not be deleted as redundant.
      # Why the cap exists: this test fired twice on real data. Before the >= 3 games gate, two
      # Liga MX rows one game into the season fell outside the range; later an LP row four games in
      # fitted 12.0259 against a ceiling of 12 and stopped the prod build. The DETECTION job now
      # belongs to the warn-severity test below.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (deserved_points >= 0 and deserved_points <= 3 * season_games_played)"
          name: int_team_season_deserved_points_in_legal_range
      # THE DETECTOR, and the reason capping does not become invisible. A cap that shaves 0.0065 points
      # per match off one row in 1,125 is an estimation artifact; a cap binding on many rows, or hard,
      # would mean the fit itself had gone wrong — and after the change above, nothing else in the repo
      # would notice. WARN, not error: this must stay visible without skipping the ~620 downstream
      # nodes that a severity=error failure inside `dbt build` marks as skipped, which is exactly how
      # the prod warehouse once stopped refreshing.
      #
      # ⚠ IT READS THE VALUE, NOT THE FLAG, AND THAT IS THE WHOLE POINT. The first version asserted
      # `not deserved_points_was_capped`, and hardwiring that column to FALSE silenced it with every
      # test still green — a surviving mutation, measured. A capped row sits EXACTLY on its bound, so
      # the value itself carries the evidence and no boolean can be trusted away. The flag is then
      # pinned separately, below.
      #
      # ⚠ WHY `warn` IS THE RIGHT SEVERITY AND NOT A LOOSENING. A capped row is CORRECT behaviour —
      # a bounded outcome met an unbounded estimator — so this is not an error condition and
      # `severity: error` would fail the prod build on data the model handled properly. It is
      # therefore a signal, and the closest of engineering_standards.md §3's three guideline rows is
      # the third ("nice to have" coverage): surface it, do not block on it. Recorded because the
      # case matches none of the three exactly, and a reader should see the reasoning rather than
      # assume the table was ignored.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (deserved_points > 0 and deserved_points < 3 * season_games_played)"
          name: int_team_season_deserved_points_cap_did_not_bind
          severity: warn
      # the flag must agree with the value it explains, in BOTH directions: true exactly when
      # deserved_points sits on a bound. Without this, `deserved_points_was_capped` is an unpinned
      # boolean that could go constantly false (hiding every cap) or constantly true (making the
      # column meaningless) with nothing red. severity=error, like this model's other biconditional
      # contracts — two columns of one model disagreeing is a defect, not a data condition.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (deserved_points_was_capped = (deserved_points = 0 or deserved_points = 3 * season_games_played))"
          name: int_team_season_deserved_capped_flag_matches_value
      # deserved_points_gap null/arithmetic contract: null exactly when not fittable, else exactly
      # points_won_sum_season - deserved_points. Pins the SIGN CONVENTION, which is inverted relative
      # to the sot_rank_gap this replaced (there, positive meant under-performing).
      - dbt_utils.expression_is_true:
          expression: "(deserved_points is null and deserved_points_gap is null) or (deserved_points is not null and deserved_points_gap = points_won_sum_season - deserved_points)"
          name: int_team_season_deserved_points_gap_contract
      # SINGLE-LADDER GUARD. Wherever a deserved_rank is published, the actual ranks in that
      # league-season must be a 1..N permutation — otherwise a competition-wide deserved position is
      # being compared against a within-conference actual one. Asserted as uniqueness over the real
      # data rather than by excluding a list of league codes, so an onboarded conference league is
      # caught with no file edit (232 rows across MLS, LMX, APD and J1 would otherwise have
      # shipped a non-comparable rank).
      - dbt_utils.unique_combination_of_columns:
          name: int_team_season_deserved_rank_only_on_single_ladder_tables
          combination_of_columns:
            - league_code
            - season_sk
            - actual_rank
          # inline `where`, matching the working precedent at core.yml:694 rather than the
          # `config:`-nested form, which has no precedent in this project and cannot be run locally.
          where: "deserved_rank is not null"
    columns:
      - name: team_season_sk
        tests:
          - not_null
          - unique
      - name: team_sk
        description: "{{ doc('team_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }} Here every value must be a DOMESTIC LEAGUE in the registry, asserted by join rather than by an accepted_values list, which would break the zero-file rule the moment a league is onboarded."
        tests:
          - dbt_utils.relationships_where:
              name: int_team_season_deserved_domestic_leagues_only
              to: ref('competition_registry')
              field: league_code
              to_condition: "competition_type = 'domestic_league'"
      - name: actual_rank
        description: "League table rank (standing_rank from int_team_season__standings_primary) — the actual position."
      - name: points_won_sum_season
        description: "{{ doc('points_won_sum_season__team') }} In this model it is the ACTUAL side of the deserved-versus-actual comparison."
      - name: season_games_played
        description: "Finished games in the season; scales the fitted rate into a points total and bounds the legal-range test."
      - name: deserved_points
        description: "{{ doc('deserved_points') }}"
      - name: actual_table_is_single_ladder
        description: "TRUE when the league-season's actual ranks form a 1..N permutation, i.e. one table rather than conferences (MLS) or a split year of two tournaments (Apertura/Clausura). Part of the fittability gate, and emitted so a consumer can say WHY a league-season carries no deserved read at all."
      - name: deserved_points_was_capped
        description: "TRUE when the mechanical cap moved this row, i.e. the least-squares fit put the team outside the [0, 3] points-per-match a match can actually yield and deserved_points was brought back to the bound. NULL, not FALSE, where the league-season is not fittable at all — 'was it capped' has no answer where there is no fit. Emitted for the same reason as actual_table_is_single_ladder: it is the only thing that explains why a served value sits exactly on a bound, and it is what the warn-severity detector reads."
      - name: deserved_rank
        description: "{{ doc('deserved_rank') }}"
      - name: deserved_points_gap
        description: "{{ doc('deserved_points_gap') }}"
      - name: deserved_points_gap_rank
        description: "{{ doc('deserved_points_gap_rank') }}"
      - name: league_sk
        description: "{{ doc('league_sk') }}"
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
      - name: entity_type
      - name: shots_on_goal_difference_per_match
        description: "{{ doc('shots_on_goal_difference_per_match') }}"

  - name: int_player_season__metrics
    description: >
      A player's whole-season aggregate over all their finished matches — the single player-season
      rollup. Grain: (player_sk, season_sk).

      Composed from the per-club atoms: the club rows re-summed to the competition-season, with
      ratios and per-90s re-derived from the re-summed atoms rather than averaged.

      The atoms follow the metric_catalogue seed. passes_accurate_player is rounded per fixture then
      summed, the weighted-ratio numerator. Counts treat NULL as 0. `appearances` counts matches
      actually PLAYED. Rates are NULL on a zero denominator. team_sk is the player's last known
      club that season.
    config:
      tags: ["intermediate", "football", "team_season", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      # The SAME grain, spelled the way anything joining a LEG model has to spell it. `season_sk` is
      # built from (league_api_id, season_api_year), so this is not a second, weaker key — it is one
      # rule in its surrogate form above and its readable form here. Asserting the readable form
      # directly is what lets a consumer group legs on (player_sk, league_code, season_api_year) and
      # know the join cannot fan out. The TEAM model has carried both spellings since it was written;
      # the player model had only the season_sk form, so a league_code split would have surfaced
      # downstream as missing rows with no test naming the cause.
      # ⭐ NOT VACUOUS, measured on prod before this shipped: 185,421 rows, both spellings distinct at
      # 185,421 — and **34,884 player-years span more than one league_code** (max 8), a quarter of all
      # player-years. So league_code is load-bearing in this key; (player_sk, season_api_year) alone
      # would fan out badly.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - league_code
            - season_api_year
      - dbt_utils.expression_is_true:
          expression: "passes_accuracy_player_pct is null or (passes_accuracy_player_pct between 0 and 1)"
          name: int_player_season_passes_accuracy_player_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "(duels_won_player_pct is null or duels_won_player_pct between 0 and 1) and (dribbles_success_player_pct is null or dribbles_success_player_pct between 0 and 1) and (saves_player_pct is null or saves_player_pct between 0 and 1) and (finishing_efficiency_player_pct is null or finishing_efficiency_player_pct between 0 and 1)"
          name: int_player_season_ratios_in_range
      # per-90 metrics (benchmark inputs) are unbounded above but can never be negative — a sign-flip
      # or a bad numerator would trip this. NULL is allowed (minutes = 0).
      - dbt_utils.expression_is_true:
          expression: "(goals_per90 is null or goals_per90 >= 0) and (assists_per90 is null or assists_per90 >= 0) and (scorer_points_per90 is null or scorer_points_per90 >= 0) and (shots_on_goal_per90 is null or shots_on_goal_per90 >= 0) and (passes_key_per90 is null or passes_key_per90 >= 0) and (dribbles_success_per90 is null or dribbles_success_per90 >= 0) and (passes_per90 is null or passes_per90 >= 0) and (tackles_per90 is null or tackles_per90 >= 0) and (interceptions_per90 is null or interceptions_per90 >= 0) and (blocks_per90 is null or blocks_per90 >= 0) and (defensive_actions_per90 is null or defensive_actions_per90 >= 0) and (duels_won_per90 is null or duels_won_per90 >= 0) and (saves_per90 is null or saves_per90 >= 0)"
          name: int_player_season_per90_non_negative
    columns:
      - name: player_sk
        description: "{{ doc('player_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        description: "{{ doc('season_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        description: "{{ doc('league_sk') }}"
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        description: "{{ doc('season_api_year') }}"
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the player's last known club that competition-season, a deterministic last-kickoff pick. Unused downstream today, tested for integrity."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: appearances
        tests: [not_null]
