version: 2

models:
  - name: int_team_season__standings_primary
    description: >
      Deduplicated standings snapshot per team-season: one row per (team_sk, season_sk)
      chosen by latest raw_ingested_at when the core fact has multiple rows (e.g. parallel groups).
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: standing_rank
        description: "API rank from the chosen row (same semantics as mart_team_season.latest_rank source)."
      - name: form
        description: "Recent-form string from the chosen row (latest_form in marts)."
      - name: group_description
        description: "Standings group/stage label from the chosen row."

  - name: int_team_season__metrics
    description: >
      A team's whole-season rollup: every metric aggregated over all its finished matches, plus
      the W/D/L counts. Grain: (league_code, season_api_year, team_sk).

      Same sum and rate semantics as the recent-form metrics, without the five-game cap — so a
      season figure and a form figure are directly comparable.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "(shot_accuracy is null or shot_accuracy between 0 and 1) and (danger_zone_ratio is null or danger_zone_ratio between 0 and 1) and (pass_accuracy is null or pass_accuracy between 0 and 1) and (duels_won_pct is null or duels_won_pct between 0 and 1) and (save_ratio is null or save_ratio between 0 and 1) and (shot_share is null or shot_share between 0 and 1) and (points_capture is null or points_capture between 0 and 1) and (clean_sheets is null or clean_sheets between 0 and 1) and (finishing_efficiency is null or finishing_efficiency between 0 and 1)"
          name: int_team_season_ratios_in_range
      # shots-on-target conceded per match is a count rate — never negative (a sign-flip or bad
      # numerator would trip this). sot_difference_per_match is signed, so it is intentionally not range-tested.
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0"
          name: int_team_season_sot_against_non_negative
    columns:
      - name: team_season_sk
        description: "Surrogate over (team_sk, season_sk); the model's grain key. Uniqueness tested at source (relied on by int_team_season__deserved_vs_actual)."
        tests:
          - not_null
          - unique
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: season_games_played
        tests: [not_null]
      - name: sot_difference_per_match
        description: >
          Shots-on-target difference per match (for - against) — the deserved signal. NULL unless
          both own and opponent SoT cover every season game. Signed (can be negative).
      - name: shots_on_goal_against_per_match
        description: >
          Shots on target conceded per match (opponent-SoT companion to shots_on_goal_per_match).
          NULL unless opponent SoT covers every season game.

  - name: int_team_season__metrics_cumulative
    description: >
      A team's season metrics as they stood after EVERY matchday, not only at the end. Grain:
      (team_sk, league_code, season_api_year, match_number). All competitions.

      THE SINGLE HOME of the team-season rate formulas: the whole-season model is this model's
      final row, byte-identical, so the two can never drift apart.

      The `_sum_season` and `season_games_played` names are inherited from that projection to keep
      it byte-identical; here they mean "cumulative through this matchday", not "for the season".
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - league_code
            - season_api_year
            - match_number
      # Ratio bounds are split by invariant FAMILY (the cumulative grain is weaker than the whole-
      # season one — see below). Structurally-bounded ratios hold [0,1] at EVERY matchday by
      # construction: points_capture (points <= 3*games), clean_sheets (clean_sheet_games <= games),
      # shot_share (for/(for+against)), save_ratio (saves/(saves+goals)), finishing_efficiency
      # (nulled when goals>SoT). A value out of [0,1] here is a real coverage-window/formula bug.
      - dbt_utils.expression_is_true:
          expression: "(save_ratio is null or save_ratio between 0 and 1) and (shot_share is null or shot_share between 0 and 1) and (points_capture is null or points_capture between 0 and 1) and (clean_sheets is null or clean_sheets between 0 and 1) and (finishing_efficiency is null or finishing_efficiency between 0 and 1)"
          name: int_team_season_cumulative_structural_ratios_in_range
      # Provider-subset ratios (one provider stat over another: shot_accuracy = SoT/shots,
      # danger_zone_ratio = inside_box/shots, pass_accuracy = accurate/total, duels_won_pct =
      # won/total) are bounded >= 0 ONLY. At a low matchday a single game where the provider reports
      # numerator > denominator (a known API inconsistency, e.g. inside_box > total shots) is not yet
      # diluted, so a cumulative value > 1 is a genuine data reality — not a model bug (clamping would
      # hide it). The whole-season projection keeps strict [0,1] (dilution holds at season scale). A
      # negative would still be a real sign-flip bug.
      - dbt_utils.expression_is_true:
          expression: "(shot_accuracy is null or shot_accuracy >= 0) and (danger_zone_ratio is null or danger_zone_ratio >= 0) and (pass_accuracy is null or pass_accuracy >= 0) and (duels_won_pct is null or duels_won_pct >= 0)"
          name: int_team_season_cumulative_subset_ratios_non_negative
      - dbt_utils.expression_is_true:
          expression: "shots_on_goal_against_per_match is null or shots_on_goal_against_per_match >= 0"
          name: int_team_season_cumulative_sot_against_non_negative
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: match_number
        description: "Games played through this cumulative row (= games_played). The grain key + the YoY alignment cutoff N."
        tests: [not_null]
      - name: season_games_played
        description: "Games played through this matchday (name inherited from the whole-season projection for byte-identity)."
        tests: [not_null]

  - name: int_team_season__deserved_vs_actual
    description: >
      The points a team's process deserved, against the points it actually has. Grain: (team_sk,
      season_sk). DOMESTIC LEAGUES ONLY: a group-stage standing is not a comparable league rank.

      Least squares fits points-per-match on sot_difference_per_match within each league-season.
      deserved_points is that rate times the team's games played; sot_points_gap is actual minus
      deserved, NEGATIVE meaning under-performing.

      The gap redistributes: it sums to zero across a balanced season. NULL unless every team in
      that league-season has full shots-on-target coverage, a league rank and three finished
      games.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.expression_is_true:
          expression: "deserved_rank is null or deserved_rank >= 1"
          name: int_team_season_deserved_rank_positive
      # BICONDITIONAL, restored. rank is derived from deserved_points and the single-ladder
      # condition now sits inside league_season_fittable, so the two null together again and this
      # asserts BOTH directions. It briefly became one-directional, when the single-ladder split
      # applied to the rank alone; deleting the direction rather than narrowing it left the column
      # with no positive-existence guard at all, so it could have gone silently empty with every
      # test still green (analytics-engineer-reviewer, 2026-07-22). A test may become NARROWER when
      # a change makes it partly untrue. It must never become SHORTER.
      - dbt_utils.expression_is_true:
          expression: "(deserved_points is null and deserved_rank is null) or (deserved_points is not null and deserved_rank is not null)"
          name: int_team_season_deserved_rank_tracks_points
      # a published read requires a single-ladder table — the condition is inside the gate, and this
      # asserts it held rather than trusting the gate to have applied it.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or actual_table_is_single_ladder"
          name: int_team_season_deserved_requires_single_ladder
      # gate invariant: a non-null deserved_points means the league-season passed the full-table
      # gate, so this row's own inputs must both be present.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (sot_difference_per_match is not null and actual_rank is not null)"
          name: int_team_season_deserved_points_requires_inputs
      # LEGAL-RANGE INVARIANT. A fitted value can leave the possible range when the fit is degenerate
      # (a tiny league, a signal with no spread, too few games). Asserting the invariant catches every
      # such cause at once, rather than guarding the one threshold that happened to be the trigger:
      # before the >= 3 games gate, two Liga MX rows one game into the season fell outside it.
      - dbt_utils.expression_is_true:
          expression: "deserved_points is null or (deserved_points >= 0 and deserved_points <= 3 * season_games_played)"
          name: int_team_season_deserved_points_in_legal_range
      # sot_points_gap null/arithmetic contract: null exactly when not fittable, else exactly
      # points_won_sum_season - deserved_points. Pins the SIGN CONVENTION, which is inverted relative
      # to the sot_rank_gap this replaced (there, positive meant under-performing).
      - dbt_utils.expression_is_true:
          expression: "(deserved_points is null and sot_points_gap is null) or (deserved_points is not null and sot_points_gap = points_won_sum_season - deserved_points)"
          name: int_team_season_sot_points_gap_contract
      # SINGLE-LADDER GUARD. Wherever a deserved_rank is published, the actual ranks in that
      # league-season must be a 1..N permutation — otherwise a competition-wide deserved position is
      # being compared against a within-conference actual one. Asserted as uniqueness over the real
      # data rather than by excluding a list of league codes, so an onboarded conference league is
      # caught with no file edit (found by the football reviewer, 2026-07-22; 232 rows across MLS,
      # LMX, APD and J1 would have shipped a non-comparable rank).
      - dbt_utils.unique_combination_of_columns:
          name: int_team_season_deserved_rank_only_on_single_ladder_tables
          combination_of_columns:
            - league_code
            - season_sk
            - actual_rank
          # inline `where`, matching the working precedent at core.yml:694 rather than the
          # `config:`-nested form, which has no precedent in this project and cannot be run locally.
          where: "deserved_rank is not null"
    columns:
      - name: team_season_sk
        tests:
          - not_null
          - unique
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests: [not_null]
      - name: league_code
        description: "{{ doc('league_code') }} Here every value must be a DOMESTIC LEAGUE in the registry, asserted by join rather than by an accepted_values list, which would break the zero-file rule the moment a league is onboarded."
        tests:
          - dbt_utils.relationships_where:
              name: int_team_season_deserved_domestic_leagues_only
              to: ref('competition_registry')
              field: league_code
              to_condition: "competition_type = 'domestic_league'"
      - name: actual_rank
        description: "League table rank (standing_rank from int_team_season__standings_primary) — the actual position."
      - name: points_won_sum_season
        description: "Actual points won across the season — the ACTUAL side of the comparison, carried here so the gap contract test can assert against it."
      - name: season_games_played
        description: "Finished games in the season; scales the fitted rate into a points total and bounds the legal-range test."
      - name: deserved_points
        description: "Points deserved by the on-target process: the league-season least-squares fit of points-per-match on sot_difference_per_match, times this team's games played. NULL when the league-season is not fittable, or when the signal has no spread across it (the slope is then undefined, not flat)."
      - name: actual_table_is_single_ladder
        description: "TRUE when the league-season's actual ranks form a 1..N permutation, i.e. one table rather than conferences (MLS) or a split year of two tournaments (Apertura/Clausura). Part of the fittability gate, and emitted so a consumer can say WHY a league-season carries no deserved read at all."
      - name: deserved_rank
        description: "Rank by deserved_points within the league-season (1 = best) — the process-deserved table position. Derived from deserved_points, so it cannot disagree with it, and it appears and disappears exactly with it. NULL whenever the league-season is not fittable, which now includes any table that is not a single ladder."
      - name: sot_points_gap
        description: "points_won_sum_season - deserved_points. NEGATIVE = under-performing (fewer points than deserved), POSITIVE = over-performing. NOTE the sign is inverted relative to the retired sot_rank_gap. NULL when not fittable."

  - name: int_player_season__metrics
    description: >
      A player's whole-season aggregate over all their finished matches — the single player-season
      rollup. Grain: (player_sk, season_sk).

      Composed from the per-club atoms: the club rows re-summed to the competition-season, with
      ratios and per-90s re-derived from the re-summed atoms rather than averaged.

      The atoms follow the metric_catalogue seed. passes_accurate is rounded per fixture then
      summed, the weighted-ratio numerator. Counts treat NULL as 0. `appearances` counts matches
      actually PLAYED. Rates are NULL on a zero denominator. team_sk is the player's last known
      club that season.
    config:
      tags: ["intermediate", "football", "team_season", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: int_player_season_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "(duels_won_pct is null or duels_won_pct between 0 and 1) and (dribbles_success_pct is null or dribbles_success_pct between 0 and 1) and (save_pct is null or save_pct between 0 and 1) and (finishing_efficiency is null or finishing_efficiency between 0 and 1)"
          name: int_player_season_ratios_in_range
      # per-90 metrics (benchmark inputs) are unbounded above but can never be negative — a sign-flip
      # or a bad numerator would trip this. NULL is allowed (minutes = 0).
      - dbt_utils.expression_is_true:
          expression: "(goals_per90 is null or goals_per90 >= 0) and (assists_per90 is null or assists_per90 >= 0) and (scorer_points_per90 is null or scorer_points_per90 >= 0) and (shots_on_goal_per90 is null or shots_on_goal_per90 >= 0) and (key_passes_per90 is null or key_passes_per90 >= 0) and (dribbles_success_per90 is null or dribbles_success_per90 >= 0) and (passes_per90 is null or passes_per90 >= 0) and (tackles_per90 is null or tackles_per90 >= 0) and (interceptions_per90 is null or interceptions_per90 >= 0) and (blocks_per90 is null or blocks_per90 >= 0) and (defensive_actions_per90 is null or defensive_actions_per90 >= 0) and (duels_won_per90 is null or duels_won_per90 >= 0) and (saves_per90 is null or saves_per90 >= 0)"
          name: int_player_season_per90_non_negative
    columns:
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: team_sk
        description: "{{ doc('team_sk') }} Here it is the player's last known club that competition-season, a deterministic last-kickoff pick. Unused downstream today, tested for integrity."
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: appearances
        tests: [not_null]
      - name: pass_accuracy_pct
        description: "Weighted pass accuracy (accurate ÷ attempted); 0-1 or null. Range-tested at model level."
