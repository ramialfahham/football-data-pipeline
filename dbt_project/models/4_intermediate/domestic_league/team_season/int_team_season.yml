version: 2

models:
  - name: int_team_season__standings_primary
    description: >
      Deduplicated standings snapshot per team-season: one row per (team_sk, season_sk)
      chosen by latest raw_ingested_at when the core fact has multiple rows (e.g. parallel groups).
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: standing_rank
        description: "API rank from the chosen row (same semantics as mart_team_season.latest_rank source)."
      - name: form
        description: "Recent-form string from the chosen row (latest_form in marts)."
      - name: group_description
        description: "Standings group/stage label from the chosen row."

  - name: int_team_season__full_season_metrics
    description: >
      Per (league_code, season_api_year, team_sk) advanced metrics aggregated over all finished legs
      in that season. Same sum/rate semantics as int_matchday__team_form_metrics without a five-game cap.
      mart_team_season_insights exposes only the latest season_api_year per league_code.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - team_sk
    columns:
      - name: team_season_sk
        tests: [not_null]
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: season_games_played
        tests: [not_null]

  - name: int_player_season__metrics
    description: >
      Per (league_code, season_api_year, player_sk) full-season aggregate statistics over all
      finished matches. Mirrors int_team_season__full_season_metrics at player grain.
      Retained for the planned player profile / season-recap surface; its former
      consumer int_matchday__fixture_player_insights was retired in #321.
      team_sk is the player's last known club in that league/season (any_value ordered by kickoff desc).
      Rates are null when denominator is zero; never coerced to 0.
      Grain: (league_code, season_api_year, player_sk).
    config:
      tags: ["intermediate", "football", "team_season", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - player_sk
    columns:
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: player_sk
        tests: [not_null]
      - name: matches_played
        tests: [not_null]
