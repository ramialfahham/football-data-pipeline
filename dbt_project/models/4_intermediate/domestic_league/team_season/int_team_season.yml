version: 2

models:
  - name: int_team_season__standings_primary
    description: >
      Deduplicated standings snapshot per team-season: one row per (team_sk, season_sk)
      chosen by latest raw_ingested_at when the core fact has multiple rows (e.g. parallel groups).
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - season_sk
    columns:
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: standing_rank
        description: "API rank from the chosen row (same semantics as mart_team_season.latest_rank source)."
      - name: form
        description: "Recent-form string from the chosen row (latest_form in marts)."
      - name: group_description
        description: "Standings group/stage label from the chosen row."

  - name: int_team_season__full_season_metrics
    description: >
      Per (league_code, season_api_year, team_sk) advanced metrics aggregated over all finished legs
      in that season. Same sum/rate semantics as int_matchday__team_form_metrics without a five-game cap.
      mart_team_season_insights exposes only the latest season_api_year per league_code.
    config:
      tags: ["intermediate", "football", "team_season"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - league_code
            - season_api_year
            - team_sk
      - dbt_utils.expression_is_true:
          expression: "(shot_accuracy_season is null or shot_accuracy_season between 0 and 1) and (danger_zone_ratio_season is null or danger_zone_ratio_season between 0 and 1) and (pass_accuracy_season is null or pass_accuracy_season between 0 and 1) and (duels_won_pct_season is null or duels_won_pct_season between 0 and 1) and (save_ratio_season is null or save_ratio_season between 0 and 1) and (shot_share_season is null or shot_share_season between 0 and 1) and (points_capture_season is null or points_capture_season between 0 and 1)"
          name: int_team_season_ratios_in_range
    columns:
      - name: team_season_sk
        tests: [not_null]
      - name: team_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: season_games_played
        tests: [not_null]

  - name: int_player_season__metrics
    description: >
      Canonical per (player, competition-season) aggregate over all finished matches — the SINGLE
      player-season rollup consumed by BOTH mart_player_profile and mart_player_season (#480
      consolidation; replaces the inline aggregation each mart duplicated). Atoms follow
      docs/player_metrics_catalogue.md: passes_accurate = per-fixture ROUND(passes_total *
      passes_accuracy_percent / 100) then summed (the weighted-ratio numerator); counts coalesce
      nulls to 0; appearances = finished player-stat rows (honest absence); rates null when the
      denominator is zero. team_sk = the player's last known club that competition-season.
      Grain: (player_sk, season_sk) — today's grain (the per-club split is the deferred §8.3 follow-up).
    config:
      tags: ["intermediate", "football", "team_season", "player"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_sk
            - season_sk
      - dbt_utils.expression_is_true:
          expression: "pass_accuracy_pct is null or (pass_accuracy_pct between 0 and 1)"
          name: int_player_season_pass_accuracy_pct_in_range
      - dbt_utils.expression_is_true:
          expression: "(duels_won_pct is null or duels_won_pct between 0 and 1) and (dribbles_success_pct is null or dribbles_success_pct between 0 and 1) and (save_pct is null or save_pct between 0 and 1)"
          name: int_player_season_ratios_in_range
    columns:
      - name: player_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk
      - name: season_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_competition_season')
              field: season_sk
      - name: league_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]
      - name: appearances
        tests: [not_null]
      - name: pass_accuracy_pct
        description: "Weighted pass accuracy (accurate ÷ attempted); 0-1 or null. Range-tested at model level."
