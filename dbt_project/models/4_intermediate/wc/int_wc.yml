version: 2

models:
  - name: int_wc__participant_teams
    description: >
      National teams appearing on fct_fixture for the current WC tournament season (max season_api_year
      per league_code WC). Grain: team_sk.
    config:
      tags: ["intermediate", "football", "wc"]
    columns:
      - name: team_sk
        tests: [not_null, unique]
      - name: league_code
        tests: [not_null]
      - name: season_api_year
        tests: [not_null]

  - name: int_wc__pre_tournament_qualifier_legs
    description: >
      Finished supporting-confederation legs before each team's first WC tournament leg in the target
      season. Grain: (team_sk, fixture_sk).
    config:
      tags: ["intermediate", "football", "wc"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - team_sk
            - fixture_sk

  - name: int_wc__pre_tournament_team_metrics
    description: >
      Qualifier-window aggregates and is_*_complete flags per WC participant. UI shows rates only when
      the matching completeness flag is true.
    config:
      tags: ["intermediate", "football", "wc"]
    columns:
      - name: team_sk
        tests: [not_null, unique]
      - name: qualifier_games_played
        tests: [not_null]
