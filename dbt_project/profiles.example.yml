football_data_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: football-data-pipeline-gcp
      # Fallback dataset for models without `+schema` (see `macros/generate_schema_name.sql`).
      # Layer models use datasets: raw (ingestion only), staging, base, core, intermediate, marts.
      dataset: dbt_scratch
      threads: 4
      timeout_seconds: 300
      location: EU  # keep in sync with ingestion raw dataset (default dataset id: raw)
      priority: interactive

    # Recommended for CI/CD:
    # prod:
    #   type: bigquery
    #   method: service-account
    #   project: football-data-pipeline-gcp
    #   dataset: analytics
    #   keyfile: /path/to/service-account.json
    #   threads: 4
    #   timeout_seconds: 300
    #   location: EU
    #   priority: interactive
