# dbt connection profile for local development. `python scripts/bootstrap.py` copies it to
# `profiles.yml` in the REPO ROOT (gitignored) when that file is missing.
#
# Why the repo root and not ~/.dbt: ~/.dbt/profiles.yml is one file per machine, shared by every
# dbt project on it, so another project can overwrite or rewrite it. dbt reads the WORKING
# DIRECTORY before ~/.dbt, and every documented command runs dbt from the repo root
# (`dbt ... --project-dir dbt_project`). `--project-dir` does not move the profile lookup, so run
# dbt from the root, not from inside dbt_project/.
#
# ENVIRONMENT ISOLATION (see macros/generate_schema_name.sql):
#   The layer datasets (staging/core/intermediate/marts) are prefixed by the TARGET NAME. `prod` is
#   the ONLY target that writes the bare, site-facing datasets (`marts`, `core`, ...). Every other
#   target is prefixed: target `dev` writes dev_marts, dev_core, ... So this profile has no `prod`
#   target, and must never get one. CI writes its own per-merge-request profile
#   (`.gitlab-ci.yml`, the `.dbt_profile` anchor); the nightly image carries
#   `deploy/nightly/profiles.yml`.
#   Models WITHOUT a `+schema` (the base models + seeds) fall back to `dataset` below.
#
# Credentials: `method: oauth` uses your Google login. Run once:
#   gcloud auth application-default login

football_data_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: football-data-pipeline-gcp
      # Fallback dataset for models without `+schema` (the base models + seeds).
      dataset: dev_scratch
      threads: 4
      timeout_seconds: 300
      location: EU  # keep in sync with ingestion raw dataset (default dataset id: raw)
      priority: interactive
