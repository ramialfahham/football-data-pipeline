# dbt profile for the Cloud Run nightly; prod only, so a mistyped --target cannot write elsewhere.
# Dataset, location and threads must match the `.dbt_profile` anchor in `.gitlab-ci.yml`.

football_data_pipeline:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: football-data-pipeline-gcp
      dataset: dbt_analytics
      threads: 4
      timeout_seconds: 300
      location: EU
      priority: interactive
