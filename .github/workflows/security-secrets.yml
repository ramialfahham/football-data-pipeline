name: security-secrets

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Terminal gate: uniform name across all quality-gate workflows so branch
  # protection has one consistent check to require per workflow.
  gate:
    needs: secret-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "secret-scan did not pass (result=${{ needs.secret-scan.result }})"
            exit 1
          fi
          echo "gate passed"
