name: ci-ui

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'site/**'
              - 'scripts/build_match_preview_site.sh'
              - 'scripts/build_match_preview_site.ps1'
              - 'scripts/export_pages_data.py'
              - 'scripts/check_ui_i18n_metrics.py'

  ui-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON syntax (i18n + metric manifest)
        run: |
          python -m json.tool site/i18n/en.json > /dev/null
          python -m json.tool site/i18n/de.json > /dev/null
          python -m json.tool site/i18n/fi.json > /dev/null
          python -m json.tool site/match-preview/metric_manifest.json > /dev/null
          python -m json.tool site/match-preview/metric_definitions.json > /dev/null

      - name: Check JS syntax in match-preview HTML
        run: |
          python3 -c "
          import re, sys
          html = open('site/match-preview/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.DOTALL)
          if not scripts:
              print('ERROR: no <script> block found in index.html', file=sys.stderr)
              sys.exit(1)
          for i, js in enumerate(scripts):
              open(f'/tmp/ci_check_{i}.js', 'w', encoding='utf-8').write(js)
          print(f'Extracted {len(scripts)} script block(s)')
          "
          for f in /tmp/ci_check_*.js; do
            node --check "$f" && echo "SYNTAX OK: $f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done

      - name: Check metric_manifest vs i18n metrics namespace
        run: python scripts/check_ui_i18n_metrics.py

  # Terminal gate: see ci-data-build for rationale. Branch protection requires
  # this job by name so docs-only PRs (where `ui-checks` skips) don't block.
  gate:
    needs: [changes, ui-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed (result=${{ needs.changes.result }})"
            exit 1
          fi
          if [ "${{ needs.ui-checks.result }}" = "failure" ] || [ "${{ needs.ui-checks.result }}" = "cancelled" ]; then
            echo "ui-checks did not pass (result=${{ needs.ui-checks.result }})"
            exit 1
          fi
          echo "gate passed (changes=${{ needs.changes.result }}, ui-checks=${{ needs.ui-checks.result }})"
