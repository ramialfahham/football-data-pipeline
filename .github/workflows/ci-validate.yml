name: ci-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sql:
              - 'dbt_project/models/**/*.sql'

  validate:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce layer contract
        run: python scripts/check_layer_contract.py

      - name: Check registry/var sync
        run: python scripts/check_registry_var_sync.py

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: Parse project
        working-directory: dbt_project
        run: dbt parse

  sqlfluff:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint SQL
        run: sqlfluff lint models
