name: ci-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce layer contract
        run: python scripts/check_layer_contract.py

      - name: Check registry/var sync
        run: python scripts/check_registry_var_sync.py

      - name: Create dbt profile for parse
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml <<'EOF'
          football_data_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-data-pipeline-gcp
                dataset: dbt_analytics
                threads: 4
                timeout_seconds: 300
                location: EU
                priority: interactive
          EOF

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: Parse project
        working-directory: dbt_project
        run: dbt parse

  # Terminal gate: uniform name across all quality-gate workflows so branch
  # protection has one consistent check to require per workflow.
  gate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "validate did not pass (result=${{ needs.validate.result }})"
            exit 1
          fi
          echo "gate passed"
