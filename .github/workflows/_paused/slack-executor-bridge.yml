name: slack-executor-bridge

on:
  repository_dispatch:
    types: [slack_executor_brief]
  workflow_dispatch:
    inputs:
      brief_title:
        description: "Manual brief title (chat fallback testing)"
        required: true
        type: string
      brief_body:
        description: "Manual brief body (chat fallback testing)"
        required: true
        type: string
      brief_id:
        description: "Optional brief ID"
        required: false
        type: string
      requested_by:
        description: "Requester identifier"
        required: false
        default: "manual-dispatch"
        type: string

permissions:
  contents: read

jobs:
  ingest-and-forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize intake payload
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          BRIEF_TITLE: ${{ inputs.brief_title || '' }}
          BRIEF_BODY: ${{ inputs.brief_body || '' }}
          BRIEF_ID: ${{ inputs.brief_id || '' }}
          REQUESTED_BY: ${{ inputs.requested_by || '' }}
        run: |
          python3 scripts/slack_bridge/normalize_brief.py \
            --event-name "${{ github.event_name }}" \
            --client-payload-json "$CLIENT_PAYLOAD_JSON" \
            --repository "${{ github.repository }}" \
            --out /tmp/normalized_brief.json \
            --summary-out /tmp/slack_bridge_summary.md \
            --manual-title "$BRIEF_TITLE" \
            --manual-body "$BRIEF_BODY" \
            --manual-brief-id "$BRIEF_ID" \
            --manual-requested-by "$REQUESTED_BY"
          cat /tmp/slack_bridge_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normalized brief artifact
        uses: actions/upload-artifact@v4
        with:
          name: slack-brief-${{ github.run_id }}
          path: /tmp/normalized_brief.json

      - name: Acknowledge receipt in Slack thread
        run: |
          python3 scripts/slack_bridge/post_thread_update.py \
            --brief-json /tmp/normalized_brief.json \
            --status received \
            --message "Brief received by the executor bridge. Work has been queued."

      - name: Forward brief to executor endpoint
        id: forward
        continue-on-error: true
        env:
          EXECUTOR_BRIDGE_URL: ${{ secrets.CURSOR_EXECUTOR_BRIDGE_URL }}
          EXECUTOR_BRIDGE_TOKEN: ${{ secrets.CURSOR_EXECUTOR_BRIDGE_TOKEN }}
        run: |
          python3 scripts/slack_bridge/forward_to_executor.py \
            --brief-json /tmp/normalized_brief.json \
            --endpoint-url "$EXECUTOR_BRIDGE_URL" \
            --bearer-token "$EXECUTOR_BRIDGE_TOKEN" \
            --result-out /tmp/executor_forward_result.json
          echo "Executor forward result:"
          cat /tmp/executor_forward_result.json

      - name: Upload executor forward result
        uses: actions/upload-artifact@v4
        with:
          name: executor-forward-result-${{ github.run_id }}
          path: /tmp/executor_forward_result.json

      - name: Report forwarding failure in Slack thread
        if: steps.forward.outcome == 'failure'
        run: |
          python3 scripts/slack_bridge/post_thread_update.py \
            --brief-json /tmp/normalized_brief.json \
            --status failed \
            --message "Bridge intake succeeded but executor forwarding failed. Check GitHub Actions run logs."

      - name: Fail when forwarding fails
        if: steps.forward.outcome == 'failure'
        run: exit 1
