name: Deploy match preview (GitHub Pages)

on:
  workflow_dispatch:
  schedule:
    # Daily ~07:30 UTC after typical EU morning data refresh
    - cron: "30 7 * * *"
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - "dbt_project/models/1_staging/**"
      - "dbt_project/models/3_core/**"
      - "dbt_project/models/4_intermediate/matchday/**"
      - "dbt_project/models/4_intermediate/team_season/**"
      - "site/**"
      - "dbt_project/models/5_marts/mart_matchday_insights.sql"
      - "dbt_project/models/5_marts/mart_team_season.sql"
      - "dbt_project/models/5_marts/marts.yml"
      - "dbt_project/seeds/metric_glossary.csv"
      - "dbt_project/seeds/schema.yml"
      - ".github/workflows/pages-match-preview.yml"
      - "scripts/build_match_preview_site.sh"
      - "scripts/build_match_preview_site.ps1"
      - "scripts/export_matchday_json.py"
      - "scripts/build_metric_glossary_json.py"
      - "scripts/inject_feedback_endpoint.py"

concurrency:
  group: pages-match-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure artifacts directory
        run: mkdir -p artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profile for CI
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml <<'EOF'
          football_data_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-data-pipeline-gcp
                dataset: dbt_analytics
                threads: 4
                timeout_seconds: 300
                location: EU
                priority: interactive
          EOF

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: Build all upstream of mart_matchday_insights
        working-directory: dbt_project
        run: dbt run --select +mart_matchday_insights

      - name: Run data quality tests
        working-directory: dbt_project
        run: dbt test --select fct_fixture mart_matchday_insights --exclude tag:debug

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Export matchday JSON
        run: python scripts/export_matchday_json.py artifacts/matchday_insights.json

      - name: Build metric glossary JSON
        run: python scripts/build_metric_glossary_json.py

      - name: Inject feedback Apps Script URL (optional)
        env:
          FEEDBACK_APPS_SCRIPT_URL: ${{ secrets.FEEDBACK_APPS_SCRIPT_URL }}
        run: |
          if [ -n "${FEEDBACK_APPS_SCRIPT_URL:-}" ]; then
            python scripts/inject_feedback_endpoint.py site/match-preview/index.html "$FEEDBACK_APPS_SCRIPT_URL"
          else
            echo "FEEDBACK_APPS_SCRIPT_URL secret not set — Feedback stays disabled until you add it (see docs/feedback_collection.md)."
          fi

      - name: Assemble Pages folder
        run: bash scripts/build_match_preview_site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
