name: dbt-ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: dbt_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Create dbt profile for CI
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml <<'EOF'
          football_data_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-data-pipeline-gcp
                dataset: dbt_analytics
                threads: 4
                timeout_seconds: 300
                location: EU
                priority: interactive
          EOF

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        run: dbt deps

      - name: Enforce layer contract
        run: python ../scripts/check_layer_contract.py

      - name: Enforce SQL quality gate on changed enforced layers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          python ../scripts/check_sql_quality.py $CHANGED_FILES

      - name: Lint SQL
        run: sqlfluff lint models

      - name: Parse project
        run: dbt parse

      - name: Build staging
        run: dbt build --selector staging

      - name: Build core transfer contracts
        run: dbt build --select dim_date dim_player fct_transfer

      - name: Build fixture statistics chain
        run: dbt build --select stg_apif__d1_fixture_statistics fct_fixture_team_stats mart_matchday_insights

      - name: Run fixture stats trust diagnostics (hard gate)
        run: python ../scripts/data_trust_fixture_stats.py
