name: dbt-ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: dbt_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Create dbt profile for CI
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml <<'EOF'
          football_data_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-data-pipeline-gcp
                dataset: dbt_analytics
                threads: 4
                timeout_seconds: 300
                location: EU
                priority: interactive
          EOF

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        run: dbt deps

      - name: Enforce layer contract
        run: python ../scripts/check_layer_contract.py

      - name: Lint SQL
        run: sqlfluff lint models

      - name: Parse project
        run: dbt parse

      - name: Build staging
        run: dbt build --selector staging

      - name: Build core transfer contracts
        run: dbt build --select dim_date base_apif__bl1_transfers +dim_player +fct_transfer

      - name: Build fixture statistics chain
        run: dbt build --select stg_apif__bl1_fixture_statistics fct_fixture fct_fixture_team_stats mart_matchday_insights

      - name: Run singular data quality tests
        run: dbt test --select test_type:singular --exclude tag:freshness_check

      - name: Run fixture stats trust diagnostics (hard gate)
        run: python ../scripts/data_trust_fixture_stats.py
