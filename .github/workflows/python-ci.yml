name: python-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # Terminal gate: uniform name across all quality-gate workflows so branch
  # protection has one consistent check to require per workflow.
  gate:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test did not pass (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "gate passed"
