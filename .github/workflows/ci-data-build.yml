name: ci-data-build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ingest:
        description: Force bootstrap ingest (PL, PD, BL2, SA, L1, VL)
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      ingest: ${{ steps.filter.outputs.ingest }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'dbt_project/**'
              - 'ingestion/**'
              - 'docs/competition_registry.yml'
              - 'scripts/check_*.py'
              - 'scripts/data_trust_*.py'
              - 'requirements.txt'
              - '.github/workflows/ci-*.yml'
            ingest:
              - 'ingestion/**'
              - 'docs/competition_registry.yml'
              - 'dbt_project/models/1_staging/**'

  data-build:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.data == 'true'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: dbt_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profile for CI
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml <<'EOF'
          football_data_pipeline:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: football-data-pipeline-gcp
                dataset: dbt_analytics
                threads: 4
                timeout_seconds: 300
                location: EU
                priority: interactive
          EOF

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        run: dbt deps

      - name: Lint SQL (sqlfluff + dbt templater needs GCP)
        run: sqlfluff lint models

      - name: dbt seed
        run: dbt seed

      - name: Bootstrap ingest domestic league raw tables
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.run_ingest == true) ||
          needs.changes.outputs.ingest == 'true'
        working-directory: .
        env:
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          API_FOOTBALL_INCLUDE_IN_PROGRESS: "1"
          API_FOOTBALL_LEAGUE_CODES: "PL,PD,BL2,SA,L1,VL,LMX,LP,MLS"
          API_FOOTBALL_SKIP_INGEST_LOCK: "1"
        run: |
          export PYTHONPATH=.
          python -m ingestion.api_football.main

      - name: Build staging
        run: dbt build --selector staging

      - name: Build base through marts
        run: dbt build --selector downstream --exclude tag:freshness_check

      - name: Run singular data quality tests
        run: dbt test --select test_type:singular --exclude tag:freshness_check

      - name: Run fixture stats trust diagnostics (hard gate)
        run: python ../scripts/data_trust_fixture_stats.py

  # Terminal gate: always runs, reports a single deterministic pass/fail that
  # branch protection can require regardless of whether `data-build` was
  # path-filter-skipped. This is the unblocker for stricter required-checks
  # without breaking docs-only or UI-only PRs.
  gate:
    needs: [changes, data-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          # 'changes' must succeed. data-build is allowed to skip (means no
          # relevant files changed); only fail on actual failure or cancellation.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed (result=${{ needs.changes.result }})"
            exit 1
          fi
          if [ "${{ needs.data-build.result }}" = "failure" ] || [ "${{ needs.data-build.result }}" = "cancelled" ]; then
            echo "data-build did not pass (result=${{ needs.data-build.result }})"
            exit 1
          fi
          echo "gate passed (changes=${{ needs.changes.result }}, data-build=${{ needs.data-build.result }})"
