<!DOCTYPE html>
<!--
  Matchday IQ — Landing page
  ==========================
  Renders one card per active competition, driven by
  /pages_export_manifest.json (built by scripts/export_pages_data.py).

  Phase derivation (client-side):
    - matchday_row_count > 0           → "matchday"     → /fixture-list/?league=<code>
    - team_season_row_count > 0        → "season_recap" → /team-season/?league=<code>
    - both zero                        → "no_data"      → disabled
  WC follows the same fixture-list route when confirmed fixtures exist.

  Competition display names come from i18n (top-level competitions.*).
  Logos come from API-Football's CDN.
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday IQ — Wettbewerbe</title>
<script src="./i18n.js" defer></script>
<script src="./manifest-utils.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cooler, calmer palette. Single accent. Personality comes from logos. */
    --bg: #07091a;
    --bg-elev: #11152e;
    --card-bg: #161b38;
    --card-bg-hover: #1c2349;
    --border: rgba(255,255,255,0.07);
    --text: #f1f3fb;
    --text-secondary: #98a3c9;
    --text-tertiary: #5c6792;
    --accent: #6ea8fe;       /* refined blue — sportier, less playful */
    --accent-bright: #93c5fd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #1a2055 0%, var(--bg) 65%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 720px; margin: 0 auto; }

  /* Top bar (brand + language switcher) */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 28px;
  }
  .brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #93c5fd 0%, #c7d2fe 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--text-secondary); font-size: 14px; font-weight: 400; margin-top: -2px; margin-bottom: 28px; }

  /* Language switcher */
  .lang {
    position: relative;
    font-family: inherit;
  }
  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
    font-family: inherit;
  }
  .lang-btn:hover {
    background: var(--card-bg-hover);
    border-color: rgba(167, 139, 250, 0.3);
  }
  .lang-btn .globe { font-size: 14px; opacity: 0.8; }
  .lang-btn .code { letter-spacing: 0.04em; }
  .lang-btn .caret { font-size: 10px; opacity: 0.5; transition: transform 0.2s ease; }
  .lang.open .lang-btn .caret { transform: rotate(180deg); }

  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 200px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 1px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    z-index: 100;
  }
  .lang.open .lang-menu { display: flex; }

  .lang-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    border: 0;
    text-align: left;
    font-family: inherit;
  }
  .lang-option:hover { background: var(--card-bg-hover); color: var(--text); }
  .lang-option.active { color: var(--accent-bright); font-weight: 600; }
  .lang-option .code-tag {
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .lang-option.active .code-tag { color: var(--accent-bright); }

  .section-label {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.1em;
    margin: 32px 0 12px;
  }

  .cards { display: flex; flex-direction: column; gap: 12px; }

  .card {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    background: var(--card-bg-hover);
    border-color: rgba(110, 168, 254, 0.35);
    transform: translateY(-1px);
  }
  .card:active { transform: translateY(0); }

  .badge {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .badge img {
    width: 76%;
    height: 76%;
    object-fit: contain;
  }
  /* Fallback letters if a logo fails to load (alt attribute renders) */
  .badge img[alt]::before {
    content: attr(alt);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    background: var(--bg-elev);
    color: var(--text);
    font-weight: 800;
    font-size: 18px;
  }

  .body { min-width: 0; }
  .comp-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .meta .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--text-tertiary);
    flex-shrink: 0;
  }
  .round { font-weight: 600; color: var(--text-secondary); }
  .kickoff {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .kickoff-when { font-size: 14px; font-weight: 600; color: var(--text); }
  .kickoff-relative { font-size: 12px; color: var(--accent-bright); font-weight: 500; }

  .card.imminent .kickoff-relative { color: #fcd34d; font-weight: 600; }
  .card.imminent .kickoff-relative::before { content: "● "; color: #fcd34d; }

  .chevron { color: var(--text-tertiary); font-size: 18px; flex-shrink: 0; }
  .card:hover .chevron { color: var(--accent-bright); }

  .section.upcoming .card { opacity: 0.85; }
  .section.upcoming .card .kickoff-when { color: var(--text-secondary); }

  /* No-data card: surface the competition but make non-actionable */
  .card.is-disabled { opacity: 0.55; cursor: default; pointer-events: none; }
  .card.is-disabled:hover { transform: none; background: var(--card-bg); border-color: var(--border); }

  /* WC card: visually flagged as the upcoming tournament */
  .card.is-wc .kickoff-when { color: #fbbf24; font-weight: 600; }
  .card.is-wc .kickoff-when::before { content: "● "; color: #fbbf24; }

  /* Loading skeleton — shown while the manifest fetch is in flight */
  .cards.is-loading .card { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }
  .empty-state {
    padding: 32px 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.5;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 11px;
  }
  footer a { color: var(--text-secondary); text-decoration: none; }

  @media (min-width: 640px) {
    body { padding: 40px 24px 80px; }
    .brand { font-size: 36px; }
    .cards { gap: 14px; }
    .card { padding: 22px 22px 22px 0; }
    .badge { width: 60px; height: 60px; }
    .comp-name { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand" data-i18n="common.brand">Matchday IQ</div>
    <div class="lang" id="lang">
      <button class="lang-btn" type="button">
        <span class="globe">🌐</span>
        <span class="code">DE</span>
        <span class="caret">▾</span>
      </button>
      <!-- Options with data-lang in SUPPORTED (see site/i18n.js) are
           rendered as live switchers. Other entries are hidden at runtime
           by installLangSwitcher() — they stay in markup so adding a new
           language is just a matter of dropping a JSON file. -->
      <div class="lang-menu" role="menu">
        <button class="lang-option" role="menuitem" data-lang="de"><span>Deutsch</span><span class="code-tag">DE</span></button>
        <button class="lang-option" role="menuitem" data-lang="en"><span>English</span><span class="code-tag">EN</span></button>
        <button class="lang-option" role="menuitem" data-lang="es"><span>Español</span><span class="code-tag">ES</span></button>
        <button class="lang-option" role="menuitem" data-lang="fr"><span>Français</span><span class="code-tag">FR</span></button>
        <button class="lang-option" role="menuitem" data-lang="it"><span>Italiano</span><span class="code-tag">IT</span></button>
        <button class="lang-option" role="menuitem" data-lang="nl"><span>Nederlands</span><span class="code-tag">NL</span></button>
        <button class="lang-option" role="menuitem" data-lang="pt"><span>Português</span><span class="code-tag">PT</span></button>
        <button class="lang-option" role="menuitem" data-lang="fi"><span>Suomi</span><span class="code-tag">FI</span></button>
        <button class="lang-option" role="menuitem" data-lang="ar"><span>العربية</span><span class="code-tag">AR</span></button>
      </div>
    </div>
  </header>
  <p class="tagline" data-i18n="landing.tagline">Football analytics for fans</p>

  <div class="section-label" data-i18n="landing.sectionLabel">Wettbewerbe</div>
  <section class="section cards is-loading" id="cards">
    <!-- Skeleton placeholder while manifest loads -->
    <div class="card is-disabled">
      <div class="badge"></div>
      <div class="body">
        <div class="comp-name">&nbsp;</div>
        <div class="meta"><span class="round">&nbsp;</span></div>
      </div>
      <div class="chevron"></div>
    </div>
  </section>

  <footer>
    <a href="#" data-i18n="common.feedback">Feedback</a>
  </footer>

</div>

<script>
  /*
   * Landing renderer
   * ================
   * Reads /pages_export_manifest.json (written by scripts/export_pages_data.py)
   * and builds one card per domestic league + an optional WC card. Phase is
   * derived from row counts on the manifest — no separate phase field needed.
   *
   * Order:
   *   1. Competitions with upcoming fixtures, nearest kickoff first
   *   2. Competitions without fixture dates but not ended yet (coming soon)
   *   3. Competitions with ended seasons (recaps) last
   *
   * Each card is i18n-aware: competition names come from competitions.<CODE>,
   * state strings come from landing.state.*, CTAs from landing.cta.*.
   */
  (function () {
    // Provider league IDs for API-Football CDN logos. Mirrors
    // docs/competition_registry.yml — keep in sync when adding leagues.
    const LEAGUE_LOGO_IDS = {
      BL1: 78,
      BL2: 79,
      PL: 39,
      PD: 140,
      SA: 135,
      L1: 61,
      VL: 244,
      WC: 1,
    };

    function logoUrl(code) {
      const id = LEAGUE_LOGO_IDS[code];
      return id ? `https://media.api-sports.io/football/leagues/${id}.png` : "";
    }

    function tt(key, fallback, vars) {
      // Defensive wrapper — i18n.js may not be loaded if offline.
      if (vars && typeof window.tFmt === "function") return window.tFmt(key, vars, fallback);
      if (typeof window.t === "function") return window.t(key, fallback);
      return fallback;
    }

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function phaseFor(entry) {
      const m = Number(entry.matchday_row_count) || 0;
      const t = Number(entry.team_season_row_count) || 0;
      if (m > 0) return "matchday";
      if (t > 0) return "season_recap";
      return "no_data";
    }

    function nextKickoffEpoch(entry) {
      if (Number.isFinite(entry && entry._resolved_next_kickoff_epoch)) {
        return entry._resolved_next_kickoff_epoch;
      }
      const raw = String(entry.next_fixture_kickoff_utc || "");
      if (!raw) return null;
      const epoch = Date.parse(raw);
      return Number.isNaN(epoch) ? null : epoch;
    }

    function earliestKickoffEpochFromRows(rows) {
      if (!Array.isArray(rows)) return null;
      let minEpoch = null;
      for (const row of rows) {
        const kickoffRaw = row && row.kickoff_datetime ? String(row.kickoff_datetime) : "";
        const kickoffEpoch = kickoffRaw ? Date.parse(kickoffRaw) : NaN;
        if (!Number.isNaN(kickoffEpoch)) {
          minEpoch = minEpoch == null ? kickoffEpoch : Math.min(minEpoch, kickoffEpoch);
          continue;
        }
        const fixtureRaw = row && row.fixture_date ? String(row.fixture_date) : "";
        const fixtureEpoch = fixtureRaw ? Date.parse(fixtureRaw) : NaN;
        if (!Number.isNaN(fixtureEpoch)) {
          minEpoch = minEpoch == null ? fixtureEpoch : Math.min(minEpoch, fixtureEpoch);
        }
      }
      return minEpoch;
    }

    function competitionLabel(code, sourceMart) {
      const mu = globalThis.MATCHDAYIQ_MANIFEST;
      if (mu && typeof mu.competitionDisplayName === "function") {
        return mu.competitionDisplayName(code, sourceMart, tt, "landing");
      }
      return tt("competitions." + code, code);
    }

    function renderDomesticCard(entry) {
      const code = entry.league_code;
      const phase = phaseFor(entry);
      const sourceMart = phase === "matchday" ? entry.matchday_source_mart : null;
      const name = competitionLabel(code, sourceMart);
      let stateText = "";
      let ctaText = "";
      let href = null;
      let disabled = false;

      if (phase === "matchday") {
        stateText = tt("landing.state.matchdayUpcoming", "Next matchday");
        ctaText = tt("landing.cta.matchday", "Preview matchday");
        href = `./fixture-list/?league=${code.toLowerCase()}`;
      } else if (phase === "season_recap") {
        stateText = tt("landing.state.seasonEnded", "Season ended");
        ctaText = tt("landing.cta.recap", "View season recap");
        href = `./team-season/?league=${code.toLowerCase()}`;
      } else {
        stateText = tt("landing.state.comingSoon", "Coming soon");
        ctaText = tt("landing.cta.unavailable", "Coming soon");
        disabled = true;
      }

      const cardCls = disabled ? "card is-disabled" : "card";
      const tag = disabled ? "div" : "a";
      const hrefAttr = disabled ? "" : ` href="${escHtml(href)}"`;

      return `
        <${tag} class="${cardCls}"${hrefAttr}>
          <div class="badge"><img src="${escHtml(logoUrl(code))}" alt="${escHtml(code)}"></div>
          <div class="body">
            <div class="comp-name">${escHtml(name)}</div>
            <div class="meta"><span class="round">${escHtml(stateText)}</span></div>
            <div class="kickoff">
              <span class="kickoff-when">${escHtml(ctaText)}</span>
            </div>
          </div>
          <div class="chevron">›</div>
        </${tag}>`;
    }

    function renderWcCard(manifest) {
      const mu = globalThis.MATCHDAYIQ_MANIFEST;
      const wc = mu && typeof mu.manifestWcEntry === "function"
        ? mu.manifestWcEntry(manifest)
        : null;
      if (!wc) return "";
      const name = competitionLabel("WC");
      const hasFixtures = (Number(wc.matchday_row_count) || 0) > 0;
      const subtitle = hasFixtures
        ? tt("landing.state.matchdayUpcoming", "Next matchday")
        : tt("landing.state.comingSoon", "Coming soon");
      const cta = hasFixtures
        ? tt("landing.cta.matchday", "Preview matchday")
        : tt("landing.cta.unavailable", "Coming soon");
      const tag = hasFixtures ? "a" : "div";
      const hrefAttr = hasFixtures ? ` href="./fixture-list/?league=wc"` : "";
      const cardCls = hasFixtures ? "card is-wc" : "card is-wc is-disabled";
      return `
        <${tag} class="${cardCls}"${hrefAttr}>
          <div class="badge"><img src="${escHtml(logoUrl("WC"))}" alt="WC"></div>
          <div class="body">
            <div class="comp-name">${escHtml(name)}</div>
            <div class="meta"><span class="round">${escHtml(subtitle)}</span></div>
            <div class="kickoff">
              <span class="kickoff-when">${escHtml(cta)}</span>
            </div>
          </div>
          <div class="chevron">›</div>
        </${tag}>`;
    }

    function sortedCompetitions(manifest) {
      const mu = globalThis.MATCHDAYIQ_MANIFEST;
      const domestic = Array.isArray(manifest && manifest.domestic_leagues)
        ? manifest.domestic_leagues.map((entry) => ({ kind: "domestic", entry }))
        : [];
      const wcEntry = mu && typeof mu.manifestWcEntry === "function"
        ? mu.manifestWcEntry(manifest)
        : null;
      const wc = wcEntry ? [{ kind: "wc", entry: wcEntry }] : [];
      const all = domestic.concat(wc);

      function sortBucket(item) {
        const phase = phaseFor(item.entry);
        if (phase === "season_recap") return 2;
        const kickoff = nextKickoffEpoch(item.entry);
        return kickoff == null ? 1 : 0;
      }

      return all.sort((a, b) => {
        const ba = sortBucket(a);
        const bb = sortBucket(b);
        if (ba !== bb) return ba - bb;

        if (ba === 0) {
          const ka = nextKickoffEpoch(a.entry) ?? Number.MAX_SAFE_INTEGER;
          const kb = nextKickoffEpoch(b.entry) ?? Number.MAX_SAFE_INTEGER;
          if (ka !== kb) return ka - kb;
        }

        const ca = String(a.entry.league_code || "");
        const cb = String(b.entry.league_code || "");
        return ca.localeCompare(cb);
      });
    }

    async function hydrateKickoffSortHints(manifest) {
      const mu = globalThis.MATCHDAYIQ_MANIFEST;
      const domestic = Array.isArray(manifest && manifest.domestic_leagues)
        ? manifest.domestic_leagues
        : [];
      const wcEntry = mu && typeof mu.manifestWcEntry === "function"
        ? mu.manifestWcEntry(manifest)
        : null;
      const allEntries = wcEntry ? domestic.concat([wcEntry]) : domestic;

      const tasks = allEntries.map(async (entry) => {
        if (phaseFor(entry) !== "matchday") return;
        if (nextKickoffEpoch(entry) != null) return;
        const path = String(entry.matchday_path || "");
        if (!path) return;
        try {
          const res = await fetch(`./${path}`);
          if (!res.ok) return;
          const payload = await res.json();
          const epoch = earliestKickoffEpochFromRows(payload && payload.show);
          if (epoch != null) entry._resolved_next_kickoff_epoch = epoch;
        } catch (_) {
          // Keep rendering resilient; fallback sorting still works.
        }
      });
      await Promise.all(tasks);
    }

    function render(manifest) {
      const root = document.getElementById("cards");
      const sorted = sortedCompetitions(manifest);
      const parts = sorted.map((item) =>
        item.kind === "wc" ? renderWcCard(manifest) : renderDomesticCard(item.entry)
      );
      if (!parts.length) {
        root.classList.remove("is-loading");
        root.innerHTML = `<div class="empty-state">${escHtml(tt("landing.state.comingSoon", "Coming soon"))}</div>`;
        return;
      }
      root.classList.remove("is-loading");
      root.innerHTML = parts.join("");
    }

    function start() {
      const i18nReady = window.MATCHDAYIQ_I18N_READY || Promise.resolve({});
      const manifestReady = fetch("./pages_export_manifest.json")
        .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .catch(() => null);

      Promise.all([i18nReady, manifestReady]).then(async ([_, manifest]) => {
        if (!manifest) {
          // No manifest available (local preview without build, or 404).
          // Fall back to a static BL1 recap card so the page is never empty.
          render({
            domestic_leagues: [
              {
                league_code: "BL1",
                matchday_row_count: 0,
                team_season_row_count: 1,
                next_fixture_kickoff_utc: null,
              },
            ],
            wc: {
              league_code: "WC",
              matchday_row_count: 0,
              next_fixture_kickoff_utc: null,
            },
          });
          return;
        }
        await hydrateKickoffSortHints(manifest);
        render(manifest);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }
  })();
</script>

</body>
</html>
