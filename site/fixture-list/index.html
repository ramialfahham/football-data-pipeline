<!DOCTYPE html>
<!--
  Matchday IQ — Fixture-list page (v0 static mockup)
  ==================================================
  Approved visual reference for the fixture-list page
  ("Deliverable B" per docs/pipeline_architecture_plan.md).
  Inherits dark gradient + Inter + blue accent + logo treatment from
  site/landing/index.html (PR #60).

  Design principle (CPO decision):
  This view is for NAVIGATION — "which match should I focus on". It
  intentionally shows NO team stats. The user sees teams + kickoff,
  taps through to the fixture-detail page where the form metrics
  (standing, PPG, etc., per PR #68 form-source rules) actually live.

  Keeping the list view stat-free has two benefits: (1) faster to scan,
  more matches visible per screen height; (2) no truncation problems
  for long team names ("Borussia Mönchengladbach") competing with a
  stats column.
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday IQ — Bundesliga</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../i18n.js" defer></script>
<script src="../manifest-utils.js" defer></script>
<style>
  :root {
    --bg: #07091a;
    --bg-elev: #11152e;
    --card-bg: #161b38;
    --card-bg-hover: #1c2349;
    --border: rgba(255,255,255,0.07);
    --text: #f1f3fb;
    --text-secondary: #98a3c9;
    --text-tertiary: #5c6792;
    --accent: #6ea8fe;
    --accent-bright: #93c5fd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #1a2055 0%, var(--bg) 65%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 16px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 720px; margin: 0 auto; }

  /* Top bar: persistent brand left + language switcher right.
     Brand is visible on every subpage as identity anchor (tap → landing).
     Back navigation lives on its own row below (.backbar) — mirrors the
     pattern shipped on site/match-preview/ in PR #78. */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }
  .brand {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #93c5fd 0%, #c7d2fe 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-decoration: none;
    line-height: 1;
  }

  /* Back navigation row, sits below the topbar */
  .backbar { padding: 0 0 14px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    background: transparent;
    border: 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: none;
  }
  .back:hover { color: var(--text); }
  .back .arrow { font-size: 16px; }

  .lang { position: relative; font-family: inherit; }
  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
    font-family: inherit;
  }
  .lang-btn:hover { background: var(--card-bg-hover); border-color: rgba(110, 168, 254, 0.35); }
  .lang-btn .globe { font-size: 14px; opacity: 0.8; }
  .lang-btn .caret { font-size: 10px; opacity: 0.5; }

  /* Competition context (subheader).
     Top padding kept tight because .backbar already provides 14px above. */
  .context {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 0 28px;
  }
  .context .logo {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .context .logo img { width: 76%; height: 76%; object-fit: contain; }
  .context h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .context .round {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .context .round-meta {
    color: var(--text-tertiary);
    font-size: 12px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* Day section header */
  .day-header {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    letter-spacing: 0.1em;
    margin: 24px 0 12px;
  }

  /* Time subgroup label */
  .time-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-bright);
    margin: 14px 0 8px;
    font-variant-numeric: tabular-nums;
  }

  /* Fixture rows */
  .fixtures { display: flex; flex-direction: column; gap: 8px; }

  .fixture {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    text-decoration: none;
    color: inherit;
  }
  .fixture:hover {
    background: var(--card-bg-hover);
    border-color: rgba(110, 168, 254, 0.3);
    transform: translateY(-1px);
  }
  .fixture:active { transform: translateY(0); }

  .teams { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .team-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    align-items: center;
    gap: 10px;
  }

  .team-logo {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .team-logo img { width: 78%; height: 78%; object-fit: contain; }

  .team-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .chevron {
    color: var(--text-tertiary);
    font-size: 18px;
    flex-shrink: 0;
  }
  .fixture:hover .chevron { color: var(--accent-bright); }

  /* Off-season empty state: no upcoming fixtures.
     Shown until the next season's calendar is published and ingested. */
  .empty {
    margin-top: 8px;
    padding: 32px 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
  }
  .empty .headline {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .empty .sub {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .empty .cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--accent-bright);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.12s, border-color 0.12s;
  }
  .empty .cta:hover {
    background: var(--card-bg-hover);
    border-color: rgba(110, 168, 254, 0.35);
  }

  /* Footer */
  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 11px;
  }
  footer a { color: var(--text-secondary); text-decoration: none; }

  @media (min-width: 640px) {
    body { padding: 32px 24px 80px; }
    .context h1 { font-size: 26px; }
    .context .logo { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="topbar">
    <a href="../" class="brand" data-i18n="common.brand">Matchday IQ</a>
    <div class="lang">
      <button class="lang-btn" type="button">
        <span class="globe">🌐</span>
        <span class="code">DE</span>
        <span class="caret">▾</span>
      </button>
    </div>
  </header>
  <nav class="backbar">
    <a href="../" class="back"><span class="arrow">←</span><span data-i18n="fixtureList.back">Wettbewerbe</span></a>
  </nav>

  <section class="context" id="comp-context">
    <div class="logo"><img id="comp-logo" src="https://media.api-sports.io/football/leagues/78.png" alt="BL"></div>
    <div>
      <h1 id="comp-title">Bundesliga</h1>
      <div class="round" id="comp-round">…</div>
      <div class="round-meta" id="comp-round-meta"></div>
    </div>
  </section>

  <!-- Dynamic content slot. JS replaces this with either:
       (a) day/time-grouped fixture rows when matchday data exists, or
       (b) an off-season empty state when none.
       The static HTML below is a no-JS fallback (the empty state). -->
  <div id="fixtures-root">
    <section class="empty">
      <div class="headline" data-i18n="fixtureList.empty.headline">Keine kommenden Spiele</div>
      <div class="sub" data-i18n="fixtureList.empty.subOffSeason">Die Saison ist beendet. Bis zur neuen Saison gibt es hier keine Spielvorschau.</div>
      <a href="../team-season/" class="cta"><span data-i18n="fixtureList.empty.cta">Saisonrückblick ansehen</span> <span>›</span></a>
    </section>
  </div>

  <footer>
    <a href="#" data-i18n="common.feedback">Feedback</a>
  </footer>

</div>

<script>
  /*
   * Fixture-list renderer
   * =====================
   * Reads ?league=<code> from the URL, fetches /data/<code>/matchday_insights.json,
   * and renders day/time-grouped fixture rows. Falls back to an off-season
   * empty state when there's no data (or no ?league= param at all).
   *
   * Competition name + logo come from the URL param + a small ID lookup
   * (mirrors docs/competition_registry.yml). When the new fixture-list is
   * deep-linked without ?league=, we keep showing the legacy BL1 off-season
   * state — that path is still bookmarked by users from the previous deploy.
   */
  (function () {
    const LEAGUE_LOGO_IDS = {
      bl1: 78, bl2: 79, pl: 39, pd: 140, sa: 135, l1: 61, vl: 244, wc: 1,
    };
    const KICKOFF_TZ = "Europe/Berlin";

    function tt(key, fallback, vars) {
      if (vars && typeof window.tFmt === "function") return window.tFmt(key, vars, fallback);
      if (typeof window.t === "function") return window.t(key, fallback);
      return fallback;
    }

    function escHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function leagueParam() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get("league") || "").trim().toLowerCase();
      return /^[a-z0-9]+$/.test(raw) ? raw : "";
    }

    function competitionName(code, sourceMart) {
      const upper = code.toUpperCase();
      const mu = globalThis.MATCHDAYIQ_MANIFEST;
      if (mu && typeof mu.competitionDisplayName === "function") {
        return mu.competitionDisplayName(upper, sourceMart, tt, "fixtureList");
      }
      return tt("competitions." + upper, upper);
    }

    function logoUrl(code) {
      const id = LEAGUE_LOGO_IDS[code];
      return id ? `https://media.api-sports.io/football/leagues/${id}.png` : "";
    }

    /** "Sa 17.05." style short date in the active locale. */
    function shortDate(iso) {
      const locale = window.MATCHDAYIQ_LOCALE || "de-DE";
      try {
        return new Intl.DateTimeFormat(locale, {
          timeZone: KICKOFF_TZ,
          weekday: "short",
          day: "2-digit",
          month: "2-digit",
        }).format(new Date(iso));
      } catch (e) { return ""; }
    }

    /** Long-format day header: "Samstag, 17. Mai" / "Saturday, 17 May". */
    function dayHeader(iso) {
      const locale = window.MATCHDAYIQ_LOCALE || "de-DE";
      try {
        return new Intl.DateTimeFormat(locale, {
          timeZone: KICKOFF_TZ,
          weekday: "long",
          day: "2-digit",
          month: "long",
        }).format(new Date(iso));
      } catch (e) { return ""; }
    }

    /** "15:30" time label. */
    function timeLabel(iso) {
      const locale = window.MATCHDAYIQ_LOCALE || "de-DE";
      try {
        return new Intl.DateTimeFormat(locale, {
          timeZone: KICKOFF_TZ,
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(iso));
      } catch (e) { return ""; }
    }

    /** "YYYY-MM-DD" key for grouping (timezone-aware). */
    function dayKey(iso) {
      try {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: KICKOFF_TZ,
          year: "numeric", month: "2-digit", day: "2-digit",
        }).formatToParts(new Date(iso));
        const get = (t) => (parts.find((p) => p.type === t) || {}).value || "";
        return `${get("year")}-${get("month")}-${get("day")}`;
      } catch (e) { return ""; }
    }

    function teamLogoFromRow(row, side) {
      // Mart exposes home_team_logo_url / away_team_logo_url where available.
      const key = side + "_team_logo_url";
      const url = row && row[key] ? String(row[key]).trim() : "";
      return url;
    }

    function renderFixtureRow(row, code) {
      const fixtureId = row.fixture_api_id || row.fixture_sk || "";
      const href = `../match-preview/?league=${escHtml(code)}` + (fixtureId ? `&fixture=${encodeURIComponent(fixtureId)}` : "");
      const homeName = String(row.home_team_name || "").trim();
      const awayName = String(row.away_team_name || "").trim();
      const homeLogo = teamLogoFromRow(row, "home");
      const awayLogo = teamLogoFromRow(row, "away");
      const homeLogoTag = homeLogo
        ? `<img src="${escHtml(homeLogo)}" alt="${escHtml(homeName)}">`
        : `<div style="width:78%;height:78%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bg);">${escHtml(homeName.slice(0, 3).toUpperCase())}</div>`;
      const awayLogoTag = awayLogo
        ? `<img src="${escHtml(awayLogo)}" alt="${escHtml(awayName)}">`
        : `<div style="width:78%;height:78%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bg);">${escHtml(awayName.slice(0, 3).toUpperCase())}</div>`;
      return `
        <a href="${href}" class="fixture">
          <div class="teams">
            <div class="team-row">
              <div class="team-logo">${homeLogoTag}</div>
              <div class="team-name">${escHtml(homeName)}</div>
            </div>
            <div class="team-row">
              <div class="team-logo">${awayLogoTag}</div>
              <div class="team-name">${escHtml(awayName)}</div>
            </div>
          </div>
          <div class="chevron">›</div>
        </a>`;
    }

    function renderFixtures(rows, code) {
      // Sort by kickoff datetime asc, then fixture_sk for stable tie-break.
      const sorted = [...rows].sort((a, b) => {
        const ta = new Date(a.kickoff_datetime).getTime();
        const tb = new Date(b.kickoff_datetime).getTime();
        if (ta !== tb) return ta - tb;
        return Number(a.fixture_sk || 0) - Number(b.fixture_sk || 0);
      });

      // Group by day, then by time.
      const days = new Map();
      sorted.forEach((row) => {
        const key = dayKey(row.kickoff_datetime);
        if (!days.has(key)) days.set(key, []);
        days.get(key).push(row);
      });

      let html = "";
      for (const [, dayRows] of days) {
        const first = dayRows[0];
        html += `<div class="day-header">${escHtml(dayHeader(first.kickoff_datetime))}</div>`;
        const times = new Map();
        dayRows.forEach((r) => {
          const t = timeLabel(r.kickoff_datetime);
          if (!times.has(t)) times.set(t, []);
          times.get(t).push(r);
        });
        for (const [time, timeRows] of times) {
          html += `<div class="time-label">${escHtml(time)}</div>`;
          html += `<div class="fixtures">${timeRows.map((r) => renderFixtureRow(r, code)).join("")}</div>`;
        }
      }
      document.getElementById("fixtures-root").innerHTML = html;
    }

    function renderEmpty(code) {
      // Show off-season empty state with a CTA into the league's team-season recap.
      const root = document.getElementById("fixtures-root");
      const ctaHref = code ? `../team-season/?league=${escHtml(code)}` : "../team-season/";
      root.innerHTML = `
        <section class="empty">
          <div class="headline">${escHtml(tt("fixtureList.empty.headline", "Keine kommenden Spiele"))}</div>
          <div class="sub">${escHtml(tt("fixtureList.empty.subOffSeason", "Die Saison ist beendet. Bis zur neuen Saison gibt es hier keine Spielvorschau."))}</div>
          <a href="${ctaHref}" class="cta"><span>${escHtml(tt("fixtureList.empty.cta", "Saisonrückblick ansehen"))}</span> <span>›</span></a>
        </section>`;
    }

    function updateContextHeader(code, rows, sourceMart) {
      const logoEl = document.getElementById("comp-logo");
      const titleEl = document.getElementById("comp-title");
      const roundEl = document.getElementById("comp-round");
      const metaEl = document.getElementById("comp-round-meta");

      const compName = competitionName(code, sourceMart);
      titleEl.textContent = compName;
      logoEl.src = logoUrl(code);
      logoEl.alt = code.toUpperCase();

      if (!rows || !rows.length) {
        // Off-season state for this league.
        roundEl.textContent = tt("fixtureList.context.roundOffSeason", "Saisonpause");
        metaEl.textContent = "";
        return;
      }

      // Round name comes from the first row (all rows in upcoming round share it).
      const first = rows[0];
      const roundName = String(first.round_name || "").trim();
      roundEl.textContent = roundName || "—";

      // Date range / count subtext.
      const dates = rows.map((r) => dayKey(r.kickoff_datetime)).filter(Boolean);
      const unique = [...new Set(dates)].sort();
      const fmtShort = (k) => shortDate(rows.find((r) => dayKey(r.kickoff_datetime) === k).kickoff_datetime);
      const dateText = unique.length > 1
        ? tt("fixtureList.context.roundDateRange", `${fmtShort(unique[0])} – ${fmtShort(unique[unique.length - 1])}`,
              { startDate: fmtShort(unique[0]), endDate: fmtShort(unique[unique.length - 1]) })
        : tt("fixtureList.context.roundSingleDate", fmtShort(unique[0] || ""), { date: fmtShort(unique[0] || "") });
      const countKey = rows.length === 1 ? "fixtureList.context.fixtureCountSingular" : "fixtureList.context.fixtureCountPlural";
      const countFallback = rows.length === 1 ? `${rows.length} match` : `${rows.length} matches`;
      const countText = tt(countKey, countFallback, { count: rows.length });
      metaEl.textContent = `${countText} · ${dateText}`;
    }

    function start() {
      const code = leagueParam();
      const i18nReady = window.MATCHDAYIQ_I18N_READY || Promise.resolve({});

      if (!code) {
        // No league specified — keep the static BL1 off-season state.
        // Translation of the static markup happens via data-i18n; no-op here.
        return;
      }

      const manifestReady = fetch("../pages_export_manifest.json")
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);

      const dataReady = fetch(`../data/${code}/matchday_insights.json`)
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .catch(() => null);

      Promise.all([i18nReady, manifestReady, dataReady]).then(([_, manifest, payload]) => {
        const rows = (payload && Array.isArray(payload.show)) ? payload.show : [];
        const mu = globalThis.MATCHDAYIQ_MANIFEST;
        const entry = mu && typeof mu.manifestEntryForLeague === "function"
          ? mu.manifestEntryForLeague(manifest, code)
          : null;
        const sourceMart = entry && entry.matchday_source_mart ? entry.matchday_source_mart : null;
        updateContextHeader(code, rows, sourceMart);
        if (!rows.length) {
          renderEmpty(code);
        } else {
          renderFixtures(rows, code);
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }
  })();
</script>

</body>
</html>
