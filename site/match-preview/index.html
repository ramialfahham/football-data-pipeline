<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Day Intelligence · Bundesliga</title>
  <style>
    :root {
      --bg: #070c1a;
      --panel: #101a34;
      --panel-soft: #162349;
      --line: #2a3c74;
      --text: #ecf1ff;
      --muted: #a8b5df;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    .app { max-width: 720px; margin: 0 auto; padding: 16px 12px 28px; }
    .start {
      background: linear-gradient(140deg, #243b8f, #6a2fbe);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .sub { margin: 6px 0 0; font-size: 0.9rem; color: #e8eeff; }
    .meta { margin-top: 8px; color: #dbe3ff; font-size: 0.8rem; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    button, .btn {
      border: 1px solid #8898d8;
      background: #1d2f67;
      color: white;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .nav-hint { font-size: 0.75rem; color: var(--muted); flex: 1; min-width: 140px; }
    .carousel-wrap { position: relative; margin-top: 12px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .carousel::-webkit-scrollbar { height: 6px; }
    .carousel::-webkit-scrollbar-thumb { background: #3d5294; border-radius: 4px; }
    .card {
      min-width: 100%;
      flex: 0 0 100%;
      scroll-snap-align: start;
      background: var(--panel);
      padding: 14px;
    }
    .fixture { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; line-height: 1.25; }
    .kickoff { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
    .ranks { color: #c8d4f8; font-size: 0.8rem; margin-bottom: 10px; line-height: 1.35; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel-soft);
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.82rem;
    }
    th, td { padding: 8px 6px; border-bottom: 1px solid #22325f; vertical-align: middle; }
    th { color: #cad5ff; font-weight: 700; font-size: 0.72rem; text-align: center; }
    th:first-child, td:first-child { text-align: left; padding-left: 10px; width: 42%; }
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3) { text-align: center; width: 29%; }
    tr:last-child td { border-bottom: none; }
    .metric-name { color: #dce4ff; vertical-align: top; }
    .metric-title { font-weight: 600; }
    .metric-desc {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 4px;
      font-weight: 400;
    }
    .num { font-variant-numeric: tabular-nums; }
    .foot { color: var(--muted); font-size: 0.75rem; margin-top: 14px; line-height: 1.4; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 7, 20, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      width: min(520px, 96vw);
      background: #0f1a37;
      border: 1px solid #334b88;
      border-radius: 12px;
      padding: 14px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 1.1rem; }
    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 6px; font-size: 0.82rem; color: #d8e2ff; }
    .field textarea, .field select {
      width: 100%;
      border: 1px solid #4d65a7;
      border-radius: 8px;
      background: #111f44;
      color: #f1f5ff;
      padding: 8px;
      font-size: 0.85rem;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #174e30;
      color: #dbffe9;
      border: 1px solid #2a8152;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
      display: none;
      z-index: 1100;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="start">
      <h1>Match Day Intelligence</h1>
      <p class="sub">Bundesliga · Form aus den letzten fünf abgeschlossenen Spieltagen (alle Spiele dieser Tage) vor dem anstehenden Spieltag.</p>
      <div class="meta" id="stamp"></div>
      <div class="controls">
        <span class="nav-hint">Wischen oder Tippen: nächstes / vorheriges Spiel</span>
        <button type="button" id="prev-btn" aria-label="Vorheriges Spiel">&larr;</button>
        <button type="button" id="next-btn" aria-label="Nächstes Spiel">&rarr;</button>
        <button class="btn" id="feedback-open-btn" type="button">Feedback</button>
      </div>
    </section>
    <div class="carousel-wrap">
      <div class="carousel" id="carousel" role="region" aria-label="Spiele"></div>
    </div>
    <p class="foot" id="foot-note"></p>
  </div>
  <div class="modal-backdrop" id="feedback-modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
      <h2 id="feedback-modal-title">Kurzes Feedback</h2>
      <div class="field">
        <label id="feedback-q1-label" for="feedback-ease">Wie einfach war die Nutzung? (1–5)</label>
        <select id="feedback-ease">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q2-label" for="feedback-clarity">Wie verständlich waren die Kennzahlen? (1–5)</label>
        <select id="feedback-clarity">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q3-label" for="feedback-comment">Was sollen wir zuerst verbessern?</label>
        <textarea id="feedback-comment" rows="4" maxlength="500"></textarea>
      </div>
      <div class="modal-actions">
        <button id="feedback-cancel-btn" type="button">Abbrechen</button>
        <button id="feedback-submit-btn" type="button">Senden</button>
      </div>
    </div>
  </div>
  <div class="toast" id="feedback-toast"></div>
  <script>
    const FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/REPLACE_WITH_DEPLOYMENT_ID/exec";
    const FEEDBACK_TOKEN = "";
    const TZ = "Europe/Berlin";

    function isFeedbackEndpointConfigured() {
      const u = String(FEEDBACK_ENDPOINT || "").trim();
      if (!u || /REPLACE_WITH|PLACEHOLDER|__YOUR_/i.test(u)) return false;
      const okHost =
        /^https:\/\/script\.google\.com\//i.test(u)
        || /^https:\/\/script\.googleusercontent\.com\//i.test(u);
      const okPath = /\/(exec|dev)(\?|#|$|\/)/i.test(u);
      return okHost && okPath;
    }

    const COPY = {
      foot: "Formfenster: die fünf zuletzt abgeschlossenen Spieltage vor diesem Spieltag (nach Rundennummer); Kennzahlen sind Summen über alle Spiele im Fenster geteilt durch die jeweilige Spielanzahl. Punkteausbeute = erzielte Punkte von maximal 3 × Spiele im Fenster.",
      dataAsOf: "Datenstand",
      feedbackThanks: "Danke! Feedback wurde gesendet.",
      feedbackError: "Feedback konnte nicht gesendet werden.",
      feedbackNotConfigured:
        "Kein Feedback-Endpunkt in dieser Seite: Trage die Web-App-URL (…/exec) in site/match-preview/index.html ein ODER setze das GitHub-Actions-Geheimnis FEEDBACK_APPS_SCRIPT_URL und lasse „Deploy match preview“ neu laufen.",
    };

    function nz(x) {
      const n = Number(x);
      return Number.isFinite(n) ? n : 0;
    }

    function fmtDe(x, decimals) {
      if (x === null || x === undefined) return "0" + (decimals > 0 ? "," + "0".repeat(decimals) : "");
      const n = Number(x);
      if (!Number.isFinite(n)) return "0" + (decimals > 0 ? "," + "0".repeat(decimals) : "");
      return n.toFixed(decimals).replace(".", ",");
    }

    function fmtDePct(x) {
      return `${fmtDe(nz(x) * 100, 0)}%`;
    }

    function berlinKickoff(iso) {
      return new Intl.DateTimeFormat("de-DE", {
        timeZone: TZ,
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(iso));
    }

    function pointsDisplay(r, side) {
      const pts = side === "home" ? nz(r.home_points_won_sum_form) : nz(r.away_points_won_sum_form);
      const games = side === "home" ? nz(r.home_form_games_played) : nz(r.away_form_games_played);
      const maxPts = 3 * games;
      if (games === 0) return "—";
      return `${pts}/${maxPts}`;
    }

    function rankLabel(v) {
      if (v === null || v === undefined || v === "") return "—";
      const n = Number(v);
      return Number.isFinite(n) ? String(n) : "—";
    }

    /** Optional: metric_glossary.json → map metric_key → { label, description } */
    function glossaryMap(glossaryPayload) {
      const m = Object.create(null);
      const list = (glossaryPayload && glossaryPayload.metrics) || [];
      list.forEach((e) => {
        if (e && e.metric_key) m[e.metric_key] = { label: e.label || "", description: e.description || "" };
      });
      return m;
    }

    function glLabel(g, homeKey, awayKey, fallback) {
      const a = g[homeKey];
      const b = g[awayKey];
      if (a && b && a.label && a.label === b.label) {
        return a.label.replace(/^Home /i, "").replace(/^Away /i, "");
      }
      return fallback;
    }

    function glExplain(g, homeKey, awayKey) {
      const G = g || {};
      const a = G[homeKey];
      const b = G[awayKey];
      const d = (a && a.description) || (b && b.description) || "";
      return String(d).trim();
    }

    function escHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function metricTableRows(r, g) {
      const G = g || {};
      const row = (homeKey, awayKey, fallbackLabel, homeVal, awayVal) => ({
        label: glLabel(G, homeKey, awayKey, fallbackLabel),
        explain: glExplain(G, homeKey, awayKey),
        home: homeVal,
        away: awayVal,
      });
      return [
        row("home_points_won_sum_form", "away_points_won_sum_form", "Punkte (im Fenster)", pointsDisplay(r, "home"), pointsDisplay(r, "away")),
        row("home_goals_per_match_recent", "away_goals_per_match_recent", "Tore pro Spiel", fmtDe(r.home_goals_per_match_recent, 1), fmtDe(r.away_goals_per_match_recent, 1)),
        row("home_goals_against_per_match_recent", "away_goals_against_per_match_recent", "Gegentore pro Spiel", fmtDe(r.home_goals_against_per_match_recent, 1), fmtDe(r.away_goals_against_per_match_recent, 1)),
        row("home_danger_zone_ratio_recent", "away_danger_zone_ratio_recent", "Gefahrenzonen-Anteil", fmtDePct(r.home_danger_zone_ratio_recent), fmtDePct(r.away_danger_zone_ratio_recent)),
        row("home_shot_accuracy_recent", "away_shot_accuracy_recent", "Schussgenauigkeit", fmtDePct(r.home_shot_accuracy_recent), fmtDePct(r.away_shot_accuracy_recent)),
        row("home_finishing_efficiency_recent", "away_finishing_efficiency_recent", "Abschlusseffizienz", fmtDePct(r.home_finishing_efficiency_recent), fmtDePct(r.away_finishing_efficiency_recent)),
        row("home_pass_accuracy_recent", "away_pass_accuracy_recent", "Passgenauigkeit", fmtDePct(r.home_pass_accuracy_recent), fmtDePct(r.away_pass_accuracy_recent)),
        row("home_offensive_efficiency_recent", "away_offensive_efficiency_recent", "Offensive Effizienz", fmtDe(r.home_offensive_efficiency_recent, 1), fmtDe(r.away_offensive_efficiency_recent, 1)),
        row("home_save_ratio_recent", "away_save_ratio_recent", "Paradenquote", fmtDePct(r.home_save_ratio_recent), fmtDePct(r.away_save_ratio_recent)),
      ];
    }

    function renderTable(rows) {
      const head = `<tr><th>Heim</th><th>Kennzahl</th><th>Gast</th></tr>`;
      const body = rows.map((m) => {
        const sub = m.explain
          ? `<div class="metric-desc">${escHtml(m.explain)}</div>`
          : "";
        return `
        <tr>
          <td class="num">${m.home}</td>
          <td class="metric-name"><div class="metric-title">${escHtml(m.label)}</div>${sub}</td>
          <td class="num">${m.away}</td>
        </tr>`;
      }).join("");
      return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    let activeFixtureId = null;

    function setFeedbackCopy() {
      document.getElementById("feedback-open-btn").textContent = "Feedback";
      document.getElementById("feedback-modal-title").textContent = "Kurzes Feedback";
      document.getElementById("feedback-q1-label").textContent = "Wie einfach war die Nutzung? (1–5)";
      document.getElementById("feedback-q2-label").textContent = "Wie verständlich waren die Kennzahlen? (1–5)";
      document.getElementById("feedback-q3-label").textContent = "Was sollen wir zuerst verbessern?";
      document.getElementById("feedback-cancel-btn").textContent = "Abbrechen";
      document.getElementById("feedback-submit-btn").textContent = "Senden";
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("feedback-toast");
      toast.textContent = message;
      toast.style.display = "block";
      toast.style.background = isError ? "#5b1f2a" : "#174e30";
      toast.style.borderColor = isError ? "#8e3244" : "#2a8152";
      const ms = isError && String(message).length > 120 ? 12000 : 3500;
      setTimeout(() => { toast.style.display = "none"; }, ms);
    }

    function openFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "flex";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "false");
    }

    function closeFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "none";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "true");
    }

    async function submitFeedback() {
      if (!isFeedbackEndpointConfigured()) {
        showToast(COPY.feedbackNotConfigured, true);
        return;
      }
      const ease = Number(document.getElementById("feedback-ease").value);
      const clarity = Number(document.getElementById("feedback-clarity").value);
      const comment = String(document.getElementById("feedback-comment").value || "").trim().slice(0, 500);
      const payload = {
        ease_score: ease,
        clarity_score: clarity,
        improvement_text: comment,
        language: "de",
        fixture_id: activeFixtureId,
        app_version: "pages-match-preview",
        submitted_at: new Date().toISOString(),
        feedback_token: FEEDBACK_TOKEN,
      };
      try {
        const resp = await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) {
          showToast(`${COPY.feedbackError} (HTTP ${resp.status})`, true);
          return;
        }
        closeFeedbackModal();
        document.getElementById("feedback-comment").value = "";
        showToast(COPY.feedbackThanks);
      } catch (err) {
        const hint = err && String(err.message || err).includes("fetch")
          ? " Netzwerk/CORS prüfen; Web-App auf „Jeder“?"
          : "";
        showToast(`${COPY.feedbackError}${hint}`, true);
      }
    }

    function render(rows, g) {
      document.getElementById("foot-note").textContent = COPY.foot;
      document.getElementById("stamp").textContent = `${COPY.dataAsOf}: ${new Date().toLocaleString("de-DE")}`;
      setFeedbackCopy();

      const sorted = [...rows].sort((a, b) => {
        const ta = new Date(a.kickoff_datetime).getTime();
        const tb = new Date(b.kickoff_datetime).getTime();
        if (ta !== tb) return ta - tb;
        return nz(a.fixture_sk) - nz(b.fixture_sk);
      });

      const carousel = document.getElementById("carousel");
      carousel.innerHTML = "";

      sorted.forEach((row) => {
        if (activeFixtureId === null) activeFixtureId = row.fixture_api_id;
        const article = document.createElement("article");
        article.className = "card";
        article.dataset.fixtureId = row.fixture_api_id;
        const mdCount = nz(row.upcoming_matchday_fixture_count);
        const mdNote = mdCount > 0 ? ` · ${mdCount} Partien an diesem Spieltag` : "";
        article.innerHTML = `
          <div class="fixture">${row.home_team_name} vs ${row.away_team_name}</div>
          <div class="ranks">Tabellenplatz: ${rankLabel(row.home_league_rank)} (Heim) · ${rankLabel(row.away_league_rank)} (Gast)</div>
          <div class="kickoff">${row.league_name} · ${row.round_name} · ${berlinKickoff(row.kickoff_datetime)} (${TZ})${mdNote}</div>
          ${renderTable(metricTableRows(row, g))}
        `;
        carousel.appendChild(article);
      });

      carousel.addEventListener("scroll", () => {
        const w = carousel.clientWidth;
        const i = Math.round(carousel.scrollLeft / w);
        const cards = carousel.querySelectorAll(".card");
        const el = cards[i];
        if (el && el.dataset.fixtureId) activeFixtureId = Number(el.dataset.fixtureId);
      }, { passive: true });
    }

    function scrollByCard(dir) {
      const el = document.getElementById("carousel");
      el.scrollBy({ left: dir * el.clientWidth, behavior: "smooth" });
    }

    document.getElementById("prev-btn").addEventListener("click", () => scrollByCard(-1));
    document.getElementById("next-btn").addEventListener("click", () => scrollByCard(1));
    document.getElementById("feedback-open-btn").addEventListener("click", openFeedbackModal);
    document.getElementById("feedback-cancel-btn").addEventListener("click", closeFeedbackModal);
    document.getElementById("feedback-submit-btn").addEventListener("click", submitFeedback);
    document.getElementById("feedback-modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "feedback-modal-backdrop") closeFeedbackModal();
    });

    Promise.all([
      fetch("./matchday_insights.json").then((r) => r.json()),
      fetch("./metric_glossary.json").then((r) => r.json()).catch(() => ({ metrics: [] })),
    ])
      .then(([payload, glossaryPayload]) => {
        render(payload.show || [], glossaryMap(glossaryPayload));
      })
      .catch((err) => {
        document.getElementById("carousel").innerHTML =
          `<article class="card">Daten konnten nicht geladen werden: ${err}</article>`;
      });
  </script>
</body>
</html>
