<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchday IQ · Bundesliga</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Aligned with site/landing/ + site/fixture-list/ */
      --bg: #07091a;
      --bg-elev: #11152e;
      --panel: #161b38;
      --panel-soft: #1c2349;
      --line: rgba(255, 255, 255, 0.07);
      --line-strong: rgba(255, 255, 255, 0.12);
      --text: #f1f3fb;
      --muted: #98a3c9;
      --text-tertiary: #5c6792;
      --accent: #6ea8fe;
      --accent-bright: #93c5fd;
      /* Performance semantic: green = better-of-pair on a metric.
         Reserved for value comparison only — never for navigation/system. */
      --positive: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #1a2055 0%, var(--bg) 65%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px 12px 28px; }

    /* Top bar: persistent brand left + language switcher right.
       Brand is visible on every subpage as identity anchor (tap → landing).
       Back navigation lives on its own row below (.backbar). */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 4px;
    }
    .brand {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #93c5fd 0%, #c7d2fe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      line-height: 1;
    }

    /* Back navigation row, sits below the topbar */
    .backbar {
      padding: 0 0 14px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      background: transparent;
      border: 0;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: none;
    }
    .back:hover { color: var(--text); }
    .back .arrow { font-size: 1rem; }

    .lang { position: relative; font-family: inherit; }
    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .lang-btn:hover { background: var(--panel-soft); }
    .lang-btn .globe { font-size: 0.85rem; opacity: 0.8; }
    .lang-btn .caret { font-size: 0.65rem; opacity: 0.55; }

    /* Off-screen nav buttons — preserved for swipe-handler keyboard
       fallback + feedback-modal trigger; not user-visible.
       Replaced visually by .foot-link below. */
    .match-nav-hidden { position: absolute; left: -9999px; }

    /* Foot link (subtle text affordance, e.g. Feedback) */
    .foot-actions { margin-top: 12px; text-align: center; }
    .foot-link {
      color: var(--accent-bright);
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 500;
    }
    .foot-link:hover { color: var(--text); }

    /* Legacy classes retained for back-compat (hidden) */
    .start, .sub, .nav-hint, .competition-block { display: none; }

    h1 { margin: 0; font-size: 1.35rem; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 0.8rem; }
    .competition-block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .competition-line {
      color: var(--text);
      font-size: 0.96rem;
      line-height: 1.3;
      font-weight: 700;
    }
    .competition-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    button, .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    button:hover, .btn:hover { background: var(--panel-soft); border-color: var(--line-strong); }
    .nav-hint { font-size: 0.75rem; color: var(--muted); flex: 1; min-width: 140px; }
    .carousel-wrap { position: relative; margin-top: 12px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .carousel::-webkit-scrollbar { height: 6px; }
    .carousel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
    .card {
      min-width: 100%;
      flex: 0 0 100%;
      scroll-snap-align: start;
      background: var(--panel);
      padding: 14px;
    }
    /* Small uppercase page-type tag at the top of each fixture card.
       Mirrors the SAISONRÜCKBLICK tag on the team-season page so both
       views share the same header pattern: tag → identity → context. */
    .preview-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    /* Match header: centered home + vs + away with logos */
    .fixture {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      margin: 0 0 10px;
    }
    .fixture-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .team-logo-lg {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .team-logo-lg img {
      width: 76%;
      height: 76%;
      object-fit: contain;
    }
    .team-name-lg {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .fixture-vs {
      color: var(--text-tertiary);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    /* Legacy classes retained for backward compat */
    .fixture-home, .fixture-away { text-align: center; }
    /* Match context (competition + matchday + kickoff datetime).
       Sits below the teams as a single subtitle line — same role as
       .team-subtitle on the team-season page. */
    .kickoff {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      margin: 0 0 4px;
      line-height: 1.4;
    }
    .ranks { color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; line-height: 1.35; }

    /* Form context line, sits below the match header to set the window once */
    .form-context {
      color: var(--text-tertiary);
      font-size: 0.82rem;
      text-align: center;
      margin: -4px 0 16px;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    /* Metrics: flat list of rows. Grouping is encoded as alternating
       background tints (band-a / band-b). Group boundaries emerge from
       color changes between adjacent rows. No explicit group headers. */
    .metrics {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .metric {
      padding: 12px 14px;
    }
    .metric + .metric { border-top: 1px solid rgba(255, 255, 255, 0.04); }
    .metric-band-a { background: var(--panel); }
    .metric-band-b { background: var(--panel-soft); }
    /* Hide the row-divider between two same-band rows; keep the implied
       group-boundary divider visible where bands change. */
    .metric-band-a + .metric-band-a,
    .metric-band-b + .metric-band-b { border-top-color: rgba(255, 255, 255, 0.03); }
    .metric-band-a + .metric-band-b,
    .metric-band-b + .metric-band-a { border-top-color: var(--line-strong); }

    .metric-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }
    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: center;
    }
    .metric-value {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-align: center;
      line-height: 1.1;
      transition: color 0.15s ease;
    }
    .metric-value.is-winning { color: var(--positive); font-weight: 800; }
    .metric-title {
      font-weight: 700;
      font-size: 0.86rem;
      line-height: 1.25;
      white-space: nowrap;
    }
    .metric-desc {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 4px;
      font-weight: 400;
    }
    .metric-row-block-a td { background: var(--panel-soft); }
    .metric-row-block-b td { background: var(--panel); }
    .metric-row-block-a td { border-top-color: var(--line-strong); }
    .metric-row-block-b td { border-top-color: var(--line); }
    .num {
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
      line-height: 1.2;
      text-align: center !important;
    }
    .foot { color: var(--muted); font-size: 0.75rem; margin-top: 14px; line-height: 1.4; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 7, 20, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      width: min(520px, 96vw);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 1.1rem; font-weight: 700; }
    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 6px; font-size: 0.82rem; color: var(--muted); }
    .field textarea, .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-elev);
      color: var(--text);
      padding: 8px;
      font-size: 0.85rem;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #174e30;
      color: #dbffe9;
      border: 1px solid #2a8152;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
      display: none;
      z-index: 1100;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="../" class="brand">Matchday IQ</a>
      <div class="lang">
        <button class="lang-btn" type="button">
          <span class="globe">🌐</span>
          <span class="code">DE</span>
          <span class="caret">▾</span>
        </button>
      </div>
    </header>
    <nav class="backbar">
      <a href="../fixture-list/" class="back"><span class="arrow">←</span><span>Spieltag</span></a>
    </nav>
    <!-- Buttons retained off-screen for swipe-handler keyboard fallback and
         the feedback-modal trigger. Replaced visually by the foot-link below. -->
    <div class="match-nav-hidden">
      <button type="button" id="prev-btn" aria-label="Vorheriges Spiel"></button>
      <button type="button" id="next-btn" aria-label="Nächstes Spiel"></button>
      <button id="feedback-open-btn" type="button"></button>
    </div>
    <div class="carousel-wrap">
      <div class="carousel" id="carousel" role="region" aria-label="Spiele"></div>
    </div>
    <p class="foot" id="foot-note"></p>
    <p class="foot-actions">
      <a href="#" id="feedback-link" class="foot-link">Feedback geben</a>
    </p>
  </div>
  <div class="modal-backdrop" id="feedback-modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
      <h2 id="feedback-modal-title">Kurzes Feedback</h2>
      <div class="field">
        <label id="feedback-q1-label" for="feedback-ease">Wie einfach war die Nutzung? (1–5)</label>
        <select id="feedback-ease">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q2-label" for="feedback-clarity">Wie verständlich waren die Kennzahlen? (1–5)</label>
        <select id="feedback-clarity">
          <option value="5">5</option>
          <option value="4">4</option>
          <option value="3" selected>3</option>
          <option value="2">2</option>
          <option value="1">1</option>
        </select>
      </div>
      <div class="field">
        <label id="feedback-q3-label" for="feedback-comment">Was sollen wir zuerst verbessern?</label>
        <textarea id="feedback-comment" rows="4" maxlength="500"></textarea>
      </div>
      <div class="modal-actions">
        <button id="feedback-cancel-btn" type="button">Abbrechen</button>
        <button id="feedback-submit-btn" type="button">Senden</button>
      </div>
    </div>
  </div>
  <div class="toast" id="feedback-toast"></div>
  <script>
    const FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/REPLACE_WITH_DEPLOYMENT_ID/exec";
    const FEEDBACK_TOKEN = "";
    const TZ = "Europe/Berlin";

    function isFeedbackEndpointConfigured() {
      const u = String(FEEDBACK_ENDPOINT || "").trim();
      if (!u || /REPLACE_WITH|PLACEHOLDER|__YOUR_/i.test(u)) return false;
      const okHost =
        /^https:\/\/script\.google\.com\//i.test(u)
        || /^https:\/\/script\.googleusercontent\.com\//i.test(u);
      const okPath = /\/(exec|dev)(\?|#|$|\/)/i.test(u);
      return okHost && okPath;
    }

    const COPY = {
      foot: "Form-Fenster: bis zu fünf zuletzt abgeschlossene Spiele dieser Saison. Vor Saisonstart die komplette Vorsaison. Bei der WM: alle Qualifikationsspiele der Mannschaft bis zum ersten WM-Spiel, danach nur WM-Spiele. „Ø“ markiert Durchschnittswerte pro Spiel im Fenster. Prozentwerte sind kumulierte Quoten — Summe der Treffer über alle Spiele geteilt durch die Summe der Versuche, nicht der Mittelwert der pro-Spiel-Quoten. Fehlt eine Kennzahl in den Daten, zeigen wir „nicht verfügbar“ — keine erfundenen Nullen.",
      feedbackThanks: "Danke! Feedback wurde gesendet.",
      feedbackError: "Feedback konnte nicht gesendet werden.",
      feedbackErrorDetailPrefix: "Feedback nicht gespeichert:",
      feedbackNotConfigured:
        "Kein Feedback-Endpunkt in dieser Seite: Trage die Web-App-URL (…/exec) in site/match-preview/index.html ein ODER setze das GitHub-Actions-Geheimnis FEEDBACK_APPS_SCRIPT_URL und lasse „Deploy match preview“ neu laufen.",
    };

    function nz(x) {
      const n = Number(x);
      return Number.isFinite(n) ? n : 0;
    }

    /** Missing numeric metric in JSON (null / undefined): show hyphen only (mobile-first). */
    function fmtDe(x, decimals) {
      if (x === null || x === undefined) return "-";
      const n = Number(x);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(decimals).replace(".", ",");
    }

    function fmtDePct(x) {
      if (x === null || x === undefined) return "-";
      const n = Number(x);
      if (!Number.isFinite(n)) return "-";
      return `${fmtDe(n * 100, 0)}%`;
    }

    function berlinKickoff(iso) {
      return new Intl.DateTimeFormat("de-DE", {
        timeZone: TZ,
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(iso));
    }

    function seasonDisplayLabel(row) {
      const explicit = String(row && row.season_display_label ? row.season_display_label : "").trim();
      if (explicit) return explicit;
      const y = Number(row && row.season_api_year);
      if (Number.isFinite(y)) return `Saison ${y}/${y + 1}`;
      return "Saison";
    }

    function competitionDisplayLabel(row) {
      const explicit = String(row && row.competition_display_name ? row.competition_display_name : "").trim();
      if (explicit) return explicit;
      const league = String(row && row.league_name ? row.league_name : "").trim();
      return league || "Wettbewerb";
    }

    function kickoffDisplayLabel(row) {
      const explicit = String(row && row.kickoff_display_label ? row.kickoff_display_label : "").trim();
      if (explicit) return explicit;
      return `Anstoß ${berlinKickoff(row.kickoff_datetime)}`;
    }

    function normalizedStageLabel(row) {
      const explicit = String(row && row.stage_display_label ? row.stage_display_label : "").trim();
      if (explicit) return explicit;
      const round = String(row && row.round_name ? row.round_name : "").trim();
      if (!round) return "Runde";
      const regularSeasonRound = /regular\s*season/i.test(round) && /(\d+)/.test(round);
      if (regularSeasonRound) {
        const n = round.match(/(\d+)/);
        if (n && n[1]) return `${n[1]}. Spieltag`;
      }
      return round;
    }

    function matchContextLine(row) {
      const competition = competitionDisplayLabel(row);
      const season = seasonDisplayLabel(row);
      const compSeason = [competition, season].filter(Boolean).join(" · ");
      const stage = normalizedStageLabel(row);
      const substage = String(row && row.substage_display_label ? row.substage_display_label : "").trim();
      const kickoff = kickoffDisplayLabel(row);
      return [compSeason, stage, substage, kickoff].filter(Boolean).join(" · ");
    }

    function setCompetitionContext(rows) {
      const el = document.getElementById("competition-context");
      if (!el) return;
      const first = rows && rows.length ? rows[0] : {};
      const competition = competitionDisplayLabel(first);
      const season = seasonDisplayLabel(first);
      el.textContent = `${competition} - ${season}`;
    }

    function pointsDisplay(r, side) {
      const ptsRaw = side === "home" ? r.home_points_won_sum_form : r.away_points_won_sum_form;
      const gamesRaw = side === "home" ? r.home_form_games_played : r.away_form_games_played;
      const games = Number(gamesRaw);
      if (!Number.isFinite(games) || games === 0) return "-";
      if (ptsRaw === null || ptsRaw === undefined) return "-";
      const pts = Number(ptsRaw);
      if (!Number.isFinite(pts)) return "-";
      const maxPts = 3 * games;
      return `${pts}/${maxPts}`;
    }

    function rankLabel(v) {
      if (v === null || v === undefined || v === "") return "-";
      const n = Number(v);
      return Number.isFinite(n) ? String(n) : "-";
    }

    /** Optional: metric_glossary.json → map metric_key → { label, description } */
    function glossaryMap(glossaryPayload) {
      const m = Object.create(null);
      const list = (glossaryPayload && glossaryPayload.metrics) || [];
      list.forEach((e) => {
        if (e && e.metric_key) m[e.metric_key] = { label: e.label || "", description: e.description || "" };
      });
      return m;
    }

    function glLabel(g, homeKey, awayKey, fallback) {
      const a = g[homeKey];
      const b = g[awayKey];
      if (a && b && a.label && a.label === b.label) {
        return a.label.replace(/^Home /i, "").replace(/^Away /i, "");
      }
      return fallback;
    }

    function glExplain(g, homeKey, awayKey) {
      const G = g || {};
      const a = G[homeKey];
      const b = G[awayKey];
      const d = (a && a.description) || (b && b.description) || "";
      return String(d).trim();
    }

    function escHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function metricTableRows(r, g) {
      // Grouping is encoded as alternating background bands ("a" vs "b") on
      // the rendered rows — no separate group header labels. The band flips
      // every time the next metric belongs to a new semantic group, so the
      // user sees a tinted block for each group without spending vertical
      // space on a header.
      const m = (label, homeVal, awayVal, homeNum, awayNum, band, opts = {}) => ({
        label, home: homeVal, away: awayVal, homeNum, awayNum, band,
        lowerIsBetter: !!opts.lowerIsBetter,
      });
      const pct = (v) => (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v) * 100;
      const num = (v) => (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
      return [
        // Tabellenstand & Form
        m("Tabellenplatz", rankLabel(r.home_league_rank), rankLabel(r.away_league_rank),
          num(r.home_league_rank), num(r.away_league_rank), "a", { lowerIsBetter: true }),
        m("Punkteausbeute", pointsDisplay(r, "home"), pointsDisplay(r, "away"),
          num(r.home_points_won_sum_form), num(r.away_points_won_sum_form), "a"),
        // Tore
        m("Ø Tore", fmtDe(r.home_goals_per_match_recent, 1), fmtDe(r.away_goals_per_match_recent, 1),
          num(r.home_goals_per_match_recent), num(r.away_goals_per_match_recent), "b"),
        m("Ø Gegentore", fmtDe(r.home_goals_against_per_match_recent, 1), fmtDe(r.away_goals_against_per_match_recent, 1),
          num(r.home_goals_against_per_match_recent), num(r.away_goals_against_per_match_recent), "b", { lowerIsBetter: true }),
        // Abschluss & Effizienz
        m("Ø Schüsse", fmtDe(r.home_shots_per_match_recent, 1), fmtDe(r.away_shots_per_match_recent, 1),
          num(r.home_shots_per_match_recent), num(r.away_shots_per_match_recent), "a"),
        m("Schüsse aufs Tor", fmtDePct(r.home_shot_accuracy_recent), fmtDePct(r.away_shot_accuracy_recent),
          pct(r.home_shot_accuracy_recent), pct(r.away_shot_accuracy_recent), "a"),
        m("Schüsse aus dem Strafraum", fmtDePct(r.home_danger_zone_ratio_recent), fmtDePct(r.away_danger_zone_ratio_recent),
          pct(r.home_danger_zone_ratio_recent), pct(r.away_danger_zone_ratio_recent), "a"),
        m("Trefferquote", fmtDePct(r.home_finishing_efficiency_recent), fmtDePct(r.away_finishing_efficiency_recent),
          pct(r.home_finishing_efficiency_recent), pct(r.away_finishing_efficiency_recent), "a"),
        // Spielaufbau
        m("Ø Pässe", fmtDe(r.home_passes_per_match_recent, 0), fmtDe(r.away_passes_per_match_recent, 0),
          num(r.home_passes_per_match_recent), num(r.away_passes_per_match_recent), "b"),
        m("Angekommene Pässe", fmtDePct(r.home_pass_accuracy_recent), fmtDePct(r.away_pass_accuracy_recent),
          pct(r.home_pass_accuracy_recent), pct(r.away_pass_accuracy_recent), "b"),
        // Standards & Defensive
        m("Ø Ecken", fmtDe(r.home_corner_kicks_per_match_recent, 1), fmtDe(r.away_corner_kicks_per_match_recent, 1),
          num(r.home_corner_kicks_per_match_recent), num(r.away_corner_kicks_per_match_recent), "a"),
        m("Ø Ecken gegen", fmtDe(r.home_corners_conceded_per_match_recent, 1), fmtDe(r.away_corners_conceded_per_match_recent, 1),
          num(r.home_corners_conceded_per_match_recent), num(r.away_corners_conceded_per_match_recent), "a", { lowerIsBetter: true }),
        m("Gehaltene Torschüsse", fmtDePct(r.home_save_ratio_recent), fmtDePct(r.away_save_ratio_recent),
          pct(r.home_save_ratio_recent), pct(r.away_save_ratio_recent), "b"),
      ];
    }

    function teamNameLabel(v, missingLabel) {
      const label = String(v ?? "").trim();
      return label || missingLabel;
    }

    function renderMetrics(rows) {
      return `<div class="metrics">${rows.map(renderMetricRow).join("")}</div>`;
    }

    function renderMetricRow(m) {
      // Decide who's "winning" this metric — affects subtle color highlight.
      let homeWin = false, awayWin = false;
      const hHas = m.homeNum !== null && Number.isFinite(m.homeNum);
      const aHas = m.awayNum !== null && Number.isFinite(m.awayNum);
      if (hHas && aHas) {
        if (m.lowerIsBetter) {
          homeWin = m.homeNum < m.awayNum;
          awayWin = m.awayNum < m.homeNum;
        } else {
          homeWin = m.homeNum > m.awayNum;
          awayWin = m.awayNum > m.homeNum;
        }
      }
      const homeCls = "metric-value" + (homeWin ? " is-winning" : "");
      const awayCls = "metric-value" + (awayWin ? " is-winning" : "");
      const bandCls = "metric metric-band-" + (m.band || "a");
      return `
        <div class="${bandCls}">
          <div class="metric-label">${escHtml(m.label)}</div>
          <div class="metric-row">
            <div class="${homeCls}">${m.home}</div>
            <div class="${awayCls}">${m.away}</div>
          </div>
        </div>`;
    }

    // Kept as alias for any external code calling renderTable
    function renderTable(rows) { return renderMetrics(rows); }

    let activeFixtureId = null;

    function setFeedbackCopy() {
      document.getElementById("feedback-open-btn").textContent = "Feedback";
      document.getElementById("feedback-modal-title").textContent = "Kurzes Feedback";
      document.getElementById("feedback-q1-label").textContent = "Wie einfach war die Nutzung? (1–5)";
      document.getElementById("feedback-q2-label").textContent = "Wie verständlich waren die Kennzahlen? (1–5)";
      document.getElementById("feedback-q3-label").textContent = "Was sollen wir zuerst verbessern?";
      document.getElementById("feedback-cancel-btn").textContent = "Abbrechen";
      document.getElementById("feedback-submit-btn").textContent = "Senden";
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("feedback-toast");
      toast.textContent = message;
      toast.style.display = "block";
      toast.style.background = isError ? "#5b1f2a" : "#174e30";
      toast.style.borderColor = isError ? "#8e3244" : "#2a8152";
      const ms = isError && String(message).length > 120 ? 12000 : 3500;
      setTimeout(() => { toast.style.display = "none"; }, ms);
    }

    function openFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "flex";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "false");
    }

    function closeFeedbackModal() {
      document.getElementById("feedback-modal-backdrop").style.display = "none";
      document.getElementById("feedback-modal-backdrop").setAttribute("aria-hidden", "true");
    }

    async function submitFeedback() {
      if (!isFeedbackEndpointConfigured()) {
        showToast(COPY.feedbackNotConfigured, true);
        return;
      }
      const ease = Number(document.getElementById("feedback-ease").value);
      const clarity = Number(document.getElementById("feedback-clarity").value);
      const comment = String(document.getElementById("feedback-comment").value || "").trim().slice(0, 500);
      const payload = {
        ease_score: ease,
        clarity_score: clarity,
        improvement_text: comment,
        language: "de",
        fixture_id: activeFixtureId,
        app_version: "pages-match-preview",
        submitted_at: new Date().toISOString(),
        feedback_token: FEEDBACK_TOKEN,
      };
      try {
        const resp = await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload),
        });
        const body = await resp.json().catch(() => null);
        const appOk = !!(body && body.ok);
        if (!resp.ok) {
          showToast(`${COPY.feedbackError} (HTTP ${resp.status})`, true);
          return;
        }
        if (!appOk) {
          const detail = body && body.error ? String(body.error) : "unknown_error";
          showToast(`${COPY.feedbackErrorDetailPrefix} ${detail}`, true);
          return;
        }
        closeFeedbackModal();
        document.getElementById("feedback-comment").value = "";
        showToast(COPY.feedbackThanks);
      } catch (err) {
        const hint = err && String(err.message || err).includes("fetch")
          ? " Netzwerk/CORS prüfen; Web-App auf „Jeder“?"
          : "";
        showToast(`${COPY.feedbackError}${hint}`, true);
      }
    }

    function render(rows, g) {
      document.getElementById("foot-note").textContent = COPY.foot;
      setFeedbackCopy();

      const sorted = [...rows].sort((a, b) => {
        const ta = new Date(a.kickoff_datetime).getTime();
        const tb = new Date(b.kickoff_datetime).getTime();
        if (ta !== tb) return ta - tb;
        return nz(a.fixture_sk) - nz(b.fixture_sk);
      });
      setCompetitionContext(sorted);

      const carousel = document.getElementById("carousel");
      carousel.innerHTML = "";

      sorted.forEach((row) => {
        if (activeFixtureId === null) activeFixtureId = row.fixture_api_id;
        const article = document.createElement("article");
        article.className = "card";
        article.dataset.fixtureId = row.fixture_api_id;
        const homeTeam = teamNameLabel(row.home_team_name, "DATA_ERROR_HOME_TEAM");
        const awayTeam = teamNameLabel(row.away_team_name, "DATA_ERROR_AWAY_TEAM");
        // TODO: replace name-based lookup with API team id from the mart.
        // home_team_sk / away_team_sk are hash surrogate keys, not API team_ids.
        // Once mart_matchday_insights exposes `home_team_api_id` and
        // `away_team_api_id`, drop TEAM_LOGO_BY_NAME and read those directly.
        // Until then: any team not in the map renders without a logo (page
        // still works; only the logo is blank).
        const TEAM_LOGO_BY_NAME = {
          "Bayern München": 157, "Borussia Dortmund": 165, "Bayer Leverkusen": 168,
          "VfB Stuttgart": 172, "Eintracht Frankfurt": 169, "RB Leipzig": 173,
          "FC Augsburg": 170, "1. FSV Mainz 05": 164, "Werder Bremen": 162,
          "TSG Hoffenheim": 167, "Borussia Mönchengladbach": 163,
          "Hamburger SV": 175, "SC Freiburg": 160, "VfL Wolfsburg": 161,
          "1. FC Heidenheim": 180, "1. FC Union Berlin": 182, "FC St. Pauli": 186,
          "1. FC Köln": 192,
        };
        const logoUrl = (teamName) => {
          const id = TEAM_LOGO_BY_NAME[teamName];
          return id ? `https://media.api-sports.io/football/teams/${id}.png` : "";
        };
        const homeLogoUrl = logoUrl(homeTeam);
        const awayLogoUrl = logoUrl(awayTeam);
        article.innerHTML = `
          <div class="preview-tag">Spielvorschau</div>
          <div class="fixture">
            <div class="fixture-team fixture-home">
              <div class="team-logo-lg"><img src="${escHtml(homeLogoUrl)}" alt="${escHtml(homeTeam)}"></div>
              <div class="team-name-lg">${escHtml(homeTeam)}</div>
            </div>
            <div class="fixture-vs">vs</div>
            <div class="fixture-team fixture-away">
              <div class="team-logo-lg"><img src="${escHtml(awayLogoUrl)}" alt="${escHtml(awayTeam)}"></div>
              <div class="team-name-lg">${escHtml(awayTeam)}</div>
            </div>
          </div>
          <div class="kickoff">${escHtml(matchContextLine(row))}</div>
          <div class="form-context">Form: letzte 5 Spiele</div>
          ${renderMetrics(metricTableRows(row, g))}
        `;
        carousel.appendChild(article);
      });

      carousel.addEventListener("scroll", () => {
        const w = carousel.clientWidth;
        const i = Math.round(carousel.scrollLeft / w);
        const cards = carousel.querySelectorAll(".card");
        const el = cards[i];
        if (el && el.dataset.fixtureId) activeFixtureId = Number(el.dataset.fixtureId);
      }, { passive: true });
    }

    function scrollByCard(dir) {
      const el = document.getElementById("carousel");
      el.scrollBy({ left: dir * el.clientWidth, behavior: "smooth" });
    }

    document.getElementById("prev-btn").addEventListener("click", () => scrollByCard(-1));
    document.getElementById("next-btn").addEventListener("click", () => scrollByCard(1));
    document.getElementById("feedback-open-btn").addEventListener("click", openFeedbackModal);
    const feedbackLink = document.getElementById("feedback-link");
    if (feedbackLink) {
      feedbackLink.addEventListener("click", (e) => {
        e.preventDefault();
        openFeedbackModal();
      });
    }
    document.getElementById("feedback-cancel-btn").addEventListener("click", closeFeedbackModal);
    document.getElementById("feedback-submit-btn").addEventListener("click", submitFeedback);
    document.getElementById("feedback-modal-backdrop").addEventListener("click", (ev) => {
      if (ev.target.id === "feedback-modal-backdrop") closeFeedbackModal();
    });

    Promise.all([
      fetch("./matchday_insights.json").then((r) => r.json()),
      fetch("./metric_glossary.json").then((r) => r.json()).catch(() => ({ metrics: [] })),
    ])
      .then(([payload, glossaryPayload]) => {
        render(payload.show || [], glossaryMap(glossaryPayload));
      })
      .catch((err) => {
        document.getElementById("carousel").innerHTML =
          `<article class="card">Daten konnten nicht geladen werden: ${err}</article>`;
      });
  </script>
</body>
</html>
