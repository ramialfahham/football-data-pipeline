# The same checks CI runs offline: CI's `lint:python` job runs `pre-commit run --all-files`.
# Nothing here may need credentials. SQL lint needs BigQuery and runs in CI's data jobs instead.
default_install_hook_types: [pre-commit, post-commit]

# The whitespace fixers skip what is written by tools or frozen, never edited by hand: generated
# data, the retired `site/`, the protected `.github/workflows/` snapshot, and the review artifacts
# under `.claude/task/`. The secret scans have no exclusion: they see every file.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: ^dbt_project/target/
      - id: end-of-file-fixer
        exclude: ^(site_v2/src/data/|site/|\.github/workflows/|\.claude/task/|.*\.svg$|.*\.png$|.*\.jpg$|.*\.jpeg$)
      - id: trailing-whitespace
        exclude: ^(site_v2/src/data/|site/|\.github/workflows/|\.claude/task/|.*\.md$|.*\.svg$)
        args: [--markdown-linebreak-ext=md]

  # Must match the ruff pin in requirements-dev.txt; tests/test_lint_config.py checks both.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--config, .ruff-ci.toml]

  - repo: local
    hooks:
      - id: check-no-secrets
        name: Block obvious secrets in tracked files
        entry: python scripts/security/check_no_secrets.py
        language: system
        pass_filenames: true
      - id: push-and-open-mr
        name: Push the branch and open a merge request
        entry: .githooks/post-commit
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: true
