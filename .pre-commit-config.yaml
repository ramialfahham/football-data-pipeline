repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        # Allow GitHub Actions workflow files that use !! tag-like syntax
        args: [--unsafe]
      - id: check-json
        # Skip dbt-generated JSON that may include trailing commas etc.
        exclude: ^dbt_project/target/
      - id: end-of-file-fixer
        exclude: ^(.*\.svg|.*\.png|.*\.jpg|.*\.jpeg)$
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.svg)$
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        # Limit ruff to first-party Python; avoid generated/vendored paths.
        files: ^(ingestion|scripts|tests|dbt_project/macros|dbt_project/seeds)/.*\.py$
      - id: ruff-format
        files: ^(ingestion|scripts|tests|dbt_project/macros|dbt_project/seeds)/.*\.py$

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        # Match the CI invocation: lint from dbt_project root with its .sqlfluff config.
        files: ^dbt_project/models/.*\.sql$
        args: [--config, dbt_project/.sqlfluff]
        additional_dependencies: ['sqlfluff-templater-dbt==3.2.5']

  - repo: local
    hooks:
      - id: check-no-secrets
        name: Block obvious secrets in tracked files
        entry: python scripts/security/check_no_secrets.py
        language: system
        pass_filenames: true
